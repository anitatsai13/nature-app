<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>自然科學習網｜生物・理化・地球科學</title>
<style>
:root{--bg:#f6f9f5;--card:#ffffff;--ink:#29342b;--muted:#74807a;--brand:#2f7a58;--brand2:#3d7ea6;--ok:#2e7d32;--bad:#c62828;--line:#dfe8dc;--chip:#ecf3ea;--gold:#e4efe0;--mark:#ffe08a;--todo:#f6a623}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 60px}
header{text-align:center;padding:18px 0 6px}
header h1{font-size:1.5rem;letter-spacing:.12em;color:var(--brand)}
header .sub{color:var(--muted);font-size:.85rem;margin-top:4px;letter-spacing:.05em}
.units{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.unit{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 18px;font-size:.98rem;cursor:pointer;font-weight:800}
.unit.active{background:var(--sub-c,var(--brand));border-color:var(--sub-c,var(--brand));color:#fff}
.unit .cx{margin-left:6px;font-size:.72rem;opacity:.85}
.toc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub-t,var(--brand));border-radius:12px;padding:11px 13px;margin:2px 0 12px}
.toc .tv{display:flex;align-items:center;gap:8px;margin:11px 0 6px;font-size:.84rem;font-weight:900;color:var(--sub-t,var(--brand))}
.toc .tv:first-child{margin-top:0}
.toc .tv .vb{background:var(--sub-t,var(--brand));color:#fff;border-radius:7px;padding:1px 10px;font-size:.78rem}
.toc .tv .vn{font-weight:400;font-size:.76rem;color:var(--muted)}
.toc .tl{display:flex;flex-wrap:wrap;gap:6px}
.toc .tu{display:inline-flex;align-items:center;gap:6px;background:var(--gold);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.86rem;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.4}
.toc .tu:hover{border-color:var(--sub-t,var(--brand));background:var(--chip)}
.toc .tu .n{background:var(--sub-t,var(--brand));color:#fff;border-radius:6px;padding:0 6px;font-size:.73rem;font-weight:900;flex:none}
.toc .tu .c{color:var(--muted);font-size:.73rem;white-space:nowrap}
.toc .tu .c b{color:var(--ok)}
.toc .tx{display:block;margin:12px auto 0;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:.78rem;color:var(--muted);cursor:pointer;font-family:inherit}
.toc .tx:hover{border-color:var(--sub-t,var(--brand));color:var(--sub-t,var(--brand))}
.volhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 2px;font-weight:900;color:var(--sub,var(--brand))}
.volhd .vb{background:var(--sub,var(--brand));color:#fff;border-radius:9px;padding:3px 13px;font-size:.92rem}

.volhd .vbar i{display:block;height:100%;background:var(--sub,var(--brand));border-radius:99px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem}
.acct-form{display:block}
.acct .atitle{font-size:.84rem;color:var(--muted);margin-bottom:8px;line-height:1.6}
.acct .arow{display:flex;gap:6px;flex-wrap:wrap}
.acct input{flex:1 1 150px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:.9rem;font-family:inherit}
.acct input:focus{outline:2px solid var(--brand);outline-offset:1px}
.acct .abtns{display:flex;gap:6px;flex-wrap:wrap}
.amsg{font-size:.82rem;margin-top:7px;color:var(--muted);min-height:1em}
.amsg.bad{color:var(--bad);font-weight:800}
.amsg.ok{color:var(--ok);font-weight:800}
.wgrp{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.wgrp .wgn{font-weight:900;color:var(--brand)}
.wrec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;margin:8px 0;line-height:1.75}
.wrec .wtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.wrec .wu{background:var(--gold);color:var(--brand);border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:800}
.wrec .wt{margin-left:auto;color:var(--muted);font-size:.74rem}
.wrec .wq{font-size:.93rem;margin:4px 0}
.wrec .wa{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.wrec .wbad{color:var(--bad)}
.wrec .wok{color:var(--ok);font-weight:800}
.lstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:4px 0 12px}
.lstat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.lstat b{display:block;font-size:1.5rem;color:var(--brand);line-height:1.3}
.lstat span{font-size:.76rem;color:var(--muted)}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;font-size:.95rem;cursor:pointer;font-weight:700}
.tab.active{background:var(--brand2);border-color:var(--brand2);color:#fff}
.pane{display:none}.pane.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.stat{color:var(--muted);font-size:.85rem}
.btn{border:none;border-radius:12px;padding:11px 22px;font-size:1rem;font-weight:800;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:9px}
h2.sec{margin:22px 0 8px;font-size:1.05rem;color:var(--brand2);letter-spacing:.06em}
h2.sec .un{display:inline-block;background:var(--sub,var(--brand));color:#fff;border-radius:8px;padding:2px 10px;margin-right:8px;font-size:.92rem;letter-spacing:0}
/* ===== 重點表格 ===== */
.mtabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mtab{width:100%;min-width:620px;border-collapse:collapse;background:var(--card);font-size:.9rem}
.mtab th,.mtab td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:1.75;text-align:left}
.mtab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap}
.mtab td.nm{background:var(--chip);white-space:nowrap;text-align:center;font-weight:900;width:64px}
.mtab td.tt{white-space:nowrap;font-weight:800;width:1%}
.mtab td.pg{background:#fbfdfe;text-align:center;color:var(--muted);white-space:nowrap;width:54px;font-size:.84rem}
.mtab td .ln{display:block;margin:3px 0}
.mtab td .nt{display:block;margin:6px 0 0;padding:4px 7px;background:#fbfdfe;border-left:3px solid var(--brand);border-radius:3px;font-size:.78rem;line-height:1.5;color:var(--muted)}
.mtab td .nt b{color:var(--brand);margin-right:4px}
.tg{display:inline-block;background:#fde7ef;color:#b3376a;border:1px solid #f6cada;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:800;margin:1px 3px 1px 0;white-space:nowrap}
.tg.b{background:#e7f1fd;color:#2a5f9e;border-color:#cadcf6}
.todo{color:var(--muted);font-size:.84rem}
.todo b{color:var(--todo)}
.warn{color:var(--todo);font-weight:900;cursor:help}
.bkhd{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub,var(--brand));border-radius:12px;padding:11px 14px;margin:4px 0 6px;font-size:.88rem;line-height:1.8;color:var(--muted)}
.bkhd b{color:var(--brand);font-size:1rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:7px 0 2px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.hl{font-style:normal;font-weight:900;color:var(--brand);background:var(--mark);border-radius:4px;padding:0 3px;margin:0 1px}
.fml{display:block;background:#fbfdfe;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem;letter-spacing:.03em}
.mtab td.ct{text-align:center;white-space:nowrap;background:#fbfdfe;font-size:.82rem;width:1%}
.hot5{color:#d1462f;letter-spacing:1px}
.ctab td.h .ar{display:block;color:#d1462f;font-size:.72rem;line-height:1;margin-top:3px;font-weight:400}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.32}
.fr i{font-style:normal;padding:1px 6px;white-space:nowrap}
.fr i+i{border-top:1.6px solid currentColor}
.ovline{background:var(--gold);border:1px dashed var(--brand);border-radius:9px;padding:6px 11px;margin:6px 0 2px;font-size:.85rem;color:var(--brand);font-weight:700}
.done{color:var(--ok);font-weight:800}
h3.sub{margin:20px 0 8px;font-size:1rem;color:var(--brand);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sub .kp{background:var(--sub,var(--brand));color:#fff;border-radius:8px;padding:2px 10px;font-size:.85rem}
h3.sub .pgt{color:var(--muted);font-size:.78rem;font-weight:400}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:9px 0;line-height:1.85;font-size:.92rem}
.blk h4{font-size:.96rem;color:var(--brand2);margin:14px 0 7px;letter-spacing:.04em}
.blk h4:first-child{margin-top:0}
.blk p{margin:6px 0}
.eg{display:inline-block;background:var(--brand2);color:#fff;border-radius:5px;padding:0 6px;font-size:.75rem;font-weight:800;margin-right:5px}
.box{border-radius:12px;padding:11px 14px;margin:10px 0;line-height:1.8;font-size:.9rem}
.box p{margin:5px 0}
.box .bt{display:inline-block;border-radius:6px;padding:1px 9px;font-size:.78rem;font-weight:900;margin-bottom:5px;color:#fff}
.box.key{background:#eef8f1;border:1px solid #bfe0cb}.box.key .bt{background:var(--brand2)}
.box.myth{background:#fdf1f5;border:1px solid #f3cddb}.box.myth .bt{background:#c0507e}
.box.hot{background:#f2f9ec;border:1px solid #cde5b8}.box.hot .bt{background:#6ea33c}
.box.tip{background:#f5f1fb;border:1px solid #d8cdec}.box.tip .bt{background:#7a5bb0}
.box.calc{background:#fdf3f7;border:1px solid #f3ccdf}.box.calc .bt{background:#d4548a}
.cq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 5px}
.cq:first-of-type{margin-top:6px}
.cq .tn{background:#d4548a;color:#fff;border-radius:7px;padding:1px 10px;font-size:.78rem;font-weight:900}
.cq b{color:#b23a6e;font-size:.96rem}
.cq .pair{margin-left:auto;font-size:.73rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sol{display:inline-block;background:#d4548a;color:#fff;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:900;margin-right:6px;vertical-align:1px}
.ctab.rt{width:auto;min-width:0;margin:7px 0}
.ctab.rt th{background:#fce9f2;color:#b23a6e;border-color:#efc3d8;padding:5px 12px}
.ctab.rt td{border-color:#efc3d8;padding:5px 12px}
.cb{display:inline-block;border:1.5px solid #4aa3b8;border-radius:7px;padding:2px 9px;margin:3px 2px;background:#fff;vertical-align:middle}
.fig{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 8px;margin:7px 0;text-align:center}
.fig svg{max-width:100%;height:auto;display:block;margin:0 auto}
.fig .mt{font-size:.85rem;font-weight:800;color:var(--brand);margin-bottom:3px}
.fig .cap{font-size:.76rem;color:var(--muted);margin-top:5px;line-height:1.5}
.figrow{display:flex;gap:9px;flex-wrap:wrap;margin:7px 0}
.figrow>.fig{flex:1 1 210px;margin:0;display:flex;flex-direction:column;justify-content:flex-start}
.figrow>.fig svg{max-width:185px}
.ctab .fig{margin:0;border:none;padding:2px}
.ctab .fig svg{max-width:195px}
.fig svg[width]{max-width:100%;height:auto}
.ctab .fig svg[width]{max-width:none}
.c-red{background:#fbe0e0!important;color:#b0342f;font-weight:800}
.c-orange{background:#fde8cf!important;color:#b5651d;font-weight:800}
.c-yellow{background:#fdf3cf!important;color:#8f7415;font-weight:800}
.c-green{background:#ddf0dd!important;color:#2e7d41;font-weight:800}
.c-blue{background:#dceaf7!important;color:#2a5f9e;font-weight:800}
.c-purple{background:#e9e0f3!important;color:#6a4a9e;font-weight:800}
.c-pinkred{background:#efd9e8!important;color:#9b3d78;font-weight:800}
.c-bluegreen{background:#d7efe9!important;color:#1f7d6e;font-weight:800}
.c-brown{background:#f0ddd3!important;color:#8b4a2b;font-weight:800}
.c-yellowgreen{background:#e8f0cf!important;color:#66841c;font-weight:800}
.c-blueblack{background:#d9dde8!important;color:#2a3550;font-weight:800}
.c-none{background:#fbfbfb!important;color:#7b8a82;font-weight:800}
.ctab td.cc{text-align:center;white-space:nowrap}
.res{display:inline-block;border-radius:6px;padding:2px 10px;font-weight:800}
.arw{color:#3d9bd4;font-weight:900;margin:0 4px}
.lb{display:inline-block;border-radius:5px;padding:0 7px;font-size:.74rem;font-weight:900;color:#fff;margin-right:5px;vertical-align:1px}
.lb.r{background:#d94f5c}.lb.e{background:#3d7ea6}.lb.g{background:#2f8f5f}.lb.p{background:#7a5bb0}
.cal{display:inline-block;color:#2b8f74;font-size:.76rem;font-weight:800;margin:0 4px}
.cal::before{content:"\21b3 ";font-weight:400}
.stepline{margin:8px 0;line-height:2.2}
.ctab{width:100%;border-collapse:collapse;background:var(--card);font-size:.88rem;min-width:480px}
.ctab th,.ctab td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.7}
.ctab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap;font-size:.85rem}
.ctab td.h{background:var(--chip);font-weight:800;white-space:nowrap;text-align:center}
.ctab td.c{text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:9px 0}
.flow .fb{flex:1 1 170px;background:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:.85rem;line-height:1.6}
.flow .fb b{display:block;color:var(--brand);margin-bottom:2px}
.act{background:var(--card);border:2px solid var(--brand);border-radius:10px;padding:9px 11px;margin:9px 0;text-align:center;line-height:2.1;font-size:.9rem;overflow-x:auto}
.act .big{font-weight:900;letter-spacing:.04em}
/* ===== 搜尋 ===== */
.sbar{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.sbar input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:.95rem;font-family:inherit}
.sbar input:focus{outline:2px solid var(--brand);outline-offset:1px}
.sbtn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--brand);color:#fff;
  font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;white-space:nowrap}
.sbtn.ghost{background:var(--card);color:var(--muted)}
.sbtn:hover{filter:brightness(1.08)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.sres .shead{font-weight:900;color:var(--brand);margin-bottom:8px;font-size:.9rem}
.sres .sgrp{font-weight:900;margin:10px 0 4px;color:var(--brand2);font-size:.86rem;
  border-bottom:1px dashed var(--line);padding-bottom:3px}
.sres .sitem{display:block;width:100%;text-align:left;background:var(--gold);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin:5px 0;cursor:pointer;font-family:inherit;font-size:.86rem;
  line-height:1.6;color:var(--ink)}
.sres .sitem:hover{border-color:var(--brand)}
.sres .sitem .swhere{display:block;color:var(--muted);font-size:.78rem;margin-bottom:2px}
.sres .qcard{background:#fbfdfe;border:1px solid var(--line);border-left:3px solid var(--brand2);
  border-radius:8px;padding:8px 10px;margin:5px 0;font-size:.86rem;line-height:1.7}
.sres .qcard .qa{color:var(--ok);font-weight:900}
.sres .qcard .qe{color:var(--muted);display:block;margin-top:3px}

.sres .snone{color:var(--muted);padding:6px 2px}

.secflash{animation:secflash 1.6s ease-in-out}
/* ===== 測驗 ===== */
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.exam .src{font-size:.72rem;background:var(--gold);color:var(--brand2);border-radius:6px;padding:2px 8px;margin-right:6px}
.exam .topic{font-size:.72rem;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px}
.exam .q{margin:10px 0;line-height:1.8;font-size:1.02rem}
img.qi{max-width:min(440px,100%);display:block;margin:10px auto;border:1px solid var(--line);border-radius:10px;background:#fff}
img.gi{display:inline-block;max-height:88px;max-width:160px;vertical-align:middle;border:1px solid var(--line);border-radius:6px;margin:2px;background:#fff}
.eopts{display:grid;gap:8px}
.eopt{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fbfdfe;border-radius:11px;padding:11px 13px;font-size:.98rem;cursor:pointer;line-height:1.7;color:var(--ink)}
.eopt .k{font-weight:900;color:var(--brand2);flex:none}
.eopt.correct{border-color:var(--ok);background:#eef7ee}
.eopt.wrong{border-color:var(--bad);background:#fdeeee}
.expl{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.75;font-size:.92rem}
.expl.show{display:block}
.expl .lbl{font-weight:900;color:var(--brand);margin-right:6px}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.counter{color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:8px}
.nav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:26px 16px;margin:14px 0}
.scorebox .big{font-size:2.2rem;font-weight:900;color:var(--brand)}
.review .r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;line-height:1.7}
.qitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.qitem .q{line-height:1.8;margin:6px 0;font-size:.95rem}
.qitem .o{color:var(--muted);font-size:.9rem;line-height:1.75;margin-top:4px}
.qitem .a{display:none;margin-top:8px;font-size:.9rem;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
.qitem .a.show{display:block}
.qitem .a b{color:var(--ok)}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:34px;letter-spacing:.05em}
@media(max-width:520px){header h1{font-size:1.25rem}.unit{padding:8px 12px;font-size:.9rem}}
</style>
</head>
<body>
<div class="wrap">
<header>

/* ===== 題庫（依冊分） ===== */
const Q_BIO=[{"q":"關於生殖過程中所歷經的細胞分裂，下列敘述何者<b>正確</b>？","opts":["無性生殖會歷經細胞分裂，但不會歷經減數分裂","有性生殖會歷經減數分裂，但不會歷經細胞分裂","無性生殖須先形成配子，所以一定要歷經減數分裂","有性生殖中精、卵結合後即為成熟個體，不需要再進行細胞分裂"],"ans":0,"sec":"生殖的方式","diff":"易","src":"重點演練2・是非","exp":"解題關鍵：<b>無性生殖不須產生配子，不會歷經減數分裂</b>，但仍要靠細胞分裂產生新個體，故(A)正確、(C)錯誤。有性生殖中精卵結合後，還要經由<i class=\"hl\">細胞分裂</i>才能逐漸發育為成熟個體，故(B)(D)錯誤。"},
{"q":"行有性生殖的生物較能適應環境變化，主要原因為下列何者？","opts":["子代的變異性大","可快速增加子代數目","能將遺傳物質的組合完整保留並代代相傳","子代與親代的性狀表現完全相同"],"ans":0,"sec":"生殖的方式","diff":"易","src":"重點演練2","exp":"解題關鍵：行有性生殖的生物，子代<b>變異性大</b>，使族群適應環境變化的能力較強。(B)(C)(D)描述的都是<i class=\"hl\">無性生殖</i>的特徵。"},
{"q":"下列生物所行的生殖方式中，何者的細胞<b>必須</b>經過減數分裂的過程？","opts":["渦蟲的斷裂生殖","酵母菌的出芽生殖","菊花的種子繁殖","馬鈴薯的營養器官繁殖"],"ans":2,"sec":"生殖的方式","diff":"中","src":"重點演練2","exp":"解題關鍵：<b>只有有性生殖需要配子，才會歷經減數分裂</b>。菊花的種子繁殖屬於<i class=\"hl\">有性生殖</i>，需經減數分裂產生配子並進行受精；(A)(B)(D)皆為無性生殖，不形成配子。"},
{"q":"關於植物的營養器官繁殖，下列敘述何者<b>正確</b>？","opts":["馬鈴薯利用塊莖、番薯利用塊根或莖進行營養器官繁殖","馬鈴薯和番薯皆是利用塊根進行營養器官繁殖","可利用營養器官繁殖的植物，無法再以有性生殖產生下一代","營養器官繁殖屬於有性生殖，過程中會形成配子"],"ans":0,"sec":"無性生殖","diff":"中","src":"重點演練3・是非","exp":"解題關鍵：<b>馬鈴薯是塊「莖」、番薯是塊「根」</b>，故(B)錯誤。以營養器官繁殖的植物<i class=\"hl\">仍可能開花結果</i>，再以種子繁殖（有性生殖）產生下一代，故(C)錯誤。營養器官繁殖不形成配子，屬於無性生殖，(D)錯誤。"},
{"q":"果農為了<b>保持果樹的優良品種</b>，經常使用下列哪一種方法來繁殖果樹植株？","opts":["有性生殖","種子繁殖","營養器官繁殖","斷裂生殖"],"ans":2,"sec":"無性生殖","diff":"易","src":"重點演練3","exp":"解題關鍵：要<b>保留親代的優良性狀</b>，就要用無性生殖。營養器官繁殖屬於<i class=\"hl\">無性生殖</i>，子代可保有與親代相同的性狀特徵。(A)(B)為有性生殖，子代會產生變異；(D)斷裂生殖不適用於果樹。"},
{"q":"下列四種生物可利用的生殖方式，何者配對<b>錯誤</b>？","opts":["水螅：出芽生殖","青黴菌：孢子繁殖","渦蟲：分裂生殖","落地生根：營養器官繁殖"],"ans":2,"sec":"無性生殖","diff":"易","src":"重點演練3","exp":"解題關鍵：渦蟲行的是<i class=\"hl\">斷裂生殖</i>（受外力斷裂成片段後各自長成新個體），不是分裂生殖。<b>分裂生殖是單細胞生物（變形蟲、草履蟲、細菌）</b>才有的方式。"},
{"q":"阿儒將一片落地生根的葉片切成大小不同的兩片，分別進行培養。經一段時間後，兩片葉片各自長出一些小芽。關於長出小芽的過程中，細胞所進行的分裂名稱及此分裂的相關敘述，下列何者最合理？","opts":["均為減數分裂，且分裂過程中經一次染色體複製","均為減數分裂，且分裂過程中出現兩次連續分裂","均為細胞分裂，且分裂過程中經一次染色體複製","均為細胞分裂，且分裂過程中出現兩次連續分裂"],"ans":2,"sec":"無性生殖","diff":"中","src":"會考109補","exp":"解題關鍵：<b>葉是營養器官，以葉繁殖屬於營養器官繁殖，是無性生殖</b>，不須形成配子，所以<i class=\"hl\">只進行細胞分裂</i>。細胞分裂過程中染色體只複製一次、也只分裂一次（兩次連續分裂是減數分裂的特徵），故選(C)。"},
{"q":"小玲取了某株植物的部分組織，放入培養基中進行繁殖，有關以此方式繁殖出的新植株，下列敘述何者最合理？","opts":["是由原植株的細胞經減數分裂產生","是由原植株的細胞經細胞分裂產生","新植株細胞內的基因為原植株細胞的一半","新植株細胞內的染色體為原植株細胞的一半"],"ans":1,"sec":"無性生殖","diff":"易","src":"會考108（通過率 71%）","exp":"解題關鍵：<b>組織培養屬於無性生殖</b>，親代與子代的遺傳物質組合<i class=\"hl\">完全相同</i>。無性生殖只進行細胞分裂，不進行減數分裂，所以基因與染色體數目都和原植株一樣，故選(B)。"},
{"q":"關於青蛙的假交配與植物的授粉，下列敘述何者<b>正確</b>？","opts":["青蛙的假交配過程中，雄蛙並未將精子送入雌蛙體內，仍屬於體外受精","青蛙可利用假交配將精子送入雌蛙體內，進行體內受精","植物授粉後，雌蕊的柱頭會自行萌發出花粉管","植物的花粉管由子房向上長出，與柱頭會合後完成受精"],"ans":0,"sec":"有性生殖","diff":"中","src":"重點演練4・是非","exp":"解題關鍵：假交配時<b>雄蛙並沒有直接把精子送入雌蛙體內</b>，仍是在水中完成受精，故為<i class=\"hl\">體外受精</i>。植物授粉後，是由落在柱頭上的<i class=\"hl\">花粉</i>萌發出花粉管，向下延伸進入子房，不是柱頭或子房長出來的。"},
{"q":"動物在生殖適應上，由體外受精演變成體內受精，此和種子植物在生殖方式上出現何種構造的意義相同？","opts":["維管束","種子","角質層","花粉管"],"ans":3,"sec":"有性生殖","diff":"中","src":"重點演練4","exp":"解題關鍵：體內受精是父方的精子<b>在母體內</b>與母方的卵結合，<i class=\"hl\">不需要依賴水</i>。種子植物利用<b>花粉管</b>把精細胞送到胚珠內與卵結合，意義相同——都讓受精作用擺脫對水的依賴。"},
{"q":"下列哪一生物的胚胎發育位置是在<b>母體內</b>？","opts":["針鼴","陸龜","蝙蝠","鴿子"],"ans":2,"sec":"有性生殖","diff":"中","src":"重點演練4","exp":"解題關鍵：胚胎在母體內發育的是<i class=\"hl\">胎生</i>動物。(A)針鼴是<b>卵生哺乳類</b>；(B)陸龜為卵生爬蟲類；(C)蝙蝠是胎生哺乳類；(D)鴿子為卵生鳥類，故選(C)。"},
{"q":"關於有性生殖的敘述，下列何者<b>正確</b>？","opts":["體外受精的成功率較體內受精的成功率高","卵生動物在胚胎發育時期會形成胎盤和臍帶","體內受精的動物單次產卵數會較體外受精的動物少","卵生動物一定進行體外受精"],"ans":2,"sec":"有性生殖","diff":"中","src":"重點演練4","exp":"解題關鍵：(A)<i class=\"hl\">體內</i>受精的成功率較高；(B)只有<b>胎生</b>動物才有胎盤和臍帶；(D)有的卵生動物會行體內受精，例如爬蟲類和鳥類。體內受精成功率高，所以單次產卵數較少，故選(C)。"},
{"q":"下列為梅花行有性生殖的過程：<br>甲. 長出花粉管　乙. 花粉傳到雌蕊柱頭上<br>丙. 胚珠發育為種子，子房發育為果實<br>丁. 種子萌發長出新個體　戊. 精細胞進入胚珠和卵結合<br>其正確順序排列為何？","opts":["乙甲丙丁戊","乙戊甲丙丁","甲乙戊丁丙","乙甲戊丙丁"],"ans":3,"sec":"有性生殖","diff":"中","src":"重點演練4","exp":"解題關鍵：順序是<b>授粉 → 長花粉管 → 受精 → 果實種子發育 → 萌芽</b>。花粉先傳到柱頭（乙），萌發花粉管（甲），精細胞沿花粉管進入胚珠與卵結合（戊），受精後子房發育為果實、胚珠發育為種子（丙），最後種子萌發長出新個體（丁），故選(D)。"},
{"q":"下列何者<b>不是</b>蟲媒花的特色？","opts":["花粉輕，容易隨風飄起","花朵大、花瓣顏色鮮豔","花朵內具有蜜腺","花朵香氣較為濃郁"],"ans":0,"sec":"有性生殖","diff":"易","src":"重點演練4","exp":"解題關鍵：(A)是<i class=\"hl\">風媒花</i>的特色——風媒花的花粉靠風力傳播，所以<b>數量多、重量輕、沒有黏性</b>。蟲媒花要靠昆蟲帶走花粉，所以花粉<b>較重、有黏性</b>，並以鮮豔的花瓣、香氣和蜜腺吸引昆蟲。"},
{"q":"多數魚類在交配時，通常會同時釋放出大量的精子和卵，其原因為何？","opts":["使體內受精的過程更加順利","可增加精子和卵結合的機會","可提供更多養分給胚胎","因卵越多可游得越快"],"ans":1,"sec":"有性生殖","diff":"易","src":"重點演練4","exp":"解題關鍵：多數魚類為<i class=\"hl\">體外受精</i>，精子和卵在水中相遇才能結合，<b>受精成功率低</b>，所以在交配時同時釋出大量的精子和卵，以增加兩者結合的機會。"},
{"q":"已知草莓的食用部位是由<b>花托</b>處膨大而來。若草莓上另有一種構造是由草莓的<b>子房</b>發育而成，則此構造應稱為下列何者？","opts":["胚珠","種子","果實","花粉"],"ans":2,"sec":"有性生殖","diff":"中","src":"會考112（通過率 36%）","exp":"解題關鍵：<b>受精後，子房發育成果實，胚珠發育成種子</b>。題目已說＊構造是由子房發育而成，所以＊就是<i class=\"hl\">果實</i>（草莓表面一粒一粒的才是真正的果實），故選(C)。"},
{"q":"自花授粉是指植物的花粉黏附在<b>同一朵花</b>的雌蕊柱頭上。關於植物以自花授粉的方式生殖，下列何者最合理？","opts":["屬於有性生殖","不會產生果實","子代不具有繁殖能力","子代與親代的性狀皆完全相同"],"ans":0,"sec":"有性生殖","diff":"中","src":"會考109（通過率 51%）","exp":"解題關鍵：<b>只要經歷授粉、受精作用，就是有性生殖</b>，與花粉來自同一朵花或別朵花無關。自花授粉仍會受精、結果，子代也具繁殖能力，且因經過配子結合，性狀<i class=\"hl\">不會與親代完全相同</i>，故選(A)。"},
{"q":"已知某地區的脊椎動物只有哺乳類、鳥類和爬蟲類。若小平依其調節體溫變化的不同，分成內溫動物及外溫動物兩群，則有關此地區中脊椎動物的生殖方式，下列敘述何者最合理？","opts":["內溫動物、外溫動物皆必為胎生","內溫動物必為胎生，外溫動物必為卵生","內溫動物、外溫動物皆必為體內受精","內溫動物必為體內受精，外溫動物必為體外受精"],"ans":2,"sec":"有性生殖","diff":"難","src":"會考109補","exp":"解題關鍵：哺乳類和鳥類是<b>內溫動物</b>，爬蟲類是<b>外溫動物</b>。(A)(B)多數哺乳類為胎生，但<i class=\"hl\">鳥類、多數爬蟲類和少數哺乳類（鴨嘴獸、針鼴）為卵生</i>；這三類動物<b>全部都行體內受精</b>，故選(C)。"},
{"q":"關於試管嬰兒與人類生殖的過程，下列敘述何者<b>正確</b>？","opts":["試管嬰兒是精、卵在母體外結合，再將受精卵植入母體中發育，屬於有性生殖","試管嬰兒能在母體外發育成長，屬於一種無性生殖","人類生殖的過程中，精、卵結合和胚胎發育的地點皆為子宮","人類的精、卵在子宮相遇結合，受精卵再移到輸卵管著床"],"ans":0,"sec":"人類的生殖","diff":"中","src":"重點演練5・是非","exp":"解題關鍵：試管嬰兒仍有<b>精、卵結合</b>，所以是<i class=\"hl\">有性生殖</i>，只是受精在母體外進行，之後仍須植入母體發育。人類的精、卵是在<i class=\"hl\">輸卵管</i>結合成受精卵，形成胚胎後才到<i class=\"hl\">子宮</i>著床發育。"},
{"q":"下列何者<b>不是</b>人類女性輸卵管的功能或特性？","opts":["輸送卵","與子宮相連接","胎兒產出的通道","受精作用發生的場所"],"ans":2,"sec":"人類的生殖","diff":"易","src":"重點演練5","exp":"解題關鍵：胎兒是由<i class=\"hl\">陰道</i>產出的，陰道才是產道。輸卵管的功能是<b>輸送卵</b>，也是<b>精卵受精的場所</b>，一端與子宮相連。"},
{"q":"下列何者與「香蕉的<b>地下莖</b>冒出嫩芽並長成新植株」的生殖方式相似？","opts":["水螅利用精子和卵產生後代","阿姨生下一對長得一模一樣的雙胞胎","番石榴利用種子繁殖後代","草莓利用匍匐莖繁殖後代"],"ans":3,"sec":"實驗整理","diff":"易","src":"實驗立即練・觀察植物的營養器官繁殖","exp":"解題關鍵：由地下莖冒出嫩芽屬於<i class=\"hl\">營養器官繁殖</i>，是<b>無性生殖</b>。(A)(B)(C)都經過精卵結合，是有性生殖；(D)草莓的匍匐莖也是營養器官繁殖，故選(D)。"},
{"q":"杏的果實剖面中，<b>甲為果肉、乙為種子</b>，試問甲與乙分別由植物的何種構造發育而來？","opts":["甲：雄蕊　乙：雌蕊","甲：花瓣　乙：子房","甲：子房　乙：胚珠","甲：胚珠　乙：卵"],"ans":2,"sec":"實驗整理","diff":"易","src":"實驗立即練・花、果實和種子的觀察","exp":"解題關鍵：植物的卵受精後，<b>子房會膨大發育成果實</b>（果肉即為果實的一部分），<b>胚珠則發育成種子</b>，故選(C)。"},
{"q":"青蛙的染色體有 13 對，其中 1 對為<b>性染色體</b>。在不考慮突變的情況下，雌蛙卵巢內經<b>減數分裂</b>後的卵子，應有幾條性染色體？","opts":["1 條","2 條","13 條","26 條"],"ans":0,"sec":"染色體與細胞分裂","diff":"中","src":"會考113（通過率 48%）","exp":"解題關鍵：<b>減數分裂產生的子細胞，染色體套數為母細胞的一半</b>。青蛙體細胞有 13 對（26 條）染色體，經減數分裂後的卵子只剩 13 條，其中<i class=\"hl\">性染色體只有 1 條</i>（原本成對的性染色體分開了），故選(A)。"},
{"q":"採收韭菜時，若從葉的底部割斷後，再以遮光罩將留下的根莖部遮蓋，使植株不易行光合作用，則長出的葉片會是質地軟嫩的黃色葉子，稱為韭黃。根據上述，下列推論何者最合理？","opts":["韭黃細胞是由韭菜細胞經減數分裂而來","韭菜葉片細胞經由突變而產生黃色葉子","韭黃與韭菜葉片細胞內的染色體數相同","韭黃與韭菜調控葉片顏色的基因不相同"],"ans":2,"sec":"染色體與細胞分裂","diff":"中","src":"會考111補","exp":"解題關鍵：韭黃是韭菜的<b>根莖部在遮光環境下，經營養器官繁殖</b>長出來的，屬於<i class=\"hl\">無性生殖</i>，只進行細胞分裂。所以細胞內的染色體數和基因都與原植株<b>相同</b>，顏色變黃是<b>缺少光照</b>造成的，與突變、基因差異都無關，故選(C)。"},
{"q":"已知高莖豌豆為顯性性狀特徵、矮莖豌豆為隱性性狀特徵，則下列敘述何者<b>正確</b>？","opts":["兩株高莖豌豆親代，仍可能產生矮莖的子代","兩株高莖豌豆親代，不可能產生矮莖的子代","兩株矮莖豌豆親代，可能產生高莖的子代","高莖豌豆的基因型一定為 TT"],"ans":0,"sec":"基因與遺傳","diff":"中","src":"重點演練1・是非","exp":"解題關鍵：高莖親代的基因型可能是 TT 或 Tt。若兩親代皆為 <b>Tt × Tt</b>，就有 1/4 的機率產生矮莖（tt）的子代，故(A)正確、(B)(D)錯誤。矮莖為隱性，基因型必為 tt，<i class=\"hl\">tt × tt 只能產生 tt</i>，故(C)錯誤。"},
{"q":"細胞核內遺傳物質的<b>數目</b>，由多到少排列，下列何者正確？","opts":["染色體 ＞ 基因 ＞ 等位基因","等位基因 ＞ 基因 ＞ 染色體","基因 ＞ 染色體 ＞ 等位基因","染色體 ＞ 等位基因 ＞ 基因"],"ans":1,"sec":"基因與遺傳","diff":"中","src":"重點演練1・是非","exp":"解題關鍵：<b>包含關係</b>是細胞 ＞ 細胞核 ＞ 染色體 ＞ DNA ＞ 基因 ＞ 等位基因，但<i class=\"hl\">數目剛好相反</i>——一條染色體上排列許多基因，一個基因又由兩個等位基因組成，所以數目是等位基因最多、染色體最少。"},
{"q":"已知豚鼠的體毛有黑色和白色兩種性狀特徵。小環將一隻黑毛豚鼠與一隻白毛豚鼠交配，所生下的第一子代<b>皆為白毛</b>；再從第一子代中取兩隻豚鼠交配，所生下的第二子代中，有 1/4 為黑毛、3/4 為白毛。根據此實驗結果，下列敘述何者最為正確？","opts":["無法用孟德爾的遺傳法則解釋","黑毛為顯性的特徵，白毛為隱性的特徵","第一子代的白毛豚鼠中，包含兩種基因型","若從第二子代取兩隻黑毛豚鼠交配，第三子代不會出現白毛豚鼠"],"ans":3,"sec":"基因與遺傳","diff":"難","src":"重點演練1","exp":"解題關鍵：由實驗結果可推測<b>白毛為顯性、黑毛為隱性</b>，且完全符合孟德爾的遺傳法則，故(A)(B)錯誤。假設白毛等位基因為 A、黑毛為 a，第一子代的基因型<i class=\"hl\">皆為 Aa（只有一種）</i>，故(C)錯誤。黑毛為隱性，基因型必為 aa，兩隻黑毛交配所生的子代<b>應全為黑毛</b>，故選(D)。"},
{"q":"生物體進行有性生殖的時候，親代的性狀特徵如何傳遞給子代？","opts":["由細胞質來傳遞","僅透過精子的 DNA 來傳遞","僅透過卵的 DNA 來傳遞","由卵和精子的 DNA 共同來傳遞"],"ans":3,"sec":"基因與遺傳","diff":"易","src":"重點演練1","exp":"解題關鍵：有性生殖的子代由<b>精、卵結合</b>而來，親代雙方的遺傳物質是透過<i class=\"hl\">配子的 DNA 共同傳遞</i>給子代的，所以子代的基因一半來自父方、一半來自母方。"},
{"q":"有一植物的等位基因有表現為圓形種子的顯性（R），和表現為皺形種子的隱性（r），試問基因型組合 <b>RR、Rr、rr</b> 的表現型分別為下列何者？","opts":["圓、皺、圓","圓、圓、皺","圓、皺、皺","皺、圓、圓"],"ans":1,"sec":"基因與遺傳","diff":"易","src":"重點演練1","exp":"解題關鍵：成對等位基因中<b>只要有一個顯性，就表現顯性性狀</b>。RR（兩個皆顯性）和 Rr（一顯一隱）都表現出<i class=\"hl\">圓形</i>；只有 rr（兩個皆隱性）才表現出<i class=\"hl\">皺形</i>，故選(B)。"},
{"q":"關於人類的染色體與 ABO 血型的遺傳，下列敘述何者<b>正確</b>？","opts":["人類的體細胞和生殖細胞中，皆具有體染色體和性染色體","人類行有性生殖，故性染色體只存在於生殖細胞中","血型皆為 O 型的父母，生出 O 型女孩的機率為 100%","血型皆為 O 型的父母，有可能生出 A 型的子女"],"ans":0,"sec":"人類的遺傳","diff":"中","src":"重點演練2・是非","exp":"解題關鍵：體細胞（22 對體染色體＋1 對性染色體）和生殖細胞（22 條體染色體＋1 條性染色體）<b>都含有性染色體</b>，故(A)正確、(B)錯誤。O 型的基因型必為 ii，子女必定是 O 型，但<i class=\"hl\">生男生女的機率各為 1/2</i>，所以生出「O 型女孩」的機率只有 50%，故(C)(D)皆錯誤。"},
{"q":"惠心的爸爸血型是 B 型、媽媽是 A 型、<b>姊姊是 O 型</b>。如果惠心的媽媽有意再生一胎，試問生出 O 型小孩的機率會是多少？","opts":["0","1/2","1/4","1/8"],"ans":2,"sec":"人類的遺傳","diff":"中","src":"重點演練2","exp":"解題關鍵：姊姊是 O 型（ii），表示父、母<b>各給了一個 i</b>。因此爸爸的基因型為 Iᴮi、媽媽為 Iᴬi。以棋盤方格法推算，子代為 IᴬIᴮ、Iᴬi、Iᴮi、ii 各占 1/4，故生出 O 型（ii）的機率為 <i class=\"hl\">1/4</i>。"},
{"q":"惠心的爸爸血型是 B 型、媽媽是 A 型、姊姊是 O 型。則惠心父母所生子女在 ABO 血型的<b>表現型</b>最多有 X 種、<b>基因型</b>最多有 Y 種，則 X＋Y＝？","opts":["16","12","8","6"],"ans":2,"sec":"人類的遺傳","diff":"難","src":"重點演練2","exp":"解題關鍵：由姊姊是 O 型可推得爸爸為 Iᴮi、媽媽為 Iᴬi。子代基因型最多有 <b>IᴬIᴮ、Iᴬi、Iᴮi、ii 共 4 種</b>，表現型最多有 <b>AB 型、A 型、B 型、O 型共 4 種</b>，故 X＋Y＝4＋4＝<i class=\"hl\">8</i>。"},
{"q":"假設孔雀魚的黑眼睛及紅眼睛由一對遺傳因子所控制，遺傳因子有顯性 A 與隱性 a 兩種。將甲、乙兩隻<b>黑眼睛</b>孔雀魚交配，所生下的眾多子代有黑眼睛及紅眼睛兩種，其中任意選擇兩隻<b>黑眼睛</b>的子代標記為丙、丁。在不考慮突變的情況下，推測甲、乙、丙、丁中，哪兩隻控制眼睛顏色性狀的基因型<b>一定相同</b>？","opts":["甲、乙","甲、丙","乙、丁","丙、丁"],"ans":0,"sec":"基因與遺傳","diff":"中","src":"會考114（通過率 63%）","exp":"解題關鍵：親代甲、乙皆為黑眼睛，子代卻出現<b>紅眼睛</b>，可知黑眼睛為顯性(A)、紅眼睛為隱性(a)，且親代各帶有一個 a，所以甲、乙的基因型<i class=\"hl\">一定都是 Aa</i>。子代中的黑眼睛可能是 AA 或 Aa，無法確定，故選(A)。"},
{"q":"老師選用基因型皆為 Aa 的雄、雌<b>長翅</b>果蠅進行交配，並要求學生觀察 1000 隻第一子代果蠅的表現型與數量。小坪僅觀察到 4 隻長翅果蠅及 6 隻短翅果蠅後，就直接推測結果為「長翅 400 隻、短翅 600 隻」。老師在小坪的紀錄本寫下：「理論上子代數量不太可能出現這樣的比例。」老師寫下該評語，是因為理論上第一子代預測比例較可能為何？","opts":["應全為長翅","應全為短翅","長翅與短翅的比例應約為 1：3","長翅與短翅的比例應約為 3：1"],"ans":3,"sec":"基因與遺傳","diff":"中","src":"會考113（通過率 65%）","exp":"解題關鍵：親代皆為長翅且基因型皆為 Aa，可知長翅的遺傳因子為 A、短翅為 a。以棋盤方格法推算 <b>Aa × Aa → AA：Aa：aa ＝ 1：2：1</b>，長翅（AA 和 Aa）：短翅（aa）＝<i class=\"hl\">3：1</i>，故選(D)。"},
{"q":"某種昆蟲的體色由一對等位基因控制，<b>深色對淺色為顯性</b>，以 T 表示顯性等位基因、t 表示隱性等位基因。已知此種昆蟲的棲地中有依賴視覺捕食的天敵。假設此棲地中的昆蟲分別由甲（tt × tt）、乙（tt × Tt）、丙（Tt × Tt）、丁（Tt × TT）四組不同基因型的親代繁殖，若各組都產生很多子代且數目幾乎相同，則當棲地環境變化使<b>深色昆蟲最易被天敵捕食</b>時，下列哪一組所繁殖的子代被捕食之數量可能會最多？","opts":["甲","乙","丙","丁"],"ans":3,"sec":"基因與遺傳","diff":"難","src":"會考108（通過率 69%）","exp":"解題關鍵：用棋盤方格法推算各組子代——甲（tt × tt）<b>全為淺色</b>；乙（tt × Tt）深：淺＝1：1；丙（Tt × Tt）深：淺＝3：1；丁（Tt × TT）<i class=\"hl\">全為深色</i>。深色最易被捕食，所以丁組子代被捕食的數量最多，故選(D)。"},
{"q":"人類的 ABO 血型由一對遺傳因子控制，型式有 Iᴬ、Iᴮ 和 i 三種，其中 Iᴬ 和 Iᴮ 是顯性、i 是隱性。甲、乙、丙、丁四組父母的血型配對為——甲：父 A 型、母 A 型；乙：父 A 型、母 B 型；丙：父 O 型、母 AB 型；丁：父 O 型、母 O 型。在不考慮突變的情況下，則何組<b>不可能</b>生下 O 型血型的子女？","opts":["甲","乙","丙","丁"],"ans":2,"sec":"人類的遺傳","diff":"中","src":"會考111（通過率 73%）","exp":"解題關鍵：要生下 O 型（ii）的子女，<b>父、母至少都要帶有一個 i</b>。丙組的母親是 AB 型，基因型必為 <i class=\"hl\">IᴬIᴮ</i>，身上沒有 i，所以不可能生下 O 型子女，故選(C)。"},
{"q":"能否捲舌是由一對位於<b>體染色體</b>的等位基因所控制。若一位孩子及其父母與祖父母（孩子父親的父母）皆能捲舌，但<b>父親的兄弟姊妹皆不能捲舌</b>，則在不考慮突變的情況下，下列敘述何者最合理？","opts":["孩子的父母捲舌基因型必相同","孩子的父母捲舌表現型必相異","孩子的祖父母捲舌基因型必相同","孩子的祖父母捲舌表現型必相異"],"ans":2,"sec":"人類的遺傳","diff":"難","src":"會考109（通過率 43%）","exp":"解題關鍵：祖父母皆能捲舌，卻生出<b>不能捲舌</b>的子女，可知能捲舌為顯性（R）、不能捲舌為隱性（r），且祖父母<i class=\"hl\">各帶有一個隱性等位基因，基因型皆為 Rr</i>，必定相同，故選(C)。(A)孩子父母的基因型可能是 RR 或 Rr，無法確定；(B)(D)父母與祖父母皆能捲舌，表現型都相同。"},
{"q":"關於突變的敘述，下列何者<b>正確</b>？","opts":["突變大多是有害的，造成突變的原因有自然突變與人為誘變兩種","突變都是有害的，且皆由人為造成，在自然情況下不會發生","基因一旦發生突變，都會遺傳給子代","突變只會發生在生殖細胞，不會發生在體細胞"],"ans":0,"sec":"突變與遺傳疾病","diff":"中","src":"重點演練3・是非","exp":"解題關鍵：突變<b>大多</b>有害，但原因有<i class=\"hl\">自然突變</i>（自然界自行發生，機率很低）與<i class=\"hl\">人為誘變</i>兩種，故(A)正確、(B)錯誤。突變若發生在<b>體細胞</b>則不會遺傳給子代，故(C)(D)皆錯誤。"},
{"q":"懷孕的婦女應避免照射 X 光，這是因為可能會發生下列何種情形？","opts":["造成受精卵或胚胎基因突變","產下愛滋寶寶","促使胎兒發育過度快速","造成孕婦將隱性遺傳疾病遺傳給胎兒"],"ans":0,"sec":"突變與遺傳疾病","diff":"易","src":"重點演練3","exp":"解題關鍵：X 光是導致基因突變的<i class=\"hl\">物理因子</i>，故有可能造成胚胎或受精卵基因突變。(B)愛滋為<b>垂直感染</b>，不是照射 X 光造成的。"},
{"q":"關於生物突變的敘述，下列何者是<b>錯誤</b>的？","opts":["亞硝酸鹽類可能會造成生物體突變","自然突變發生的機率很低","紫外光為造成突變的物理因子","都是由顯性等位基因突變為隱性等位基因"],"ans":3,"sec":"突變與遺傳疾病","diff":"中","src":"重點演練3","exp":"解題關鍵：突變的方向<b>沒有限制</b>——可能由顯性等位基因突變為隱性等位基因，<i class=\"hl\">也可能由隱性突變為顯性</i>，故(D)錯誤。(A)亞硝酸鹽為化學因子、(C)紫外光為物理因子，都正確。"},
{"q":"下列發生在生物體的變化中，何者<b>必定</b>屬於自然突變的結果？","opts":["嚼食檳榔造成口腔癌","黑毛狗和白毛狗生出黑白毛相間的小狗","核輻射使孕婦所懷的胎兒產生畸形","馬腳趾的演化從四趾變成單趾"],"ans":3,"sec":"突變與遺傳疾病","diff":"中","src":"重點演練3","exp":"解題關鍵：(A)(C)都是接觸<b>化學或物理因子</b>造成的<i class=\"hl\">人為誘變</i>；(B)有可能只是親代遺傳物質重新組合的<b>遺傳</b>結果，不一定是突變。只有(D)馬腳趾的演化是長時間自然發生的突變累積，故選(D)。"},
{"q":"步宇年輕時喜歡晒太陽，過量紫外線造成<b>上臂皮膚細胞</b>中的基因突變，因此罹患皮膚癌。試問將來他的小孩是否會遺傳到皮膚癌？其原因為何？","opts":["是，因為小孩也遺傳到突變的基因","是，因為他的小孩必定喜歡晒太陽","否，因為此突變只發生在體細胞，不會遺傳","否，因為任何細胞突變都不會遺傳"],"ans":2,"sec":"突變與遺傳疾病","diff":"中","src":"重點演練3","exp":"解題關鍵：皮膚細胞屬於<b>體細胞</b>，體細胞的突變<i class=\"hl\">不會遺傳給子代</i>，只會表現在個體本身。(D)錯在「任何細胞」——若突變發生在<b>生殖細胞</b>，就有機會遺傳給子代。"},
{"q":"關於生物技術的敘述，下列何者<b>正確</b>？","opts":["基因轉殖是將某一生物的基因轉殖入另一種生物的細胞內，使其表現出該基因的性狀","複製動物屬於體外受精的生殖方式","傳統與現代育種都必須經歷長時間逐代繁殖與選拔的過程","基因改造食品對人體健康的影響已確定完全無害"],"ans":0,"sec":"生物技術","diff":"中","src":"重點演練4・是非","exp":"解題關鍵：(B)複製動物<b>未經受精作用</b>，屬於<i class=\"hl\">無性生殖</i>；(C)<i class=\"hl\">現代</i>育種運用生物技術，可縮短逐代篩選的時間；(D)基因改造食品對人體健康的影響<b>仍有爭議</b>，並未確定無害。"},
{"q":"下列哪一種<b>不是</b>生物技術的應用範圍？","opts":["利用細菌大量生產胰島素","戴眼鏡改善紅綠色盲患者的情況","利用雞蛋大量製造疫苗","利用 DNA 鑑定親子關係"],"ans":1,"sec":"生物技術","diff":"易","src":"重點演練4","exp":"解題關鍵：配戴眼鏡是<i class=\"hl\">光學</i>的應用，和遺傳物質無關，不屬於生物技術；而且紅綠色盲是<b>基因造成的</b>，戴眼鏡也無法改善。"},
{"q":"關於基因轉殖技術的應用，下列敘述何者<b>錯誤</b>？","opts":["將抗病毒基因轉殖到木瓜樹，可使木瓜樹不容易感染病毒","目前的技術已能轉殖木瓜基因於牛隻身上，並可以此牛隻大量生產木瓜牛乳","可將抗蟲基因殖入農作物細胞內，使作物自身可以抵抗蟲害而減少農藥使用量","可將水母的螢光基因轉殖到其他魚體中，產生特殊品種的螢光魚"],"ans":1,"sec":"生物技術","diff":"易","src":"重點演練4","exp":"解題關鍵：(B)<b>目前的技術沒有辦法做到</b>。基因轉殖是讓細胞表現出外來基因的<i class=\"hl\">特性</i>（例如抗蟲、抗病毒、發螢光），並不是把一種食物的味道裝進另一種生物裡。"},
{"q":"軟骨發育不全症是體染色體中某基因發生突變所造成，患者具有身材矮小、四肢短小變形等特徵，若親代只有其中一方為患者，子代就會有 50% 以上的罹病率。已知阿佑因<b>發生突變</b>而患有軟骨發育不全症，但其<b>父母皆未患病</b>。若以 F 代表突變的遺傳因子、f 代表正常的遺傳因子，則關於阿佑父母基因型的推論，下列何者最合理？","opts":["父：Ff、母：Ff","父：Ff、母：ff","父：FF、母：FF","父：ff、母：ff"],"ans":3,"sec":"突變與遺傳疾病","diff":"難","src":"會考112（通過率 29%）","exp":"解題關鍵：題目說明<b>有 F 者會患病、無 F 者不會患病</b>（顯性遺傳）。阿佑的父、母皆未患病，代表兩人<i class=\"hl\">都不帶有突變的遺傳因子 F</i>，所以基因型皆為 ff，阿佑的 F 是<b>自己發生突變</b>來的，故選(D)。"},
{"q":"小鼠性別決定機制與人類相同，但視覺僅能看見黃、藍和灰色。若將人類感光色素基因成功轉殖至許多小鼠<b>受精卵</b>的 X 染色體之特定位置，則由此發育的小鼠可分辨紅綠燈的顏色。關於上述成功轉殖的這群小鼠，下列推論何者最合理？","opts":["屬於親代行無性生殖所產生的子代","若為雄性則其所產生的精子皆具此基因","全身的體細胞皆具有人類感光色素基因","互相繁殖出的下一子代皆無法分辨紅綠色"],"ans":2,"sec":"生物技術","diff":"難","src":"會考108（通過率 50%）","exp":"解題關鍵：基因轉殖到<b>受精卵</b>，受精卵經<i class=\"hl\">細胞分裂</i>產生的體細胞都會帶有這個基因，故(C)正確。(A)受精卵由精卵結合而來，仍是有性生殖；(B)雄性為 XY，經減數分裂後<b>帶 Y 染色體的精子沒有此基因</b>；(D)此基因會隨 X 染色體傳給子代，所以子代也可能分辨紅綠色。"},
{"q":"科學家可利用生物科技複製動物，如桃莉羊。在不考慮突變的情況下，桃莉羊與親代之間的<b>基因相似程度</b>與下列何者<b>不同</b>？","opts":["番薯及其以塊根繁殖產生的子代","青蛙及其以體外受精產生的子代","變形蟲及其以分裂生殖產生的子代","酵母菌及其以出芽生殖產生的子代"],"ans":1,"sec":"生物技術","diff":"中","src":"會考110補","exp":"解題關鍵：生物複製<b>未經受精作用</b>，屬於無性生殖，子代與親代的基因<i class=\"hl\">完全相同</i>。(A)(C)(D)都是無性生殖，基因也完全相同；只有(B)青蛙的體外受精屬於<b>有性生殖</b>，子代與親代的基因<i class=\"hl\">不完全相同</i>，故選(B)。"},
{"q":"關於生物演化的敘述，下列何者<b>正確</b>？","opts":["地球環境發生巨大變動時，無法適應的生物滅絕，能適應新環境者存活繁衍","地球環境每發生一次巨大變動，就會造成所有生物滅絕","蝌蚪長出四肢變成青蛙，此過程屬於演化","化石堅硬，一旦形成便可永久保存"],"ans":0,"sec":"生物演化與化石","diff":"中","src":"重點演練1・是非","exp":"解題關鍵：環境變動時，原有生物中<b>無法適應者滅絕、能適應新環境者存活繁衍</b>，不會全部滅絕，故(A)正確、(B)錯誤。(C)蝌蚪變青蛙是<i class=\"hl\">變態</i>，演化須經歷<b>漫長的時間</b>。(D)化石保存<b>不易</b>，容易受環境變動而破壞。"},
{"q":"關於化石的敘述，下列何者<b>正確</b>？","opts":["只有動物的骨骼、硬殼可以形成化石，植物無法形成化石","植物也有堅硬的部分（如細胞壁）可以形成化石","化石大都在火成岩中被發現","化石一旦形成，就不會再受環境變動破壞"],"ans":1,"sec":"生物演化與化石","diff":"中","src":"重點演練1・是非","exp":"解題關鍵：形成化石需要<b>較堅硬的部分</b>，植物的<i class=\"hl\">細胞壁</i>就是堅硬部分，所以植物也能形成化石（如樹蕨化石），故(A)錯誤、(B)正確。(C)化石大都在<i class=\"hl\">沉積岩</i>中發現。"},
{"q":"關於地球生物演化的趨勢，下列何者最為正確？","opts":["體型大 → 體型小","種類少 → 種類多","多細胞生物 → 單細胞生物","脊椎動物 → 無脊椎動物"],"ans":1,"sec":"生物演化與化石","diff":"易","src":"重點演練1","exp":"解題關鍵：演化趨勢是<b>構造簡單→複雜、單細胞→多細胞、無脊椎→脊椎、種類少→種類多、海洋→陸地</b>，故(C)(D)方向相反。(A)<i class=\"hl\">體型的演化趨勢依物種而定</i>，不一定是小→大，所以不是「最正確」的選項。"},
{"q":"考古學家在某地發現某種恐龍大量的骨骼和牙齒化石，且骨骼可拼成完整形體，則由所發現的化石<b>無法</b>確切得知此種恐龍的何種特徵？","opts":["體表顏色","身體型態","體長","食性"],"ans":0,"sec":"生物演化與化石","diff":"中","src":"重點演練1","exp":"解題關鍵：由骨骼可推知<b>身體型態和體長</b>，由牙齒可推知<b>食性</b>；但除非是保留完整的特殊化石，否則<i class=\"hl\">大多數化石無法推測體表顏色</i>等細節特徵。"},
{"q":"由馬的系列化石可推知其演化過程，則下列何者與由化石所推論<b>不符</b>？","opts":["生活環境由叢林轉變為草原","由吃嫩枝演化為吃乾草","體型由小演化為大","腳趾數由少演化為多"],"ans":3,"sec":"生物演化與化石","diff":"中","src":"重點演練1","exp":"解題關鍵：馬的腳趾數是<i class=\"hl\">四趾 → 三趾 → 單趾</i>，是<b>由多演化為少</b>，適應在草原上跳躍奔跑，故(D)不符。"},
{"q":"關於生物的俗名與學名，下列敘述何者<b>正確</b>？","opts":["同種生物的定義是學名完全相同，且交配後可生下具有生殖能力的後代","兩種生物的種小名相同，就屬於同種生物","蟑螂的俗名為「小強」，學名為「德國蟑螂」","學名由各地人們自行給予，所以同一種生物會有不同的學名"],"ans":0,"sec":"生物的命名與分類","diff":"中","src":"重點演練2・是非","exp":"解題關鍵：同種生物的定義是<i class=\"hl\">學名完全相同</i>，(B)只有種小名相同、屬名不同，代表不同屬，絕非同種。(C)學名必須是<b>拉丁文</b>並採二名法，「德國蟑螂」是俗名。(D)學名<b>國際通用，一種生物只有一個</b>。"},
{"q":"生物老師在黑板上寫出甲～丁四種生物的學名——甲：Ailuropoda minor、乙：Prionailurus bengalensis、丙：Seleucidis melanoleuca、丁：Ailuropoda melanoleuca。老師說明其中包含了兩種熊、一種貓和一種鳥，則四種生物中，哪兩種最可能是熊？","opts":["甲、丁","乙、丙","乙、丁","丙、丁"],"ans":0,"sec":"生物的命名與分類","diff":"中","src":"重點演練2","exp":"解題關鍵：學名的<b>第一個字是屬名</b>。甲和丁的屬名都是 Ailuropoda，表示<i class=\"hl\">同屬</i>，親緣關係最接近，所以最可能是那兩種熊，故選(A)。（注意：丙和丁的<b>種</b>小名相同，但屬名不同，不代表親緣接近）"},
{"q":"臺灣水韭是一種水生蕨類植物，目前僅見於陽明山國家公園的夢幻湖中。其學名的正確書寫方式應為下列何者？","opts":["Isoetes Taiwanensis","isoetes taiwanensis","Isoetes taiwanensis","isoetes Taiwanensis"],"ans":2,"sec":"生物的命名與分類","diff":"易","src":"重點演練2","exp":"解題關鍵：二名法的規則是<b>屬名首字母大寫、種小名全部小寫</b>，整個學名以斜體字（或正體加底線）書寫，故選(C)。"},
{"q":"下列有關生物分類的敘述，何者<b>正確</b>？","opts":["僅依據生物外形的相似程度來分類","生物分類的階層越高，所包含的生物種類越多，親緣關係也越近","不同種的生物個體可用人工方法達到交配，但產生的後代沒有生殖能力","學名由屬名和種小名所組成，屬名為形容詞，種小名為名詞"],"ans":2,"sec":"生物的命名與分類","diff":"中","src":"重點演練2","exp":"解題關鍵：(A)還要依<b>內部構造、演化親緣關係</b>等來分類。(B)階層越高所含種類越多，但親緣關係<i class=\"hl\">越遠</i>。(D)屬名為<b>名詞</b>、種小名為<b>形容詞</b>。(C)如馬和驢人工交配產生的騾不具生殖能力，正確。"},
{"q":"關於原核生物界的敘述，下列何者<b>正確</b>？","opts":["原核生物不具有細胞核，其遺傳物質散布在細胞質中","原核生物界中的生物不具有細胞核，也沒有遺傳物質","藍綠菌具有葉綠體，可行光合作用","原核生物都不能行光合作用"],"ans":0,"sec":"病毒、原核生物界、原生生物界與真菌界","diff":"中","src":"重點演練3・是非","exp":"解題關鍵：原核生物<b>沒有核膜</b>，所以沒有細胞核，但<i class=\"hl\">仍然有遺傳物質</i>，只是散布在細胞質的特定區域，故(A)正確、(B)錯誤。藍綠菌<b>沒有葉綠體</b>，但具有<i class=\"hl\">葉綠素</i>，仍可行光合作用，故(C)(D)皆錯誤。"},
{"q":"關於原生生物界的敘述，下列何者<b>正確</b>？","opts":["無細胞核，是最原始的生命型態","藻類具有葉綠素，但不具有葉綠體","原生動物不具有運動的能力","原生菌類在生態系中屬於分解者"],"ans":3,"sec":"病毒、原核生物界、原生生物界與真菌界","diff":"中","src":"重點演練3","exp":"解題關鍵：(A)原生生物<b>具有細胞核</b>，是最原始的<i class=\"hl\">真核</i>生物；(B)藻類<b>有葉綠體</b>；(C)原生動物可能具有纖毛、鞭毛或偽足等構造，<i class=\"hl\">可協助運動</i>；(D)原生菌類分解體外養分再吸收，屬於分解者，正確。"},
{"q":"下列何者為真菌，卻和多數的真菌差異較大，不但屬於<b>單細胞</b>生物，而且<b>不具有菌絲</b>？","opts":["青黴菌","酵母菌","黏菌","竹蓀"],"ans":1,"sec":"病毒、原核生物界、原生生物界與真菌界","diff":"中","src":"重點演練3","exp":"解題關鍵：真菌大多是<b>多細胞、具菌絲</b>的，只有<i class=\"hl\">酵母菌</i>是單細胞、無菌絲，且行出芽生殖。(C)黏菌是<b>原生菌類</b>，屬於原生生物界，不是真菌。"},
{"q":"豆腐乳是一種傳統發酵食品，其做法是將豆腐接種毛黴菌以進行發酵，當豆腐被菌絲完全覆蓋後，再加入調味料而製成。下列有關毛黴菌構造的敘述，何者最合理？","opts":["不具孢子","不具粒線體","不具葉綠體","不具細胞壁"],"ans":2,"sec":"病毒、原核生物界、原生生物界與真菌界","diff":"易","src":"會考112（通過率 80%）","exp":"解題關鍵：黴菌屬於<b>真菌</b>。真菌<i class=\"hl\">沒有葉綠體</i>，不能行光合作用，只能分解或吸收外界養分，故選(C)。真菌有細胞壁（幾丁質）、會產生孢子，也具有粒線體。"},
{"q":"甲、乙兩種生物的特徵比較如下——甲：有細胞核、有細胞膜、<b>無</b>葉綠素、<b>有</b>菌絲；乙：<b>無</b>細胞核、有細胞膜、<b>有</b>葉綠素、<b>無</b>菌絲。則關於甲、乙所屬的分類，依序為下列何者？","opts":["原生生物界、真菌界","原生生物界、植物界","真菌界、原生生物界","真菌界、原核生物界"],"ans":3,"sec":"病毒、原核生物界、原生生物界與真菌界","diff":"中","src":"會考114（通過率 53%）","exp":"解題關鍵：<b>無細胞核 ＝ 原核生物界；有菌絲 ＝ 真菌界</b>。甲有細胞核且有菌絲，但沒有葉綠素，屬於<i class=\"hl\">真菌界</i>；乙沒有細胞核，是<i class=\"hl\">原核生物界</i>（有葉綠素的藍綠菌），故選(D)。"},
{"q":"關於植物界的敘述，下列何者<b>正確</b>？","opts":["植物細胞都具有細胞壁，但只有綠色細胞具有葉綠體","植物界的生物，其細胞必定同時具有葉綠體與細胞壁","藻類具有葉綠體和細胞壁，是植物界中最原始的物種","植物由藻類演化而來，所以藻類也屬於植物界"],"ans":0,"sec":"植物界","diff":"中","src":"重點演練4・是非","exp":"解題關鍵：植物細胞<b>都有細胞壁</b>，但只有<i class=\"hl\">綠色</i>的細胞才有葉綠體（例如根部細胞就沒有），故(A)正確、(B)錯誤。藻類屬於<i class=\"hl\">原生生物界</i>，不是植物界，故(C)(D)錯誤。"},
{"q":"下列何者為<b>無維管束</b>植物，植株矮小且通常生活在潮溼的地方？","opts":["香菇","綠藻","鳥巢蕨","土馬騌"],"ans":3,"sec":"植物界","diff":"易","src":"重點演練4","exp":"解題關鍵：<i class=\"hl\">蘚苔植物沒有維管束</i>，運輸效率差，所以植株矮小、生活在潮溼處，土馬騌就是苔類。(A)香菇是真菌、(B)綠藻是原生生物，<b>都不是植物</b>；(C)鳥巢蕨是蕨類，<b>有維管束</b>。"},
{"q":"千千想讓小香認識植物園裡的<b>裸子植物</b>，則他應該選擇下列哪一種特徵的植物？","opts":["有毬果","會開花","葉脈為平行脈","成熟葉背有孢子囊堆"],"ans":0,"sec":"植物界","diff":"易","src":"重點演練4","exp":"解題關鍵：裸子植物的生殖器官是<i class=\"hl\">毬果</i>。(B)會開花是<b>被子植物</b>的特徵；(C)平行脈是被子植物中<b>單子葉植物</b>的特徵；(D)孢子囊堆是<b>蕨類植物</b>的特徵。"},
{"q":"下列四種植物依演化順序由先至後，以代號排列的順序為何？<br>甲. 被子植物　乙. 蘚苔植物　丙. 蕨類植物　丁. 裸子植物","opts":["甲乙丙丁","乙丙丁甲","乙丙甲丁","丙乙丁甲"],"ans":1,"sec":"植物界","diff":"易","src":"重點演練4","exp":"解題關鍵：陸生植物的演化順序為<i class=\"hl\">蘚苔植物 → 蕨類植物 → 裸子植物 → 被子植物</i>（乙丙丁甲），對應的是角質層 → 維管束 → 種子 → 花與果實依序出現。"},
{"q":"將四種植物分成兩組：<b>蘚苔植物、蕨類植物</b>為一組，<b>裸子植物、被子植物</b>為另一組。試問其分類依據應為下列何者？","opts":["花的有無","維管束的有無","種子的有無","角質層的有無"],"ans":2,"sec":"植物界","diff":"中","src":"重點演練4","exp":"解題關鍵：(A)只有<b>被子</b>植物有花；(B)只有<b>蘚苔</b>植物沒有維管束；(D)四類<b>全部都有</b>角質層。只有「種子的有無」能把蘚苔、蕨類（以<i class=\"hl\">孢子</i>繁殖）和裸子、被子（以<i class=\"hl\">種子</i>繁殖）剛好切成兩組，故選(C)。"},
{"q":"有關植物特徵的敘述，下列何者<b>正確</b>？","opts":["蘚苔植物有根、莖、葉","蕨類植物有維管束","裸子植物不會產生種子","單子葉植物的根為軸根"],"ans":1,"sec":"植物界","diff":"易","src":"重點演練4","exp":"解題關鍵：(A)蘚苔植物<b>不具維管束</b>，也沒有真正的根、莖、葉，只有假根、假莖、假葉；(C)裸子植物<i class=\"hl\">會</i>產生種子，只是種子裸露沒有果實保護；(D)單子葉植物的根為<i class=\"hl\">鬚根</i>，軸根是雙子葉植物。"},
{"q":"從藻類到陸生植物的出現順序如下：綠藻 —<b>甲</b>→ 蘚苔植物 —<b>乙</b>→ 蕨類植物 —<b>丙</b>→ 裸子植物 —<b>丁</b>→ 被子植物。關於甲～丁四個階段中，植物構造的演變何者<b>錯誤</b>？","opts":["甲階段：出現了角質層","乙階段：出現了維管束及根、莖、葉","丙階段：出現了種子與種皮的構造","丁階段：出現了花粉管"],"ans":3,"sec":"植物界","diff":"難","src":"重點演練4","exp":"解題關鍵：<b>裸子植物與被子植物都有花粉管</b>，所以花粉管出現在<i class=\"hl\">丙階段</i>（蕨類→裸子）；丁階段（裸子→被子）出現的是<i class=\"hl\">花和果實</i>，故(D)錯誤。"},
{"q":"下列為四本書的書名，每本書的書名分別顯示出所要介紹的內容，書中會列舉一些植物詳細說明其特徵，則哪一本書<b>最不可能</b>以蘇鐵作為這些植物的主要例子？","opts":["《花朵圖鑑》","《種子的傳播》","《毬果構造解析》","《維管束植物簡介》"],"ans":0,"sec":"植物界","diff":"中","src":"會考110（通過率 63%）","exp":"解題關鍵：蘇鐵是<b>裸子植物</b>，有維管束、有種子、有毬果，但<i class=\"hl\">不會開花</i>（沒有花的構造），所以最不可能出現在《花朵圖鑑》，故選(A)。"},
{"q":"在演化過程中，各類植物曾產生一些有利於適應陸地環境的構造。若依陸地植物演化的順序，推論<b>種子、果實及維管束</b>三構造出現的先後，下列何者最合理？","opts":["維管束→果實→種子","維管束→種子→果實","果實→種子→維管束","果實→維管束→種子"],"ans":1,"sec":"植物界","diff":"中","src":"會考109補","exp":"解題關鍵：植物演化順序為<b>蘚苔類（無維管束、無種子、無果實）→ 蕨類（有維管束）→ 裸子植物（有種子）→ 被子植物（有果實）</b>，故構造出現順序為<i class=\"hl\">維管束 → 種子 → 果實</i>，選(B)。"},
{"q":"關於下列動物的分類，何者<b>正確</b>？","opts":["水蛭身體柔軟且分節，屬於環節動物門","海馬和海獅都屬於哺乳類","鱷魚體表具有鱗片，所以屬於魚類","水蛭身體柔軟、移動緩慢，屬於軟體動物門"],"ans":0,"sec":"動物界","diff":"中","src":"重點演練5・是非","exp":"解題關鍵：<b>軟體動物不分節</b>，水蛭身體柔軟<i class=\"hl\">且分節</i>，屬於環節動物門，故(A)正確、(D)錯誤。(B)海馬是<i class=\"hl\">魚類</i>，海獅才是哺乳類。(C)鱷魚用肺呼吸、體內受精、卵有硬殼，屬於<i class=\"hl\">爬蟲類</i>。"},
{"q":"有關環節動物門的敘述，下列何者<b>正確</b>？","opts":["身體柔軟且有外殼保護","蚯蚓可利用體表的剛毛爬行前進","蠶寶寶屬於環節動物門","是動物界中種類和數量最多的一門"],"ans":1,"sec":"動物界","diff":"中","src":"重點演練5","exp":"解題關鍵：(A)有外殼保護是<b>軟體動物門</b>的特徵；(C)蠶寶寶有分節的附肢和外骨骼，屬於<b>節肢動物門</b>；(D)種類和數量最多的是<i class=\"hl\">節肢動物門</i>。"},
{"q":"生活在南半球的國王企鵝，其身體表面具有<b>羽毛</b>，前肢演化成適合游泳的鰭狀肢，會潛入水中覓食。試問在動物的分類中，企鵝屬於下列何者？","opts":["鳥類","魚類","哺乳類","兩生類"],"ans":0,"sec":"動物界","diff":"易","src":"重點演練5","exp":"解題關鍵：<b>只有鳥類體表才有羽毛</b>，企鵝雖然不會飛、會潛水，但體表有羽毛、卵生且卵有硬殼，仍屬於<i class=\"hl\">鳥類</i>。"},
{"q":"塵蟎常居住在人類的衣物及棉被上，以人類掉落的皮屑為生，其身體分節、具有<b>八隻步足</b>。試問塵蟎在分類上和哪一種生物最接近？","opts":["蝴蝶","蜘蛛","招潮蟹","蜈蚣"],"ans":1,"sec":"動物界","diff":"中","src":"重點演練5","exp":"解題關鍵：由<b>步足數</b>判斷——塵蟎有 <i class=\"hl\">4 對</i>步足，屬於<b>蛛形綱</b>；蝴蝶（昆蟲綱）3 對、招潮蟹（甲殼綱）5 對、蜈蚣有很多對，故和蜘蛛最接近。"},
{"q":"下列關於棘皮動物門的敘述，哪一項<b>不正確</b>？","opts":["海膽呈球狀，身體表面有許多棘","海參屬於生活在淡水的棘皮動物","管足是棘皮動物的運動構造","海星可行斷裂生殖"],"ans":1,"sec":"動物界","diff":"中","src":"重點演練5","exp":"解題關鍵：棘皮動物<i class=\"hl\">全部生活在海水中</i>，沒有淡水種類，故(B)錯誤。海參是海洋中的棘皮動物。"},
{"q":"關於節肢動物門中，昆蟲的<b>翅膀和步足</b>之敘述，下列何者是正確的？","opts":["蒼蠅有一對翅膀和三對步足","蝗蟲沒有翅膀但有四對步足","蚊子有兩對翅膀和三對步足","大多數的蝴蝶有兩對翅膀和兩對步足"],"ans":0,"sec":"動物界","diff":"難","src":"重點演練5","exp":"解題關鍵：<b>昆蟲綱一律是 3 對步足</b>，故(B)錯。蠅、蚊只有<i class=\"hl\">1 對</i>翅膀，故(A)正確、(C)錯。大多數蝴蝶有 2 對翅膀和 <i class=\"hl\">3 對</i>步足（部分蝶科的前足退化），故(D)錯。"},
{"q":"將百合、土馬騌、山蘇、蘇鐵和玫瑰五種植物依特徵分類：<b>不形成種子</b>者歸為甲類；<b>形成種子且產生果實</b>者歸為乙類；<b>形成種子但不產生果實</b>者歸為丙類。若百合歸為乙類，則乙類除了百合外，還應包括下列何者？","opts":["土馬騌","山蘇","蘇鐵","玫瑰"],"ans":3,"sec":"實驗整理","diff":"中","src":"實驗立即練・檢索表","exp":"解題關鍵：甲類是不形成種子的<b>蘚苔（土馬騌）與蕨類（山蘇）</b>；丙類是有種子卻沒有果實的<b>裸子植物（蘇鐵）</b>；乙類是有花有果實的<i class=\"hl\">被子植物</i>——百合和玫瑰，故選(D)。"},
{"q":"將六種動物分成兩類：<b>鮭魚、海葵、青蛙</b>為一類，<b>錦蛇、蜘蛛、麻雀</b>為另一類。試問下列何者為其分類的依據？","opts":["脊椎骨的有無","體溫是否恆定","是否為卵生","體內受精或體外受精"],"ans":3,"sec":"實驗整理","diff":"難","src":"實驗立即練・檢索表","exp":"解題關鍵：(A)海葵和蜘蛛都<b>沒有</b>脊椎骨，卻被分在不同組；(B)只有麻雀是內溫動物；(C)六者<b>皆為卵生</b>。鮭魚、海葵、青蛙都是<i class=\"hl\">體外受精</i>，錦蛇、蜘蛛、麻雀都是<i class=\"hl\">體內受精</i>，故選(D)。"},
{"q":"在地層中發現下列何者，最能作為該地層過去曾經位於<b>海裡</b>的證據？","opts":["隕石","馬的化石","火成岩的岩脈","三葉蟲的化石"],"ans":3,"sec":"生物演化與化石","diff":"易","src":"會考100","exp":"解題關鍵：<b>三葉蟲生活在古代的海洋中</b>，發現牠的化石代表該地層曾經位於海裡。(A)(C)與海陸環境無關；(B)馬生活在<i class=\"hl\">陸地</i>上。"},
{"q":"某份鳥類資料顯示：<b>雁鴨科</b>有赤膀鴨（Mareca strepera）、羅文鴨（Mareca falcata）、赤頸鴨（Mareca penelope）、鳳頭潛鴨（Aythya fuligula）；<b>鸕鷀科</b>有鸕鷀（Phalacrocorax carbo）；<b>鵜鶘科</b>有卷羽鵜鶘（Pelecanus crispus）。推論表中所有鳥類在分類上的敘述，何者是<b>可能</b>的？","opts":["最多包含 3 個目、4 個屬","最多包含 3 個目、6 個屬","最多包含 4 個目、4 個屬","最多包含 4 個目、6 個屬"],"ans":0,"sec":"生物的命名與分類","diff":"難","src":"會考114（通過率 56%）","exp":"解題關鍵：分類階層<b>由高到低</b>是目 ＞ 科 ＞ 屬，<i class=\"hl\">同科必定同目</i>。表中共 3 個科，所以最多 3 個目；學名第一個字是屬名，表中有 Mareca、Aythya、Phalacrocorax、Pelecanus 共 <i class=\"hl\">4 個屬</i>，故選(A)。"},
{"q":"小美在植物圖鑑中看到杜鵑花科（Ericaceae）中的金毛杜鵑（Rhododendron oldhamii）後，若想要依學名搜尋與此植物<b>同屬但不同物種</b>的植物，則下列何種查詢方式最能達到他的目的？","opts":["學名第一個字為 Ericaceae 的植物","學名第二個字為 oldhamii 的植物","學名第一個字為 Rhododendron 的植物","學名為 Rhododendron oldhamii 的植物"],"ans":2,"sec":"生物的命名與分類","diff":"中","src":"會考113（通過率 65%）","exp":"解題關鍵：學名<b>第一個字是屬名、第二個字是種小名</b>。同屬但不同物種的植物，<i class=\"hl\">屬名相同、種小名不同</i>，所以要查第一個字為 Rhododendron 的植物，故選(C)。"},
{"q":"人類從大豆野生種（Glycine soja）培育出黃豆、毛豆及黑豆等經濟作物，三者的<b>物種名稱皆為大豆（Glycine max）</b>，但種皮顏色與特性不同。根據上述推測，下列敘述何者最合理？","opts":["三者皆是由野生種的營養器官培育而來","三者的種子用途雖不同但皆為營養器官","三者的不同特性主要經自然環境篩選而來","三者中任兩者相互授粉可產生具生殖能力子代"],"ans":3,"sec":"生物的命名與分類","diff":"難","src":"會考109補","exp":"解題關鍵：黃豆、毛豆、黑豆的<b>學名相同</b>，表示為<i class=\"hl\">同種生物</i>，所以互相授粉可產生具生殖能力的後代，故(D)正確。(A)(C)若由營養器官（無性生殖）培育，三者特徵應完全相同，故是<b>有性生殖後由人為篩選</b>而來；(B)種子是<b>生殖</b>器官。"},
{"q":"海中四種動物的特徵為——甲（海蛇）：具鱗片、以<b>肺</b>呼吸；乙（海鰻）：具鱗片、以<b>鰓</b>呼吸；丙（海兔）：身體柔軟、<b>不分節</b>；丁（海牛）：母體分泌<b>乳汁</b>。若以<b>脊椎骨的有無</b>作為分類依據，則下列哪一分類結果最合理？","opts":["一組為甲、乙；另一組為丙、丁","一組為甲、丁；另一組為乙、丙","一組為乙；另一組為甲、丙、丁","一組為丙；另一組為甲、乙、丁"],"ans":3,"sec":"動物界","diff":"中","src":"會考104（通過率 39%）","exp":"解題關鍵：甲有鱗片以肺呼吸→<b>爬蟲類</b>；乙有鱗片以鰓呼吸→<b>魚類</b>；丁分泌乳汁→<b>哺乳類</b>，三者都是<i class=\"hl\">脊椎動物</i>。丙身體柔軟不分節→<b>軟體動物</b>，<i class=\"hl\">無脊椎骨</i>，故選(D)。"},
{"q":"某動物園的紀錄為——食蟹獴：肺呼吸、胎生、體表有毛髮以保持體溫；環頸雉：氣囊、卵生、體表有羽毛可以協助飛行；孟加拉虎：肺呼吸、胎生、能分泌乳汁哺育幼兒；豹紋瞼虎：肺呼吸、卵生、體表具有鱗片以適應乾燥環境。根據此表將動物分類，推測下列哪種動物的<b>體溫調節方式</b>可能與其他三者不同？","opts":["食蟹獴","環頸雉","孟加拉虎","豹紋瞼虎"],"ans":3,"sec":"動物界","diff":"中","src":"試辦 102","exp":"解題關鍵：食蟹獴、孟加拉虎為<b>哺乳類</b>，環頸雉為<b>鳥類</b>，三者都是<i class=\"hl\">內溫動物</i>；豹紋瞼虎體表有鱗片、卵生，屬於<b>爬蟲類</b>，是<i class=\"hl\">外溫動物</i>，故選(D)。"},
{"q":"關於生態系的敘述，下列何者<b>正確</b>？","opts":["生態系包含生物和非生物兩部分，只有生物無法組成生態系","同一時間內，生活在紅樹林的所有生物，就可組成紅樹林生態系","食蟲植物可藉由捕食昆蟲獲得養分，無須再進行光合作用","藍綠菌在生態系中扮演分解者"],"ans":0,"sec":"生物圈與生態系","diff":"中","src":"重點演練1・是非","exp":"解題關鍵：生態系是<b>生物和其生活的環境</b>所組成，包含生物和<i class=\"hl\">非生物</i>兩部分，故(A)正確、(B)錯誤（那只是群集）。(C)食蟲植物捕蟲是為了補充<b>氮元素</b>，<i class=\"hl\">主要養分仍靠光合作用</i>。(D)藍綠菌有葉綠素可行光合作用，屬於<i class=\"hl\">生產者</i>。"},
{"q":"下列關於地球生物圈的敘述，何者<b>正確</b>？","opts":["人類已登陸月球，故月球屬於生物圈","生物圈的範圍可能隨生物滅絕而減少","生物圈上下垂直範圍共約 10 公里","生物圈中分布最廣的生物是人類"],"ans":1,"sec":"生物圈與生態系","diff":"中","src":"重點演練1","exp":"解題關鍵：生物圈會<i class=\"hl\">隨生物的發現或滅絕而變動</i>，故(B)正確。(A)地球生物無法在月球上自然生存；(C)上下各約 10 公里，<b>共約 20 公里</b>；(D)分布最廣的是<i class=\"hl\">細菌</i>。"},
{"q":"生物各有其適應生存環境的策略，下列各種生物的特徵與功能，何者<b>正確</b>？","opts":["仙人掌的針狀葉更有利於行光合作用","北極熊皮下脂肪厚主要是利於游泳","枯葉蝶體色形態與環境相似有利於隱藏","蝙蝠以超聲波測距是為了適應明亮的環境"],"ans":2,"sec":"生物圈與生態系","diff":"易","src":"重點演練1","exp":"解題關鍵：(A)針狀葉是為了<i class=\"hl\">減少水分散失</i>；(B)皮下脂肪厚主要是<i class=\"hl\">禦寒及儲存養分</i>；(D)蝙蝠的超聲波是為了適應<i class=\"hl\">黑暗</i>的洞穴環境。(C)即為<b>保護色</b>，正確。"},
{"q":"小新將蝸牛放入空的水族箱中，每天用水、菜葉餵食，則下列現象何者<b>正確</b>？","opts":["蝸牛在水族箱中為消費者","蝸牛在水族箱中為分解者","水族箱中已形成生態系","蝸牛在水族箱中為生產者"],"ans":0,"sec":"生物圈與生態系","diff":"中","src":"重點演練1","exp":"解題關鍵：蝸牛不能自行製造養分，是<i class=\"hl\">消費者</i>，故(A)正確、(B)(D)錯誤。(C)這個水族箱<b>沒有生產者、也沒有分解者</b>，所以不能稱為生態系。"},
{"q":"關於食物鏈與能量流動的敘述，下列何者<b>正確</b>？","opts":["單一生物族群可能同時存在於多個食物鏈中，多個食物鏈彼此連接即為食物網","生態系中的單一生物族群只會存在於一個食物鏈中","能量流動時，大部分的能量都會傳遞到下一個階層","能量可以在生物與環境間不斷循環利用"],"ans":0,"sec":"能量流動與物質循環","diff":"中","src":"重點演練2・是非","exp":"解題關鍵：同一族群可能同時出現在多條食物鏈中，彼此連接就是<i class=\"hl\">食物網</i>，故(A)正確、(B)錯誤。能量流動時只有約 <i class=\"hl\">10%</i> 傳到下一階層，約 90% 散失，故(C)錯誤；能量是<b>單向傳遞且會散失</b>，<i class=\"hl\">無法循環</i>，故(D)錯誤。"},
{"q":"下列是和碳循環相關的作用，試問其中哪幾個項目<b>會增加</b>空氣中的二氧化碳濃度？<br>甲. 光合作用　乙. 呼吸作用　丙. 分解者的分解作用　丁. 化石燃料的燃燒","opts":["甲","甲丙","乙丙丁","甲乙丙丁"],"ans":2,"sec":"能量流動與物質循環","diff":"易","src":"重點演練2","exp":"解題關鍵：<b>光合作用會「消耗」二氧化碳</b>，使空氣中的濃度降低，所以甲不算。呼吸作用、分解作用、燃燒都會<i class=\"hl\">釋放二氧化碳</i>，故選(C)。"},
{"q":"關於物質循環的敘述，下列何者<b>錯誤</b>？","opts":["分解者有助於物質的循環","進入生物體的所有物質，都可以被生物體利用、分解和排除","物質是在生物與非生物間循環","黴菌在物質循環上可以扮演分解者的角色"],"ans":1,"sec":"能量流動與物質循環","diff":"中","src":"重點演練2","exp":"解題關鍵：<b>並非所有物質都能被生物體代謝排除</b>——例如人體無法分解<i class=\"hl\">纖維素</i>，也無法代謝<i class=\"hl\">重金屬</i>（這正是生物放大作用的成因），故(B)錯誤。"},
{"q":"關於陸域生態系與水域生態系的敘述，下列何者<b>正確</b>？","opts":["陸域生態系依照雨量多寡，可分為森林、草原和沙漠生態系","陸域生態系依照溫度高低，可分為森林、草原和沙漠生態系","地表面積中，陸域生態系所占的比例較水域生態系多","水域生態系依照溫度高低，分為淡水、河口與海洋生態系"],"ans":0,"sec":"生態系的類型","diff":"中","src":"重點演練3・是非","exp":"解題關鍵：陸域生態系依<i class=\"hl\">雨量</i>多寡分類（森林＞草原＞沙漠），水域生態系依<i class=\"hl\">鹽度</i>低到高分類，故(B)(D)錯誤。地表面積中<b>水域約占 70%、陸域約占 30%</b>，故(C)錯誤。"},
{"q":"跳鼠是一種非常奇特的生物，<b>終生幾乎不喝水</b>，其水分多從食物中攝取；<b>白天躲藏於地洞中，晚上才出來活動</b>。由此可推知跳鼠應生活在何種生態系中？","opts":["草原生態系","沙漠生態系","溪流生態系","熱帶雨林生態系"],"ans":1,"sec":"生態系的類型","diff":"易","src":"重點演練3","exp":"解題關鍵：由跳鼠的行為可知該地區水分<b>非常缺乏</b>，且<i class=\"hl\">晝夜溫差大</i>（白天躲地洞避熱、晚上才活動），這是<b>沙漠生態系</b>的特徵。"},
{"q":"小棒帶來一張陸域生態系的照片，照片中有<b>獵豹、長頸鹿、禿鷹、草、小灌木叢</b>等生物。試根據這些生物判斷，下列關於此生態系的敘述何者<b>錯誤</b>？","opts":["日夜溫差是陸域生態系中最大的","遮蔽物較少","生產者主要為草本植物","年雨量比森林生態系少"],"ans":0,"sec":"生態系的類型","diff":"中","src":"重點演練3","exp":"解題關鍵：由生物種類可知這是<i class=\"hl\">草原生態系</i>。陸域生態系中<b>日夜溫差最大的是沙漠生態系</b>，不是草原，故(A)錯誤。"},
{"q":"有關海洋生態系的敘述，下列何者<b>正確</b>？","opts":["淺海區的水深不超過 100 公尺","海洋生態系可分為潮間帶、淺海區和大洋區","大洋透光區的生產者以大型藻類為主","鯨只扮演初級消費者"],"ans":1,"sec":"生態系的類型","diff":"中","src":"重點演練3","exp":"解題關鍵：(A)淺海區水深不到 <i class=\"hl\">200</i> 公尺；(C)大洋透光區的生產者為<i class=\"hl\">浮游藻類</i>；(D)鯨會吃浮游生物（包含浮游藻類及動物），<b>不只是初級消費者</b>。"},
{"q":"不同環境中會演化出適合該環境的生物，下列何種生物與其生存環境的敘述是<b>錯誤</b>的？","opts":["非洲草原上奔跑的羚羊","熱帶雨林中低鳴的樹蛙","林間溪流旁覓食的招潮蟹","沙漠中的仙人掌"],"ans":2,"sec":"生態系的類型","diff":"易","src":"重點演練3","exp":"解題關鍵：招潮蟹主要生活在<i class=\"hl\">河口生態系</i>（紅樹林的潮間帶泥灘地），不是淡水的林間溪流，故(C)錯誤。"},
{"q":"關於生物多樣性與水域汙染的敘述，下列何者<b>正確</b>？","opts":["生物多樣性要同時考量遺傳、物種、生態系三個層次","一環境中生物個體數越多，就代表此環境的生物多樣性越高","工業廢水所含的重金屬，是造成水域優養化的主因","優養化是因為水中氧氣過多，使藻類大量繁殖"],"ans":0,"sec":"人類與環境","diff":"中","src":"重點演練4・是非","exp":"解題關鍵：生物多樣性包含<i class=\"hl\">遺傳、物種、生態系</i>三個層次，不是只看個體數，故(A)正確、(B)錯誤。造成優養化的主因是<b>畜牧業廢水、家庭汙水中的氮、磷化物</b>（營養鹽過多），故(C)(D)錯誤。"},
{"q":"地球上有草原、森林和溼地等各種環境供生物棲息，這種情形稱之為何？","opts":["族群多樣性","遺傳多樣性","物種多樣性","生態系多樣性"],"ans":3,"sec":"人類與環境","diff":"易","src":"重點演練4","exp":"解題關鍵：各式各樣的<b>環境</b>構成不同的生態系，稱為<i class=\"hl\">生態系多樣性</i>；遺傳多樣性看的是基因，物種多樣性看的是生物種類。"},
{"q":"關於生物多樣性的敘述，下列何者<b>正確</b>？","opts":["生物複製可快速增加遺傳多樣性","開發沼澤地、森林地為良田，可以增加物種多樣性","物種多樣性越低、食物網越單純的生態系越穩定","維護生物多樣性才能保障人類食、衣、住、行、醫藥、育樂各方面資源"],"ans":3,"sec":"人類與環境","diff":"中","src":"重點演練4","exp":"解題關鍵：(A)複製生物的特徵與提供細胞核者<b>完全相同</b>，無助於增加遺傳多樣性；(B)開發會<i class=\"hl\">降低</i>該地區的物種多樣性；(C)應該是<i class=\"hl\">物種多樣性越高、食物網越複雜</i>，生態系才越穩定。"},
{"q":"下列國際間的公約或組織，何者主要目的是管制國際間<b>野生動植物的非法貿易</b>？","opts":["拉姆薩公約","華盛頓公約","國際自然保護聯盟","生物多樣性公約"],"ans":1,"sec":"人類與環境","diff":"易","src":"重點演練4","exp":"解題關鍵：(A)拉姆薩公約保護<i class=\"hl\">溼地</i>；(C)國際自然保護聯盟評估現存生物的<i class=\"hl\">瀕危等級</i>；(D)生物多樣性公約維護全球生物的多樣性。"},
{"q":"阿澤欲估算某草原區裡的野兔數，他先捕捉 <b>10 隻</b>野兔在身上作標記，然後放回去。兩個月後，捉到 <b>30 隻</b>野兔中有 <b>2 隻</b>身上有標記，試估計此處的野兔約有幾隻？","opts":["150","170","185","200"],"ans":0,"sec":"族群數量的估算","diff":"中","src":"實驗立即練・捉放法","exp":"解題關鍵：捉放法公式為 ⟬捉出個體中有標記的個體數|捉出個體數⟭ ＝ ⟬有標記的個體總數|族群個體總數⟭。設野兔共有 X 隻，則 ⟬2|30⟭ ＝ ⟬10|X⟭，解得 X ＝ 10 × 30 ÷ 2 ＝ <i class=\"hl\">150</i> 隻。"},
{"q":"翩翩想知道瓶中的黑豆數，利用黃豆作為標記，充分混合在黑豆中後取樣。<b>第 3 次</b>：放入黃豆 20 顆、取樣總豆數 30 顆、取樣中的黃豆數 4 顆，估計黑豆數 150 顆；<b>第 4 次</b>：放入黃豆 20 顆、取樣總豆數 60 顆、取樣中的黃豆數 10 顆，估計黑豆數 120 顆。已知瓶中黑豆數的實際值為 <b>105 顆</b>。由第 3 次與第 4 次的結果判斷，下列推論何者正確？","opts":["取樣的次數增加，準確度也增加","取樣的總豆數增加，準確度也增加","放入瓶中的黃豆數增加，準確度也增加","瓶中的黑豆數增加，準確度也增加"],"ans":1,"sec":"族群數量的估算","diff":"難","src":"實驗立即練・捉放法","exp":"解題關鍵：第 3 次與第 4 次<b>放入的黃豆數相同（都是 20）</b>，不同的只有<i class=\"hl\">取樣總豆數</i>（30 → 60），而估計值由 150 變成 120，<b>更接近實際值 105</b>，可見取樣總豆數越多越準確，故選(B)。"},
{"q":"以黃豆作標記來估計瓶中黑豆數的實驗中，下列何者<b>不能</b>使估計的黑豆數更接近實際值？","opts":["多次取樣求平均值","取樣的總豆數增加","放入瓶中的黃豆數增加","瓶中的黑豆數增加"],"ans":3,"sec":"族群數量的估算","diff":"中","src":"實驗立即練・捉放法","exp":"解題關鍵：增加瓶中的黑豆數會<i class=\"hl\">更動實際值本身</i>，並不會讓估計結果更準確，故選(D)。(A)(B)(C)都是減少誤差的正確做法。"},

{"q":"甲、乙為兩種多細胞生物。「葡萄糖＋氧氣 → 水＋二氧化碳」這個反應，甲<b>能</b>、乙<b>能</b>；「水＋二氧化碳 → 葡萄糖＋氧氣＋水」這個反應，甲<b>能</b>、乙<b>不能</b>。根據此表推測甲、乙在生態系中所扮演的角色，下列敘述何者最合理？","opts":["甲可能是分解者","甲可能是初級消費者","乙可能是生產者","乙可能是次級消費者"],"ans":3,"sec":"生物圈與生態系","diff":"中","src":"會考110補","exp":"解題關鍵：「葡萄糖＋氧氣 → 水＋二氧化碳」是<b>呼吸作用</b>，生物都會；「水＋二氧化碳 → 葡萄糖＋氧氣」是<b>光合作用</b>，只有生產者會。甲能行光合作用，應為<i class=\"hl\">生產者</i>；乙不能，應為<i class=\"hl\">消費者</i>，故選(D)。"},

{"q":"某食物鏈中甲、乙、丙三種生物獲得能量的<b>主要來源</b>為——甲：昆蟲；乙：太陽；丙：嫩葉。推測下列何者最可能為甲、乙、丙生物的食性關係？","opts":["甲 → 丙 → 乙","乙 → 丙 → 甲","丙 → 甲 → 乙","甲 → 乙 → 丙"],"ans":1,"sec":"能量流動與物質循環","diff":"中","src":"會考111補","exp":"解題關鍵：能量主要來源為<b>太陽</b>者為<i class=\"hl\">生產者</i>（乙）；以<b>嫩葉</b>為食者為<i class=\"hl\">初級消費者</i>（丙）；以<b>昆蟲</b>為食者至少是<i class=\"hl\">次級消費者</i>（甲）。食物鏈依「被吃 → 吃」排列為乙 → 丙 → 甲，故選(B)。"},
{"q":"人類將人工魚礁投入水底以增加藻類、珊瑚及魚類的棲息空間，這些魚礁最可能被置放在下列哪一地區？","opts":["溪流區","河口區","淺海區","大洋區"],"ans":2,"sec":"生態系的類型","diff":"易","src":"會考111（通過率 80%）","exp":"解題關鍵：珊瑚生活在<b>水質清澈且溫暖的淺海</b>，藻類也需要陽光，由此可判斷魚礁應放在海洋生態系中的<i class=\"hl\">淺海區</i>。"},
{"q":"已知某殺蟲劑是一種難以被生物代謝的化合物。某地區食物鏈中甲、乙、丙、丁四種生物體內含有的該殺蟲劑濃度為——甲 2.0、乙 0.2、丙 20、丁 0.04（單位：百萬分之一）。已知其中一種生物為生產者，根據上述，下列推論何者正確？","opts":["食性關係可能為丙 → 甲 → 乙 → 丁","食性關係可能為丁 → 乙 → 甲 → 丙","丙生物最可能為此食物鏈中的生產者","甲生物最可能為此食物鏈中的三級消費者"],"ans":1,"sec":"人類與環境","diff":"中","src":"會考112（通過率 56%）","exp":"解題關鍵：根據<b>生物放大作用</b>，食物鏈中<i class=\"hl\">層級越高的消費者體內累積越多</i>。濃度由低到高為丁（0.04）＜乙（0.2）＜甲（2.0）＜丙（20），所以丁是生產者、丙是最高層級消費者，食性關係為丁 → 乙 → 甲 → 丙，故選(B)。"},

{"q":"阿土伯以種植水稻為生，他想要對 10 公頃的水稻田施加氮肥，已知每公頃水稻田所需的氮元素質量為 120 公斤，則阿土伯至少要購買多少公斤的硫酸銨（(NH₄)₂SO₄）才足夠施肥所需？（(NH₄)₂SO₄ 的分子量為 132，N 的原子量為 14）","opts":["120×⟬132|28⟭","120×⟬28|132⟭","120×10×⟬132|28⟭","120×10×⟬28|132⟭"],"ans":2,"sec":"質量守恆","diff":"中","src":"重點演練・素養題","exp":"(NH₄)₂SO₄ 中 N 所占的質量比為 ⟬28|132⟭（2 個 N，原子量 14×2＝28），故須購買肥料 120×10×⟬132|28⟭（kg）。注意田有 <b>10 公頃</b>，需求量要先乘 10。"},
{"q":"毒理學之父——帕拉賽瑟斯曾說過：「依使用劑量的多寡，可決定物質是否有毒」，例如喝水時人體會自動調節水及鈉的平衡，但若在短時間內攝取大量水分，就可能會發生低血鈉症而造成頭暈、嘔吐，甚至昏迷等症狀。則下列不同分量的水中，何者的質量最大？","opts":["1 分子的水","1 莫耳的水","1 毫克的水","1 公克的水"],"ans":1,"sec":"質量守恆","diff":"易","src":"重點演練・素養題","exp":"1 莫耳水的質量為 <b>18 公克</b>，故質量大小為：1 莫耳的水 ＞ 1 公克的水 ＞ 1 毫克的水 ＞ 1 分子的水，故選(B)。"},

{"q":"在適當的條件下，H₂S 和 SO₂ 會發生反應，生成 H₂O 和 S。小如記錄某一反應裝置內反應前、反應後各物質的質量如下：<br>　H₂S：反應前 70 g，反應後 <b>甲</b><br>　SO₂：反應前 64 g，反應後 <b>乙</b><br>　H₂O：反應前 0 g，反應後 <b>丙</b><br>　S：反應前 2 g，反應後 <b>丁</b><br>下列何組數據最可能是上述反應後各物質的質量？","opts":["甲 64、乙 70、丙 2、丁 0","甲 2、乙 0、丙 36、丁 98","甲 20、乙 48、丙 0、丁 68","甲 0、乙 32、丙 54、丁 48"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考114（通過率 47%）","exp":"解題關鍵：<b>反應物的質量會減少，生成物的質量會增加，且遵守質量守恆定律</b>。(A)反應物 SO₂ 在反應後的質量反而增加，不合理。(C)生成物 H₂O 在反應後的質量並未增加，不合理。(D)反應後的總質量為 32＋54＋48＝134 g，與反應前的總質量 70＋64＋2＝136 g 不同，不合理。故選(B)。"},
{"q":"已知甲、乙兩種不同的金屬元素分別與同濃度的鹽酸反應，反應後只會產生氫氣與金屬的氯化物。取甲金屬 24.3 g 與鹽酸反應，另取乙金屬 65.4 g 與鹽酸反應，兩個反應的金屬都完全耗盡，且產生的氫氣質量均為 2.0 g，則比較兩個反應的反應物與產物的質量，下列何者正確？（前項為「兩反應的鹽酸消耗質量」，後項為「兩反應的產物總質量」）","opts":["相同／相同","相同／不同","不同／相同","不同／不同"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考113（通過率 37%）","exp":"解題關鍵：由產生的氫氣質量推論鹽酸消耗質量，再根據質量守恆推論產物總質量。氫氣是由鹽酸中的 H 所產生，因兩反應產生的氫氣質量相同，可推論兩反應的<b>鹽酸消耗質量也相同</b>。根據質量守恆定律，乙金屬消耗的質量較大（65.4 g ＞ 24.3 g），因此<b>產物的總質量也會較大</b>，故選(B)。"},
{"q":"小明響應環保團體所宣導的「中秋節不烤肉」，在中秋節時只賞月，不烤肉。若小明減少消耗 10 公斤的木炭，且木炭的含碳量為 96％，則他最多減少產生多少公斤的二氧化碳？（反應式為 C＋O₂→CO₂，原子量：C＝12，O＝16）","opts":["10×1000×96%","⟬10×1000×96%|12⟭","800×44","⟬800×44|1000⟭"],"ans":3,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練・素養題","exp":"碳的莫耳數＝⟬10×1000×96%|12⟭＝<b>800 mol</b>，由係數比可知可產生 800 mol 的二氧化碳，故二氧化碳質量＝⟬800×44|1000⟭＝<b>35.2 kg</b>。注意題目問的單位是<b>公斤</b>，所以最後要除以 1000。"},
