<title>自然科學習網｜生物・理化・地球科學</title>
<style>

.tab.active{background:var(--brand2);border-color:var(--brand2);color:#fff}
.pane{display:none}.pane.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.stat{color:var(--muted);font-size:.85rem}
.btn{border:none;border-radius:12px;padding:11px 22px;font-size:1rem;font-weight:800;cursor:pointer;background:var(--chip);color:var(--ink)}

.mtabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

.mtab th,.mtab td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:1.75;text-align:left}

.mtab td.nm{background:var(--chip);white-space:nowrap;text-align:center;font-weight:900;width:64px}
.mtab td.tt{white-space:nowrap;font-weight:800;width:1%}
.mtab td.pg{background:#fbfdfe;text-align:center;color:var(--muted);white-space:nowrap;width:54px;font-size:.84rem}
.mtab td .ln{display:block;margin:3px 0}
.mtab td .nt{display:block;margin:6px 0 0;padding:4px 7px;background:#fbfdfe;border-left:3px solid var(--brand);border-radius:3px;font-size:.78rem;line-height:1.5;color:var(--muted)}
.mtab td .nt b{color:var(--brand);margin-right:4px}
.tg{display:inline-block;background:#fde7ef;color:#b3376a;border:1px solid #f6cada;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:800;margin:1px 3px 1px 0;white-space:nowrap}
.tg.b{background:#e7f1fd;color:#2a5f9e;border-color:#cadcf6}
.todo{color:var(--muted);font-size:.84rem}
.todo b{color:var(--todo)}
.warn{color:var(--todo);font-weight:900;cursor:help}
.bkhd{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub,var(--brand));border-radius:12px;padding:11px 14px;margin:4px 0 6px;font-size:.88rem;line-height:1.8;color:var(--muted)}
.bkhd b{color:var(--brand);font-size:1rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:7px 0 2px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.hl{font-style:normal;font-weight:900;color:var(--brand);background:var(--mark);border-radius:4px;padding:0 3px;margin:0 1px}
.fml{display:block;background:#fbfdfe;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem;letter-spacing:.03em}
.mtab td.ct{text-align:center;white-space:nowrap;background:#fbfdfe;font-size:.82rem;width:1%}
.hot5{color:#d1462f;letter-spacing:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.32}
.fr i{font-style:normal;padding:1px 6px;white-space:nowrap}
.fr i+i{border-top:1.6px solid currentColor}
.ovline{background:var(--gold);border:1px dashed var(--brand);border-radius:9px;padding:6px 11px;margin:6px 0 2px;font-size:.85rem;color:var(--brand);font-weight:700}
.done{color:var(--ok);font-weight:800}
h3.sub{margin:20px 0 8px;font-size:1rem;color:var(--brand);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sub .kp{background:var(--sub,var(--brand));color:#fff;border-radius:8px;padding:2px 10px;font-size:.85rem}
h3.sub .pgt{color:var(--muted);font-size:.78rem;font-weight:400}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:9px 0;line-height:1.85;font-size:.92rem}
.blk h4{font-size:.96rem;color:var(--brand2);margin:14px 0 7px;letter-spacing:.04em}
.blk h4:first-child{margin-top:0}
.blk p{margin:6px 0}
.eg{display:inline-block;background:var(--brand2);color:#fff;border-radius:5px;padding:0 6px;font-size:.75rem;font-weight:800;margin-right:5px}
.box{border-radius:12px;padding:11px 14px;margin:10px 0;line-height:1.8;font-size:.9rem}
.box p{margin:5px 0}
.box .bt{display:inline-block;border-radius:6px;padding:1px 9px;font-size:.78rem;font-weight:900;margin-bottom:5px;color:#fff}
.box.key{background:#eef8f1;border:1px solid #bfe0cb}.box.key .bt{background:var(--brand2)}
.box.myth{background:#fdf1f5;border:1px solid #f3cddb}.box.myth .bt{background:#c0507e}
.box.hot{background:#f2f9ec;border:1px solid #cde5b8}.box.hot .bt{background:#6ea33c}
.box.tip{background:#f5f1fb;border:1px solid #d8cdec}.box.tip .bt{background:#7a5bb0}
.box.calc{background:#fdf3f7;border:1px solid #f3ccdf}.box.calc .bt{background:#d4548a}
.cq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 5px}
.cq:first-of-type{margin-top:6px}
.cq .tn{background:#d4548a;color:#fff;border-radius:7px;padding:1px 10px;font-size:.78rem;font-weight:900}
.cq b{color:#b23a6e;font-size:.96rem}
.cq .pair{margin-left:auto;font-size:.73rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sol{display:inline-block;background:#d4548a;color:#fff;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:900;margin-right:6px;vertical-align:1px}
.ctab.rt{width:auto;min-width:0;margin:7px 0}
.ctab.rt th{background:#fce9f2;color:#b23a6e;border-color:#efc3d8;padding:5px 12px}
.ctab.rt td{border-color:#efc3d8;padding:5px 12px}
.cb{display:inline-block;border:1.5px solid #4aa3b8;border-radius:7px;padding:2px 9px;margin:3px 2px;background:#fff;vertical-align:middle}
.cal{display:inline-block;color:#2b8f74;font-size:.76rem;font-weight:800;margin:0 4px}
.cal::before{content:"\21b3 ";font-weight:400}
.stepline{margin:8px 0;line-height:2.2}
.ctab{width:100%;border-collapse:collapse;background:var(--card);font-size:.88rem;min-width:480px}
.ctab th,.ctab td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.7}
.ctab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap;font-size:.85rem}
.ctab td.h{background:var(--chip);font-weight:800;white-space:nowrap;text-align:center}
.ctab td.c{text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:9px 0}
.flow .fb{flex:1 1 170px;background:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:.85rem;line-height:1.6}
.flow .fb b{display:block;color:var(--brand);margin-bottom:2px}
.act{background:var(--card);border:2px solid var(--brand);border-radius:10px;padding:9px 11px;margin:9px 0;text-align:center;line-height:2.1;font-size:.9rem;overflow-x:auto}
.act .big{font-weight:900;letter-spacing:.04em}
/* ===== 搜尋 ===== */
.sbar{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.sbar input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:.95rem;font-family:inherit}
.sbar input:focus{outline:2px solid var(--brand);outline-offset:1px}
.sbtn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--brand);color:#fff;
  font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;white-space:nowrap}
.sbtn.ghost{background:var(--card);color:var(--muted)}
.sbtn:hover{filter:brightness(1.08)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.sres .shead{font-weight:900;color:var(--brand);margin-bottom:8px;font-size:.9rem}
.sres .sgrp{font-weight:900;margin:10px 0 4px;color:var(--brand2);font-size:.86rem;
  border-bottom:1px dashed var(--line);padding-bottom:3px}
.sres .sitem{display:block;width:100%;text-align:left;background:var(--gold);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin:5px 0;cursor:pointer;font-family:inherit;font-size:.86rem;
  line-height:1.6;color:var(--ink)}
.sres .sitem:hover{border-color:var(--brand)}
.sres .sitem .swhere{display:block;color:var(--muted);font-size:.78rem;margin-bottom:2px}
.sres .qcard{background:#fbfdfe;border:1px solid var(--line);border-left:3px solid var(--brand2);
  border-radius:8px;padding:8px 10px;margin:5px 0;font-size:.86rem;line-height:1.7}
.sres .qcard .qa{color:var(--ok);font-weight:900}
.sres .qcard .qe{color:var(--muted);display:block;margin-top:3px}
.sres mark{background:var(--mark);color:var(--brand);font-weight:900;border-radius:3px;padding:0 2px}
.sres .snone{color:var(--muted);padding:6px 2px}
@keyframes secflash{0%,100%{background:transparent}25%,75%{background:var(--mark)}}
.secflash{animation:secflash 1.6s ease-in-out}
/* ===== 測驗 ===== */
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.exam .src{font-size:.72rem;background:var(--gold);color:var(--brand2);border-radius:6px;padding:2px 8px;margin-right:6px}
.exam .topic{font-size:.72rem;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px}
.exam .q{margin:10px 0;line-height:1.8;font-size:1.02rem}
img.qi{max-width:min(440px,100%);display:block;margin:10px auto;border:1px solid var(--line);border-radius:10px;background:#fff}
img.gi{display:inline-block;max-height:88px;max-width:160px;vertical-align:middle;border:1px solid var(--line);border-radius:6px;margin:2px;background:#fff}
.eopts{display:grid;gap:8px}
.eopt{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fbfdfe;border-radius:11px;padding:11px 13px;font-size:.98rem;cursor:pointer;line-height:1.7;color:var(--ink)}
.eopt .k{font-weight:900;color:var(--brand2);flex:none}
.eopt.correct{border-color:var(--ok);background:#eef7ee}
.eopt.wrong{border-color:var(--bad);background:#fdeeee}
.expl{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.75;font-size:.92rem}
.expl.show{display:block}
.expl .lbl{font-weight:900;color:var(--brand);margin-right:6px}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.counter{color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:8px}
.nav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:26px 16px;margin:14px 0}
.scorebox .big{font-size:2.2rem;font-weight:900;color:var(--brand)}
.review .r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;line-height:1.7}
.qitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.qitem .q{line-height:1.8;margin:6px 0;font-size:.95rem}
.qitem .o{color:var(--muted);font-size:.9rem;line-height:1.75;margin-top:4px}
.qitem .a{display:none;margin-top:8px;font-size:.9rem;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
.qitem .a.show{display:block}
.qitem .a b{color:var(--ok)}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:34px;letter-spacing:.05em}
@media(max-width:520px){header h1{font-size:1.25rem}.unit{padding:8px 12px;font-size:.9rem}}
</style>
</head>

<div class="wrap">
<header>

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const IM={};

/* ===== 題庫（依冊分） ===== */
const Q_BIO=[
];

];

{"q":"阿土伯以種植水稻為生，他想要對 10 公頃的水稻田施加氮肥，已知每公頃水稻田所需的氮元素質量為 120 公斤，則阿土伯至少要購買多少公斤的硫酸銨（(NH₄)₂SO₄）才足夠施肥所需？（(NH₄)₂SO₄ 的分子量為 132，N 的原子量為 14）","opts":["120×⟬132|28⟭","120×⟬28|132⟭","120×10×⟬132|28⟭","120×10×⟬28|132⟭"],"ans":2,"sec":"質量守恆","diff":"中","src":"重點演練・素養題","exp":"(NH₄)₂SO₄ 中 N 所占的質量比為 ⟬28|132⟭（2 個 N，原子量 14×2＝28），故須購買肥料 120×10×⟬132|28⟭（kg）。注意田有 <b>10 公頃</b>，需求量要先乘 10。"},
{"q":"毒理學之父——帕拉賽瑟斯曾說過：「依使用劑量的多寡，可決定物質是否有毒」，例如喝水時人體會自動調節水及鈉的平衡，但若在短時間內攝取大量水分，就可能會發生低血鈉症而造成頭暈、嘔吐，甚至昏迷等症狀。則下列不同分量的水中，何者的質量最大？","opts":["1 分子的水","1 莫耳的水","1 毫克的水","1 公克的水"],"ans":1,"sec":"質量守恆","diff":"易","src":"重點演練・素養題","exp":"1 莫耳水的質量為 <b>18 公克</b>，故質量大小為：1 莫耳的水 ＞ 1 公克的水 ＞ 1 毫克的水 ＞ 1 分子的水，故選(B)。"},
{"q":"臺灣的「毒澱粉事件」源自於不肖業者將未經核准的順丁烯二酸酐（C₄H₂O₃）調製成修飾澱粉，以增加食品的口感，則 490 克的順丁烯二酸酐為多少莫耳？（原子量：H＝1，C＝12，O＝16）","opts":["2","3","4","5"],"ans":3,"sec":"質量守恆","diff":"中","src":"重點演練・素養題","exp":"順丁烯二酸酐的分子量＝4×12＋2×1＋3×16＝<b>98</b>，490 克相當於 ⟬490|98⟭＝<b>5 莫耳</b>。"},
{"q":"在適當的條件下，H₂S 和 SO₂ 會發生反應，生成 H₂O 和 S。小如記錄某一反應裝置內反應前、反應後各物質的質量如下：<br>　H₂S：反應前 70 g，反應後 <b>甲</b><br>　SO₂：反應前 64 g，反應後 <b>乙</b><br>　H₂O：反應前 0 g，反應後 <b>丙</b><br>　S：反應前 2 g，反應後 <b>丁</b><br>下列何組數據最可能是上述反應後各物質的質量？","opts":["甲 64、乙 70、丙 2、丁 0","甲 2、乙 0、丙 36、丁 98","甲 20、乙 48、丙 0、丁 68","甲 0、乙 32、丙 54、丁 48"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考114（通過率 47%）","exp":"解題關鍵：<b>反應物的質量會減少，生成物的質量會增加，且遵守質量守恆定律</b>。(A)反應物 SO₂ 在反應後的質量反而增加，不合理。(C)生成物 H₂O 在反應後的質量並未增加，不合理。(D)反應後的總質量為 32＋54＋48＝134 g，與反應前的總質量 70＋64＋2＝136 g 不同，不合理。故選(B)。"},
{"q":"已知甲、乙兩種不同的金屬元素分別與同濃度的鹽酸反應，反應後只會產生氫氣與金屬的氯化物。取甲金屬 24.3 g 與鹽酸反應，另取乙金屬 65.4 g 與鹽酸反應，兩個反應的金屬都完全耗盡，且產生的氫氣質量均為 2.0 g，則比較兩個反應的反應物與產物的質量，下列何者正確？（前項為「兩反應的鹽酸消耗質量」，後項為「兩反應的產物總質量」）","opts":["相同／相同","相同／不同","不同／相同","不同／不同"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考113（通過率 37%）","exp":"解題關鍵：由產生的氫氣質量推論鹽酸消耗質量，再根據質量守恆推論產物總質量。氫氣是由鹽酸中的 H 所產生，因兩反應產生的氫氣質量相同，可推論兩反應的<b>鹽酸消耗質量也相同</b>。根據質量守恆定律，乙金屬消耗的質量較大（65.4 g ＞ 24.3 g），因此<b>產物的總質量也會較大</b>，故選(B)。"},
{"q":"小明響應環保團體所宣導的「中秋節不烤肉」，在中秋節時只賞月，不烤肉。若小明減少消耗 10 公斤的木炭，且木炭的含碳量為 96％，則他最多減少產生多少公斤的二氧化碳？（反應式為 C＋O₂→CO₂，原子量：C＝12，O＝16）","opts":["10×1000×96%","⟬10×1000×96%|12⟭","800×44","⟬800×44|1000⟭"],"ans":3,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練・素養題","exp":"碳的莫耳數＝⟬10×1000×96%|12⟭＝<b>800 mol</b>，由係數比可知可產生 800 mol 的二氧化碳，故二氧化碳質量＝⟬800×44|1000⟭＝<b>35.2 kg</b>。注意題目問的單位是<b>公斤</b>，所以最後要除以 1000。"},
{"q":"已知呼吸作用的化學反應為「C₆H₁₂O₆＋O₂→CO₂＋H₂O（未平衡）」，若平衡此反應式，則係數總和應為下列何者？","opts":["4","12","18","19"],"ans":3,"sec":"化學反應的微觀世界","diff":"易","src":"重點演練","exp":"平衡後的反應式為 <b>C₆H₁₂O₆＋6O₂→6CO₂＋6H₂O</b>，故係數總和為 1＋6＋6＋6＝<b>19</b>。"},
{"q":"已知鈉在氧氣中燃燒會生成氧化鈉，反應式為「Na＋O₂→Na₂O（未平衡）」，今取 34.5 克的鈉在足量的氧氣中完全燃燒，則會生成多少克的氧化鈉？（原子量：O＝16，Na＝23）","opts":["34.5","46.5","58.5","62.5"],"ans":1,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"先平衡反應式：<b>4Na＋O₂→2Na₂O</b>。鈉的莫耳數＝⟬34.5|23⟭＝1.5 莫耳，由係數比可知鈉與氧化鈉的莫耳數比為 <b>2：1</b>，故可生成 1.5×⟬1|2⟭＝0.75 莫耳的氧化鈉；Na₂O 的分子量＝23×2＋16＝62，則質量＝0.75×62＝<b>46.5 克</b>。"},
{"q":"鎂在空氣中燃燒的反應式為「2Mg＋O₂→2MgO」，若將 18 克的鎂與 16 克的氧氣混合後點火燃燒，則最多會產生多少克的氧化鎂？（原子量：O＝16，Mg＝24）","opts":["30","32","36","40"],"ans":0,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"鎂的莫耳數＝⟬18|24⟭＝0.75 莫耳，氧氣的莫耳數＝⟬16|32⟭＝0.5 莫耳。由係數比可知鎂與氧的莫耳數比為 2：1，若 0.75 莫耳鎂完全反應只需 0.375 莫耳氧氣，故<b>鎂為限量試劑</b>。鎂與氧化鎂的莫耳數比為 1：1，MgO 分子量＝40，則氧化鎂的質量＝0.75×40＝<b>30 克</b>。"},
{"q":"小佩在家烘焙麵包，他加入化合物 X，使麵團在烘烤過程中膨脹且變得鬆軟，反應式為：2X → Na₂CO₃ ＋ CO₂ ＋ H₂O，則 X 的分子量應為何？","opts":["21","42","84","168"],"ans":2,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"反應前、後原子的<b>種類及數目不變</b>：右側共有 Na 2、C 2、O 6、H 2，除以 2 即為 1 個 X，故 X 為 <b>NaHCO₃</b>（小蘇打），分子量＝23＋1＋12＋3×16＝<b>84</b>。"},
{"q":"關於反應「Mg ＋ 2HCl → H₂ ＋ MgCl₂」的敘述，下列何者<b>錯誤</b>？","opts":["1 個 Mg 原子可與 2 個 HCl 分子反應","1 克 Mg 可與 2 克 HCl 分子反應","1 莫耳 Mg 原子可與 2 莫耳 HCl 分子反應","6×10²³ 個 Mg 原子可與 2×6×10²³ 個 HCl 分子反應"],"ans":1,"sec":"化學反應的微觀世界","diff":"易","src":"重點演練","exp":"反應式的<b>係數比＝個數比＝莫耳數比</b>，但<i class=\"hl\">不等於質量比</i>，故(B)錯誤。"},
{"q":"已知甲烷和甲醇與足量的氧氣反應，生成物皆為二氧化碳和水，反應式如下：<br>　反應一　CH₄＋2O₂→CO₂＋2H₂O<br>　反應二　2CH₃OH＋3O₂→2CO₂＋4H₂O<br>若分別進行此兩種反應，且完全反應後所得到的生成物總質量相同，則關於反應物的比較，下列敘述何者正確？（原子量：H＝1、C＝12、O＝16）","opts":["甲烷消耗的質量較甲醇少","兩種反應氧氣消耗的質量相同","甲烷和甲醇兩者消耗的質量相同","反應一的氧氣消耗質量較反應二少"],"ans":0,"sec":"化學反應的微觀世界","diff":"難","src":"會考112大題考區","exp":"解題關鍵：思考「生成物總質量相同」的背後含意。每 1 莫耳 CH₄ 與每 1 莫耳 CH₃OH 產生的生成物都是 1 CO₂＋2 H₂O，故生成物總質量相同 → 兩者<b>消耗的莫耳數相同</b>。分子量 CH₄＝16、CH₃OH＝32，故消耗<b>質量比為 16：32＝1：2</b>，甲烷消耗的質量較少，(A)正確。氧氣方面，每莫耳燃料耗氧為 2 mol 對 1.5 mol，比為 4：3，故反應一耗氧較多，(B)(D)皆錯。"},
{"q":"鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一，其步驟如下：<br>　步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。Mg²⁺ ＋ 2NaOH → 2Na⁺ ＋ Mg(OH)₂<br>　步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。Mg(OH)₂ ＋ 2HCl → MgCl₂ ＋ 2H₂O<br>　步驟三：電解熔融狀態的氯化鎂即可得到鎂。MgCl₂ —〔電解〕→ Mg ＋ Cl₂<br>依據上述方法，在某次製鎂的反應後，共產生鎂 960 公克，則該次製鎂反應中，理論上會消耗重量百分濃度為 80% 的鹽酸共多少公克？（鎂的原子量為 24，氯化氫的分子量為 36.5）","opts":["1825","2400","2920","3650"],"ans":3,"sec":"化學反應的微觀世界","diff":"難","src":"會考109（通過率 29%）","exp":"解題關鍵：計算出鎂的莫耳數後，再由係數比推得所需 HCl 的莫耳數，最後計算出消耗的鹽酸質量。由步驟二、三可知，產生 1 莫耳 Mg 需要 1 莫耳 MgCl₂，而產生 1 莫耳 MgCl₂ 需消耗 <b>2 莫耳</b> HCl。960 g Mg 的莫耳數＝⟬960|24⟭＝40 莫耳，故需消耗 80 莫耳 HCl，質量＝80×36.5＝2920 g。鹽酸（溶液）質量＝⟬溶質質量|重量百分濃度⟭＝⟬2920|80%⟭＝<b>3650 g</b>。"},
{"q":"目前臺灣的中藥材大部分都是進口，這些進口的中藥材在加工過程中常會使用二氧化硫，達到漂白的功效，也因此常有二氧化硫殘留量超標的情形。因二氧化硫可溶於水形成 X 物質，食藥署建議在烹煮中藥材前應先以清水沖洗，以保障食用安全。上文中利用二氧化硫漂白時會進行何種反應？且 X 物質最可能為何種物質？","opts":["氧化還原反應，酸性物質","氧化還原反應，鹼性物質","酸鹼中和反應，酸性物質","酸鹼中和反應，鹼性物質"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"二氧化硫是利用<b>氧化還原反應</b>進行漂白；SO₂ 溶於水會形成<b>亞硫酸（H₂SO₃）</b>，屬<b>酸性</b>物質（非金屬氧化物的水溶液呈酸性），故選(A)。"},
{"q":"關於反應「2Al ＋ 3CuO → Al₂O₃ ＋ 3Cu」的敘述，下列何者正確？","opts":["Al 被氧化，進行氧化反應","CuO 被氧化，進行還原反應","Al 對氧的活性比 Cu 小","若進行燃燒試驗，則 Cu 較 Al 容易氧化"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練","exp":"Al 得到氧（Al→Al₂O₃），進行<b>氧化</b>反應，(A)正確。(B)CuO <b>失去氧</b>，進行還原反應。(C)(D)Al 能把 Cu 從 CuO 中還原出來，表示 <b>Al 對氧的活性較大</b>，進行燃燒試驗時也會較容易氧化。"},
{"q":"將 X、Y、Z、W 四種金屬與 XO、YO、ZO、WO 四種氧化物分別進行反應，「○」代表有反應、「×」代表無反應，結果如下：<br>　XO ＋ Y → ×　　XO ＋ Z → ○<br>　ZO ＋ Y → <b>甲</b>　　WO ＋ X → <b>乙</b>　　WO ＋ Z → ×<br>則甲、乙之符號應分別為何？","opts":["甲為○，乙為×","甲為×，乙為○","甲、乙均為○","甲、乙均為×"],"ans":3,"sec":"氧化與還原反應","diff":"難","src":"重點演練","exp":"由「XO＋Z」有反應可知活性 <b>Z＞X</b>；由「Z＋WO」無反應可知活性 <b>W＞Z</b>；由「Y＋XO」無反應可知活性 <b>X＞Y</b>。綜合上述，活性大小為 <i class=\"hl\">W＞Z＞X＞Y</i>。甲（ZO＋Y）因 Y 活性最小，無法搶走 Z 的氧 → ×；乙（WO＋X）因 W 活性大於 X → ×，故選(D)。"},
{"q":"由於食品中有一些成分容易被氧化，而產生變色或變質，故常添加抗氧化劑。抗氧化劑分為天然抗氧化劑與化學抗氧化劑，天然抗氧化劑如維生素 E 等，化學抗氧化劑較天然抗氧化劑穩定，如丁基羥基甲氧苯（BHA）等，經常食用化學抗氧化劑可能會有罹癌風險。則關於 BHA 在食品中發揮作用時的敘述，下列何者正確？","opts":["BHA 失去氧，進行氧化反應","BHA 失去氧，進行還原反應","BHA 得到氧，進行氧化反應","BHA 得到氧，進行還原反應"],"ans":2,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"抗氧化劑本身具有<b>易與氧作用</b>的特性，會<b>代替食品被氧化而得到氧</b>，進行<b>氧化反應</b>，故選(C)。"},
{"q":"有些物質可使棕色的碘液進行還原反應，反應後溶液呈無色，例如許多水果所含有的維生素 C。以維生素 C 和綠茶茶水分別進行實驗：<br>　甲試管：維生素 C 溶液　乙試管：水　丙試管：綠茶茶水<br>三支試管都滴入數滴碘液並搖晃後——<br>　甲：棕色消失　乙：液體呈棕色　丙：棕色消失<br>僅依據本實驗結果，下列推論何者最合理？","opts":["綠茶茶水中必定含有維生素 C","綠茶茶水中必定含有能被氧化的物質","綠茶茶水進行氧化反應，維生素 C 進行還原反應","因實驗結果溶液顏色改變，故綠茶茶水可做為酸鹼指示劑"],"ans":1,"sec":"氧化與還原反應","diff":"中","src":"會考114（通過率 57%）","exp":"解題關鍵：<b>碘液進行還原反應時，必有另一物質進行氧化反應</b>。(A)不一定，可能是含有其他可使碘液進行還原反應的物質。(C)兩者都是<b>進行氧化反應</b>。(D)酸鹼指示劑須在不同酸鹼性的溶液中變色，本實驗並未改變酸鹼性。故選(B)。"},
{"q":"某篇關於氫應用的報導說明如下：「金屬多以氧化物的形式封藏於岩石礦物中，可利用氫和氧易起反應的特性，<b>將氧從礦物中移除，留下可用的純金屬和水</b>。」關於上述畫線處提及的反應，下列說明何者最合理？","opts":["因為氫被氧化，所以是氧化還原反應","因為礦物被氧化，所以是氧化還原反應","因為金屬氧化物溶於水呈酸性，所以是酸鹼中和反應","因為金屬氧化物溶於水呈鹼性，所以是酸鹼中和反應"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"會考113（通過率 59%）","exp":"解題關鍵：判斷何者得到氧，何者失去氧。氫將氧從礦物中移除，形成純金屬與水，則<b>氫得到氧被氧化</b>、<b>礦物失去氧被還原</b>，屬於氧化還原反應，故選(A)。"},
{"q":"小凱在家中廚房找到下列物品，則這些物品中，何者<b>不含</b>有電解質？","opts":["手工釀醋","天然海鹽","萬用小蘇打粉","手工砂糖"],"ans":3,"sec":"認識電解質","diff":"易","src":"重點演練・素養題","exp":"(A)食醋中的醋酸為<b>酸</b>類，屬於電解質。(B)食鹽為<b>鹽</b>類，屬於電解質。(C)小蘇打粉為<b>鹽</b>類，屬於電解質。(D)砂糖（蔗糖）在水中<i class=\"hl\">不會解離</i>，水溶液無法導電，不屬於電解質。"},
{"q":"將氫氧化鈣溶於水中，其解離反應式為「Ca(OH)₂→Ca²⁺＋2OH⁻」，則關於氫氧化鈣水溶液的敘述，下列何者正確？","opts":["導電時，Ca²⁺ 移向負極，OH⁻ 移向正極","導電時，兩極不一定會發生化學反應","Ca²⁺ 的總個數與 OH⁻ 的總個數相等","Ca²⁺ 的總帶電量為 OH⁻ 總帶電量的兩倍"],"ans":0,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"通電後<b>陽離子往負極</b>、<b>陰離子往正極</b>移動，(A)正確。(B)導電時兩極<b>必會</b>發生化學反應。(C)(D)水溶液必為電中性，Ca²⁺ 的總帶電量<b>等於</b> OH⁻ 的總帶電量，但兩者的<i class=\"hl\">個數不相等</i>（OH⁻ 個數是 Ca²⁺ 的兩倍）。"},
{"q":"若質量數 40、原子序 20 的鈣原子失去兩個電子形成鈣離子，則關於鈣離子的敘述，下列何者正確？","opts":["質子數為 18","電子數為 18","中子數為 22","質量數為 38"],"ans":1,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"該鈣原子的質子數、電子數均為 20，中子數＝質量數－質子數＝40－20＝20。失去兩個電子後：質子數仍為 <b>20</b>、中子數仍為 <b>20</b>、質量數仍為 <b>40</b>（電子質量極小不計），只有電子數變成 20－2＝<b>18</b>，故選(B)。"},
{"q":"下列化合物各取 1 莫耳並完全溶於等量的水中，則哪一水溶液中所含離子總莫耳數最多？","opts":["NaCl","HCl","CaCl₂","NH₄OH"],"ans":2,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"解離式分別為：(A)NaCl→Na⁺＋Cl⁻（2 個）；(B)HCl→H⁺＋Cl⁻（2 個）；(C)CaCl₂→Ca²⁺＋2Cl⁻（<b>3 個</b>）；(D)NH₄OH→NH₄⁺＋OH⁻（2 個）。故選(C)。"},
{"q":"西元 2011 年 3 月 11 日，日本外海發生大地震，造成核電廠機組損壞爆炸，釋出放射性物質「碘-129」、「碘-131」而造成恐慌，相關單位提醒當地民眾可適時的服用「碘化鉀」來防止甲狀腺大量吸收這些放射性物質。則下列關於碘-129、碘-131 以及碘化鉀的敘述，何者<b>錯誤</b>？","opts":["碘-129、碘-131 的質量數不同","碘-129、碘-131 為元素，而碘化鉀為化合物","碘-129、碘-131 與碘化鉀溶於水後，水溶液均為電中性","碘化鉀溶於水所解離出來的碘離子與碘-129、碘-131 的化學性質相同"],"ans":3,"sec":"認識電解質","diff":"中","src":"重點演練・素養題","exp":"(D)錯誤。<b>碘離子（I⁻）與碘原子（I）的電子數不同，化學性質也不同</b>。原子與其離子只有質子數、中子數相同，電子數與化學性質皆不同。"},
{"q":"已知 Ca 和 Cl 的原子序分別為 20、17，Ca²⁺ 和 Cl⁻ 的質子數和電子數如下：<br>　Ca²⁺：質子數 <b>w</b>、電子數 <b>y</b><br>　Cl⁻：質子數 <b>x</b>、電子數 <b>z</b><br>則 w、x、y、z 的數值大小比較，下列何者正確？","opts":["w＞z","x＞y","x＞z","y＞w"],"ans":0,"sec":"認識電解質","diff":"中","src":"會考114（通過率 66%）","exp":"解題關鍵：<b>電中性原子的原子序＝質子數＝電子數</b>。Ca²⁺ 表示失去 2 個電子，故 w＝20、y＝20－2＝18；Cl⁻ 表示得到 1 個電子，故 x＝17、z＝17＋1＝18。則 w(20)＞z(18)，故選(A)。"},
{"q":"有一個帶電的離子含有 X、Y、Z 三種粒子（質子、電子、中子，未依照順序排列），且 X、Y、Z 的粒子數目依序為 Nx、Ny、Nz。已知 X 粒子的質量最小，關於此離子的說明，下列何者最合理？","opts":["若為陽離子，且 Ny＞Nx＝Nz，則 Z 為質子","若為陽離子，且 Ny＞Nx＝Nz，則 Z 為電子","若為陰離子，且 Nx＝Ny＞Nz，則 Z 為質子","若為陰離子，且 Nx＞Ny＝Nz，則 Z 為電子"],"ans":2,"sec":"認識電解質","diff":"難","src":"會考111（通過率 45%）","exp":"解題關鍵：<b>陽離子則質子數＞電子數，陰離子則質子數＜電子數</b>。三種粒子中<i class=\"hl\">電子的質量最小</i>，故 X 為電子。(A)(B)若為陽離子，則質子數＞電子數（Nx），但選項中 Ny＞Nx，故 Y 才是質子。(C)若為陰離子，電子數（Nx）＞質子數，Nx＝Ny＞Nz，則 Z 可為質子，成立。(D)若為陰離子，電子數須大於質子數，但 Nx＞Ny＝Nz，Y 或 Z 為質子而非電子。故選(C)。"},
{"q":"家中電熱水瓶使用一段時間後，內壁常會出現白色的「水垢」，已知水垢的主要成分為碳酸鎂與碳酸鈣，則使用下列何種物質對去除水垢最有幫助？","opts":["熱水","燒鹼","檸檬酸","石灰"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練・素養題","exp":"<b>酸性物質</b>的水溶液可與碳酸鹽類反應，使其溶解。(B)燒鹼（氫氧化鈉）與(D)石灰（氧化鈣）均為<b>鹼性</b>物質，故選(C)檸檬酸。"},
{"q":"下列哪一項為酸與鹼的<b>共同</b>性質？","opts":["兩者皆可溶解油脂","兩者的水溶液皆可導電","兩者的水溶液皆可使酚酞呈紅色","兩者皆可使活性大的金屬產生氫氣"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練","exp":"酸類與鹼類<b>都是電解質</b>，水溶液皆可導電，(B)正確。(A)<b>鹼</b>才可溶解油脂。(C)酚酞遇酸性溶液呈<b>無色</b>、遇鹼性溶液才呈紅色。(D)<b>酸</b>才可使活性大的金屬產生氫氣。"},
{"q":"關於酸性物質特性的敘述，下列何者<b>錯誤</b>？","opts":["濃硫酸具有強脫水性，可使碳水化合物失去水分","醋酸又稱為蟻酸，具有刺激性氣味","鹽酸應為無色，但是工業用的鹽酸含有雜質，故呈淡黃色","稀釋濃硫酸時，應將濃硫酸緩慢加入大量水中，並不斷攪拌"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練","exp":"(B)錯誤。醋酸又稱為<i class=\"hl\">乙酸</i>；<b>蟻酸</b>則是<b>甲酸</b>，兩者不同。"},
{"q":"牡蠣殼的主要成分為碳酸鈣，牡蠣殼經過高溫煅燒後的煅燒牡蠣殼粉具有抗菌性，可抑制大腸桿菌、沙門氏菌與金黃色葡萄球菌等。若阿達想要研究煅燒牡蠣殼粉的抗菌性與 pH 值之相關性，而非與成分的相關性，則他可研究下列何種物質的抗菌性？","opts":["鹽酸","碳酸","食鹽","燒鹼"],"ans":3,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練・素養題","exp":"碳酸鈣高溫煅燒會分解成<b>氧化鈣</b>（CaCO₃ →〔△〕→ CaO＋CO₂），氧化鈣為<b>鹼性</b>物質。若要研究抗菌性與 pH 值的相關性（而非成分），應選擇成分不同但同為<b>鹼性</b>的物質，故選(D)燒鹼（氫氧化鈉）。"},
{"q":"閱讀下文後回答：「為了減少溫室氣體，地質學家將二氧化碳變成岩石的一部分——將發電廠產生的二氧化碳灌入大量的水中，以管線將這些氣泡水輸送到數公里遠的區域，接著透過高壓將氣泡水注入地下一千公尺深的岩層中，這些氣泡水會和鈣、鎂等離子反應而『固化』，並填充岩層空隙。」上述二氧化碳變成岩石一部分的過程，是利用下列二氧化碳（水溶液）的何種性質？","opts":["密度大於空氣","溶於水呈酸性","可與鈣離子反應產生難溶於水的碳酸鹽","可與鈉離子反應產生易溶於水的碳酸鹽"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考114（通過率 60%）","exp":"解題關鍵：藉由二氧化碳的檢驗方式判斷。由題目可知，二氧化碳水溶液會與<b>鈣、鎂離子</b>反應，形成<i class=\"hl\">難溶於水</i>的碳酸鈣而「固化」，與密度、酸鹼性無關，故選(C)。"},
{"q":"虎門銷煙為清朝銷毀鴉片的歷史事件。把海水引入浸泡池浸泡鴉片，之後再加入石灰等物質，石灰遇水會改變水溫，此改變也利於將鴉片溶於水中，等退潮時再排入海中。關於上述銷毀鴉片的說明，下列何者最合理？","opts":["石灰溶於水為放熱反應，而高溫使鴉片更易溶於水中","石灰溶於水為吸熱反應，而高溫使鴉片更易溶於水中","鴉片浸泡海水後會使水溫上升，使其與石灰反應速率加快","鴉片浸泡海水後會使水溫下降，使其與石灰反應速率加快"],"ans":0,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考113（通過率 74%）","exp":"解題關鍵：思考石灰遇水會如何改變水溫。石灰（CaO）溶於水會<i class=\"hl\">放熱</i>，使水溫升高；由題目「此改變也利於將鴉片溶於水中」可推論高溫會使鴉片更易溶於水中，故選(A)。"},
{"q":"人體會自動將血液的 pH 值調節在 7.35 到 7.45 之間，若血液的 pH 值低於 7.35，即為「酸中毒」；若血液的 pH 值高於 7.45，則為「鹼中毒」。試問下列敘述何者正確？","opts":["人體酸中毒時的血液必呈酸性，且 [H⁺]＞[OH⁻]","人體酸中毒時的血液必呈酸性，且 [H⁺]＜[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＞[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＜[OH⁻]"],"ans":3,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練・素養題","exp":"酸中毒只要 pH 低於 7.35 即成立，例如 pH＝7.2 仍<b>大於 7</b>，血液<i class=\"hl\">可能仍呈鹼性</i>，故(A)(B)的「必呈酸性」不成立。鹼中毒時 pH 高於 7.45，<b>必定大於 7</b>，故血液必呈鹼性，且鹼性表示 [H⁺]＜[OH⁻]，故選(D)。"},
{"q":"小黃計畫假日要去泡溫泉，正在考慮下列四個地點。若小黃的皮膚較為敏感，不宜浸泡過酸或過鹼的溫泉，否則皮膚容易出現乾、癢等症狀，則小黃應選擇哪一地點的溫泉最為適當？","opts":["新北投，溫泉 pH 值 1.2","陽明山，溫泉 pH 值 2.3","礁溪，溫泉 pH 值 7.5","關子嶺，溫泉 pH 值 10.2"],"ans":2,"sec":"水溶液的酸鹼性","diff":"易","src":"重點演練・素養題","exp":"pH 值小於 7 為酸性，且數值越小酸性越強；pH 值大於 7 為鹼性，且數值越大鹼性越強。<b>pH 7.5 最接近中性 7</b>，故選(C)礁溪。"},
{"q":"將 1M、50 mL 的 HCl 水溶液加水稀釋到 100 mL，則關於稀釋過程的敘述，下列何者正確？","opts":["莫耳濃度變大","[H⁺] 變大","pH 值變大","重量百分率濃度變大"],"ans":2,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練","exp":"加水稀釋後，溶質的莫耳數與質量<b>不變</b>，但溶液的體積與質量<b>變大</b>，故(A)莫耳濃度與(D)重量百分率濃度均<b>變小</b>。(B)酸性減弱，[H⁺] <b>變小</b>。[H⁺] 變小則 pH 值<i class=\"hl\">變大</i>（趨近 7），故選(C)。"},
{"q":"牙齒酸蝕是指酸性物質會使牙齒外層的琺瑯質軟化，而容易損耗。<br><b>實驗一</b>：選用形狀大小很相近的豬牙齒，分別浸泡不同濃度的鹽酸數日，結果如下——<br>　鹽酸 X：pH 2.4，重量減少百分比 1 日後 6.82%、2 日後 7.87%<br>　鹽酸 Y：pH 3.7，重量減少百分比 1 日後 4.15%、2 日後 4.92%<br>　鹽酸 Z：pH 3.1，重量減少百分比 1 日後 5.95%、2 日後 6.76%<br><b>實驗二</b>：取形狀大小很相近的豬牙齒，分別浸泡在 pH 值介於 2～4 之間的甲、乙、丙三杯飲料中數日，發現牙齒重量減少百分比為丙＜甲＜乙。<br>若實驗二只考慮 pH 值的影響，則依實驗一的結果，關於甲、乙、丙三杯飲料的推測，下列何者最合理？","opts":["乙杯最酸，其 pH 值最大","乙杯最酸，其 pH 值最小","丙杯最酸，其 pH 值最大","丙杯最酸，其 pH 值最小"],"ans":1,"sec":"水溶液的酸鹼性","diff":"中","src":"會考113（通過率 70%）","exp":"解題關鍵：先由表中數據推論 pH 值與牙齒損耗的關係。由實驗一可見 <b>pH 值越小（酸性越強），牙齒重量減少越多</b>（X 的 pH 2.4 減少最多）。實驗二中重量減少百分比為丙＜甲＜乙，表示<b>乙杯使牙齒損耗最大 → 乙杯最酸 → pH 值最小</b>，故選(B)。"},
{"q":"閱讀下文後回答：「新聞報導某處養殖的白蝦大量暴斃，調查後初步推測是高溫與暴雨，使養殖池的溶氧量和 pH 值劇烈變化，導致水質改變所造成的。專家建議為避免白蝦大量死亡，應注意水溫變化，可先用水車調整水中的溶氧量，並監控水中的 pH 值，投放熟石灰（氫氧化鈣）調整至合適的 pH 值。」關於上述專家建議的方法，下列說明何者最合理？（溶氧量：溶解於水中的氧氣量）","opts":["使水中的溶氧量增加，pH 值增加","使水中的溶氧量增加，pH 值減少","使水中的溶氧量減少，pH 值增加","使水中的溶氧量減少，pH 值減少"],"ans":0,"sec":"水溶液的酸鹼性","diff":"中","src":"會考111（通過率 51%）","exp":"解題關鍵：思考高溫對水中溶氧量的影響，以及熟石灰水溶液的酸鹼性。<b>高溫會使水中的溶氧量減少</b>，故用水車的目的是使溶氧量<i class=\"hl\">增加</i>；熟石灰（氫氧化鈣）為<b>鹼性</b>物質，投放後會使水的 pH 值<i class=\"hl\">增加</i>，故選(A)。"},
{"q":"阿珍因胃酸分泌過多而服用胃藥（主要成分為碳酸鈉），則服用此胃藥後的敘述，下列何者<b>錯誤</b>？","opts":["胃部可能會有熱熱的感覺","會使胃內液體的 pH 值下降","胃內會進行酸鹼中和反應","會使胃內液體的 [H⁺] 下降"],"ans":1,"sec":"酸鹼中和","diff":"中","src":"重點演練・素養題","exp":"碳酸鈉（鹼性）會與胃內的鹽酸進行<b>酸鹼中和反應</b>，屬放熱反應（故(A)正確），並使胃內液體的 [H⁺] <b>下降</b>（故(D)正確）。[H⁺] 下降代表酸性減弱，pH 值應<i class=\"hl\">上升</i>，故(B)錯誤。"},

/* ===== 由 BOOKS 生成「學習重點」各頁 ===== */
function tags(a){
  return (a||[]).map(x=>'<span class="tg'+(/補充/.test(x)?' b':'')+'">'+esc(x)+'</span>').join("");
}
function hotBar(h){
  if(!h) return '<span style="color:var(--line)">\u2014</span>';
  return '<span class="hot5">'+'\u25cf'.repeat(h)+'</span><span style="color:var(--line)">'+'\u25cf'.repeat(5-h)+'</span>';
}
function tally(us){
  const all=us.reduce((n,u)=>n+u.ps.length,0);
  const done=us.reduce((n,u)=>n+u.ps.filter(p=>p.c).length,0);
  return {all:all,done:done,pct:all?Math.round(done/all*100):0};
}
function unitBlock(u){
  let h='<h2 class="sec"><span class="un">'+esc(typeof u.n==="number"?"\u7b2c "+u.n+" \u55ae\u5143":u.n)+'</span> '+esc(u.t)+'</h2>';
  if(u.ov) h+='<div class="ovline">\ud83d\udcce \u55ae\u5143\u7d9c\u89bd\u5716\uff1a\u8ab2\u672c p.'+esc(String(u.ov))+'</div>';
  h+='<div class="mtabwrap"><table class="mtab">'+
     '<tr><th>\u91cd\u9ede</th><th>\u540d\u7a31</th><th>\u6703\u8003\u91cd\u8981\u5ea6</th><th>\u5167\u5bb9</th><th>\u9801</th></tr>'+
     u.ps.map(p=>
       '<tr><td class="nm">'+esc(String(p.n))+'</td>'+
       '<td class="tt">'+esc(p.t)+(p.un?' <span class="warn" title="\u76ee\u9304\u7167\u7247\u5b57\u592a\u5c0f\uff0c\u540d\u7a31\u6216\u9801\u78bc\u5c1a\u672a\u78ba\u8a8d">\u26a0</span>':'')+
         (p.tg&&p.tg.length?'<div style="margin-top:4px">'+tags(p.tg)+'</div>':'')+'</td>'+
       '<td class="ct">'+hotBar(p.hot)+'</td>'+
       '<td class="ct">'+(p.c?'<span class="done">\u2713 \u5df2\u6536\u9304</span>':'<span class="todo"><b>\u5f85\u88dc</b></span>')+'</td>'+
       '<td class="pg">'+esc(String(p.p))+'</td></tr>').join("")+
     '</table></div>';
  u.ps.forEach(p=>{
    if(!p.c) return;
    h+='<h3 class="sub"><span class="kp">\u91cd\u9ede '+esc(String(p.n))+'</span>'+esc(p.t)+
       '<span class="pgt">\u8ab2\u672c p.'+esc(String(p.p))+'</span></h3>'+p.c;
  });
  return h;
}
function buildLearn(){
  SUBJECTS.forEach(sj=>{
    const pane=$("#learn-"+sj.k); if(!pane) return;
    pane.style.setProperty("--sub",sj.color);
    const allU=sj.vols.reduce((a,v)=>a.concat(v.us),[]);
    const s=tally(allU);
    let h='<div class="bkhd"><b>'+sj.icon+' '+esc(sj.name)+'</b>\u3000'+sj.vols.length+' \u518a\u3001'+allU.length+
          ' \u500b\u55ae\u5143\u3001'+s.all+' \u500b\u91cd\u9ede'+
          '<div class="bar"><i style="width:'+s.pct+'%"></i></div>'+
          '\u5df2\u6536\u9304\u5167\u5bb9 '+s.done+' / '+s.all+'\uff08'+s.pct+'%\uff09'+
          (s.done<s.all?'\u3000\u5c1a\u672a\u6536\u9304\u7684\u91cd\u9ede\u6703\u6a19\u793a <b style="color:var(--todo)">\u5f85\u88dc</b>\u3002':'')+
          '</div>';
    sj.vols.forEach(v=>{
      const q=tally(v.us);
      h+='<div class="volhd"><span class="vb">'+esc(v.name)+'</span>'+
         '<span class="vbar"><i style="width:'+q.pct+'%"></i></span>'+
         '<span class="vp">'+v.us.length+' \u55ae\u5143\u3001'+q.all+' \u91cd\u9ede\uff5c\u5df2\u6536\u9304 '+q.done+'</span></div>';
      v.us.forEach(u=>{ h+=unitBlock(u); });
    });
    pane.innerHTML=h;
  });
}

function renderUnits(){
  const box=$("#unitChips");box.innerHTML="";

    const b=document.createElement("button");
    b.className="unit"+(unit===k?" active":"");
    b.innerHTML=esc((UNITS[k].icon?UNITS[k].icon+" ":"")+UNITS[k].name)+
      (unit===k?'<span class="cx">'+(tocOpen?"\u25b4":"\u25be")+'</span>':'');
    if(UNITS[k].color) b.style.setProperty("--sub-c",UNITS[k].color);
    b.onclick=()=>{
      if(unit===k){tocOpen=!tocOpen;renderUnits();renderToc();return;}
      unit=k;secSel="all";diffSel="all";tocOpen=true;qQuit();
      renderUnits();renderLearn();renderChips();renderList();renderToc();
    };

  });
  $("#subT").textContent="學習重點＋題庫測驗｜"+UNITS[unit].name+"（"+UNITS[unit].qs.length+" 題）";
}
let tocOpen=true;
function renderToc(){
  const box=$("#toc"); if(!box) return;
  const sj=SUBJECTS.find(s=>s.k===unit);
  if(!sj||!tocOpen){box.hidden=true;return;}
  box.hidden=false;
  box.style.setProperty("--sub-t",sj.color);
  let h="",i=0;
  sj.vols.forEach(v=>{
    h+='<div class="tv"><span class="vb">'+esc(v.name)+'</span><span class="vn">'+v.us.length+' 個單元</span></div><div class="tl">';
    v.us.forEach(u=>{
      const done=u.ps.filter(p=>p.c).length;
      h+='<button class="tu" data-i="'+i+'" title="'+esc(u.t)+'">'+
         '<span class="n">'+esc(typeof u.n==="number"?String(u.n):u.n)+'</span>'+esc(u.t)+
         '<span class="c">'+(done?'<b>\u2713'+done+'</b>/':'')+u.ps.length+' 重點</span></button>';
      i++;
    });
    h+='</div>';
  });
  h+='<button class="tx" id="tocX">收起目錄 \u25b4</button>';
  box.innerHTML=h;
  box.querySelectorAll(".tu").forEach(b=>b.onclick=()=>jumpUnit(+b.dataset.i));

}

  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  const lt=document.querySelector('.tab[data-tab="learn"]'); if(lt)lt.classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
  $("#pane-learn").classList.add("show");
}
function flashSec(h){
  if(!h) return;
  h.scrollIntoView({block:"start",behavior:"smooth"});
  h.classList.remove("secflash"); void h.offsetWidth; h.classList.add("secflash");
}
function jumpUnit(i){
  toLearnTab();
  const hs=document.querySelectorAll("#learn-"+unit+" h2.sec");
  tocOpen=false; renderUnits(); renderToc();
  flashSec(hs[i]);
}
function renderLearn(){
  document.querySelectorAll(".lpane").forEach(p=>p.style.display="none");
  $("#learn-"+unit).style.display="";
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));t.classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
  $("#pane-"+t.dataset.tab).classList.add("show");
});

/* ===== 測驗 ===== */
let secSel="all", diffSel="all", QZ=null;
const bank=()=>UNITS[unit].qs;
const pool=()=>bank().filter(q=>(secSel==="all"||q.sec===secSel)&&(diffSel==="all"||q.diff===diffSel));
function chips(box,cur,items,fn){
  const b=$(box);b.innerHTML="";
  items.forEach(it=>{const c=document.createElement("button");c.className="chip"+(cur===it.v?" active":"");
    c.textContent=it.t;c.onclick=()=>{fn(it.v);renderChips();renderList();};b.appendChild(c);});
}
function renderChips(){
  const qs=bank(), cnt=f=>qs.filter(f).length;
  if(!qs.length){
    $("#secChips").innerHTML="";$("#diffChips").innerHTML="";
    $("#startBtn").style.display="none";
    $("#poolStat").textContent="此科目尚無題庫，先到「學習重點」複習吧 🌱";
    if(QZ)qQuit();
    return;
  }
  $("#startBtn").style.display="";
  const secs=[...new Set(qs.map(q=>q.sec))];
  if(secs.length>1){
    chips("#secChips",secSel,[{v:"all",t:"全部（"+qs.length+" 題）"}]
      .concat(secs.map(s=>({v:s,t:s+"（"+cnt(q=>q.sec===s)+"）"}))),v=>{secSel=v;});
  }else{$("#secChips").innerHTML="";secSel="all";}
  const diffs=["易","中","難"].filter(d=>cnt(q=>q.diff===d)>0);
  if(diffs.length){
    chips("#diffChips",diffSel,[{v:"all",t:"所有難度"}]
      .concat(diffs.map(d=>({v:d,t:d+"（"+cnt(q=>q.diff===d)+"）"}))),v=>{diffSel=v;});
  }else{$("#diffChips").innerHTML="";diffSel="all";}
  $("#startBtn").textContent="📝 開始測驗（"+pool().length+" 題）";
  let best=0;try{best=+localStorage.getItem("nat_best_"+unit+"_"+secSel+"_"+diffSel)||0;}catch(e){}
  $("#poolStat").textContent=best?("此範圍最佳答對率 "+best+"%"):"";
  if(QZ)qQuit();
}
function renderList(){
  const arr=pool();
  $("#qlist").innerHTML=arr.map((q,i)=>
    '<div class="qitem"><span class="topic">'+q.sec+(q.diff?'・'+q.diff:'')+'</span>'+(q.src?' <span class="topic">'+esc(q.src)+'</span>':'')+
    '<div class="q">'+(i+1)+'. '+rep(q.q,true)+'</div>'+
    '<div class="o">'+q.opts.map((o,k)=>"（"+"ＡＢＣＤ"[k]+"）"+rep(o,false)).join("　")+'</div>'+
    '<button class="btn ghost sm" onclick="tglA(this)">👁 看答案</button>'+
    '<div class="a"><b>正解（'+"ＡＢＣＤ"[q.ans]+'）'+rep(q.opts[q.ans],false)+'</b>'+(q.exp?'<div style="margin-top:4px">詳解：'+rep(q.exp,false)+'</div>':'')+'</div></div>'
  ).join("");
}
window.tglA=function(btn){btn.nextElementSibling.classList.toggle("show");};
function qStart(list){
  QZ={list:shuffle((list||pool()).slice()),i:0,score:0,wrong:[],full:!list,u:unit,scope:secSel+"_"+diffSel};
  if(!QZ.list.length){alert("此範圍沒有題目。");QZ=null;return;}
  $("#qlist").style.display="none";$("#startBtn").style.display="none";
  qRender();
}
function qQuit(){$("#quizBox").innerHTML="";$("#qlist").style.display="";$("#startBtn").style.display="";QZ=null;}
function qRender(){
  const q=QZ.list[QZ.i],n=QZ.list.length;
  let s='<div class="progress"><i style="width:'+(QZ.i/n*100)+'%"></i></div>';
  s+='<div class="counter">第 '+(QZ.i+1)+' / '+n+' 題　|　得分 '+QZ.score+'</div>';
  s+='<div class="exam"><span class="topic">'+q.sec+(q.diff?'・'+q.diff:'')+'</span>'+(q.src?' <span class="src">'+esc(q.src)+'</span>':'');
  s+='<div class="q">'+rep(q.q,true)+'</div>';
  s+='<div class="eopts">'+q.opts.map((o,k)=>'<button class="eopt" data-k="'+k+'"><span class="k">（'+"ＡＢＣＤ"[k]+'）</span><span>'+rep(o,false)+'</span></button>').join("")+'</div>';
  s+='<div class="expl"></div></div>';
  s+='<div class="nav"><button class="btn ghost sm" id="qquit">結束</button><button class="btn primary" id="qnext" style="display:none">下一題 ▶</button></div>';
  $("#quizBox").innerHTML=s;
  document.querySelectorAll("#quizBox .eopt").forEach(b=>b.onclick=()=>qChoose(b,q));
  $("#qquit").onclick=qQuit;
  $("#qnext").onclick=()=>{QZ.i++;if(QZ.i<n)qRender();else qFinish();};
}
function qChoose(btn,q){
  const k=+btn.dataset.k, ok=k===q.ans;
  document.querySelectorAll("#quizBox .eopt").forEach(x=>x.onclick=null);
  document.querySelectorAll("#quizBox .eopt")[q.ans].classList.add("correct");
  if(!ok)btn.classList.add("wrong");
  if(ok)QZ.score++;else QZ.wrong.push(q);
  const e=$("#quizBox .expl");
  let s='<span class="lbl">'+(ok?"✅ 答對了":"❌ 正解")+'</span>（'+"ＡＢＣＤ"[q.ans]+'）'+rep(q.opts[q.ans],false);
  if(q.exp)s+='<div style="margin-top:6px">💡 '+rep(q.exp,false)+'</div>';
  e.innerHTML=s;e.classList.add("show");
  const nx=$("#qnext");nx.style.display="inline-block";nx.focus();
}
function qFinish(){
  const n=QZ.list.length,pct=Math.round(QZ.score/n*100);
  const emoji=pct>=90?"🏆":pct>=70?"🎉":pct>=50?"💪":"📖";
  try{if(QZ.full){const key="nat_best_"+QZ.u+"_"+QZ.scope;const best=Math.max(+localStorage.getItem(key)||0,pct);localStorage.setItem(key,best);}}catch(e){}
  const rv=QZ.wrong.length
    ?'<div class="review"><h3 style="color:var(--muted);margin:14px 0 4px">📌 需複習（'+QZ.wrong.length+'）</h3>'+
      QZ.wrong.map(q=>'<div class="r"><div>'+rep(q.q,true)+'</div><b style="color:var(--ok)">正解（'+"ＡＢＣＤ"[q.ans]+'）'+rep(q.opts[q.ans],false)+'</b>'+(q.exp?'<div style="color:var(--muted);margin-top:3px">'+rep(q.exp,false)+'</div>':'')+'</div>').join("")+'</div>'
    :'<p style="color:var(--ok);font-weight:800;margin-top:12px">🌟 全部答對！</p>';
  const wrong=QZ.wrong.slice();
  $("#quizBox").innerHTML='<div class="scorebox"><div style="font-size:3rem">'+emoji+'</div><div class="big">'+QZ.score+' / '+n+'</div>'+
    '<div style="font-weight:800;color:var(--muted)">答對率 '+pct+'%</div><div class="nav">'+
    (wrong.length?'<button class="btn primary" id="againWrong">🔁 只測錯的</button>':'')+
    '<button class="btn '+(wrong.length?'ghost':'primary')+'" id="againAll">↻ 再測一次</button>'+
    '<button class="btn ghost" id="backList">⬅ 回題目列表</button></div>'+rv+'</div>';
  QZ=null;
  renderChips();
  if(wrong.length)$("#againWrong").onclick=()=>qStart(wrong);
  $("#againAll").onclick=()=>qStart();
  $("#backList").onclick=qQuit;
}
$("#startBtn").onclick=()=>qStart();
document.querySelectorAll("img[data-im]").forEach(el=>{
  const s=IM[el.dataset.im];
  if(s)el.src=s;
  else{const td=el.closest("td");if(td&&td.classList.contains("thumb"))td.textContent="—";else el.remove();}
});
renderUnits();renderLearn();renderChips();renderList();renderToc();

/* ===== 全站搜尋 ===== */
(function(){
  const box=$("#sq"), go=$("#sgo"), clr=$("#sx"), out=$("#sres");
  if(!box) return;
  let IDX=null;

  function build(){
    const idx=[];
    Object.keys(UNITS).forEach(u=>{
      const pane=$("#learn-"+u); if(!pane) return;
      let cur=null;
      [...pane.children].forEach(el=>{
        if(el.tagName==="H2"&&el.classList.contains("sec")){
          cur={unit:u,unitName:UNITS[u].name,sec:el.textContent.trim(),el:el,text:""};
          idx.push(cur);
        } else if(cur){
          cur.text+=" "+el.textContent.replace(/\s+/g," ");
        }
      });
    });
    return idx;
  }

  const norm=s=>String(s).toLowerCase();
  const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function mark(s,q){
    const i=norm(s).indexOf(norm(q));
    if(i<0) return escH(s);
    return escH(s.slice(0,i))+"<mark>"+escH(s.slice(i,i+q.length))+"</mark>"+escH(s.slice(i+q.length));
  }

  function snip(text,q,pad){
    const i=norm(text).indexOf(norm(q));
    if(i<0) return "";
    const a=Math.max(0,i-pad), b=Math.min(text.length,i+q.length+pad);
    return (a>0?"…":"")+text.slice(a,b).trim()+(b<text.length?"…":"");
  }

  function jump(unitKey,secText){
    if(unit!==unitKey){unit=unitKey;secSel="all";diffSel="all";qQuit();renderUnits();renderLearn();renderChips();renderList();}
    tocOpen=false;renderUnits();renderToc();
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    const lt=document.querySelector('.tab[data-tab="learn"]'); if(lt)lt.classList.add("active");
    document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
    $("#pane-learn").classList.add("show");
    const h=[...document.querySelectorAll("#learn-"+unitKey+" h2.sec")].find(x=>x.textContent.trim()===secText);
    if(h){h.scrollIntoView({block:"start",behavior:"smooth"});h.classList.remove("secflash");void h.offsetWidth;h.classList.add("secflash");}
  }

  function run(){
    const q=box.value.trim();
    if(!q){out.hidden=true;clr.hidden=true;return;}
    if(!IDX) IDX=build();
    clr.hidden=false; out.hidden=false;

    const hits=IDX.filter(s=>norm(s.sec).includes(norm(q))||norm(s.text).includes(norm(q)));

    const qhits=[];
    Object.keys(UNITS).forEach(u=>{
      (UNITS[u].qs||[]).forEach(o=>{
        const blob=[o.q,(o.opts||[]).join(" "),o.exp||""].join(" ");
        if(norm(blob).includes(norm(q))) qhits.push({u:u,uName:UNITS[u].name,o:o});
      });
    });

    let html='<div class="shead">「'+escH(q)+'」找到 學習重點 '+hits.length+' 節、題庫 '+qhits.length+' 題</div>';

    if(hits.length){
      let lastU="";
      hits.slice(0,40).forEach(s=>{
        if(s.unitName!==lastU){html+='<div class="sgrp">📚 '+escH(s.unitName)+'</div>';lastU=s.unitName;}
        const sp=snip(s.text,q,38)||snip(s.sec,q,38)||s.text.slice(0,80).trim()+"…";
        html+='<button class="sitem" data-u="'+s.unit+'" data-s="'+escH(s.sec)+'">'+
              '<span class="swhere">'+escH(s.sec)+'</span>'+mark(sp,q)+'</button>';
      });
      if(hits.length>40) html+='<div class="snone">（還有 '+(hits.length-40)+' 節未列出，請輸入更精確的關鍵字）</div>';
    }

    if(qhits.length){
      html+='<div class="sgrp">📝 題庫</div>';
      qhits.slice(0,15).forEach(h=>{
        const o=h.o, ans=(o.opts||[])[o.ans]||"";
        html+='<div class="qcard">'+mark(String(o.q).replace(/⟦[^⟧]*⟧/g,"〔圖〕"),q)+
              '<br><span class="qa">答：'+escH(String(ans).replace(/。$/,""))+'</span>'+
              (o.exp?'<span class="qe">'+mark(String(o.exp).replace(/⟦[^⟧]*⟧/g,"〔圖〕"),q)+'</span>':'')+
              '<span class="qe">—— '+escH(h.uName)+(o.src?'｜'+escH(o.src):'')+'</span></div>';
      });
      if(qhits.length>15) html+='<div class="snone">（還有 '+(qhits.length-15)+' 題未列出）</div>';
    }

    if(!hits.length&&!qhits.length) html+='<div class="snone">找不到「'+escH(q)+'」。試試較短的關鍵字，例如「比熱」而不是「比熱要怎麼算」。</div>';

    out.innerHTML=html;
    out.querySelectorAll(".sitem").forEach(b=>b.onclick=()=>jump(b.dataset.u,b.dataset.s));
  }

  go.onclick=run;
  clr.onclick=()=>{box.value="";out.hidden=true;clr.hidden=true;box.focus();};
  box.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();run();}
    if(e.key==="Escape"){box.value="";out.hidden=true;clr.hidden=true;}
  });
})();
</script>
</body>
</html>
