<p><span class="nt"><b>註</b>節肢動物門昆蟲綱、蛛形綱、甲殼綱的比較：</span></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th colspan="3">昆蟲綱</th><th>蛛形綱</th><th>甲殼綱</th></tr>
<tr><td class="h">身體區分</td><td class="c" colspan="3"><i class="hl">三節</i>：頭、胸、腹</td><td class="c"><i class="hl">二節</i>：頭胸、腹</td><td class="c">有分節</td></tr>
<tr><td class="h">步足</td><td class="c" colspan="3"><i class="hl">3 對</i></td><td class="c"><i class="hl">4 對</i></td><td class="c"><i class="hl">5 對</i></td></tr>
<tr><td class="h">翅膀</td><td class="c">無</td><td class="c">1 對</td><td class="c">2 對（多數）</td><td class="c">無</td><td class="c">無</td></tr>
<tr><td class="h">常見物種</td><td class="c">衣魚、工蟻</td><td class="c">蚊、蠅</td><td class="c">蜻蜓、蝴蝶</td><td class="c">蜘蛛、蠍子</td><td class="c">蝦、蟹</td></tr>
<tr><td class="h">特徵</td><td colspan="3">1. 陸地上最普遍、種類最多的節肢動物。<br>2. <i class="hl">唯一會飛行</i>的無脊椎動物。<br>3. 大部分生活史會經歷<b>變態</b>過程。</td><td>有些蜘蛛會<b>結網</b>以捕食昆蟲。</td><td>1. 水中常見的節肢動物。<br>2. 第一對步足常膨大為<i class="hl">螯足</i>，以捕食或禦敵。</td></tr>
</table></div>
</div>

<div class="blk">
<h4>四、脊椎動物</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>魚類</th><th>兩生類</th><th>爬蟲類</th><th>鳥類</th><th>哺乳類</th></tr>
<tr><td class="h">呼吸構造</td><td class="c">鰓</td><td class="c"><i class="hl">幼體：鰓</i><br><i class="hl">成體：肺、皮膚</i></td><td class="c">肺</td><td class="c">肺、<i class="hl">氣囊</i></td><td class="c">肺</td></tr>
<tr><td class="h">受精場所</td><td class="c">多為體外</td><td class="c">多為體外</td><td class="c"><i class="hl">體內</i></td><td class="c"><i class="hl">體內</i></td><td class="c"><i class="hl">體內</i></td></tr>
<tr><td class="h">胚胎發育</td><td class="c">多為卵生、<br>卵無硬殼</td><td class="c">卵生、<br>無硬殼</td><td class="c">多為卵生、<br>卵<i class="hl">有硬殼</i></td><td class="c">卵生、<br><i class="hl">有硬殼</i></td><td class="c">多為<i class="hl">胎生</i>、<br>少數卵生</td></tr>
<tr><td class="h">體溫恆定</td><td class="c">外溫動物</td><td class="c">外溫動物</td><td class="c">外溫動物</td><td class="c"><i class="hl">內溫動物</i></td><td class="c"><i class="hl">內溫動物</i></td></tr>
<tr><td class="h">特徵</td><td>1. 體表有<i class="hl">鱗片</i>保護。<br>2. <b>軟骨魚</b>：骨質為軟骨，具有數條<i class="hl">鰓裂</i>。<br>3. <b>硬骨魚</b>：骨質為硬骨，具有<i class="hl">鰾</i>與<i class="hl">鰓蓋</i>。</td><td>1. <i class="hl">最先登陸</i>，但不是成功登陸的陸生動物。<br>2. <i class="hl">皮膚無法有效防止水分散失</i>。</td><td>皮膚有<i class="hl">角質層</i>，體表有<b>鱗片</b>或<b>骨板</b>，可防止水分散失。</td><td>1. 前肢為翅膀。<br>2. 體表有<i class="hl">羽毛</i>，可協助飛行及保溫。<br>3. <i class="hl">骨骼中空</i>，堅硬而輕。<br>4. 肺延伸出<i class="hl">氣囊</i>。<br>5. 視力佳、眼睛外有<b>瞬膜</b>。</td><td>1. 體表有<i class="hl">毛髮</i>保溫。<br>2. 母體分泌<i class="hl">乳汁</i>哺育幼兒。</td></tr>
<tr><td class="h">種類</td><td>1. 軟骨魚：鯊魚、魟魚。<br>2. 硬骨魚：錦鯉、泥鰍、<b>海馬</b>、河豚、彈塗魚。</td><td>1. 有尾類：山椒魚、蠑螈。<br>2. 無尾類：蟾蜍、蛙。<span class="nt"><b>小提示</b>蛙類有<b>假交配</b>現象。</span></td><td>蛇、蜥蜴、龜、<b>鱷</b>。</td><td>麻雀、大冠鷲、小白鷺、雞、鴨、<b>企鵝</b>、貓頭鷹。</td><td>1. <b>卵生</b>：<i class="hl">鴨嘴獸、針鼴</i>。<br>2. <b>胎生</b>：<br>（1）胎盤不完整（有育兒袋）：袋鼠、無尾熊。<br>（2）胎盤完整：人、猴、鯨、狗。</td></tr>

<p>3. <b>生物適應環境的特徵</b></p>

<div class="blk">

<p>1. <b>定義</b>：在自然環境中，<i class="hl">生物和其生活的環境</i>組成了生態系，包含<i class="hl">生物</i>和<i class="hl">非生物</i>兩部分。</p>
<p>2. <b>生態系的組成</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">生物<br>因子</td><td>1. <i class="hl">生產者</i>（自營）：能行<b>光合作用</b>自行製造養分，如藍綠菌、藻類、綠色植物。<br>2. <i class="hl">消費者</i>（異營）：以其他生物作為養分來源，如原生動物、動物。<br>　（1）<b>初級消費者</b>以生產者為食，故為<b>草食性</b>動物。<br>　（2）<b>次級消費者</b>以初級消費者為食，故為<b>肉食性或雜食性</b>動物。<span class="nt"><b>例</b>草（生產者）→ 羚羊（初級消費者）→ 獅子（次級消費者）。</span><br>3. <i class="hl">分解者</i>：分解生物的遺體和排泄物，並將物質釋放回環境中，如細菌、原生菌類、真菌。</td></tr>
<tr><td class="h">非生物<br>因子<br>（環境）</td><td>1. 生物棲息的環境：石頭、泥土和海水等。<br>2. 影響生物生長、繁殖和分布的因素：<i class="hl">陽光、溫度、溼度、含氧量</i>等。</td></tr>

<p>1. <b>眼蟲</b>（原生動物）具有葉綠體，有光時可行光合作用自行製造養分，也可直接由外界攝取養分，同時扮演<i class="hl">生產者和消費者</i>。</p>
<p>2. <b>清除者</b>：以生物遺體、排泄物為食的<i class="hl">消費者</i>。<span class="nt"><b>例</b>禿鷹、鬣狗、蛆等。</span></p>

<p>3. <b>生態系組成層次</b>：個體 → 族群 → 群集（群落）<span class="nt">加上環境</span> → 生態系 → 生物圈。</p>
<div class="mtabwrap"><table class="ctab">

<tr><td class="h">生物圈</td><td>地球上生物及其生存與活動的範圍，包括海平面垂直上、下各約 10 公里。</td></tr>

<div class="blk">
<h4>三、族群</h4>
<p>1. <b>演替（消長）</b>：生物群集組成隨著環境變動而改變，生態系類型也隨之變化。<span class="nt"><b>例</b>裸露的地表 → 草本植物出現 → 木本植物出現 → 形成森林。</span></p>
<p>2. <b>影響族群大小的主要因素</b>：出生、死亡、遷入、遷出。</p>

<p>3. <b>負荷量</b>：一個環境中所能供養某一族群的<i class="hl">最大個體數量</i>。<br>
（1）環境中若只有一個生物族群，數量達最多且維持穩定時（<i class="hl">動態平衡</i>），此時的數量可稱為環境對該族群的<b>負荷量</b>。<br>
（2）當環境中不只存在單一族群時，則每種族群皆無法達到只有自身族群存在時的負荷量。<span class="nt"><b>例</b>一塊草地上只有羊時，最多可供養 10 隻羊；但若多了牛，則最多只能供養 <b>5 隻羊與 3 隻牛</b>。</span><br>
（3）<i class="hl">環境負荷量有限</i>，所以族群個體數量不會無限增加。</p>

const B9_4=`<div class="blk">
<h4>一、生物多樣性</h4>
<p>1. <b>定義</b>：生活在同一區域中的所有生物，在<i class="hl">個體遺傳物質、種類、棲地</i>等方面所存在的差異。</p>
<p>2. <b>功能</b>：維持生態平衡，提供人類食、衣、住、行、醫藥、育樂各方面資源。</p>
<p>3. <b>層次和重要性</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>層次</th><th>定義與重要性</th></tr>
<tr><td class="h">遺傳<br>多樣性</td><td class="c">基因</td><td>1. <i class="hl">有性生殖</i>及<i class="hl">突變</i>造成同種生物個體間的基因不完全相同。<br>2. 基因的多樣性造成個體間性狀特徵的多樣性，使物種對環境變動時的<b>適應能力提高</b>。<span class="nt"><b>例</b>人類族群有黑種人、白種人及黃種人等。</span></td></tr>
<tr><td class="h">物種<br>多樣性</td><td class="c">物種</td><td>1. 同一環境中，有各種不同的生物生存。<br>2. 生態系中的生物<b>種類越多</b>，<i class="hl">食物網越複雜，生態系就會越穩定</i>。<span class="nt"><b>例</b>雨林生態系的生物種類最多、食物網最複雜，故比草原生態系穩定。</span></td></tr>
<tr><td class="h">生態系<br>多樣性</td><td class="c">棲息環境</td><td>地球上有各式各樣的環境，構成各種不同的生態系。</td></tr>
</table></div>
<p>4. <b>危害因素</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>因素</th><th>說明</th><th>舉例</th></tr>
<tr><td class="h">人口問題</td><td>人口快速增加但資源有限而衍生出各種問題</td><td>糧食缺乏、廢棄物增加、環境破壞</td></tr>
<tr><td class="h">資源<br>過度使用</td><td>野生動、植物的濫捕與採集，缺乏<b>永續經營</b>概念，導致生物瀕臨絕種</td><td>黑鮪、玳瑁、犀牛、臺灣一葉蘭、紅豆杉等面臨生存危機</td></tr>
<tr><td class="h">棲地破壞</td><td>火災、氣候變遷、人類開發使棲地減少或破碎化</td><td>石虎棲地因道路開發而被切割</td></tr>
<tr><td class="h">外來物種</td><td>外來物種與原生種<b>競爭</b>，威脅原生種生存，影響生態平衡</td><td>秋行軍蟲、福壽螺、美國螯蝦、巴西龜、綠鬣蜥、小花蔓澤蘭、布袋蓮</td></tr>
<tr><td class="h">環境汙染</td><td>人類活動造成汙染問題，危害所有生物生存</td><td>空氣汙染、水汙染、固體廢棄物汙染</td></tr>
<tr><td class="h">全球暖化<br>氣候變遷</td><td>地球持續增溫、氣候異常、降雨量不穩定等，影響生態環境，不利生物生存</td><td>海水升溫使珊瑚死亡、熱帶生物遷移到溫帶地區、氣候異常改變生理時鐘</td></tr>
</table></div>
</div>

<div class="blk">
<h4>二、環境汙染</h4>
<p>1. <b>汙染種類</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>種類</th><th>來源</th><th>汙染物</th><th>影響</th></tr>
<tr><td class="h" rowspan="4">空氣<br>汙染</td><td class="c" rowspan="3">車輛、工廠排放</td><td class="c">二氧化碳、甲烷</td><td class="c"><i class="hl">溫室效應加劇</i></td></tr>
<tr><td class="c">二氧化硫</td><td class="c"><i class="hl">酸雨</i> → 植物枯亡、建物毀損</td></tr>
<tr><td class="c">細懸浮微粒</td><td class="c">進入生物體直接危害健康</td></tr>
<tr><td class="c">冷媒、工廠排放</td><td class="c">氟氯碳化物</td><td class="c"><i class="hl">破壞臭氧層</i></td></tr>
<tr><td class="h" rowspan="3">水汙染</td><td class="c">農業廢水</td><td class="c">農藥、殺蟲劑</td><td class="c">生物中毒死亡</td></tr>
<tr><td class="c">畜牧業廢水、生活汙水</td><td class="c"><i class="hl">氮、磷化物</i></td><td class="c"><i class="hl">水域優養化</i></td></tr>
<tr><td class="c">工業廢水</td><td class="c">重金屬（銅、鉛、汞、鎘）</td><td class="c">隨<b>食物鏈</b>進入生物體造成中毒</td></tr>
<tr><td class="h" rowspan="2">固體<br>廢棄物<br>汙染</td><td class="c" rowspan="2">人類活動產生的廢棄物</td><td class="c">一般塑膠垃圾</td><td class="c">阻礙排水、燃燒產生戴奧辛</td></tr>
<tr><td class="c">核廢料</td><td class="c">輻射汙染、增加突變機率</td></tr>
</table></div>
<p>2. <b>生物放大作用</b><br>
（1）<b>定義</b>：難以被生物體代謝排出體外的<i class="hl">有毒物質</i>進入生物體內，會累積在生物體中，隨著<i class="hl">食物鏈</i>傳遞而進入更高層級的消費者體內。<br>
（2）<b>結果</b>：<i class="hl">越高層級消費者體內的有毒物質累積量越多</i>。<br>
（3）<b>影響</b>：危害健康、降低生殖力、導致死亡。</p>

<h4>三、保育</h4>
<p>1. <b>國際保育組織、公約</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>名稱</th><th>內容</th></tr>
<tr><td class="h">拉姆薩公約</td><td>透過國家行動和國際合作，來保護與合理利用<i class="hl">溼地</i></td></tr>
<tr><td class="h">生物多樣性公約</td><td>各國在政治、經濟上互相支援保育工作，並交流學術研究成果</td></tr>
<tr><td class="h">華盛頓公約</td><td>管制國際間<i class="hl">野生動植物的非法貿易</i></td></tr>
<tr><td class="h">京都議定書、巴黎協議、<br>格拉斯哥氣候協議</td><td>控制<b>溫室氣體</b>排放量，限制全球增溫幅度，期望達成<i class="hl">淨零排放</i><span class="nt"><b>註</b>排放的溫室氣體－移除的溫室氣體＝淨零排放</span></td></tr>
<tr><td class="h">蒙特婁議定書</td><td>規範各國逐漸減量，最後禁用<i class="hl">氟氯碳化物</i>，以免繼續損害臭氧層</td></tr>
<tr><td class="h">國際自然保護聯盟</td><td>制定<b>瀕危物種紅皮書</b>，評估現存生物的瀕危等級</td></tr>
</table></div>
<p>2. <b>臺灣保育法令</b>：文化資產保存法、野生動物保育法、森林法、國家公園法、海洋保育法等。</p>
<p>3. <b>臺灣的保護區</b></p>
<div class="mtabwrap"><table class="ctab">

<tr><td class="h">自然保留區</td><td>1. 保存原有自然狀態。<br>2. <i class="hl">保護最嚴格</i>，僅供研究及教育使用。</td></tr>

<h4>一、捉放法</h4>
<p>1. <b>適用對象</b>：<i class="hl">族群較大、移動速度較快、分布較均勻</i>的<b>動物</b>族群。<span class="nt"><b>例</b>水池中的魚、樹林中的鳥。</span></p>
<p>2. <b>步驟</b>：定量捕取 → 作標記 → 放回群體 → 隨機捕捉 → 由標記個體比例計算族群個體總數。</p>
<p>3. <b>公式</b></p>
<div class="box calc"><span class="bt">捉放法</span>
<p style="text-align:center;font-size:1rem"><span class="fr"><i>捉出個體中，有標記的個體數</i><i>捉出個體數</i></span> ＝ <span class="fr"><i>有標記的個體總數</i><i>族群個體總數</i></span></p>
</div>
<p>4. 計算出的族群個體總數是一個<i class="hl">估算值</i>，不是準確值。可藉由<b>增加標記的個體數</b>、<b>增加捉出的個體數</b>和<b>多次實驗求平均值</b>等方式來減少誤差。</p>
</div>

<div class="blk">
<h4>二、樣區採樣法（樣區法）</h4>
<p>1. <b>適用對象</b>：分布範圍大且均勻的<b>植物</b>族群。</p>
<p>2. <b>步驟</b>：先計算出小單位面積中的生物平均數量 → 再推算總面積中的生物個體總數。</p>
<p>3. <b>公式</b></p>
<div class="box calc"><span class="bt">樣區採樣法</span>
<p style="text-align:center;font-size:1rem"><span class="fr"><i>取樣面積中的個體數</i><i>取樣面積</i></span> ＝ <span class="fr"><i>族群個體總數</i><i>總面積</i></span></p>
</div>
</div>`;

function tags(a){
  return (a||[]).map(x=>'<span class="tg'+(/補充/.test(x)?' b':'')+'">'+esc(x)+'</span>').join("");
}
function hotBar(h){
  if(!h) return '<span style="color:var(--line)">\u2014</span>';
  return '<span class="hot5">'+'\u25cf'.repeat(h)+'</span><span style="color:var(--line)">'+'\u25cf'.repeat(5-h)+'</span>';
}
function tally(us){
  const all=us.reduce((n,u)=>n+u.ps.length,0);
  const done=us.reduce((n,u)=>n+u.ps.filter(p=>p.c).length,0);
  return {all:all,done:done,pct:all?Math.round(done/all*100):0};
}
function unitBlock(u){
  let h='<h2 class="sec"><span class="un">'+esc(typeof u.n==="number"?"\u7b2c "+u.n+" \u55ae\u5143":u.n)+'</span> '+esc(u.t)+'</h2>';

  h+='<div class="mtabwrap"><table class="mtab">'+
     '<tr><th>\u91cd\u9ede</th><th>\u540d\u7a31</th><th>\u6703\u8003\u91cd\u8981\u5ea6</th><th>\u5167\u5bb9</th><th>\u9801</th></tr>'+
     u.ps.map(p=>
       '<tr><td class="nm">'+esc(String(p.n))+'</td>'+
       '<td class="tt">'+esc(p.t)+(p.un?' <span class="warn" title="\u76ee\u9304\u7167\u7247\u5b57\u592a\u5c0f\uff0c\u540d\u7a31\u6216\u9801\u78bc\u5c1a\u672a\u78ba\u8a8d">\u26a0</span>':'')+
         (p.tg&&p.tg.length?'<div style="margin-top:4px">'+tags(p.tg)+'</div>':'')+'</td>'+
       '<td class="ct">'+hotBar(p.hot)+'</td>'+
       '<td class="ct">'+(p.c?'<span class="done">\u2713 \u5df2\u6536\u9304</span>':'<span class="todo"><b>\u5f85\u88dc</b></span>')+'</td>'+
       '<td class="pg">'+esc(String(p.p))+'</td></tr>').join("")+
     '</table></div>';
  u.ps.forEach(p=>{
    if(!p.c) return;
    h+='<h3 class="sub"><span class="kp">\u91cd\u9ede '+esc(String(p.n))+'</span>'+esc(p.t)+
       '<span class="pgt">\u8ab2\u672c p.'+esc(String(p.p))+'</span></h3>'+p.c;
  });
  return h;
}

    qk:String(q.q).slice(0,60),
    correct:"\uff08"+"\uff21\uff22\uff23\uff24"[q.ans]+"\uff09"+q.opts[q.ans],
    chosen:"\uff08"+"\uff21\uff22\uff23\uff24"[chosen]+"\uff09"+q.opts[chosen],
    t:new Date().toISOString(),round:quizRound||new Date().toISOString()};
  const a=loadM();a.push(rec);saveM(a);cloudMirror();
}
function logRound(n,score,pct){
  const a=loadL();
  a.push({t:quizRound||new Date().toISOString(),sub:unit,subName:UNITS[unit].name,
    scope:(secSel==="all"?"\u5168\u90e8":secSel)+"\uff5c"+(diffSel==="all"?"\u4e0d\u9650\u96e3\u5ea6":diffSel),
    n:n,score:score,pct:pct});
  saveL(a);cloudMirror();
}

/* ---------- 帳號區塊 ---------- */
function acctMsg(t,k){const m=$("#amsg");if(m){m.textContent=t;m.className="amsg"+(k?(" "+k):"")}}
function acctHTML(){
  if(!CLOUD)return "";
  if(loggedIn())return '<div class="acct"><span>\ud83d\udc64 \u5df2\u767b\u5165\uff1a<b>'+esc(acctName())+
    '</b>\u3000<span style="color:var(--ok)">\u96f2\u7aef\u540c\u6b65\u4e2d</span></span>'+
    '<span class="abtns"><button class="btn ghost sm" onclick="acctSync()">\u21bb \u5f9e\u96f2\u7aef\u540c\u6b65</button>'+
    '<button class="btn ghost sm" onclick="acctLogout()">\u767b\u51fa</button></span></div>';
  return '<div class="acct acct-form"><div class="atitle">\ud83d\udc64 \u767b\u5165\u5f8c\uff0c\u932f\u984c\u8207\u7d00\u9304\u6703\u5b58\u5230\u96f2\u7aef\uff0c\u63db\u88dd\u7f6e\u4e5f\u770b\u5f97\u5230\uff08\u8207\u82f1\u6587\u5b78\u7fd2\u7db2\u540c\u4e00\u7d44\u5e33\u865f\uff09</div>'+
    '<div class="arow"><input id="aem" type="text" placeholder="\u59d3\u540d\uff0f\u5ea7\u865f \u6216 Email" autocomplete="username">'+
    '<input id="apw" type="password" placeholder="\u5bc6\u78bc\uff08\u81f3\u5c11 6 \u78bc\uff09" autocomplete="current-password">'+
    '<button class="btn primary sm" onclick="acctLogin()">\u767b\u5165</button>'+
    '<button class="btn ghost sm" onclick="acctReg()">\u8a3b\u518a</button></div>'+
    '<div id="amsg" class="amsg"></div></div>';
}
window.acctLogin=async function(){
  const e=$("#aem").value.trim(),p=$("#apw").value;
  if(!e||!p)return acctMsg("\u8acb\u8f38\u5165\u5e33\u865f\u8207\u5bc6\u78bc","bad");
  acctMsg("\u767b\u5165\u4e2d\u2026");
  try{await doSignIn(e,p);await syncDown();renderWrong();renderLog();}
  catch(err){acctMsg("\u767b\u5165\u5931\u6557\uff1a"+err.message,"bad");}
};
window.acctReg=async function(){
  const e=$("#aem").value.trim(),p=$("#apw").value;
  if(!e||p.length<6)return acctMsg("\u8acb\u8f38\u5165\u5e33\u865f\uff0c\u5bc6\u78bc\u81f3\u5c11 6 \u78bc","bad");
  acctMsg("\u8a3b\u518a\u4e2d\u2026");
  try{await doSignUp(e,p);
    if(loggedIn()){await syncDown();renderWrong();renderLog();}
    else acctMsg("\u8a3b\u518a\u5b8c\u6210\uff0c\u8acb\u518d\u6309\u4e00\u6b21\u300c\u767b\u5165\u300d","ok");}
  catch(err){acctMsg("\u8a3b\u518a\u5931\u6557\uff1a"+err.message,"bad");}
};
window.acctLogout=function(){saveSession(null);renderWrong();renderLog();};
window.acctSync=async function(){acctMsg("\u540c\u6b65\u4e2d\u2026");await syncDown();renderWrong();renderLog();};

/* ---------- 錯題本 ---------- */
let wSub="all";
window.wSetSub=function(k){wSub=k;renderWrong();};
window.wClear=function(){
  if(!confirm("\u78ba\u5b9a\u6e05\u7a7a\u6240\u6709\u932f\u984c\uff1f"))return;
  saveM([]);if(CLOUD&&loggedIn())cloudSaveApp(APP_M,[]).catch(()=>{});renderWrong();
};
window.wExport=function(){
  const blob=new Blob([JSON.stringify({mistakes:loadM(),log:loadL()},null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="\u81ea\u7136\u79d1\u932f\u984c\u672c.json";a.click();URL.revokeObjectURL(u);
};
window.wImport=function(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=function(){
    const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=function(){try{
      const j=JSON.parse(rd.result);
      saveM(mergeBy(mKey,loadM(),j.mistakes||(Array.isArray(j)?j:[])));
      saveL(mergeBy(lKey,loadL(),j.log||[]));
      cloudMirror();renderWrong();renderLog();
    }catch(e){alert("\u532f\u5165\u5931\u6557\uff1a"+e.message)}};
    rd.readAsText(f);
  };
  i.click();
};
window.wRetest=function(k){
  const qs=(UNITS[k]&&UNITS[k].qs)||[];
  const keys=new Set(loadM().filter(r=>r.sub===k).map(r=>r.qk));
  const pool=qs.filter(q=>keys.has(String(q.q).slice(0,60)));
  if(!pool.length)return alert("\u9019\u4e9b\u932f\u984c\u5c0d\u61c9\u4e0d\u5230\u73fe\u6709\u984c\u76ee\u3002");
  if(unit!==k){unit=k;secSel="all";diffSel="all";tocOpen=false;renderUnits();renderLearn();renderChips();renderList();renderToc();}
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelector('.tab[data-tab="quiz"]').classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
  $("#pane-quiz").classList.add("show");
  qStart(pool);
  window.scrollTo({top:0,behavior:"instant"});
};
function renderWrong(){
  const host=$("#wbox");if(!host)return;
  const all=loadM();
  let h=acctHTML();
  const cnt={};all.forEach(r=>{cnt[r.sub]=(cnt[r.sub]||0)+1;});
  h+='<div class="row" style="justify-content:space-between;align-items:center">'+
     '<span class="stat">\u5171 '+all.length+' \u7b46\u932f\u984c</span>'+
     '<span class="abtns"><button class="btn ghost sm" onclick="wExport()">\u2b07 \u532f\u51fa</button>'+
     '<button class="btn ghost sm" onclick="wImport()">\u2b06 \u532f\u5165</button>'+
     '<button class="btn ghost sm" onclick="wClear()">\ud83d\uddd1 \u6e05\u7a7a</button></span></div>';
  if(!all.length){
    host.innerHTML=h+'<p class="stat" style="margin-top:24px;text-align:center">\u9084\u6c92\u6709\u932f\u984c\u3002\u53bb\u6e2c\u9a57\u5427\uff01\u7b54\u932f\u7684\u6703\u81ea\u52d5\u6536\u9032\u9019\u88e1 \ud83d\udcda</p>';
    return;
  }
  h+='<div class="row">';
  h+='<button class="chip'+(wSub==="all"?" active":"")+'" onclick="wSetSub(\'all\')">\u5168\u90e8\uff08'+all.length+'\uff09</button>';
  Object.keys(UNITS).forEach(k=>{if(cnt[k])h+='<button class="chip'+(wSub===k?" active":"")+'" onclick="wSetSub(\''+k+'\')">'+esc(UNITS[k].icon+" "+UNITS[k].name)+'\uff08'+cnt[k]+'\uff09</button>';});
  h+='</div>';
  const shown=all.filter(r=>wSub==="all"||r.sub===wSub).slice().reverse();
  /* 依科目分組，每組一顆重測鈕 */
  const groups={};shown.forEach(r=>{(groups[r.sub]=groups[r.sub]||[]).push(r);});
  Object.keys(groups).forEach(k=>{
    h+='<div class="wgrp"><span class="wgn">'+esc((UNITS[k]?UNITS[k].icon+" "+UNITS[k].name:k))+'\u3000'+groups[k].length+' \u7b46</span>'+
       '<button class="btn primary sm" onclick="wRetest(\''+k+'\')">\ud83d\udd01 \u91cd\u6e2c\u9019\u4e9b\u932f\u984c</button></div>';
    groups[k].forEach(r=>{
      h+='<div class="wrec"><div class="wtop">'+
         (r.un?'<span class="wu">'+esc((r.vol?r.vol+" ":"")+"\u7b2c "+r.un+" \u55ae\u5143")+'</span>':'')+
         '<span class="topic">'+esc(r.sec||"")+(r.diff?"\u30fb"+esc(r.diff):"")+'</span>'+
         (r.src?'<span class="topic">'+esc(r.src)+'</span>':'')+
         '<span class="wt">'+esc(String(r.t).slice(0,10))+'</span></div>'+
         '<div class="wq">'+rep(r.qk,false)+'\u2026</div>'+
         '<div class="wa"><span class="wbad">\u4f60\u9078 '+rep(r.chosen,false)+'</span>'+
         '<span class="wok">\u6b63\u89e3 '+rep(r.correct,false)+'</span></div></div>';
    });
  });
  host.innerHTML=h;
}

/* ---------- 測驗紀錄 ---------- */
window.lClear=function(){
  if(!confirm("\u78ba\u5b9a\u6e05\u7a7a\u6240\u6709\u6e2c\u9a57\u7d00\u9304\uff1f"))return;
  saveL([]);if(CLOUD&&loggedIn())cloudSaveApp(APP_L,[]).catch(()=>{});renderLog();
};
function renderLog(){
  const host=$("#lbox");if(!host)return;
  const all=loadL().slice().sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  let h=acctHTML();
  if(!all.length){
    host.innerHTML=h+'<p class="stat" style="margin-top:24px;text-align:center">\u9084\u6c92\u6709\u6e2c\u9a57\u7d00\u9304\u3002\u6bcf\u505a\u5b8c\u4e00\u6b21\u6e2c\u9a57\u5c31\u6703\u8a18\u4e00\u7b46 \ud83d\udcc8</p>';
    return;
  }
  const tot=all.reduce((n,r)=>n+r.n,0), got=all.reduce((n,r)=>n+r.score,0);
  const avg=tot?Math.round(got/tot*100):0;
  const d7=Date.now()-7*864e5, recent=all.filter(r=>new Date(r.t).getTime()>=d7).length;
  h+='<div class="lstat"><div><b>'+all.length+'</b><span>\u6e2c\u9a57\u6b21\u6578</span></div>'+
     '<div><b>'+tot+'</b><span>\u4f5c\u7b54\u984c\u6578</span></div>'+
     '<div><b>'+avg+'%</b><span>\u5e73\u5747\u7b54\u5c0d\u7387</span></div>'+
     '<div><b>'+recent+'</b><span>\u8fd1 7 \u5929</span></div></div>';
  h+='<div class="row" style="justify-content:flex-end"><button class="btn ghost sm" onclick="lClear()">\ud83d\uddd1 \u6e05\u7a7a\u7d00\u9304</button></div>';
  h+='<div class="mtabwrap"><table class="ctab"><tr><th>\u6642\u9593</th><th>\u79d1\u76ee</th><th>\u7bc4\u570d</th><th>\u5f97\u5206</th><th>\u7b54\u5c0d\u7387</th></tr>';
  all.slice(0,200).forEach(r=>{
    const t=new Date(r.t), ts=(t.getMonth()+1)+"/"+t.getDate()+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    const col=r.pct>=90?"var(--ok)":r.pct>=60?"var(--brand)":"var(--bad)";
    h+='<tr><td class="c">'+esc(ts)+'</td><td class="c">'+esc((UNITS[r.sub]?UNITS[r.sub].icon+" ":"")+r.subName)+'</td>'+
       '<td>'+esc(r.scope||"")+'</td><td class="c">'+r.score+" / "+r.n+'</td>'+
       '<td class="c" style="color:'+col+';font-weight:900">'+r.pct+'%</td></tr>';
  });
  h+='</table></div>';
  if(all.length>200)h+='<p class="stat">\uff08\u50c5\u986f\u793a\u6700\u8fd1 200 \u7b46\uff09</p>';
  host.innerHTML=h;
}

loadSession();
if(CLOUD&&loggedIn())syncDown().then(()=>{renderWrong();renderLog();});
renderWrong();renderLog();

/* ===== 全站搜尋 ===== */
(function(){
  const box=$("#sq"), go=$("#sgo"), clr=$("#sx"), out=$("#sres");
  if(!box) return;
  let IDX=null;

  function build(){
    const idx=[];
    Object.keys(UNITS).forEach(u=>{
      const pane=$("#learn-"+u); if(!pane) return;
      let cur=null;
      [...pane.children].forEach(el=>{
        if(el.tagName==="H2"&&el.classList.contains("sec")){
          cur={unit:u,unitName:UNITS[u].name,sec:el.textContent.trim(),el:el,text:""};
          idx.push(cur);
        } else if(cur){
          cur.text+=" "+el.textContent.replace(/\s+/g," ");
        }
      });
    });
    return idx;
  }

  /* 題庫原文含 <b>/<i class="hl"> 與 ⟬分子|分母⟭ 標記，搜尋結果是純文字，先還原成好讀的樣子 */
  const plain=s=>String(s)
    .replace(/⟦[^⟧]*⟧/g,"〔圖〕")
    .replace(/⟬([^|⟭]*)[|]([^⟭]*)⟭/g,"$1/$2")
    .replace(/<br>/g,"　")
    .replace(/<[^>]+>/g,"");
  const norm=s=>String(s).toLowerCase();
  const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function mark(s,q){
    const i=norm(s).indexOf(norm(q));
    if(i<0) return escH(s);
    return escH(s.slice(0,i))+"<mark>"+escH(s.slice(i,i+q.length))+"</mark>"+escH(s.slice(i+q.length));
  }

  function snip(text,q,pad){
    const i=norm(text).indexOf(norm(q));
    if(i<0) return "";
    const a=Math.max(0,i-pad), b=Math.min(text.length,i+q.length+pad);
    return (a>0?"…":"")+text.slice(a,b).trim()+(b<text.length?"…":"");
  }

  function jump(unitKey,secText){
    if(unit!==unitKey){unit=unitKey;secSel="all";diffSel="all";qQuit();renderUnits();renderLearn();renderChips();renderList();}
    tocOpen=false;renderUnits();renderToc();
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    const lt=document.querySelector('.tab[data-tab="learn"]'); if(lt)lt.classList.add("active");
    document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
    $("#pane-learn").classList.add("show");
    const h=[...document.querySelectorAll("#learn-"+unitKey+" h2.sec")].find(x=>x.textContent.trim()===secText);
    if(h){h.scrollIntoView({block:"start",behavior:"smooth"});h.classList.remove("secflash");void h.offsetWidth;h.classList.add("secflash");}
  }

  function run(){
    const q=box.value.trim();
    if(!q){out.hidden=true;clr.hidden=true;return;}
    if(!IDX) IDX=build();
    clr.hidden=false; out.hidden=false;

    const hits=IDX.filter(s=>norm(s.sec).includes(norm(q))||norm(s.text).includes(norm(q)));

    const qhits=[];
    Object.keys(UNITS).forEach(u=>{
      (UNITS[u].qs||[]).forEach(o=>{
        const blob=[o.q,(o.opts||[]).join(" "),o.exp||""].join(" ");
        if(norm(blob).includes(norm(q))) qhits.push({u:u,uName:UNITS[u].name,o:o});
      });
    });

    let html='<div class="shead">「'+escH(q)+'」找到 學習重點 '+hits.length+' 節、題庫 '+qhits.length+' 題</div>';

    if(hits.length){
      let lastU="";
      hits.slice(0,40).forEach(s=>{
        if(s.unitName!==lastU){html+='<div class="sgrp">📚 '+escH(s.unitName)+'</div>';lastU=s.unitName;}
        const sp=snip(s.text,q,38)||snip(s.sec,q,38)||s.text.slice(0,80).trim()+"…";
        html+='<button class="sitem" data-u="'+s.unit+'" data-s="'+escH(s.sec)+'">'+
              '<span class="swhere">'+escH(s.sec)+'</span>'+mark(sp,q)+'</button>';
      });
      if(hits.length>40) html+='<div class="snone">（還有 '+(hits.length-40)+' 節未列出，請輸入更精確的關鍵字）</div>';
    }

    if(qhits.length){
      html+='<div class="sgrp">📝 題庫</div>';
      qhits.slice(0,15).forEach(h=>{
        const o=h.o, ans=(o.opts||[])[o.ans]||"";
        html+='<div class="qcard">'+mark(plain(o.q),q)+
              '<br><span class="qa">答：'+escH(plain(ans).replace(/。$/,""))+'</span>'+
              (o.exp?'<span class="qe">'+mark(plain(o.exp),q)+'</span>':'')+
              '<span class="qe">—— '+escH(h.uName)+(o.src?'｜'+escH(o.src):'')+'</span></div>';
      });
      if(qhits.length>15) html+='<div class="snone">（還有 '+(qhits.length-15)+' 題未列出）</div>';
    }

    if(!hits.length&&!qhits.length) html+='<div class="snone">找不到「'+escH(q)+'」。試試較短的關鍵字，例如「比熱」而不是「比熱要怎麼算」。</div>';

    out.innerHTML=html;
    out.querySelectorAll(".sitem").forEach(b=>b.onclick=()=>jump(b.dataset.u,b.dataset.s));
  }

  go.onclick=run;
  clr.onclick=()=>{box.value="";out.hidden=true;clr.hidden=true;box.focus();};
  box.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();run();}
    if(e.key==="Escape"){box.value="";out.hidden=true;clr.hidden=true;}
  });
})();
</script>
