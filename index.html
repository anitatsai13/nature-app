{"q":"已知鈉在氧氣中燃燒會生成氧化鈉，反應式為「Na＋O₂→Na₂O（未平衡）」，今取 34.5 克的鈉在足量的氧氣中完全燃燒，則會生成多少克的氧化鈉？（原子量：O＝16，Na＝23）","opts":["34.5","46.5","58.5","62.5"],"ans":1,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"先平衡反應式：<b>4Na＋O₂→2Na₂O</b>。鈉的莫耳數＝⟬34.5|23⟭＝1.5 莫耳，由係數比可知鈉與氧化鈉的莫耳數比為 <b>2：1</b>，故可生成 1.5×⟬1|2⟭＝0.75 莫耳的氧化鈉；Na₂O 的分子量＝23×2＋16＝62，則質量＝0.75×62＝<b>46.5 克</b>。"},
{"q":"鎂在空氣中燃燒的反應式為「2Mg＋O₂→2MgO」，若將 18 克的鎂與 16 克的氧氣混合後點火燃燒，則最多會產生多少克的氧化鎂？（原子量：O＝16，Mg＝24）","opts":["30","32","36","40"],"ans":0,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"鎂的莫耳數＝⟬18|24⟭＝0.75 莫耳，氧氣的莫耳數＝⟬16|32⟭＝0.5 莫耳。由係數比可知鎂與氧的莫耳數比為 2：1，若 0.75 莫耳鎂完全反應只需 0.375 莫耳氧氣，故<b>鎂為限量試劑</b>。鎂與氧化鎂的莫耳數比為 1：1，MgO 分子量＝40，則氧化鎂的質量＝0.75×40＝<b>30 克</b>。"},
{"q":"小佩在家烘焙麵包，他加入化合物 X，使麵團在烘烤過程中膨脹且變得鬆軟，反應式為：2X → Na₂CO₃ ＋ CO₂ ＋ H₂O，則 X 的分子量應為何？","opts":["21","42","84","168"],"ans":2,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"反應前、後原子的<b>種類及數目不變</b>：右側共有 Na 2、C 2、O 6、H 2，除以 2 即為 1 個 X，故 X 為 <b>NaHCO₃</b>（小蘇打），分子量＝23＋1＋12＋3×16＝<b>84</b>。"},
{"q":"關於反應「Mg ＋ 2HCl → H₂ ＋ MgCl₂」的敘述，下列何者<b>錯誤</b>？","opts":["1 個 Mg 原子可與 2 個 HCl 分子反應","1 克 Mg 可與 2 克 HCl 分子反應","1 莫耳 Mg 原子可與 2 莫耳 HCl 分子反應","6×10²³ 個 Mg 原子可與 2×6×10²³ 個 HCl 分子反應"],"ans":1,"sec":"化學反應的微觀世界","diff":"易","src":"重點演練","exp":"反應式的<b>係數比＝個數比＝莫耳數比</b>，但<i class=\"hl\">不等於質量比</i>，故(B)錯誤。"},
{"q":"已知甲烷和甲醇與足量的氧氣反應，生成物皆為二氧化碳和水，反應式如下：<br>　反應一　CH₄＋2O₂→CO₂＋2H₂O<br>　反應二　2CH₃OH＋3O₂→2CO₂＋4H₂O<br>若分別進行此兩種反應，且完全反應後所得到的生成物總質量相同，則關於反應物的比較，下列敘述何者正確？（原子量：H＝1、C＝12、O＝16）","opts":["甲烷消耗的質量較甲醇少","兩種反應氧氣消耗的質量相同","甲烷和甲醇兩者消耗的質量相同","反應一的氧氣消耗質量較反應二少"],"ans":0,"sec":"化學反應的微觀世界","diff":"難","src":"會考112大題考區","exp":"解題關鍵：思考「生成物總質量相同」的背後含意。每 1 莫耳 CH₄ 與每 1 莫耳 CH₃OH 產生的生成物都是 1 CO₂＋2 H₂O，故生成物總質量相同 → 兩者<b>消耗的莫耳數相同</b>。分子量 CH₄＝16、CH₃OH＝32，故消耗<b>質量比為 16：32＝1：2</b>，甲烷消耗的質量較少，(A)正確。氧氣方面，每莫耳燃料耗氧為 2 mol 對 1.5 mol，比為 4：3，故反應一耗氧較多，(B)(D)皆錯。"},
{"q":"鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一，其步驟如下：<br>　步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。Mg²⁺ ＋ 2NaOH → 2Na⁺ ＋ Mg(OH)₂<br>　步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。Mg(OH)₂ ＋ 2HCl → MgCl₂ ＋ 2H₂O<br>　步驟三：電解熔融狀態的氯化鎂即可得到鎂。MgCl₂ —〔電解〕→ Mg ＋ Cl₂<br>依據上述方法，在某次製鎂的反應後，共產生鎂 960 公克，則該次製鎂反應中，理論上會消耗重量百分濃度為 80% 的鹽酸共多少公克？（鎂的原子量為 24，氯化氫的分子量為 36.5）","opts":["1825","2400","2920","3650"],"ans":3,"sec":"化學反應的微觀世界","diff":"難","src":"會考109（通過率 29%）","exp":"解題關鍵：計算出鎂的莫耳數後，再由係數比推得所需 HCl 的莫耳數，最後計算出消耗的鹽酸質量。由步驟二、三可知，產生 1 莫耳 Mg 需要 1 莫耳 MgCl₂，而產生 1 莫耳 MgCl₂ 需消耗 <b>2 莫耳</b> HCl。960 g Mg 的莫耳數＝⟬960|24⟭＝40 莫耳，故需消耗 80 莫耳 HCl，質量＝80×36.5＝2920 g。鹽酸（溶液）質量＝⟬溶質質量|重量百分濃度⟭＝⟬2920|80%⟭＝<b>3650 g</b>。"},
{"q":"目前臺灣的中藥材大部分都是進口，這些進口的中藥材在加工過程中常會使用二氧化硫，達到漂白的功效，也因此常有二氧化硫殘留量超標的情形。因二氧化硫可溶於水形成 X 物質，食藥署建議在烹煮中藥材前應先以清水沖洗，以保障食用安全。上文中利用二氧化硫漂白時會進行何種反應？且 X 物質最可能為何種物質？","opts":["氧化還原反應，酸性物質","氧化還原反應，鹼性物質","酸鹼中和反應，酸性物質","酸鹼中和反應，鹼性物質"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"二氧化硫是利用<b>氧化還原反應</b>進行漂白；SO₂ 溶於水會形成<b>亞硫酸（H₂SO₃）</b>，屬<b>酸性</b>物質（非金屬氧化物的水溶液呈酸性），故選(A)。"},
{"q":"關於反應「2Al ＋ 3CuO → Al₂O₃ ＋ 3Cu」的敘述，下列何者正確？","opts":["Al 被氧化，進行氧化反應","CuO 被氧化，進行還原反應","Al 對氧的活性比 Cu 小","若進行燃燒試驗，則 Cu 較 Al 容易氧化"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練","exp":"Al 得到氧（Al→Al₂O₃），進行<b>氧化</b>反應，(A)正確。(B)CuO <b>失去氧</b>，進行還原反應。(C)(D)Al 能把 Cu 從 CuO 中還原出來，表示 <b>Al 對氧的活性較大</b>，進行燃燒試驗時也會較容易氧化。"},
{"q":"將 X、Y、Z、W 四種金屬與 XO、YO、ZO、WO 四種氧化物分別進行反應，「○」代表有反應、「×」代表無反應，結果如下：<br>　XO ＋ Y → ×　　XO ＋ Z → ○<br>　ZO ＋ Y → <b>甲</b>　　WO ＋ X → <b>乙</b>　　WO ＋ Z → ×<br>則甲、乙之符號應分別為何？","opts":["甲為○，乙為×","甲為×，乙為○","甲、乙均為○","甲、乙均為×"],"ans":3,"sec":"氧化與還原反應","diff":"難","src":"重點演練","exp":"由「XO＋Z」有反應可知活性 <b>Z＞X</b>；由「Z＋WO」無反應可知活性 <b>W＞Z</b>；由「Y＋XO」無反應可知活性 <b>X＞Y</b>。綜合上述，活性大小為 <i class=\"hl\">W＞Z＞X＞Y</i>。甲（ZO＋Y）因 Y 活性最小，無法搶走 Z 的氧 → ×；乙（WO＋X）因 W 活性大於 X → ×，故選(D)。"},
{"q":"由於食品中有一些成分容易被氧化，而產生變色或變質，故常添加抗氧化劑。抗氧化劑分為天然抗氧化劑與化學抗氧化劑，天然抗氧化劑如維生素 E 等，化學抗氧化劑較天然抗氧化劑穩定，如丁基羥基甲氧苯（BHA）等，經常食用化學抗氧化劑可能會有罹癌風險。則關於 BHA 在食品中發揮作用時的敘述，下列何者正確？","opts":["BHA 失去氧，進行氧化反應","BHA 失去氧，進行還原反應","BHA 得到氧，進行氧化反應","BHA 得到氧，進行還原反應"],"ans":2,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"抗氧化劑本身具有<b>易與氧作用</b>的特性，會<b>代替食品被氧化而得到氧</b>，進行<b>氧化反應</b>，故選(C)。"},
{"q":"有些物質可使棕色的碘液進行還原反應，反應後溶液呈無色，例如許多水果所含有的維生素 C。以維生素 C 和綠茶茶水分別進行實驗：<br>　甲試管：維生素 C 溶液　乙試管：水　丙試管：綠茶茶水<br>三支試管都滴入數滴碘液並搖晃後——<br>　甲：棕色消失　乙：液體呈棕色　丙：棕色消失<br>僅依據本實驗結果，下列推論何者最合理？","opts":["綠茶茶水中必定含有維生素 C","綠茶茶水中必定含有能被氧化的物質","綠茶茶水進行氧化反應，維生素 C 進行還原反應","因實驗結果溶液顏色改變，故綠茶茶水可做為酸鹼指示劑"],"ans":1,"sec":"氧化與還原反應","diff":"中","src":"會考114（通過率 57%）","exp":"解題關鍵：<b>碘液進行還原反應時，必有另一物質進行氧化反應</b>。(A)不一定，可能是含有其他可使碘液進行還原反應的物質。(C)兩者都是<b>進行氧化反應</b>。(D)酸鹼指示劑須在不同酸鹼性的溶液中變色，本實驗並未改變酸鹼性。故選(B)。"},
{"q":"某篇關於氫應用的報導說明如下：「金屬多以氧化物的形式封藏於岩石礦物中，可利用氫和氧易起反應的特性，<b>將氧從礦物中移除，留下可用的純金屬和水</b>。」關於上述畫線處提及的反應，下列說明何者最合理？","opts":["因為氫被氧化，所以是氧化還原反應","因為礦物被氧化，所以是氧化還原反應","因為金屬氧化物溶於水呈酸性，所以是酸鹼中和反應","因為金屬氧化物溶於水呈鹼性，所以是酸鹼中和反應"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"會考113（通過率 59%）","exp":"解題關鍵：判斷何者得到氧，何者失去氧。氫將氧從礦物中移除，形成純金屬與水，則<b>氫得到氧被氧化</b>、<b>礦物失去氧被還原</b>，屬於氧化還原反應，故選(A)。"},
{"q":"小凱在家中廚房找到下列物品，則這些物品中，何者<b>不含</b>有電解質？","opts":["手工釀醋","天然海鹽","萬用小蘇打粉","手工砂糖"],"ans":3,"sec":"認識電解質","diff":"易","src":"重點演練・素養題","exp":"(A)食醋中的醋酸為<b>酸</b>類，屬於電解質。(B)食鹽為<b>鹽</b>類，屬於電解質。(C)小蘇打粉為<b>鹽</b>類，屬於電解質。(D)砂糖（蔗糖）在水中<i class=\"hl\">不會解離</i>，水溶液無法導電，不屬於電解質。"},
{"q":"將氫氧化鈣溶於水中，其解離反應式為「Ca(OH)₂→Ca²⁺＋2OH⁻」，則關於氫氧化鈣水溶液的敘述，下列何者正確？","opts":["導電時，Ca²⁺ 移向負極，OH⁻ 移向正極","導電時，兩極不一定會發生化學反應","Ca²⁺ 的總個數與 OH⁻ 的總個數相等","Ca²⁺ 的總帶電量為 OH⁻ 總帶電量的兩倍"],"ans":0,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"通電後<b>陽離子往負極</b>、<b>陰離子往正極</b>移動，(A)正確。(B)導電時兩極<b>必會</b>發生化學反應。(C)(D)水溶液必為電中性，Ca²⁺ 的總帶電量<b>等於</b> OH⁻ 的總帶電量，但兩者的<i class=\"hl\">個數不相等</i>（OH⁻ 個數是 Ca²⁺ 的兩倍）。"},
{"q":"若質量數 40、原子序 20 的鈣原子失去兩個電子形成鈣離子，則關於鈣離子的敘述，下列何者正確？","opts":["質子數為 18","電子數為 18","中子數為 22","質量數為 38"],"ans":1,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"該鈣原子的質子數、電子數均為 20，中子數＝質量數－質子數＝40－20＝20。失去兩個電子後：質子數仍為 <b>20</b>、中子數仍為 <b>20</b>、質量數仍為 <b>40</b>（電子質量極小不計），只有電子數變成 20－2＝<b>18</b>，故選(B)。"},
{"q":"下列化合物各取 1 莫耳並完全溶於等量的水中，則哪一水溶液中所含離子總莫耳數最多？","opts":["NaCl","HCl","CaCl₂","NH₄OH"],"ans":2,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"解離式分別為：(A)NaCl→Na⁺＋Cl⁻（2 個）；(B)HCl→H⁺＋Cl⁻（2 個）；(C)CaCl₂→Ca²⁺＋2Cl⁻（<b>3 個</b>）；(D)NH₄OH→NH₄⁺＋OH⁻（2 個）。故選(C)。"},
{"q":"西元 2011 年 3 月 11 日，日本外海發生大地震，造成核電廠機組損壞爆炸，釋出放射性物質「碘-129」、「碘-131」而造成恐慌，相關單位提醒當地民眾可適時的服用「碘化鉀」來防止甲狀腺大量吸收這些放射性物質。則下列關於碘-129、碘-131 以及碘化鉀的敘述，何者<b>錯誤</b>？","opts":["碘-129、碘-131 的質量數不同","碘-129、碘-131 為元素，而碘化鉀為化合物","碘-129、碘-131 與碘化鉀溶於水後，水溶液均為電中性","碘化鉀溶於水所解離出來的碘離子與碘-129、碘-131 的化學性質相同"],"ans":3,"sec":"認識電解質","diff":"中","src":"重點演練・素養題","exp":"(D)錯誤。<b>碘離子（I⁻）與碘原子（I）的電子數不同，化學性質也不同</b>。原子與其離子只有質子數、中子數相同，電子數與化學性質皆不同。"},
{"q":"已知 Ca 和 Cl 的原子序分別為 20、17，Ca²⁺ 和 Cl⁻ 的質子數和電子數如下：<br>　Ca²⁺：質子數 <b>w</b>、電子數 <b>y</b><br>　Cl⁻：質子數 <b>x</b>、電子數 <b>z</b><br>則 w、x、y、z 的數值大小比較，下列何者正確？","opts":["w＞z","x＞y","x＞z","y＞w"],"ans":0,"sec":"認識電解質","diff":"中","src":"會考114（通過率 66%）","exp":"解題關鍵：<b>電中性原子的原子序＝質子數＝電子數</b>。Ca²⁺ 表示失去 2 個電子，故 w＝20、y＝20－2＝18；Cl⁻ 表示得到 1 個電子，故 x＝17、z＝17＋1＝18。則 w(20)＞z(18)，故選(A)。"},
{"q":"有一個帶電的離子含有 X、Y、Z 三種粒子（質子、電子、中子，未依照順序排列），且 X、Y、Z 的粒子數目依序為 Nx、Ny、Nz。已知 X 粒子的質量最小，關於此離子的說明，下列何者最合理？","opts":["若為陽離子，且 Ny＞Nx＝Nz，則 Z 為質子","若為陽離子，且 Ny＞Nx＝Nz，則 Z 為電子","若為陰離子，且 Nx＝Ny＞Nz，則 Z 為質子","若為陰離子，且 Nx＞Ny＝Nz，則 Z 為電子"],"ans":2,"sec":"認識電解質","diff":"難","src":"會考111（通過率 45%）","exp":"解題關鍵：<b>陽離子則質子數＞電子數，陰離子則質子數＜電子數</b>。三種粒子中<i class=\"hl\">電子的質量最小</i>，故 X 為電子。(A)(B)若為陽離子，則質子數＞電子數（Nx），但選項中 Ny＞Nx，故 Y 才是質子。(C)若為陰離子，電子數（Nx）＞質子數，Nx＝Ny＞Nz，則 Z 可為質子，成立。(D)若為陰離子，電子數須大於質子數，但 Nx＞Ny＝Nz，Y 或 Z 為質子而非電子。故選(C)。"},
{"q":"家中電熱水瓶使用一段時間後，內壁常會出現白色的「水垢」，已知水垢的主要成分為碳酸鎂與碳酸鈣，則使用下列何種物質對去除水垢最有幫助？","opts":["熱水","燒鹼","檸檬酸","石灰"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練・素養題","exp":"<b>酸性物質</b>的水溶液可與碳酸鹽類反應，使其溶解。(B)燒鹼（氫氧化鈉）與(D)石灰（氧化鈣）均為<b>鹼性</b>物質，故選(C)檸檬酸。"},
{"q":"下列哪一項為酸與鹼的<b>共同</b>性質？","opts":["兩者皆可溶解油脂","兩者的水溶液皆可導電","兩者的水溶液皆可使酚酞呈紅色","兩者皆可使活性大的金屬產生氫氣"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練","exp":"酸類與鹼類<b>都是電解質</b>，水溶液皆可導電，(B)正確。(A)<b>鹼</b>才可溶解油脂。(C)酚酞遇酸性溶液呈<b>無色</b>、遇鹼性溶液才呈紅色。(D)<b>酸</b>才可使活性大的金屬產生氫氣。"},
{"q":"關於酸性物質特性的敘述，下列何者<b>錯誤</b>？","opts":["濃硫酸具有強脫水性，可使碳水化合物失去水分","醋酸又稱為蟻酸，具有刺激性氣味","鹽酸應為無色，但是工業用的鹽酸含有雜質，故呈淡黃色","稀釋濃硫酸時，應將濃硫酸緩慢加入大量水中，並不斷攪拌"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練","exp":"(B)錯誤。醋酸又稱為<i class=\"hl\">乙酸</i>；<b>蟻酸</b>則是<b>甲酸</b>，兩者不同。"},
{"q":"牡蠣殼的主要成分為碳酸鈣，牡蠣殼經過高溫煅燒後的煅燒牡蠣殼粉具有抗菌性，可抑制大腸桿菌、沙門氏菌與金黃色葡萄球菌等。若阿達想要研究煅燒牡蠣殼粉的抗菌性與 pH 值之相關性，而非與成分的相關性，則他可研究下列何種物質的抗菌性？","opts":["鹽酸","碳酸","食鹽","燒鹼"],"ans":3,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練・素養題","exp":"碳酸鈣高溫煅燒會分解成<b>氧化鈣</b>（CaCO₃ →〔△〕→ CaO＋CO₂），氧化鈣為<b>鹼性</b>物質。若要研究抗菌性與 pH 值的相關性（而非成分），應選擇成分不同但同為<b>鹼性</b>的物質，故選(D)燒鹼（氫氧化鈉）。"},
{"q":"閱讀下文後回答：「為了減少溫室氣體，地質學家將二氧化碳變成岩石的一部分——將發電廠產生的二氧化碳灌入大量的水中，以管線將這些氣泡水輸送到數公里遠的區域，接著透過高壓將氣泡水注入地下一千公尺深的岩層中，這些氣泡水會和鈣、鎂等離子反應而『固化』，並填充岩層空隙。」上述二氧化碳變成岩石一部分的過程，是利用下列二氧化碳（水溶液）的何種性質？","opts":["密度大於空氣","溶於水呈酸性","可與鈣離子反應產生難溶於水的碳酸鹽","可與鈉離子反應產生易溶於水的碳酸鹽"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考114（通過率 60%）","exp":"解題關鍵：藉由二氧化碳的檢驗方式判斷。由題目可知，二氧化碳水溶液會與<b>鈣、鎂離子</b>反應，形成<i class=\"hl\">難溶於水</i>的碳酸鈣而「固化」，與密度、酸鹼性無關，故選(C)。"},
{"q":"虎門銷煙為清朝銷毀鴉片的歷史事件。把海水引入浸泡池浸泡鴉片，之後再加入石灰等物質，石灰遇水會改變水溫，此改變也利於將鴉片溶於水中，等退潮時再排入海中。關於上述銷毀鴉片的說明，下列何者最合理？","opts":["石灰溶於水為放熱反應，而高溫使鴉片更易溶於水中","石灰溶於水為吸熱反應，而高溫使鴉片更易溶於水中","鴉片浸泡海水後會使水溫上升，使其與石灰反應速率加快","鴉片浸泡海水後會使水溫下降，使其與石灰反應速率加快"],"ans":0,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考113（通過率 74%）","exp":"解題關鍵：思考石灰遇水會如何改變水溫。石灰（CaO）溶於水會<i class=\"hl\">放熱</i>，使水溫升高；由題目「此改變也利於將鴉片溶於水中」可推論高溫會使鴉片更易溶於水中，故選(A)。"},
{"q":"人體會自動將血液的 pH 值調節在 7.35 到 7.45 之間，若血液的 pH 值低於 7.35，即為「酸中毒」；若血液的 pH 值高於 7.45，則為「鹼中毒」。試問下列敘述何者正確？","opts":["人體酸中毒時的血液必呈酸性，且 [H⁺]＞[OH⁻]","人體酸中毒時的血液必呈酸性，且 [H⁺]＜[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＞[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＜[OH⁻]"],"ans":3,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練・素養題","exp":"酸中毒只要 pH 低於 7.35 即成立，例如 pH＝7.2 仍<b>大於 7</b>，血液<i class=\"hl\">可能仍呈鹼性</i>，故(A)(B)的「必呈酸性」不成立。鹼中毒時 pH 高於 7.45，<b>必定大於 7</b>，故血液必呈鹼性，且鹼性表示 [H⁺]＜[OH⁻]，故選(D)。"},
{"q":"小黃計畫假日要去泡溫泉，正在考慮下列四個地點。若小黃的皮膚較為敏感，不宜浸泡過酸或過鹼的溫泉，否則皮膚容易出現乾、癢等症狀，則小黃應選擇哪一地點的溫泉最為適當？","opts":["新北投，溫泉 pH 值 1.2","陽明山，溫泉 pH 值 2.3","礁溪，溫泉 pH 值 7.5","關子嶺，溫泉 pH 值 10.2"],"ans":2,"sec":"水溶液的酸鹼性","diff":"易","src":"重點演練・素養題","exp":"pH 值小於 7 為酸性，且數值越小酸性越強；pH 值大於 7 為鹼性，且數值越大鹼性越強。<b>pH 7.5 最接近中性 7</b>，故選(C)礁溪。"},
{"q":"將 1M、50 mL 的 HCl 水溶液加水稀釋到 100 mL，則關於稀釋過程的敘述，下列何者正確？","opts":["莫耳濃度變大","[H⁺] 變大","pH 值變大","重量百分率濃度變大"],"ans":2,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練","exp":"加水稀釋後，溶質的莫耳數與質量<b>不變</b>，但溶液的體積與質量<b>變大</b>，故(A)莫耳濃度與(D)重量百分率濃度均<b>變小</b>。(B)酸性減弱，[H⁺] <b>變小</b>。[H⁺] 變小則 pH 值<i class=\"hl\">變大</i>（趨近 7），故選(C)。"},
{"q":"牙齒酸蝕是指酸性物質會使牙齒外層的琺瑯質軟化，而容易損耗。<br><b>實驗一</b>：選用形狀大小很相近的豬牙齒，分別浸泡不同濃度的鹽酸數日，結果如下——<br>　鹽酸 X：pH 2.4，重量減少百分比 1 日後 6.82%、2 日後 7.87%<br>　鹽酸 Y：pH 3.7，重量減少百分比 1 日後 4.15%、2 日後 4.92%<br>　鹽酸 Z：pH 3.1，重量減少百分比 1 日後 5.95%、2 日後 6.76%<br><b>實驗二</b>：取形狀大小很相近的豬牙齒，分別浸泡在 pH 值介於 2～4 之間的甲、乙、丙三杯飲料中數日，發現牙齒重量減少百分比為丙＜甲＜乙。<br>若實驗二只考慮 pH 值的影響，則依實驗一的結果，關於甲、乙、丙三杯飲料的推測，下列何者最合理？","opts":["乙杯最酸，其 pH 值最大","乙杯最酸，其 pH 值最小","丙杯最酸，其 pH 值最大","丙杯最酸，其 pH 值最小"],"ans":1,"sec":"水溶液的酸鹼性","diff":"中","src":"會考113（通過率 70%）","exp":"解題關鍵：先由表中數據推論 pH 值與牙齒損耗的關係。由實驗一可見 <b>pH 值越小（酸性越強），牙齒重量減少越多</b>（X 的 pH 2.4 減少最多）。實驗二中重量減少百分比為丙＜甲＜乙，表示<b>乙杯使牙齒損耗最大 → 乙杯最酸 → pH 值最小</b>，故選(B)。"},
{"q":"閱讀下文後回答：「新聞報導某處養殖的白蝦大量暴斃，調查後初步推測是高溫與暴雨，使養殖池的溶氧量和 pH 值劇烈變化，導致水質改變所造成的。專家建議為避免白蝦大量死亡，應注意水溫變化，可先用水車調整水中的溶氧量，並監控水中的 pH 值，投放熟石灰（氫氧化鈣）調整至合適的 pH 值。」關於上述專家建議的方法，下列說明何者最合理？（溶氧量：溶解於水中的氧氣量）","opts":["使水中的溶氧量增加，pH 值增加","使水中的溶氧量增加，pH 值減少","使水中的溶氧量減少，pH 值增加","使水中的溶氧量減少，pH 值減少"],"ans":0,"sec":"水溶液的酸鹼性","diff":"中","src":"會考111（通過率 51%）","exp":"解題關鍵：思考高溫對水中溶氧量的影響，以及熟石灰水溶液的酸鹼性。<b>高溫會使水中的溶氧量減少</b>，故用水車的目的是使溶氧量<i class=\"hl\">增加</i>；熟石灰（氫氧化鈣）為<b>鹼性</b>物質，投放後會使水的 pH 值<i class=\"hl\">增加</i>，故選(A)。"},
{"q":"阿珍因胃酸分泌過多而服用胃藥（主要成分為碳酸鈉），則服用此胃藥後的敘述，下列何者<b>錯誤</b>？","opts":["胃部可能會有熱熱的感覺","會使胃內液體的 pH 值下降","胃內會進行酸鹼中和反應","會使胃內液體的 [H⁺] 下降"],"ans":1,"sec":"酸鹼中和","diff":"中","src":"重點演練・素養題","exp":"碳酸鈉（鹼性）會與胃內的鹽酸進行<b>酸鹼中和反應</b>，屬放熱反應（故(A)正確），並使胃內液體的 [H⁺] <b>下降</b>（故(D)正確）。[H⁺] 下降代表酸性減弱，pH 值應<i class=\"hl\">上升</i>，故(B)錯誤。"},
{"q":"在錐形瓶內裝入 1M、20 mL 的氫氧化鈣水溶液和數滴酚酞，再慢慢滴入 1M 的鹽酸，則下列敘述何者<b>錯誤</b>？","opts":["滴入鹽酸前，錐形瓶內的溶液顏色為無色","滴入鹽酸的過程中，錐形瓶內溶液的溫度會上升","滴入鹽酸的過程中，錐形瓶內溶液的 pH 值會下降","實驗完成後，將錐形瓶內的溶液蒸乾，可得到氯化鈣"],"ans":0,"sec":"酸鹼中和","diff":"中","src":"重點演練","exp":"(A)錯誤。氫氧化鈣水溶液為<b>鹼性</b>，而酚酞在鹼性溶液中呈<i class=\"hl\">紅色</i>，不是無色。(B)酸鹼中和為放熱反應。(C)加入酸使 pH 值下降。(D)Ca(OH)₂＋2HCl→CaCl₂＋2H₂O，蒸乾可得氯化鈣。"},
{"q":"取硫粉和鎂帶分別在空氣中燃燒，燃燒後的產物依序於 X、Y 兩瓶密閉容器內與水充分混合。在室溫下先以石蕊試紙檢測 X、Y 兩瓶水溶液，再將兩瓶水溶液混合並測量溫度變化。已知實驗結果兩瓶的石蕊試紙皆有變色，則下列哪一個代號最可能是實驗結果的紀錄？<br>　甲：X 瓶變紅色、Y 瓶變藍色，混合後溫度下降<br>　乙：X 瓶變紅色、Y 瓶變藍色，混合後溫度上升<br>　丙：X 瓶變藍色、Y 瓶變紅色，混合後溫度上升<br>　丁：X 瓶變藍色、Y 瓶變紅色，混合後溫度下降","opts":["甲","乙","丙","丁"],"ans":1,"sec":"酸鹼中和","diff":"難","src":"會考110補考","exp":"解題關鍵：<b>非金屬氧化物的水溶液呈酸性，金屬氧化物的水溶液呈鹼性</b>。硫為非金屬，X 瓶（SO₂ 溶於水成亞硫酸）呈<b>酸性</b>，會使藍色石蕊試紙<b>變紅色</b>；鎂為金屬，Y 瓶（MgO 溶於水成氫氧化鎂）呈<b>鹼性</b>，會使紅色石蕊試紙<b>變藍色</b>。酸性與鹼性水溶液混合會進行酸鹼中和，為<i class=\"hl\">放熱反應</i>，溫度<b>上升</b>，故選(B)乙。"},
{"q":"「刀工」是指切菜的技術，可根據烹調或食用的需要，將食材加工成一定的形狀。小佩將番茄切成薄片狀後再丟入鍋中拌炒，可讓番茄更快熟透，主要與下列何種影響反應速率的因素最相關？","opts":["濃度","溫度","催化劑","接觸面積"],"ans":3,"sec":"反應速率","diff":"易","src":"重點演練・素養題","exp":"物質被拆分得<b>越細、越薄</b>，則<i class=\"hl\">總表面積越大</i>，粒子碰撞機會變多，反應速率越快，故選(D)接觸面積。"},
{"q":"小華參觀麵粉工廠時，看到「嚴禁煙火」的警告標誌，廠長解釋是因為空氣中散布著麵粉粉末，若遇到火源容易發生爆炸。則麵粉粉末遇到火源容易爆炸，與下列哪兩個影響反應速率的因素最為相關？<br>　甲. 反應物活性　乙. 接觸面積　丙. 溫度　丁. 催化劑","opts":["甲乙","乙丙","乙丁","丙丁"],"ans":1,"sec":"反應速率","diff":"中","src":"重點演練・素養題","exp":"麵粉<b>散布在空氣中</b>，粉末與空氣的<i class=\"hl\">接觸面積增加</i>（乙）；<b>火源</b>則是增加<i class=\"hl\">溫度</i>（丙），故選(B)。"},
{"q":"閱讀下列新聞報導後回答：<br>　「一場泳池慶生派對中，工作人員在泳池中倒入大量的液態氮，以製造煙霧效果並且炒熱氣氛，最後卻造成數人昏迷送醫。有人分析：『氮氣和池水中的氯會反應產生有毒的三氯化氮，對皮膚和呼吸道相當刺激。』」<br>小莫看完報導後，認為三氯化氮雖然有毒，但應該不是此次意外的原因，應是其他因素所致。下列何者最可能是她認為不是三氯化氮的理由？","opts":["空氣中有大量氮氣，池水也會接觸氮氣，但一般泳池並沒有類似的意外","池水溫度會因液態氮汽化而下降，反而會加快產生三氯化氮的反應速率","泳池會加入較高濃度的氯氣用以殺菌消毒，故泳池的氯含量比自來水高","液態氮汽化後所產生的氣體會溶於池水中，與水中的氯接觸機會增加"],"ans":0,"sec":"反應速率","diff":"難","src":"會考112（通過率 52%）","exp":"解題關鍵：思考平時的泳池水是否已經有與氮氣接觸。(A)空氣中的<b>氮含量約占 78%</b>，池水平時就一直接觸氮氣卻沒出事，可支持「不是三氯化氮」的推論，故選(A)。(B)溫度<b>下降</b>會<i class=\"hl\">減慢</i>反應速率，敘述有誤。(C)泳池氯含量較高時，應更<b>容易</b>產生三氯化氮，並非認為「不是」的理由。(D)氮<b>不易</b>溶於水。"},
{"q":"甲、乙兩組製備氣體的實驗裝置（大理石與鹽酸反應）僅有<b>一個</b>條件不同，其他條件皆相同。已知乙組裝置產生氣泡的初始速率明顯較甲組裝置<b>慢</b>，則上述不同的條件，可能是指下列何者？","opts":["甲組的鹽酸濃度較高","甲組的廣口瓶容積較大","乙組的反應溫度較高","乙組的大理石顆粒較小"],"ans":0,"sec":"反應速率","diff":"中","src":"會考111補考","exp":"解題關鍵：反應速率與<b>接觸面積、濃度、溫度</b>有關。由題目可知乙組的反應速率較甲組慢。(A)濃度越高反應速率越快，故甲組的鹽酸濃度應較乙組高，<b>正確</b>。(B)廣口瓶容積大小<i class=\"hl\">不影響</i>反應速率。(C)溫度越高反應速率越快，應是<b>甲組</b>溫度較高。(D)顆粒越小總表面積越大、反應越快，應是<b>甲組</b>的大理石顆粒較小。"},
{"q":"室溫下有兩杯水溶液：<br>　<b>實驗一</b>：HCl 水溶液（pH＝2），加入適量的鋅粉<br>　<b>實驗二</b>：NaHCO₃ 水溶液（pH＝9），加入適量的鹽酸<br>兩杯均會冒泡。若改變 HCl 和 NaHCO₃ 的濃度，使這兩杯水溶液的 pH 值<b>均增加</b>，但其他實驗條件皆不變，則分別加入鋅粉和鹽酸後，這兩杯水溶液冒泡速率的改變情形，最可能為下列何者？","opts":["兩杯水溶液都變快","兩杯水溶液都變慢","實驗一：變快，實驗二：變慢","實驗一：變慢，實驗二：變快"],"ans":3,"sec":"反應速率","diff":"難","src":"會考110補考","exp":"解題關鍵：<b>酸性</b>溶液的 pH 值增加，表示濃度<i class=\"hl\">變小</i>；<b>鹼性</b>溶液的 pH 值增加，表示濃度<i class=\"hl\">變大</i>。HCl 為酸性，pH 增加代表濃度變小 → 冒泡<b>變慢</b>；NaHCO₃ 為鹼性，pH 增加代表濃度變大 → 冒泡<b>變快</b>。濃度越大反應速率越快，故選(D)。"},
{"q":"阿美進行下列實驗：<br>　① 在杯子中裝水並放入一顆方糖。<br>　② 攪拌時發現方糖的形狀改變了。<br>　③ 充分攪拌後杯底仍有方糖沉澱，此時再丟入一顆方糖。<br>　④ 一段時間後發現再放入的方糖，其形狀也改變了。<br>則步驟②與步驟④中，糖的溶解速率（D溶解）與析出速率（D析出）之大小關係分別為何？","opts":["兩步驟均為 D溶解＝D析出","兩步驟均為 D溶解＞D析出","步驟②：D溶解＝D析出，步驟④：D溶解＞D析出","步驟②：D溶解＞D析出，步驟④：D溶解＝D析出"],"ans":3,"sec":"可逆反應與平衡","diff":"中","src":"重點演練・素養題","exp":"步驟②時溶液<b>尚未達到飽和</b>（糖還在溶解、杯底還沒剩），此時<i class=\"hl\">溶解速率 ＞ 析出速率</i>。步驟③杯底仍有方糖沉澱，表示已達<b>飽和</b>；步驟④再放入的方糖形狀改變但總量不變，此時<i class=\"hl\">溶解速率 ＝ 析出速率</i>（動態平衡），故選(D)。"},
{"q":"某色溶液內的反應已達平衡狀態，則下列敘述何者正確？","opts":["溶液的顏色不再改變","正反應與逆反應均停止","反應物濃度與生成物濃度相同","平衡改變後就不會再達成新的平衡"],"ans":0,"sec":"可逆反應與平衡","diff":"中","src":"重點演練","exp":"達平衡時顏色、濃度等<b>不再改變</b>，(A)正確。(B)正反應速率<b>等於</b>逆反應速率，但<i class=\"hl\">都不為零</i>，兩者仍持續進行（動態平衡）。(C)反應物與生成物濃度<b>固定</b>，但<b>不一定相同</b>。(D)條件允許時<b>會</b>再達到新的平衡。"},
{"q":"鉻酸鉀和二鉻酸鉀的可逆反應如下：<br>　<b>2CrO₄²⁻（黃色）＋ 2H⁺ ⇌ Cr₂O₇²⁻（橘紅色）＋ H₂O</b><br>則改變溶液酸鹼性的平衡變化情形，下列何者正確？","opts":["pH 值變小時，平衡向左移動","pH 值變小時，平衡向右移動","pH 值變大時，平衡向右移動","不論 pH 值變小或變大，均不會改變平衡"],"ans":1,"sec":"可逆反應與平衡","diff":"中","src":"重點演練","exp":"pH 值<b>變小</b>時，[H⁺] 濃度<b>增加</b>；H⁺ 是反應物，增加反應物濃度會使平衡往生成物方向（<i class=\"hl\">向右</i>）移動，故選(B)。反之 pH 值變大時 [H⁺] 減少，平衡<b>向左</b>移動。"},
{"q":"在燒瓶中裝水並加熱到沸騰後，停止加熱、塞住瓶口，翻轉倒置燒瓶，使瓶內的空氣位於上方。此時拿一袋冰塊放在燒瓶的上方，瓶內的氣壓會改變，而水會由下而上開始冒出氣泡，是一種物理變化。根據上述說明，關於冰塊降溫造成此現象的解釋，下列何者最合理？","opts":["瓶內的水蒸氣凝結，接著藉由水汽化達到新的平衡","瓶內的水蒸氣蒸發，接著藉由水汽化達到新的平衡","瓶內的氣壓降低，接著藉由水分解反應產生氣體達到新的平衡","瓶內的氣壓升高，接著藉由水分解反應產生氣體達到新的平衡"],"ans":0,"sec":"可逆反應與平衡","diff":"難","src":"會考114（通過率 46%）","exp":"解題關鍵：思考溫度降低時氣壓如何變化，以及水冒出氣泡是何種變化。冰塊降溫使瓶內的<b>水蒸氣凝結成水</b>（氣壓下降），瓶內水冒出氣泡則表示<b>水汽化成水蒸氣</b>，兩者一來一往達到新的平衡，故選(A)。(C)(D)水分解屬於<i class=\"hl\">化學變化</i>，與題目「是一種物理變化」不符。"},
{"q":"將裝有紅棕色二氧化氮（NO₂）氣體的密閉玻璃瓶放入冰水中，二氧化氮會互相結合產生無色的四氧化二氮（N₂O₄）氣體，瓶內的顏色會逐漸變淡，反應式為 <b>2NO₂ ⇌ N₂O₄</b>。當溫度下降至某溫度，且保持恆定，一段時間後玻璃瓶內的顏色便不再改變。關於顏色不再改變時反應速率的說明，下列何者正確？","opts":["正反應速率等於逆反應速率，且速率為 0","正反應速率等於逆反應速率，且速率不為 0","正反應速率不等於逆反應速率，且兩速率均不為 0","正反應速率不等於逆反應速率，且其中一速率為 0"],"ans":1,"sec":"可逆反應與平衡","diff":"中","src":"會考113（通過率 63%）","exp":"解題關鍵：思考玻璃瓶內的顏色不再改變的含意。容器內氣體<b>顏色不再改變</b>，表示已達到<b>反應平衡</b>；此時正反應速率<b>等於</b>逆反應速率，且<i class=\"hl\">不為零</i>，兩者仍持續進行，屬於<b>動態平衡</b>，故選(B)。"},
{"q":"室溫時，在含有橘紅色二鉻酸根離子（Cr₂O₇²⁻）的水溶液中加入氫氧化鈉，會產生黃色的鉻酸根離子（CrO₄²⁻），達平衡後其可逆反應表示為：<br>　<b>Cr₂O₇²⁻ ＋ 2OH⁻ ⇌ 2CrO₄²⁻ ＋ H₂O</b><br>若對上述水溶液<b>通入二氧化碳</b>，使平衡再次移動，則關於此反應趨向和物質濃度的敘述，下列何者正確？","opts":["反應向正反應方向進行，達新平衡時 [Cr₂O₇²⁻] 等於 0","反應向正反應方向進行，達新平衡時 [CrO₄²⁻] 增加","反應向逆反應方向進行，達新平衡時 [CrO₄²⁻] 等於 0","反應向逆反應方向進行，達新平衡時 [Cr₂O₇²⁻] 增加"],"ans":3,"sec":"可逆反應與平衡","diff":"難","src":"會考109補考","exp":"解題關鍵：二氧化碳與水反應產生的物質會影響酸鹼性。CO₂ 會和 H₂O 反應生成<b>碳酸（H₂CO₃）</b>並解離產生 <b>H⁺</b>；H⁺ 會中和 OH⁻，使 <i class=\"hl\">[OH⁻] 減少</i>。OH⁻ 是反應物，反應物減少會使平衡往<b>逆反應</b>方向進行。達新平衡時 [CrO₄²⁻] <b>減少（但不為零）</b>、[Cr₂O₇²⁻] <b>增加</b>，故選(D)。"},
{"q":"人體雖然複雜，但主要是由 6 種元素構成，質量比例如下：<br>　氧(O) 65%、碳(C) 18%、氫(H) 10%、氮(N) 3.0%、鈣(Ca) 1.5%、磷(P) 1.0%<br>若只考慮這 6 種元素，則下列敘述何者正確？","opts":["金屬元素約占 19%","原子序最小的元素約占 3%","原子量越大的元素所占比例越高","碳在人體中所組成的物質可能為無機化合物"],"ans":3,"sec":"認識有機化合物","diff":"中","src":"重點演練・素養題","exp":"(A)這 6 種元素中<b>只有鈣</b>為金屬元素，約占 <b>1.5%</b>。(B)原子序最小的元素為<b>氫</b>，約占 <b>10%</b>。(C)不一定，氮、鈣、磷的原子量均大於氫，但占比較小。(D)有可能，例如 <i class=\"hl\">CO₂</i>（碳的氧化物屬於無機化合物），故選(D)。"},
{"q":"下列何者屬於有機化合物？","opts":["CO₂","CBr₄","HCN","H₂CO₃"],"ans":1,"sec":"認識有機化合物","diff":"易","src":"重點演練","exp":"<b>碳的氧化物</b>（CO₂）、<b>碳酸鹽類</b>（H₂CO₃ 為碳酸）、<b>氰化物</b>（HCN）等雖含有碳原子，但<i class=\"hl\">不屬於</i>有機化合物，故選(B) CBr₄。"},
{"q":"關於有機化合物與無機化合物的敘述，下列何者正確？","opts":["含碳的化合物皆為有機化合物","有機化合物只能從有機體中獲得","有機化合物的種類比無機化合物多","有機化合物必含有碳、氫、氧元素"],"ans":2,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"(A)一氧化碳、二氧化碳、碳酸鹽類及氰化物雖含碳，但<b>並非</b>有機化合物。(B)有機化合物<b>可由人工合成</b>（烏拉合成尿素）。(C)因排列與結合方式多變，有機化合物種類<i class=\"hl\">較多</i>，正確。(D)有機化合物必含<b>碳</b>元素，但<b>不一定</b>含有氫、氧元素（例如 CCl₄）。"},
{"q":"德國科學家烏拉在實驗室合成尿素，推翻有機化合物的早期推論，則尿素的化學式最可能為下列何者？","opts":["CO(NH₂)₂","NH₄ONH","NH₄NO₂","NH₄CaO"],"ans":0,"sec":"認識有機化合物","diff":"易","src":"重點演練","exp":"尿素為<b>有機化合物</b>，應<i class=\"hl\">含有碳元素</i>，四個選項中只有(A) CO(NH₂)₂ 含碳，故選(A)。"},
{"q":"甲乙醚與丙醇的分子式均為 C₃H₈O，但兩者的性質差異甚大，則造成兩者性質有所差異的主要原因為何？","opts":["分子量不同","原子種類不同","原子數目不同","原子排列方式不同"],"ans":3,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"<b>分子式相同</b>，則兩者的分子量、原子種類及原子數目<b>都相同</b>；但兩者的<i class=\"hl\">原子排列方式不同</i>，即為不同的化合物，故性質會有所差異，故選(D)。"},
{"q":"小佩將白砂糖放入蒸發皿中加熱，發現白砂糖會先變成白色液體（甲）後，再變成黑色物質（乙），則甲、乙兩階段分別屬於何種變化？","opts":["甲、乙均為物理變化","甲、乙均為化學變化","甲為物理變化，乙為化學變化","甲為化學變化，乙為物理變化"],"ans":2,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"甲階段為<b>砂糖融化</b>（只改變狀態），為<i class=\"hl\">物理變化</i>；乙階段為<b>產生含碳的黑色物質</b>（產生新物質），為<i class=\"hl\">化學變化</i>，故選(C)。"},
{"q":"已知甲～丁四者均為純物質，其所含元素的質量百分比如下：<br>　甲：C 75%、H 25%、O 0%<br>　乙：C 27%、H 0%、O 73%<br>　丙：C 100%、H 0%、O 0%<br>　丁：C 52%、H 13%、O 35%<br>則哪些物質<b>不可能</b>是有機化合物？（原子量：C＝12、H＝1、O＝16）","opts":["甲、乙","乙、丙","丙、丁","甲、丙"],"ans":1,"sec":"認識有機化合物","diff":"難","src":"會考113（通過率 57%）","exp":"解題關鍵：思考哪些含有碳的化合物<b>並非</b>有機化合物。乙的 C：O 莫耳數比＝⟬27|12⟭：⟬73|16⟭≈1：2，即 <b>CO₂</b>，屬於<i class=\"hl\">碳的氧化物</i>，不是有機化合物。丙<b>完全由碳組成</b>，是<i class=\"hl\">元素而非化合物</i>，當然也不是有機化合物。故選(B)。"},
{"q":"下表為四位學生對於有機化合物、無機化合物中組成元素的說明，哪一位學生的說明最合理？<br>　小玉：有機化合物<b>必含 C</b>／無機化合物<b>必不含 C</b><br>　小如：有機化合物<b>必含 C</b>／無機化合物<b>可以含 C</b><br>　小方：有機化合物<b>必含 C、O</b>／無機化合物<b>必不含 C、O</b><br>　小德：有機化合物<b>必含 C、H、O</b>／無機化合物<b>可以含 C、H、O</b>","opts":["小玉","小如","小方","小德"],"ans":1,"sec":"認識有機化合物","diff":"難","src":"會考112（通過率 60%）","exp":"解題關鍵：<b>部分含碳的化合物屬於無機化合物</b>。有機化合物<b>必含有碳</b>，但碳的氧化物、碳酸鹽類、氰化物等含碳的化合物卻屬於<i class=\"hl\">無機化合物</i>，所以無機化合物<b>可以含 C</b>，故選(B)小如。有機化合物不一定含 O 或 H，故小方、小德的說明有誤。"},
{"q":"小華爺爺家中還保存著早期農民使用的「竹筒炮」，早期農民會使用竹筒炮產生巨響驅趕鳥類，阻止其啄食農作物。已知竹筒炮是將電石（CaC₂）放入竹筒中，再加水產生電石氣（C₂H₂），點火後即會爆炸產生巨響，則電石氣<b>不屬於</b>下列何者？","opts":["有機化合物","碳氫化合物","烴類","醇類"],"ans":3,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"電石氣（C₂H₂）<b>只含 C、H 兩種元素</b>，為<i class=\"hl\">碳氫化合物</i>，又稱為<i class=\"hl\">烴類</i>，也屬於有機化合物，故(A)(B)(C)皆屬於。(D)醇類須含有 <b>OH 原子團</b>（含 C、H、O），與電石氣不符，故選(D)。"},
{"q":"某科學家偵測電影院內的空氣數據並歸納後，發現人類的心情或舉動隨著劇情進行，會使空氣中某些氣體的濃度明顯增加：<br>　大笑 → 二氧化碳（CO₂）<br>　緊張 → 二氧化碳、異戊二烯（C₅H₈）<br>　喝啤酒 → 乙醇（C₂H₅OH）<br>關於上述三種氣體的敘述，何者正確？（原子量：H＝1，C＝12，O＝16）","opts":["大笑時明顯增加的氣體分子量為 28","緊張時明顯增加的氣體包含碳氫化合物","喝啤酒時明顯增加的氣體燃燒只會產生水","無論大笑、緊張或喝啤酒，明顯增加的氣體均屬於有機化合物"],"ans":1,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"(A)CO₂ 的分子量為 12＋16×2＝<b>44</b>，不是 28。(B)異戊二烯 C₅H₈ <b>只含 C、H</b>，屬於<i class=\"hl\">碳氫化合物</i>，正確。(C)乙醇<b>還含有碳原子</b>，燃燒時除了水還會產生二氧化碳。(D)CO₂ <b>不屬於</b>有機化合物。"},
{"q":"取 2 mL 的乙醇和 2 mL 的冰醋酸共置於一支試管中，並加入數滴濃硫酸後，將試管浸於盛有熱水的燒杯中，且不斷攪拌。反應完成後將試管取出，發現有少許油狀物<b>浮在最上層</b>。由以上結果可知該油狀物具下列哪些性質？<br>　甲. 易溶於水　乙. 難溶於水　丙. 密度比水小　丁. 密度比水大","opts":["甲丙","乙丙","甲丁","乙丁"],"ans":1,"sec":"常見的有機化合物","diff":"中","src":"重點演練","exp":"醇類加有機酸類會進行<b>酯化反應</b>產生<i class=\"hl\">酯類</i>。酯類<b>難溶於水</b>（乙），且會<b>浮在水面上</b>，表示<b>密度比水小</b>（丙），故選(B)。"},
{"q":"小佩利用回鍋油、氫氧化鈉水溶液、酒精與飽和食鹽水製造肥皂，則下列敘述何者正確？","opts":["氫氧化鈉水溶液可用硫酸代替","酒精可加快皂化反應，屬於催化劑","肥皂不溶於飽和食鹽水中，可析出於液面上","肥皂沾溼後可使藍色石蕊試紙變紅色"],"ans":2,"sec":"常見的有機化合物","diff":"中","src":"重點演練","exp":"(A)皂化反應應使用<b>鹼性</b>物質，而硫酸為<b>酸性</b>物質。(B)酒精可使油脂與氫氧化鈉水溶液混合得更均勻，但<i class=\"hl\">不屬於催化劑</i>（既不是反應物也不是催化劑）。(C)正確，這就是<b>鹽析</b>。(D)肥皂水呈<b>鹼性</b>，可使<i class=\"hl\">紅色</i>石蕊試紙變<i class=\"hl\">藍色</i>。"},
{"q":"粉刷牆面時常使用水性漆或油性漆，水性漆是以水（H₂O）作為溶劑，油性漆則常以甲苯（C₇H₈）作為溶劑。甲苯為無色液體，具有特殊氣味，長期吸聞會對神經系統造成傷害，因此在使用含甲苯的油性漆時應注意通風。根據上述，下列關於甲苯的分類何者<b>錯誤</b>？","opts":["烴類","有機化合物","碳水化合物","碳氫化合物"],"ans":2,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"甲苯的化學式為 C₇H₈，<b>只含 C、H</b>，屬於有機化合物中的<i class=\"hl\">碳氫化合物</i>，而碳氫化合物又稱為<i class=\"hl\">烴類</i>，故(A)(B)(D)皆正確。(C)<b>碳水化合物</b>中氫與氧的比例與水相同（H：O＝2：1），而甲苯<b>不含氧元素</b>，故並非碳水化合物，選(C)。"},
{"q":"木糖醇是一種可以代替蔗糖的食品添加物。若要知道木糖醇是否和乙醇一樣都是醇類，應查詢木糖醇的何項資訊？","opts":["分子量","組成的原子種類與排列方式","組成的原子總數是否超過 1000 個","氫和氧的原子數目比是否為 1：1"],"ans":1,"sec":"常見的有機化合物","diff":"易","src":"會考113（通過率 79%）","exp":"解題關鍵：<b>有機化合物的分類是根據特定的原子團或結構</b>。醇類的特性是含有 <i class=\"hl\">OH 原子團</i>，可由<b>原子種類與排列方式</b>判斷，而無法由分子量、原子總數或比例判斷，故選(B)。"},
{"q":"閱讀下文後回答：<br>　「為避免攝取過量咖啡因，可先降低咖啡豆中的咖啡因含量。將咖啡豆浸泡在有機溶劑中，咖啡因會溶在溶劑中，之後取出咖啡因加熱，使溶劑揮發掉。二氯甲烷是過往常用的有機溶劑，去除咖啡因效果好又易揮發，但後來因安全疑慮而棄用，並改用乙酸乙酯。因為酯類＿＿＿＿，所以較無安全性疑慮，美國食品藥物管理局許可使用乙酸乙酯來去除咖啡因，且無明定殘留許可標準。」<br>依據上述資訊，畫線處最適合填入下列何者？","opts":["只由碳和氫兩種原子所組成","是香蕉、柳丁等水果就含有的物質","沸點比二氯甲烷高，而不易揮發去除","是油脂與鹼性物質進行皂化反應後的產物"],"ans":1,"sec":"常見的有機化合物","diff":"難","src":"會考111（通過率 49%）","exp":"解題關鍵：「較無安全疑慮」表示<b>可以食用</b>。(B)水果本來就含有，代表可食用、較無安全疑慮，正確。(A)酯類含有 <b>C、H、O</b> 三種原子。(C)文中<b>未提及</b>酯類的沸點高低及揮發性。(D)<b>皂化</b>反應產生的是肥皂；酯類是由醇類與有機酸類進行<i class=\"hl\">酯化</i>反應而產生。"},
{"q":"天然氣為常用燃料，其組成以甲烷為主，並含有少量的乙烷、丙烷等氣體。下表列出 1 m³ 的烷類完全燃燒時所放出的熱量，以及二氧化碳排放量（碳排放量）：<br>　甲烷：熱量 9,006 kcal/m³，碳排放量 X g/m³<br>　乙烷：熱量 15,867 kcal/m³，碳排放量 2X g/m³<br>　丙烷：熱量 22,754 kcal/m³，碳排放量 3X g/m³<br>依據表中資訊判斷，若以<b>燃燒放出相同熱量</b>為前提，比較不同成分比例的天然氣，下列推論何者最合理？","opts":["甲烷體積比例越高的天然氣，其碳排放量越低","丙烷體積比例越高的天然氣，其碳排放量越低","甲烷體積比例越高的天然氣，燃燒所消耗的體積越少","丙烷體積比例越高的天然氣，燃燒所消耗的體積越多"],"ans":0,"sec":"常見的有機化合物","diff":"難","src":"會考111補考","exp":"解題關鍵：將表中熱量取至相近值時，比較體積及碳排放量大小。碳排放量相等時（取 6X），熱量為甲烷 54,036 ＞ 乙烷 47,601 ＞ 丙烷 45,508，可推知<b>放出相同熱量時，碳排放量為丙烷＞乙烷＞甲烷</b>，故甲烷比例越高時碳排放量<i class=\"hl\">越低</i>，(A)正確、(B)錯誤。(C)(D)相同體積時放熱為丙烷＞乙烷＞甲烷，故放出相同熱量時<b>消耗體積為甲烷＞乙烷＞丙烷</b>，甲烷比例越高消耗體積<b>越多</b>、丙烷比例越高消耗體積<b>越少</b>，故(C)(D)皆錯。"},
{"q":"阿華拿出一盒蛋想煮蛋花湯，但不慎使蛋盒太靠近爐火，而發現蛋盒邊緣有些<b>軟化</b>。已知蛋的主要成分為蛋白質，蛋盒的主要成分為聚氯乙烯，則關於蛋白質與聚氯乙烯的分類，下列何者正確？（前者為蛋白質，後者為聚氯乙烯）","opts":["天然聚合物／鏈狀聚合物","天然聚合物／網狀聚合物","合成聚合物／鏈狀聚合物","合成聚合物／網狀聚合物"],"ans":0,"sec":"生活中的有機聚合物","diff":"中","src":"重點演練・素養題","exp":"蛋白質由<b>胺基酸</b>聚合而成，屬於<i class=\"hl\">天然聚合物</i>。聚氯乙烯（PVC）加熱會<b>軟化</b>（題目中蛋盒受熱軟化即是線索），屬於<b>熱塑性</b>的<i class=\"hl\">鏈狀聚合物</i>，故選(A)。"},
{"q":"關於聚合物遇熱情形及分類，下列敘述何者正確？","opts":["寶特瓶遇熱會軟化變形，屬於熱塑性聚合物","輪胎遇熱不會軟化變形，屬於熱塑性聚合物","聚乙烯遇熱不會軟化變形，屬於熱固性聚合物","酚醛樹脂遇熱會軟化變形，屬於熱固性聚合物"],"ans":0,"sec":"生活中的有機聚合物","diff":"中","src":"重點演練","exp":"(A)寶特瓶（PET）遇熱會軟化變形，屬於<i class=\"hl\">熱塑性</i>（鏈狀）聚合物，正確。(B)輪胎屬於<b>熱固性</b>聚合物。(C)聚乙烯遇熱<b>會</b>軟化變形，屬於<b>熱塑性</b>聚合物。(D)酚醛樹脂遇熱<b>不會</b>軟化變形，屬於熱固性聚合物。"},
{"q":"衣料纖維的分類如下：<br>　衣料纖維 → <b>天然纖維</b> → 分成<b>甲</b>、<b>乙</b> 兩類<br>　衣料纖維 → <b>丙</b> → 分成<b>人造絲</b>、<b>丁</b> 兩類<br>若甲纖維是由蛋白質組成，則關於甲、乙、丙、丁的敘述，下列何者正確？","opts":["甲纖維有可能為棉或麻","乙纖維主要是由脂質組成","丙纖維是由植物纖維溶解後抽成絲狀所製成","丁纖維的原料為石油"],"ans":3,"sec":"生活中的有機聚合物","diff":"難","src":"重點演練","exp":"由「甲由蛋白質組成」可知<b>甲＝動物纖維</b>，則<b>乙＝植物纖維</b>；丙與人造絲、丁同層，故<b>丙＝人造纖維</b>、<b>丁＝合成纖維</b>。(A)棉、麻為<b>植物</b>纖維（乙）。(B)植物纖維主要由<i class=\"hl\">纖維素</i>組成，不是脂質。(C)由植物纖維溶解後抽成絲狀的是<b>人造絲（再生纖維）</b>，不是整個「人造纖維」類別。(D)合成纖維的原料為<i class=\"hl\">石油</i>，正確。"},
{"q":"關於澱粉、纖維素與蛋白質的敘述，下列何者<b>錯誤</b>？","opts":["組成澱粉、纖維素的小分子相同，但排列方式不同","組成蛋白質的小分子為胺基酸，其氫、氧原子數目的比例與水相同","動物纖維主要由蛋白質組成，植物纖維主要由纖維素組成","澱粉可使碘液變成藍黑色，蛋白質受熱後容易變質凝固"],"ans":1,"sec":"生活中的有機聚合物","diff":"中","src":"重點演練","exp":"(A)澱粉與纖維素都由<b>葡萄糖</b>聚合而成，只是聚合方式不同，正確。(B)錯誤——氫、氧原子數目比例與水相同（2：1）的是<i class=\"hl\">醣類</i>（故又稱碳水化合物），<b>不是蛋白質</b>；蛋白質還含有氮、硫等元素。(C)(D)皆正確。"},
{"q":"部分市售的防蚊產品以「敵避」為主要成分，「敵避」分子式為 C₁₂H₁₇NO，熔點為 －45℃，沸點為 290℃，是一種具有驅蚊功效的物質。在常溫常壓下，「敵避」應屬於下列何種物質？","opts":["液體聚合物","液體化合物","固體聚合物","固體化合物"],"ans":1,"sec":"生活中的有機聚合物","diff":"難","src":"會考108（通過率 56%）","exp":"解題關鍵：思考<b>聚合物的定義</b>，以及三態變化與溫度的關係。常溫 25℃ 介於熔點 －45℃ 與沸點 290℃ 之間，故敵避為<i class=\"hl\">液態</i>。聚合物的原子總數通常有數千到數十萬個，而一個敵避分子（C₁₂H₁₇NO）只含 12＋17＋1＋1＝<b>31 個原子</b>，屬於一般<i class=\"hl\">化合物</i>而非聚合物，故選(B)。"},
{"q":"傳統磅秤是利用彈簧來秤量物體重量。將物體放在秤盤上，秤盤會往下移動而使磅秤內的彈簧被拉長，<b>彈簧的伸長量越大則指針所指向的數值越大</b>。某不良小販擅自更換磅秤內的彈簧，使顧客須多支付 50% 的金錢（例如原本只須支付 10 元，結果變成支付 15 元）。若原本磅秤中彈簧受力(F)與伸長量(L)的情形為「F 50 gw→L 10 mm、F 100 gw→L 20 mm、F 200 gw→L 40 mm」，則小販所更換的彈簧最可能為下列何者？","opts":["50→20、100→40、200→80（mm）","50→15、100→30、200→60（mm）","50→7.5、100→15、200→30（mm）","50→5、100→10、200→20（mm）"],"ans":1,"sec":"力與平衡","diff":"中","src":"重點演練・素養題","exp":"顧客須多支付 <b>50%</b> 的金錢，表示指針指到的數值變成原本的 <b>1.5 倍</b>，即相同受力下彈簧的<i class=\"hl\">伸長量須為原本的 1.5 倍</i>。原本 50 gw→10 mm，1.5 倍即 15 mm，故選(B)。"},
{"q":"有一彈簧的受力與伸長量成正比，由關係圖可讀出：受力 <b>2 kgw</b> 時伸長量為 <b>20 cm</b>。今將此彈簧放置於水平桌面上，兩端所連接的細繩跨過兩側滑輪後<b>各掛 2 kgw 的砝碼</b>，若細繩質量、繩與滑輪的摩擦力可忽略不計，則此彈簧的伸長量為多少 cm？","opts":["10","20","30","40"],"ans":1,"sec":"力與平衡","diff":"中","src":"重點演練","exp":"彈簧兩端各掛 2 kgw，相當於<i class=\"hl\">一端固定、另一端受力 2 kgw</i>（並非 4 kgw）——這正是「彈簧平衡時兩端受力相同」的觀念。故伸長量為 <b>20 cm</b>。"},
{"q":"某靜止物體受到 x、y 兩力作用。當兩力夾角為 0° 時，所受合力大小為 21 kgw；當兩力夾角為 180° 時，所受合力大小為 3 kgw。則當兩力夾角為 90° 時，所受合力大小為多少 kgw？","opts":["9","12","15","25"],"ans":2,"sec":"力與平衡","diff":"難","src":"重點演練","exp":"夾角 0°：x＋y＝21；夾角 180°：x－y＝3。解得 x＝<b>12</b> kgw、y＝<b>9</b> kgw。夾角 90° 時合力＝√(12²＋9²)＝√225＝<b>15 kgw</b>。"},
{"q":"如圖(一)，對彈簧秤甲<b>兩端同時</b>施以方向相反、大小同為 100 gw 的水平力，彈簧秤甲保持靜止平衡，讀數為 X甲。如圖(二)，彈簧秤乙<b>吊掛在支架下</b>，對其施以鉛直向下、大小為 100 gw 的力，彈簧秤乙保持靜止平衡，讀數為 X乙。若彈簧秤的重量很輕可以忽略，且過程中均未超過彈性限度，則 X甲、X乙 應為多少？","opts":["X甲＝0，X乙＝100 gw","X甲＝100 gw，X乙＝0","X甲＝100 gw，X乙＝100 gw","X甲＝200 gw，X乙＝100 gw"],"ans":2,"sec":"力與平衡","diff":"難","src":"會考109（通過率 37%）","exp":"解題關鍵：畫出圖(二)的力圖。乙被支架<b>固定</b>在上端，下端施 100 gw，支架同時給它 100 gw 的反作用力——這跟甲「兩端各施 100 gw」其實是<i class=\"hl\">同一種情形</i>。彈簧秤的讀數是<b>一端所受的力</b>，不是兩端相加，故兩者讀數<b>均為 100 gw</b>，選(C)。"},
{"q":"甲、乙、丙三條完全相同的彈簧懸掛在一根水平橫桿上：甲彈簧<b>無懸掛物品</b>，乙彈簧懸掛重量為 W₁ 公克重的砝碼，丙彈簧懸掛 W₁ 與 W₂ 公克重的砝碼。靜止平衡時，<b>乙比甲長 2 cm，丙比乙長 1 cm</b>。若三條彈簧質量均很輕忽略不計，且乙、丙兩彈簧在取下砝碼後均可恢復原長，則 W₁：W₂ 應為下列何者？","opts":["1：2","2：1","2：3","3：2"],"ans":1,"sec":"力與平衡","diff":"中","src":"會考108（通過率 74%）","exp":"解題關鍵：<b>作用在彈簧上的力與彈簧伸長量成正比</b>。懸掛 W₁ 時伸長 2 cm（乙比甲長 2 cm）；再加掛 W₂ 時又多伸長 1 cm（丙比乙長 1 cm），即 W₂ 造成的伸長量為 1 cm。故 W₁：W₂＝2：1，選(B)。"},
{"q":"大力士尼格瑪圖林單獨拉動重達 36 公噸的波音 737 飛機，耗費 44.58 秒走完 25 公尺。假設尼格瑪圖林與地面的最大靜摩擦力大小為 F甲，波音 737 飛機與地面的最大靜摩擦力大小為 F乙，若他想要更輕鬆完成拉動飛機的壯舉，則可採用下列何種方式？","opts":["同時增加 F甲 與 F乙","同時減少 F甲 與 F乙","增加 F甲、減少 F乙","減少 F甲、增加 F乙"],"ans":2,"sec":"摩擦力","diff":"中","src":"重點演練・素養題","exp":"<b>F甲 越大</b>，他的腳才不會打滑，越<i class=\"hl\">有利於出力行走</i>；<b>F乙 越小</b>，飛機越<i class=\"hl\">容易被拉動</i>。故選(C)。"},
{"q":"下列四個不同質量的物體，在不同外力作用下皆呈<b>靜止</b>，則何者所受的靜摩擦力最大？","opts":["以 0.5 kgw 的水平力拉 4 kg 的物體","以 1 kgw 的水平力拉 3 kg 的物體","以 1.5 kgw 的水平力拉 2 kg 的物體","以 2 kgw 的水平力拉 1 kg 的物體"],"ans":3,"sec":"摩擦力","diff":"中","src":"重點演練","exp":"物體靜止時 <i class=\"hl\">靜摩擦力＝平行接觸面的外力</i>，<b>與正向力（重量）無關</b>。外力越大則靜摩擦力越大，故選(D) 2 kgw。"},
{"q":"某物體靜置於水平地面上，其所受水平外力和摩擦力的關係為：外力由 0 增加時摩擦力等量增加，到 <b>8 kgw</b> 為最大靜摩擦力；物體開始運動後摩擦力固定為 <b>4 kgw</b>。阿星以不同大小的水平施力向右拉此物體，直到物體開始運動，則下列敘述何者正確？","opts":["物體開始運動前，所受的摩擦力方向向右","若要拉動物體，則水平施力至少要大於 8 kgw","當施力 7 kgw 去拉物體時，物體所受合力大小為 1 kgw","當施力 11 kgw 去拉物體時，物體所受合力大小為 3 kgw"],"ans":1,"sec":"摩擦力","diff":"難","src":"重點演練","exp":"(A)摩擦力<b>阻止</b>物體運動，施力向右則摩擦力方向<i class=\"hl\">向左</i>。(B)須超過最大靜摩擦力 8 kgw 才能拉動，正確。(C)施力 7 kgw <b>未超過</b>最大靜摩擦力，物體仍靜止，<i class=\"hl\">合力為 0</i>。(D)施力 11 kgw 已超過，此時受<b>動摩擦力 4 kgw</b>，合力＝11－4＝<b>7 kgw</b>。"},
{"q":"一個質量 2 kg 的長方體木塊靜置於水平桌面上，對木塊施一水平向東的外力 F。由摩擦力(f)與外力(F)的關係圖可讀出：f 隨 F 線性上升至 <b>400 gw</b>，之後固定為 <b>300 gw</b>。根據此圖判斷下列敘述何者正確？","opts":["最大靜摩擦力為 300 gw","外力 F 由 0 增加至 300 gw 時，木塊開始向東運動","若外力 F 小於 400 gw 時，則外力 F 越小，靜摩擦力也越小","若外力 F 大於 400 gw 時，則外力 F 越大，動摩擦力也越大"],"ans":2,"sec":"摩擦力","diff":"中","src":"會考114（通過率 59%）","exp":"解題關鍵：外力小於或大於最大靜摩擦力時，物體分別受靜摩擦力或動摩擦力作用。(A)(B)由圖可知最大靜摩擦力為 <b>400 gw</b>，外力須<b>超過 400 gw</b> 木塊才會移動。(C)未達最大靜摩擦力前<i class=\"hl\">靜摩擦力＝外力</i>，故外力越小靜摩擦力越小，正確。(D)動摩擦力<b>固定為 300 gw</b>，不隨外力增加而改變。"},
{"q":"一木塊靜置於粗糙的水平面上，分別施以不同大小的水平外力，木塊與水平面間對應的摩擦力大小及運動狀態如下：<br>　外力 100 gw → 摩擦力 100 gw，靜止不動<br>　外力 200 gw → 摩擦力 200 gw，靜止不動<br>　外力 300 gw → 摩擦力 250 gw，等加速度運動<br>　外力 400 gw → 摩擦力 250 gw，等加速度運動<br>若木塊與水平面間的最大靜摩擦力大小為 fs，根據上述資訊，推論 fs 的大小關係，下列何者最合理？","opts":["fs ＜ 200 gw","200 gw ＜ fs ＜ 250 gw","250 gw ＜ fs ＜ 300 gw","fs ＞ 300 gw"],"ans":2,"sec":"摩擦力","diff":"難","src":"會考112（通過率 43%）","exp":"解題關鍵：水平外力<b>超過</b>最大靜摩擦力時物體才會移動，且<i class=\"hl\">最大靜摩擦力 ＞ 動摩擦力</i>。外力 200 gw 時仍靜止 → fs ＞ 200；外力 300 gw 時已移動 → fs ＜ 300；移動後動摩擦力為 250 gw，而 fs ＞ 動摩擦力 → fs ＞ 250。綜合得 <b>250 ＜ fs ＜ 300 gw</b>，選(C)。"},
{"q":"防水手錶會標示 ATM 來表示可抵抗的水壓，ATM 即為大氣壓力。若某手錶標示 5 ATM，代表它可以抵抗相當於 5 大氣壓力的水壓。已知 <b>1 atm ＝ 76 cmHg ＝ 1033.6 gw/cm²</b>。若小豪想戴著手錶潛至 <b>200 公尺</b>深的水中，則他至少應配戴防水等級為多少 ATM 的手錶？","opts":["2","3","20","200"],"ans":2,"sec":"壓力","diff":"中","src":"重點演練・素養題","exp":"1 atm 可支撐約 <b>1033.6 公分（約 10 公尺）</b>高的水柱，即水下每 10 公尺約增加 1 atm。潛至 <b>200 公尺</b>深需 200÷10＝<b>20 atm</b>，故至少應挑選 20 ATM 以上防水等級的手錶，選(C)。"},
{"q":"大壯將附帶細繩的塑膠板緊貼在中空透明管底部，再緩緩壓入水中，當鬆掉細繩時塑膠板並不會掉落。若不計塑膠板的厚度，則塑膠板不會掉落的原因主要與下列何者最相關？","opts":["塑膠板的重量 ＜ 大氣壓力對塑膠板造成的作用力","塑膠板的重量 ＞ 大氣壓力對塑膠板造成的作用力","塑膠板的重量 ＜ 液體壓力對塑膠板造成的作用力","塑膠板的重量 ＞ 液體壓力對塑膠板造成的作用力"],"ans":2,"sec":"壓力","diff":"中","src":"重點演練","exp":"塑膠板的<b>重量</b>與管內<b>大氣壓力</b>對它造成的作用力<i class=\"hl\">均向下</i>；要使塑膠板不掉落，<b>由下往上</b>的<i class=\"hl\">液體壓力</i>造成的作用力至少須大於塑膠板的重量，故選(C)。"},
{"q":"汽車上有一個測量輪胎某項物理量的裝置，其數值單位為 psi。此單位可表示為 <b>1 psi ＝ 1 ⟬磅力|平方英寸⟭</b>，其中磅力為力的單位，英寸為長度的單位。根據上述資訊，此項裝置的功能最可能為量測汽車輪胎的哪一項物理量？","opts":["每秒轉動次數","胎內的氣體壓力","施於地面的推力","與地面間的摩擦力"],"ans":1,"sec":"壓力","diff":"易","src":"會考113（通過率 79%）","exp":"解題關鍵：<b>長度的平方即為面積</b>。平方英寸是面積單位，故 psi 為<i class=\"hl\">單位面積所受到的力</i>，與<b>壓力</b>的定義相同，故選(B)。"},
{"q":"一裝滿水的塑膠容器靜止<b>浮於水面</b>。X、Y 兩點位於<b>容器內</b>的水中（X 較淺、Y 較深），Z 點位於<b>容器外</b>的水中，且 Y、Z 兩點位於<b>同一水平面</b>上。三點的液體壓力分別為 Px、Py、Pz，則下列關於 Px 的值及 Py、Pz 的大小關係式何者正確？","opts":["Px ＝ 0，Py ＝ Pz","Px ＝ 0，Py ＞ Pz","Px ≠ 0，Py ＝ Pz","Px ≠ 0，Py ＞ Pz"],"ans":3,"sec":"壓力","diff":"難","src":"會考111補考","exp":"解題關鍵：根據 <b>P＝h×d</b>，相同液體中深度越深所受液壓越大。X 點上方仍有水，承受上方水的重量，故 <b>Px ≠ 0</b>。Y 在容器內、Z 在容器外，雖同一水平面，但容器<b>浮</b>在水面上，Y 點上方的水柱<b>高於</b> Z 點上方的水柱，故 <b>Py ＞ Pz</b>，選(D)。"},
{"q":"阿泰到台江國家公園搭乘膠筏，搭船前必須先穿上救生衣。工作人員提醒：「若不小心掉進河裡千萬別驚慌，救生衣會讓您浮起而不致下沉，靜待救援即可」。根據上文判斷，下列關於救生衣的敘述何者正確？","opts":["平均密度小於河水密度，且救生衣完全浸入水中時所受浮力大於救生衣重量","平均密度小於河水密度，且救生衣完全浸入水中時所受浮力等於救生衣重量","平均密度大於河水密度，且救生衣完全浸入水中時所受浮力大於救生衣重量","平均密度大於河水密度，且救生衣完全浸入水中時所受浮力等於救生衣重量"],"ans":0,"sec":"浮力","diff":"中","src":"重點演練・素養題","exp":"救生衣能使<b>人</b>浮起而不下沉，表示它的平均密度<i class=\"hl\">小於</i>河水密度；而且完全浸入水中時所受浮力必須<i class=\"hl\">大於</i>救生衣本身的重量，多出來的浮力才能<b>分擔人體部分重量</b>，使人浮起，故選(A)。"},
{"q":"小山用兩個彈簧秤分別拉住甲、乙兩球，使其靜止不動：<b>甲球</b>由上方的彈簧秤<b>向上拉住</b>並浸在水中；<b>乙球</b>由繫於容器底部的彈簧秤<b>向下拉住</b>並浸在水中。此時兩彈簧秤上均顯示 10 gw，則下列敘述何者正確？","opts":["甲球所受浮力為 10 gw","甲球所受浮力大於其重量","乙球所受浮力為 10 gw","乙球所受浮力大於其重量"],"ans":3,"sec":"浮力","diff":"難","src":"重點演練・素養題","exp":"甲球：向上的拉力(10 gw)＋浮力 ＝ 甲球重量，故甲球所受浮力<b>不一定</b>是 10 gw，且<i class=\"hl\">小於</i>其重量。乙球：向下的拉力(10 gw)＋乙球重量 ＝ 乙球所受浮力，故乙球所受浮力<b>大於 10 gw</b>，且<i class=\"hl\">大於其重量</i>，故選(D)。"},
{"q":"將一木塊投入水中，木塊浮於水面靜止不動，此時<b>浮出液面的體積為 60 cm³</b>、<b>沒入液面的體積為 40 cm³</b>。則下列敘述何者<b>錯誤</b>？（水的密度＝1 g/cm³）","opts":["木塊質量為 40 公克","木塊處於力平衡狀態","木塊所受浮力大於重力","要把木塊全部壓入水中，至少需施力 60 公克重"],"ans":2,"sec":"浮力","diff":"中","src":"重點演練","exp":"(A)浮體：浮力＝物重，B＝40×1＝40 gw，故木塊質量為 40 公克，正確。(B)靜止不動即力平衡，正確。(C)<b>錯誤</b>——木塊為<b>浮體</b>，所受<i class=\"hl\">浮力＝重力</i>，不是大於。(D)全部壓入水中所需施力＝液面上體積所增加的浮力＝60×1＝<b>60 公克重</b>，正確。"},
{"q":"「羊皮筏子」為黃河流域所流傳下來的渡河工具，其製作方式如下：將整張羊皮的頸部以及四足中的三足以繩子繫緊，再從剩餘的一足灌氣到羊皮中，灌飽氣後繫緊此足，即形成羊皮囊；將數十個羊皮囊繫在以木條製成的十字形方格下，即形成羊皮筏子，可載人或貨物順流而下。<br>今在一羊皮筏子上<b>裝載貨物</b>後，再於木條方格下<b>添加五個羊皮囊</b>，則添加羊皮囊前、後，關於羊皮筏子的敘述，下列何者正確？","opts":["排開水的體積不變，且所受浮力不變","排開水的體積變少，且所受浮力不變","排開水的體積變少，且所受浮力變大","排開水的體積變多，且所受浮力變大"],"ans":3,"sec":"浮力","diff":"中","src":"重點演練・素養題","exp":"添加羊皮囊後，羊皮筏子的<b>總重增加</b>；而<i class=\"hl\">浮體所受浮力＝物重</i>，故羊皮筏子所受浮力<b>變大</b>。再由 B＝V排開×d液 可知，浮力變大即<b>排開水的體積變多</b>，故選(D)。"},
{"q":"甲、乙、丙三個<b>相同</b>的試管中，分別裝有密度不同的 X、Y 兩種液體，兩種液體不發生化學反應且互不相溶，靜止平衡時 <b>X 皆位於下層、Y 皆位於上層</b>，所占體積為：<br>　甲：Y 5 mL、X 5 mL<br>　乙：Y 7 mL、X 3 mL<br>　丙：Y 3 mL、X 7 mL<br>若裝有液體的甲、乙、丙三試管，其總質量分別為 m甲、m乙、m丙，則下列關係何者正確？","opts":["m甲 ＝ m乙 ＝ m丙","m甲 ＞ m丙 ＞ m乙","m乙 ＞ m甲 ＞ m丙","m丙 ＞ m甲 ＞ m乙"],"ans":3,"sec":"浮力","diff":"難","src":"會考114（通過率 54%）","exp":"X 位於 Y 的<b>下方</b>，表示 <i class=\"hl\">X 的密度較大</i>。三支試管內的<b>液體總體積相同</b>（都是 10 mL），故<b>X 占的體積越大，總質量越大</b>。X 的體積為丙(7) ＞ 甲(5) ＞ 乙(3)，故 m丙＞m甲＞m乙，選(D)。"},
{"q":"將甲、乙、丙、丁四個不同材質的實心正立方體分別放入 1 L 水中（水的密度為 1.0 g/cm³）。已知四種物體皆不與水發生化學反應，且不吸水也不溶於水。四者的體積與密度如下：<br>　甲：體積 40 cm³、密度 0.5 g/cm³<br>　乙：體積 30 cm³、密度 1.0 g/cm³<br>　丙：體積 20 cm³、密度 2.0 g/cm³<br>　丁：體積 10 cm³、密度 3.0 g/cm³<br>則靜止平衡後，哪一個物體在液面下的體積最大？","opts":["甲","乙","丙","丁"],"ans":1,"sec":"浮力","diff":"難","src":"會考113（通過率 43%）","exp":"解題關鍵：<b>由密度判斷浮沉情形，再判斷液面下的體積</b>。甲(0.5)＜水 → <b>浮體</b>；乙(1.0)＝水 → <b>懸浮體</b>；丙(2.0)、丁(3.0)＞水 → <b>沉體</b>。甲為浮體，排開的水重＝物重 → 液面下體積＝40×0.5÷1＝<b>20 cm³</b>。乙、丙、丁均<b>完全沒入</b>，液面下體積即為其體積，分別為 <b>30</b>、20、10 cm³。故乙最大，選(B)。"},
{"q":"一個邊長為 5 cm 的實心均勻正立方體木塊置入水中，靜止平衡後，木塊<b>露出水面的高度為 2 cm</b>（沒入 3 cm）。若將木塊<b>露出水面的部分切除</b>後，再置入水中，則靜止平衡後木塊的情形最可能為下列何者？","opts":["木塊高 3 cm，露出水面 2 cm、沒入 1 cm","木塊高 3 cm，露出水面 1.2 cm、沒入 1.8 cm","木塊高 3 cm，完全沒入水中但不沉底","木塊高 3 cm，完全沒入並沉在容器底部"],"ans":1,"sec":"浮力","diff":"難","src":"會考112大陸考場","exp":"解題關鍵：<b>浮體的重量＝排開液體重量</b>，即 木塊總體積×d木 ＝ 液面下體積×d水。原本總高 5 cm、沒入 3 cm，故 <i class=\"hl\">總體積：液面下體積＝5：3</i>。切除後木塊的<b>密度不變</b>，此比例仍為 5：3，所以新木塊（高 3 cm）的液面下高度＝3×⟬3|5⟭＝<b>1.8 cm</b>，露出 3－1.8＝<b>1.2 cm</b>，故選(B)。"},
{"q":"除夕時，小華準備南下到嘉義與爺爺、奶奶一起吃團圓飯。在公路上，他看見里程標誌寫著「嘉義 31 km、大林 18 km、斗南 5 km」，則下列小華對此標誌的解讀何者正確？","opts":["目前位置到嘉義還需要 31 分鐘","目前位置到嘉義的路徑長為 31 公里","目前位置到嘉義的位移大小為 31 公里","目前位置到嘉義的直線距離為 31 公里"],"ans":1,"sec":"時間、位移與路徑長","diff":"中","src":"重點演練・素養題","exp":"公路里程標誌標示的是<b>沿著公路行駛的距離</b>，也就是<i class=\"hl\">路徑長</i>，故選(B)。(A)標誌標的是距離不是時間。(C)(D)位移大小＝起點到終點的<b>直線距離</b>，公路會彎曲，所以直線距離會<b>小於</b> 31 公里。"},
{"q":"小佩第一次上學時，向同學詢問教室位置，同學的指引如下：「在你正前方 10 m 處有一棵大樹，你的教室就是大樹東邊第三間教室」。試問描述教室位置的<b>參考點</b>為下列何者？","opts":["小佩","同學","大樹","第三間教室"],"ans":2,"sec":"時間、位移與路徑長","diff":"易","src":"重點演練・素養題","exp":"描述位置時要指出相對於<b>參考點</b>的方向與距離。這裡說「<b>大樹</b>東邊第三間」，方向與距離都是以大樹為基準，故參考點為<i class=\"hl\">大樹</i>，選(C)。"},
{"q":"以甲、乙、丙三個不同的單擺，進行小角度的單擺實驗，其擺動次數與時間的關係為：<b>相同的擺動次數所需的時間，丙 ＞ 乙 ＞ 甲</b>。則三個單擺的擺長關係為下列何者？","opts":["甲 ＝ 乙 ＝ 丙","甲 ＞ 乙 ＞ 丙","丙 ＞ 甲 ＞ 乙","丙 ＞ 乙 ＞ 甲"],"ans":3,"sec":"時間、位移與路徑長","diff":"中","src":"重點演練","exp":"相同擺動次數所需時間越長，表示<b>週期越長</b>，故週期大小為丙＞乙＞甲。而<i class=\"hl\">擺長越長則週期越長</i>，故擺長大小也是<b>丙＞乙＞甲</b>，選(D)。"},
{"q":"某物體進行移動時，關於其位移與路徑長的大小關係，下列何者正確？","opts":["位移大小必小於路徑長","位移大小必大於路徑長","路徑長必等於位移大小","路徑長必不小於位移大小"],"ans":3,"sec":"時間、位移與路徑長","diff":"中","src":"重點演練","exp":"若物體<b>朝固定方向</b>移動，位移大小與路徑長<b>相同</b>；若<b>非固定方向</b>移動（有轉彎或折返），路徑長必<b>大於</b>位移大小。綜合可知 <i class=\"hl\">路徑長 ≧ 位移大小</i>，即「必不小於」，選(D)。"},
{"q":"清日在東西向的直線道路上移動，已知<b>向西為正方向</b>。他的位置(x)與時間(t)關係為：第 0 秒在 x＝－3 m，第 2 秒移到 x＝3 m，第 2～4 秒停留在 x＝3 m，第 7 秒移到 x＝1 m。則清日在第 0～7 秒間的<b>位移大小</b>與<b>路徑長</b>分別為多少 m？","opts":["位移大小 4 m，路徑長 4 m","位移大小 4 m，路徑長 7 m","位移大小 4 m，路徑長 8 m","位移大小 8 m，路徑長 8 m"],"ans":2,"sec":"時間、位移與路徑長","diff":"難","src":"重點演練","exp":"<b>位移</b>為末位置與初位置的直線距離 ＝ 1 －(－3) ＝ <b>4 m</b>。<b>路徑長</b>為實際移動的距離：前段由 －3 走到 3 共走 <b>6 m</b>，後段由 3 走到 1 共走 <b>2 m</b>，合計 6＋2 ＝ <b>8 m</b>，故選(C)。"},
{"q":"戰場上士兵為了避免被敵軍瞄準，通常不會以直線前進，而會以<b>之字形</b>的路線前進。甲路線為<b>直線</b>，乙路線為<b>之字形</b>，兩者皆由 X 點移動至 Y 點。則採用甲、乙兩種不同路線的位移與路徑長關係，下列何者正確？（前項為位移大小，後項為路徑長）","opts":["甲 ＝ 乙／甲 ＝ 乙","甲 ＝ 乙／甲 ＜ 乙","甲 ＜ 乙／甲 ＝ 乙","甲 ＜ 乙／甲 ＜ 乙"],"ans":1,"sec":"時間、位移與路徑長","diff":"中","src":"會考113（通過率 79%）","exp":"解題關鍵：<b>位移為起點到終點的直線距離；路徑長為實際移動的距離</b>。甲、乙的起點（X）與終點（Y）相同，故位移大小 <i class=\"hl\">甲＝乙</i>；乙走之字形，實際經過的距離較長，故路徑長 <i class=\"hl\">甲＜乙</i>，選(B)。"},
{"q":"可慧使用網路上的電子地圖來規劃行程，輸入起點與終點後，電子地圖提供了兩種路線規劃：<br>　<b>步行</b>：40 分鐘、2.3 公里<br>　<b>開車</b>：10 分鐘、4.5 公里<br>下列有關此兩種路線規劃的敘述，何者正確？","opts":["位移相同","路徑長相同","平均速度相同","平均速率相同"],"ans":0,"sec":"時間、位移與路徑長","diff":"易","src":"會考108（通過率 82%）","exp":"(A)位移為位置的變化量，兩者<b>起點相同、終點也相同</b>，故<i class=\"hl\">位移相同</i>，正確。(B)路徑長分別為 2.3 km 與 4.5 km，<b>不同</b>。(C)平均速度＝位移÷時間，位移相同但<b>時間不同</b>，故不同。(D)平均速率＝路徑長÷時間，開車路徑長較大、時間較短，故<b>開車較大</b>。"},
{"q":"新北市的萬里隧道率先實施「區間平均速率」取締車輛超速，此方式是利用偵測設備記錄車輛進入與離開隧道的時間，再換算成平均速率以判定車輛有無超速。已知萬里隧道全長 <b>1.1 公里</b>，隧道內限速 <b>50 公里/小時</b>，今爸爸開車進入萬里隧道的時間為 <b>09：13：00</b>，則爸爸在下列哪個時間<b>之前</b>離開隧道即會被判定為超速？","opts":["09：14：19","09：14：22","09：35：00","09：35：22"],"ans":0,"sec":"速率與速度","diff":"難","src":"重點演練・素養題","exp":"以<b>最高限速</b>行駛整條隧道所需時間 ＝ ⟬1.1|50⟭×3600 ＝ <b>79.2 秒</b> ＝ 1 分鐘 19.2 秒。若花費時間<b>少於</b> 1 分 19.2 秒即為超速，也就是在 09：14：19.2 之前離開就超速，故選(A) 09：14：19。"},
{"q":"下表為甲、乙兩人在直線道路行進時的位置與時間之關係：<br>　時間（秒）：0、1、2、3、4<br>　甲的位置（m）：0、2、4、6、8<br>　乙的位置（m）：1、3、6、9、9<br>則下列敘述何者<b>錯誤</b>？","opts":["第 1～4 秒期間，甲可能做等速度運動","第 1～3 秒期間，乙可能做等速度運動","第 1～4 秒期間，甲的平均速度比乙大","第 1～4 秒期間，乙的平均速度為 2 m/s"],"ans":2,"sec":"速率與速度","diff":"中","src":"重點演練","exp":"(A)甲在第 1～4 秒每秒位移變化量均為 <b>2 m</b>，可能做等速度運動。(B)乙在第 1～3 秒每秒位移變化量均為 <b>3 m</b>，可能做等速度運動。(C)(D)第 1～4 秒：甲的平均速度＝⟬8－2|3⟭＝2 m/s，乙的平均速度＝⟬9－3|3⟭＝2 m/s，兩者<i class=\"hl\">相等</i>，故(C)錯誤、(D)正確。"},
{"q":"某物體做等速度運動，其位置與時間的關係為：t＝0 秒時 x＝10 m，t＝2 秒時 x＝20 m，t＝「?」秒時 x＝35 m。則「?」的值為何？","opts":["5","6","7","8"],"ans":0,"sec":"速率與速度","diff":"中","src":"重點演練","exp":"等速度運動表示<b>平均速度為定值</b>：⟬20－10|2⟭ ＝ ⟬35－10|?⟭，即 5 ＝ ⟬25|?⟭，解得 <b>? ＝ 5 秒</b>。"},
{"q":"400 米賽跑的距離剛好是室外標準跑道最內圈一圈的長度。比賽中選手需跑在自己的跑道上，因內、外圈跑道長度的差異，<b>不同跑道的選手起跑位置需作對應調整</b>（終點相同）。在這項比賽中最先跑完 400 米的選手，他在比賽過程哪一項物理量的大小<b>必</b>高於其他所有選手？","opts":["平均速率","平均速度","過程中速率的最大值","過程中速度的最大值"],"ans":0,"sec":"速率與速度","diff":"中","src":"會考112（通過率 59%）","exp":"解題關鍵：<b>起跑位置不同，但終點相同</b>。每位選手的<b>路徑長相同</b>（都是 400 米），但起點不同故<b>位移不同</b>。平均速率＝⟬路徑長|經過時間⟭，最先跑完者<b>花費時間最少</b>，故<i class=\"hl\">平均速率必最大</i>，選(A)。其餘三者因位移不同或瞬時值不定，<b>不一定</b>高於其他選手。"},
{"q":"圖上 X 點到 Y 點有 S₁、S₂ 兩條路徑可以選擇。小志與阿耀同時由 X 點出發向 Y 點移動，且途中無折返。抵達 Y 點後計算出兩人的數據如下：<br>　小志：平均速度大小 40 km/h、平均速率 60 km/h<br>　阿耀：平均速度大小 40 km/h、平均速率 40 km/h<br>有關誰先抵達 Y 點及他們選擇的路徑，下列敘述何者正確？","opts":["小志先抵達，且兩人選擇相同的路徑","阿耀先抵達，且兩人選擇不同的路徑","兩人同時抵達，且兩人選擇相同的路徑","兩人同時抵達，且兩人選擇不同的路徑"],"ans":3,"sec":"速率與速度","diff":"難","src":"會考110補考","exp":"解題關鍵：<b>平均速度＝位移÷時間，平均速率＝路徑長÷時間</b>。兩人<b>位移相同</b>（都是 X→Y），平均速度也相同（皆 40），故<i class=\"hl\">花費時間相同 → 同時抵達</i>。但路徑長＝平均速率×時間，小志的平均速率較大（60＞40），故<i class=\"hl\">路徑長不同 → 選擇不同路徑</i>，選(D)。"},
{"q":"截至西元 2023 年為止，世界第一高的建築物為杜拜的哈里發塔。今在與哈里發塔最頂端<b>相同高度</b>處，使一<b>靜止</b>小球自由落下，經過 13 秒後落至地面。若重力加速度為 9.8 m/s²，且不計空氣阻力，則哈里發塔的高度約為多少公尺？","opts":["9.8×13","½×9.8×13","9.8×13×13","½×9.8×13×13"],"ans":3,"sec":"加速度與等加速度運動","diff":"中","src":"重點演練・素養題","exp":"靜止落下即 v₀＝0。落地時的速率 v ＝ gt ＝ 9.8×13（m/s）。移動距離＝v-t 圖中線段下方的<b>三角形面積</b> ＝ ½ ×（9.8×13）× 13，故選(D)。（也可直接用 S＝½gt²）"},
{"q":"關於速度與加速度的敘述，下列何者正確？","opts":["速度為零時，加速度也必為零","加速度減少時，速度也必會減少","加速度的方向必與速度的方向相同","加速度固定且不為 0 時，物體必做等加速度運動"],"ans":3,"sec":"加速度與等加速度運動","diff":"中","src":"重點演練","exp":"(A)<b>不一定</b>，例如自由落體在<b>最高點</b>時速度為零，但仍有重力加速度。(B)加速度＝⟬速度變化量|經過時間⟭，加速度減少只代表<b>速度變化量</b>減少，速度本身可能仍在增加或減少。(C)<b>不一定</b>，例如火車煞車時加速度方向與速度方向<b>相反</b>。(D)<i class=\"hl\">加速度維持不變即為等加速度運動</i>，正確。"},
{"q":"有一部車子在筆直的公路上以速度 25 m/s 行駛，若在 10 秒內車速降為 10 m/s，則在這 10 秒內，車子的平均加速度應為多少 m/s²？","opts":["1.5","2.5","－1.5","－2.5"],"ans":2,"sec":"加速度與等加速度運動","diff":"中","src":"重點演練","exp":"平均加速度 ＝ ⟬末速 － 初速|經過時間⟭ ＝ ⟬10 － 25|10⟭ ＝ <b>－1.5 m/s²</b>。負號表示加速度方向與運動方向<i class=\"hl\">相反</i>（減速），選(C)。"},
{"q":"質量 5 kg 的甲球與質量 10 kg 的乙球同時自 50 公尺高處由<b>靜止</b>自由落下，若不計空氣阻力，則關於著地瞬間甲、乙兩球的<b>速度比</b>與<b>所需時間比</b>為何？","opts":["速度比與所需時間比均為 1：1","速度比與所需時間比均為 1：2","速度比為 1：1，所需時間比為 1：2","速度比為 1：2，所需時間比為 1：1"],"ans":0,"sec":"加速度與等加速度運動","diff":"中","src":"重點演練","exp":"不計空氣阻力時，<i class=\"hl\">重力加速度與質量無關</i>，兩球的 g 相同。故掉落<b>相同距離所需時間相同</b>（時間比 1：1）；再根據 v＝gt，<b>著地瞬間速度也相同</b>（速度比 1：1），故選(A)。"},
{"q":"在筆直的道路上有甲、乙、丙、丁四輛車，由四車的速度(v)與時間(t)關係圖可讀出：<b>甲</b>為正值的水平線、<b>乙</b>的速度為 0、<b>丙</b>由 0 開始往負值遞減、<b>丁</b>也由 0 開始往負值遞減但比丙更陡。若 t＝0 s 時四車位於同一位置，則有關 t＞0 s 時車輛間距離的敘述，下列何者正確？","opts":["甲、乙兩車的距離保持不變","丙、丁兩車的距離保持不變","甲、丙兩車的距離愈來愈近","甲、丁兩車的距離愈來愈遠"],"ans":3,"sec":"加速度與等加速度運動","diff":"難","src":"會考111（通過率 60%）","exp":"解題關鍵：<b>v-t 圖中線段與時間軸圍成的面積即為位移大小</b>。(A)乙速度為零、靜止不動，甲持續前進，故距離<b>越來越遠</b>。(B)丁的位移扣除丙的位移後其值<b>逐漸變大</b>，故丙、丁距離越來越遠。(C)甲往正方向、丙往負方向，<b>朝不同方向</b>前進，距離越來越遠。(D)同理，甲、丁朝相反方向且丁更快，距離<i class=\"hl\">愈來愈遠</i>，正確。"},
{"q":"志興家和車站位於同一條筆直的馬路上，這條路上的距離關係為：<br>　醫院 —100 m— 便利商店 —150 m— 銀行 —（未標示）— 書局 —300 m— 車站<br>志興由家門前出發走直線到車站，其速率(v)和時間(t)關係圖為一梯形：由 0 開始上升，在 t＝200 s 時達到 1.0 m/s 並維持到 t＝400 s，再下降至 t＝500 s 時為 0。他在 t＝0 s 出發、t＝500 s 到達車站，且過程中不回頭走重覆路線，則志興家的位置最可能坐落於何處？","opts":["車站與書局之間","書局與銀行之間","銀行與便利商店之間","便利商店與醫院之間"],"ans":1,"sec":"加速度與等加速度運動","diff":"難","src":"會考109（通過率 51%）","exp":"解題關鍵：<b>v-t 圖曲線下方的面積即為位移大小</b>。梯形面積 ＝ ⟬(上底200 ＋ 下底500) × 高1.0|2⟭ ＝ <b>350 m</b>。由車站往回走 350 m：先經過 300 m 到書局，再往回 50 m，位置會落在<i class=\"hl\">書局與銀行之間</i>，故選(B)。"},
{"q":"阿良在搭乘高鐵的過程中，發現玻璃杯中的液面呈現如下變化：<b>先是液面傾向車頭方向，之後液面恢復成水平</b>。則列車在這段時間的運動情形最可能為下列何者？","opts":["列車逐漸減速","列車由靜止開始加速前進","列車逐漸減速至靜止不動","列車逐漸加速至等速度前進"],"ans":2,"sec":"牛頓第一運動定律","diff":"中","src":"重點演練・素養題","exp":"液面<b>傾向車頭</b>表示水因慣性繼續前衝 → 列車<i class=\"hl\">逐漸減速</i>；之後液面<b>呈水平</b>表示列車<i class=\"hl\">靜止或做等速度運動</i>。合起來即「逐漸減速至靜止不動」，故選(C)。（若是加速，液面會傾向<b>車尾</b>。）"},
{"q":"某物體同時受到許多力作用，若這些力的合力為零，則此物體的運動狀態<b>不可能</b>為何？","opts":["靜止不動","等速率運動","等速度運動","圓周運動"],"ans":3,"sec":"牛頓第一運動定律","diff":"中","src":"重點演練","exp":"根據牛頓第一運動定律，合力為零時物體維持原運動狀態——靜止者恆靜止、運動者恆做等速度運動，故(A)(B)(C)都可能。(D)圓周運動的<b>方向不斷改變</b>，表示有向心加速度，<i class=\"hl\">合力不為零</i>，故不可能，選(D)。"},
{"q":"將一小球在<b>光滑</b>軌道上的甲處釋放，若小球分別爬上右側 X、Y 兩個<b>不同斜度</b>的斜面，最後位置分別為乙和丙，則甲、乙、丙三個位置的<b>垂直高度</b>關係為下列何者？（不計任何阻力）","opts":["甲 ＜ 乙 ＜ 丙","甲 ＝ 乙 ＝ 丙","甲 ＞ 乙 ＞ 丙","甲 ＞ 丙 ＞ 乙"],"ans":1,"sec":"牛頓第一運動定律","diff":"中","src":"重點演練","exp":"由<b>伽利略的慣性實驗</b>可知：在光滑軌道上，鐵球自斜面滑下後，<i class=\"hl\">不論另一端的坡度如何，都會到達相同的高度</i>。故甲、乙、丙三個位置的高度<b>相同</b>，選(B)。"},
{"q":"承上題，若軌道的中段為<b>水平</b>，則小球在此處的運動情形，下列何者正確？","opts":["所受合力向右，向右運動的速度越來越快","所受合力向左，向右運動的速度越來越慢","所受合力為零，向右做等速度運動","未受到力的作用，向右做等速度運動"],"ans":2,"sec":"牛頓第一運動定律","diff":"中","src":"重點演練","exp":"小球在水平軌道上時，所受的<b>重力</b>與<b>軌道支撐力</b>互相抵消，<i class=\"hl\">合力為零</i>，故小球做<b>等速度運動</b>，選(C)。(D)錯在「未受到力」——小球仍受重力與支撐力，只是合力為零。"},
{"q":"某電影中出現歹徒挾持駕駛，而駕駛試圖擺脫的場景：<br>　① 一開始汽車<b>等速向前</b>行駛，歹徒坐在駕駛的<b>右後方</b><br>　② 歹徒身體移動至<b>左前方</b>想要攻擊駕駛<br>　③ 駕駛藉由操控汽車，讓歹徒的身體因為<b>慣性</b>而回到原本<b>右後方</b>的角落<br>下列四種操控汽車的方式，哪一個最可能是上述的操控方式？","opts":["先急右轉再急加速","先急右轉再急減速","先急左轉再急加速","先急左轉再急減速"],"ans":2,"sec":"牛頓第一運動定律","diff":"難","src":"會考（通過率 65%）","exp":"解題關鍵：<b>車子加速時物體會向後傾倒，車子減速時物體會向前傾倒</b>（傾向加速度的相反方向）。要把歹徒從<b>左前</b>送回<b>右後</b>：汽車<b>急向左</b>轉，歹徒因慣性往車子的<i class=\"hl\">右方</i>移動；再<b>急加速</b>，歹徒因慣性往車子的<i class=\"hl\">後方</i>移動。故選(C)。"},
{"q":"雅婷和怡君分別對牛頓第一運動定律提出自己的見解：<br>　<b>雅婷</b>：若靜止的物體不受外力作用，則此物體會一直維持靜止。<br>　<b>怡君</b>：若運動中的物體所受合力為零，則此物體會一直作等速度運動。<br>關於兩人的敘述下列何者正確？","opts":["兩人均合理","兩人均不合理","只有雅婷合理","只有怡君合理"],"ans":0,"sec":"牛頓第一運動定律","diff":"中","src":"會考106（通過率 50%）","exp":"解題關鍵：若物體不受外力作用，或所受外力的合力為零，物體必保持原運動狀態。牛頓第一運動定律正是「<b>靜止的物體保持靜止，運動中的物體必做等速度運動</b>」，雅婷說的是前半、怡君說的是後半，<i class=\"hl\">兩人的見解均合理</i>，選(A)。"},
{"q":"日本學者小谷太郎提出：若列車車頭發生強烈碰撞，則每個車廂從移動到靜止所經歷的時間不同，越前面車廂經歷的時間越短，越後面車廂經歷的時間越長；<b>經歷的時間越長則加速度越小，所受的作用力也越小</b>，因此建議乘客盡可能乘坐後方車廂。試問小谷太郎是基於下列何種定律而提出此建議？","opts":["牛頓第一運動定律","牛頓第二運動定律","牛頓第三運動定律","萬有引力定律"],"ans":1,"sec":"牛頓第二運動定律","diff":"中","src":"重點演練・素養題","exp":"「質量相同時，<b>加速度越小則作用力越小</b>」正是 <i class=\"hl\">F＝ma</i> 的關係，屬於<b>牛頓第二運動定律</b>，選(B)。"},
{"q":"水平桌面上有一質量為 1 kg 的靜止木塊，今對木塊施以 2 kgw 的水平力，則此木塊所產生的加速度<b>不可能</b>為下列何者？（g ＝ 10 m/s²）","opts":["0","2","20","25"],"ans":3,"sec":"牛頓第二運動定律","diff":"難","src":"重點演練","exp":"2 kgw ＝ 2×10 ＝ 20 N。若水平面<b>光滑無摩擦力</b>，由 F＝ma 得 a ＝ ⟬20|1⟭ ＝ <b>20 m/s²</b>，這是<i class=\"hl\">最大值</i>。若有摩擦力則加速度會<b>小於</b> 20；若最大靜摩擦力大於施力，木塊靜止不動（a＝0）。故 0～20 都可能，<b>25 不可能</b>，選(D)。"},
{"q":"小華與小明兩兄弟在賣場中一起推著同一臺<b>靜止</b>的推車，兩人各對推車施以同方向 9 N 的水平力，且推車的總質量為 30 kg。若不考慮摩擦力，則 5 秒後推車的速度為多少 m/s？","opts":["0.3","0.6","3","6"],"ans":2,"sec":"牛頓第二運動定律","diff":"中","src":"重點演練","exp":"合力 ＝ 9＋9 ＝ 18 N。由 F＝ma：18 ＝ 30×a → a ＝ <b>0.6 m/s²</b>。再由 v ＝ at ＝ 0.6×5 ＝ <b>3 m/s</b>，選(C)。"},
{"q":"有一質量 4 kg 的木塊靜置在粗糙的水平桌面上。由木塊與桌面的摩擦力對水平施力的關係圖可讀出：摩擦力隨施力線性上升至 <b>8 N</b>（最大靜摩擦力），之後固定為 <b>4 N</b>（動摩擦力）。則當木塊受到 <b>10 牛頓</b>的水平施力作用後，木塊所獲得的加速度為多少 m/s²？","opts":["0.5","1.5","2.0","2.5"],"ans":1,"sec":"牛頓第二運動定律","diff":"難","src":"重點演練","exp":"施力 10 N <b>超過</b>最大靜摩擦力 8 N，故木塊會移動並受到<b>動摩擦力 4 N</b> 作用。合力 ＝ F － f ＝ 10 － 4 ＝ 6 N。由 F＝ma：6 ＝ 4×a → a ＝ <b>1.5 m/s²</b>，選(B)。"},
{"q":"一<b>質量固定</b>的物體在水平面上做向東的直線運動，其速度(v)與時間(t)的關係為：0～4 秒由 0 線性上升到 16 m/s；4～6 秒維持 16 m/s；6～10 秒線性下降到 0。若此物體在 t＝2s、t＝5s、t＝7s 時所受合力的大小分別為 F₂、F₅、F₇，則其大小關係應為下列何者？","opts":["F₂ ＜ F₇ ＜ F₅","F₂ ＞ F₇ ＞ F₅","F₂ ＝ F₇ ＞ F₅","F₂ ＝ F₇ ＜ F₅"],"ans":2,"sec":"牛頓第二運動定律","diff":"難","src":"會考114（通過率 43%）","exp":"解題關鍵：根據 <b>F＝ma</b>，質量固定時<i class=\"hl\">加速度越大則所受合力越大</i>。0～4 秒加速度大小 ＝ ⟬16|4⟭ ＝ 4 m/s²（含 t＝2s）；4～6 秒加速度 ＝ <b>0</b>（含 t＝5s）；6～10 秒加速度大小 ＝ ⟬16|4⟭ ＝ 4 m/s²（含 t＝7s）。故 <b>F₂ ＝ F₇ ＞ F₅</b>，選(C)。"},
{"q":"甲、乙兩個<b>質量相同</b>的物體，靜置於<b>無摩擦力</b>的水平桌面上，分別受到水平外力 F甲、F乙 後作直線運動，兩外力分別施力不同長短的時間後移除。由速度(v)與時間(t)關係圖可知：<b>甲</b>在 0～20 秒由 0 上升到 30 m/s 後維持不變；<b>乙</b>在 0～30 秒由 0 上升到 20 m/s 後維持不變。則有關兩物體受力情形的敘述，下列何者正確？","opts":["F甲 施力時間較長，且外力大小 F甲 ＞ F乙","F甲 施力時間較長，但外力大小 F甲 ＜ F乙","F乙 施力時間較長，但外力大小 F甲 ＞ F乙","F乙 施力時間較長，且外力大小 F甲 ＜ F乙"],"ans":2,"sec":"牛頓第二運動定律","diff":"難","src":"會考112（通過率 65%）","exp":"解題關鍵：<b>質量相同時，施力越大則加速度越大，且施力期間進行等加速度運動</b>。速度有變化即表示受力中，故甲受力 <b>20 秒</b>、乙受力 <b>30 秒</b> → <i class=\"hl\">乙施力時間較長</i>。加速度：甲 ＝ ⟬30|20⟭ ＝ 1.5、乙 ＝ ⟬20|30⟭ ≈ 0.67，甲較大 → <i class=\"hl\">F甲 ＞ F乙</i>，選(C)。"},
{"q":"老師記錄一木塊在水平面上作<b>等加速度運動</b>時的數據，包含體積(P)、質量(Q)、所受合力大小(R)及摩擦力大小(S)，其數值以便條紙遮住。老師要阿德翻開其中<b>兩張</b>便條紙後，再利用牛頓第二運動定律求出此木塊的加速度大小，他應該翻開哪兩張，就能獲得足夠的數據？","opts":["P、R","Q、S","Q、R","R、S"],"ans":2,"sec":"牛頓第二運動定律","diff":"中","src":"會考109補考","exp":"解題關鍵：根據 <b>F＝ma</b>，欲求出 a，則應先得知 <b>F 與 m</b>。表中 <i class=\"hl\">Q 為質量（m）、R 為合力大小（F）</i>，兩者即可算出加速度；體積(P)與摩擦力(S)都不是必要數據（合力已經把摩擦力算進去了），故選(C)。"},
{"q":"天賜要作一份講解「牛頓第三運動定律」的報告，下列何者作為講解此定律的運動範例最為適當？","opts":["排球選手越用力扣球，球飛出去的速率越快","滑雪選手滑雪時，用滑雪桿向後推雪，使自己前進","撐竿跳選手越過的桿子越高，落至地面時的速率越快","田徑選手進行百米賽跑時，通過終點後無法立刻停下來"],"ans":1,"sec":"牛頓第三運動定律","diff":"中","src":"重點演練・素養題","exp":"牛頓第三運動定律為「施力於一物體時，此物體必會給予施力者一<b>反作用力</b>」。(A)越用力速率越快是 <b>F＝ma</b>，屬第二定律。(B)向後推雪、雪給予反作用力使人前進，<i class=\"hl\">正是第三定律</i>。(C)高度越高加速時間越長，屬運動學。(D)無法立刻停下來是<b>慣性</b>，屬第一定律。"},

/* 文字內 ⟦imageN⟧ 標記 → <img>；stem 用大圖(qi)、選項/詳解用行內圖(gi) */
const REP_TAGS=[["br","<br>"],["b","<b>"],["[/]b","</b>"],['i class="hl"','<i class="hl">'],["[/]i","</i>"]];
function rep(t,big){
  let s=esc(t).replace(/⟦([^⟧]+)⟧/g,(m,n)=>{
    const src=IM[UNITS[unit].pfx+n]||IM[n];
    if(!src)return "";
    return '<img class="'+(big?"qi":"gi")+'" src="'+src+'" alt="\u5716">';
  });
  REP_TAGS.forEach(a=>{s=s.replace(new RegExp("&lt;"+a[0]+"&gt;","g"),a[1]);});
  return s
    .replace(/⟬([^|⟭]*)[|]([^⟭]*)⟭/g,(m,a,b)=>'<span class="fr"><i>'+a+'</i><i>'+b+'</i></span>')
    .replace(/□/g,'<i class="hl">□</i>');
}

(3) 在「→」上方或下方可用文字或符號來表示反應所需的條件，如催化劑、加熱（符號為 △）。
</td></tr>
<tr><td class="h">舉例</td><td class="c">2H₂O₂ —〔MnO₂〕→ 2H₂O ＋ O₂　（MnO₂ 為催化劑）</td></tr>

<p>3. <b>化學反應式的平衡</b></p>
<div class="flow">
<div class="fb"><b>① Na ＋ O₂ → Na₂O</b>列出反應物與生成物的化學式。</div>
<div class="fb"><b>② Na ＋ O₂ → 1Na₂O</b>將<i class="hl">最複雜分子</i>的係數定為 1。</div>
<div class="fb"><b>③ 2Na ＋ ½O₂ → 1Na₂O</b>箭頭兩邊的原子種類及數目相同，求得其他分子的係數。</div>
<div class="fb"><b>④ 4Na ＋ O₂ → 2Na₂O</b>將係數化為<i class="hl">最簡單整數</i>，若係數為 1，可省略不寫。</div>
</div>
<p>4. <b>常見的化學反應式</b></p>

<tr><td class="h">活性大金屬與稀酸的反應</td><td>Mg ＋ 2HCl → H₂ ＋ MgCl₂<br><span style="color:var(--muted)">鎂帶＋鹽酸 → 氫氣＋氯化鎂</span></td></tr>

<h4>二、化學計量</h4>
<p>1. <b>意義</b>：利用化學反應式去推算產物的量或是所需反應物的量。</p>
<p>2. ⚠ <b>化學反應式的係數關係</b>：<i class="hl">係數比＝分子數比＝莫耳數比</i>。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>化學反應式</th><th>2H₂</th><th>＋</th><th>O₂</th><th>→</th><th>2H₂O</th></tr>
<tr><td class="h">平衡係數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">分子數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">莫耳數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">質量比<br><span style="font-weight:400;color:var(--muted);font-size:.8rem">（莫耳數×分子量）</span></td><td class="c">1<br><span style="color:var(--muted);font-size:.8rem">(2×2)</span></td><td class="c">：</td><td class="c">8<br><span style="color:var(--muted);font-size:.8rem">(1×32)</span></td><td class="c">：</td><td class="c">9<br><span style="color:var(--muted);font-size:.8rem">(2×18)</span></td></tr>
</table></div>
<p><span class="nt" style="display:block"><b>註1</b>上述的分子數比與莫耳數比是指分子數與莫耳數的<b>變化量</b>比。</span>
<span class="nt" style="display:block"><b>註2</b>反應式的係數比 <i class="hl">≠</i> 質量比。</span></p>
</div>

<div class="box hot"><span class="bt">麻辣私房菜</span>
<p><b>化學計量的解題步驟</b></p>
<div class="flow">
<div class="fb"><b>1</b>先確認反應式<i class="hl">是否已平衡</i>。</div>
<div class="fb"><b>2</b>將<i class="hl">質量轉換成莫耳數</i>。</div>
<div class="fb"><b>3</b>以完全消耗的反應物（<i class="hl">限量試劑</i>）作為基準，再利用「係數比＝莫耳數比」求得其他反應物消耗或生成物產生的莫耳數，再換算成質量。</div>
</div>
<p><span class="eg">例</span>將 16 g 的 H₂ 與 14 g 的 N₂ 進行反應，反應式為 H₂＋N₂→NH₃，則最多可生成多少 g 的氨氣？</p>
<p><span class="sol">解</span>1. 平衡反應式：3H₂＋N₂→2NH₃。<br>
2. 質量轉換成莫耳數：H₂（分子量 2）→ <span class="fr"><i>16</i><i>2</i></span>＝8 mol；N₂（分子量 28）→ <span class="fr"><i>14</i><i>28</i></span>＝0.5 mol。<br>
3. 以限量試劑為基準：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>反應式</th><th>3H₂</th><th>N₂（限量試劑）</th><th>2NH₃</th></tr>
<tr><td class="h">係數比</td><td class="c">3</td><td class="c">1</td><td class="c">2</td></tr>
<tr><td class="h">反應前莫耳數</td><td class="c">8 mol</td><td class="c">0.5 mol</td><td class="c">—</td></tr>
<tr><td class="h">消耗的莫耳數</td><td class="c">0.5×3＝1.5 mol</td><td class="c">0.5 mol</td><td class="c">—</td></tr>
<tr><td class="h">反應後莫耳數</td><td class="c">6.5 mol</td><td class="c">0</td><td class="c">0.5×2＝1 mol</td></tr>
</table></div>
<p>由上述可知，1.5 mol H₂ 與 0.5 mol N₂ 反應，可產生 1 mol NH₃，NH₃ 的質量＝1×17＝<b>17 g</b>。</p>
</div>

<div class="blk">
<h4>二、阿瑞尼斯的電解質解離說（電離說）</h4>
<p>1. <b>內容</b>：電解質在水中會分解成帶正電的<b>陽離子</b>與帶負電的<b>陰離子</b>，靠著<i class="hl">陽、陰離子的移動</i>使水溶液導電。<br>
<span class="eg">例</span>氯化氫在水中會分解成氫離子與氯離子（HCl → H⁺ ＋ Cl⁻）。</p>
<p>2. <b>電解質水溶液的特性</b><br>
(1) 電解質水溶液必為<i class="hl">電中性</i>，即<b>陽離子的總帶電量＝陰離子的總帶電量</b> → 每個陽離子帶電量×陽離子數目＝每個陰離子帶電量×陰離子數目。<br>
<span class="eg">例</span>CaCl₂ 水溶液中，離子數目比 Ca²⁺：Cl⁻＝1：2，總帶電量比 Ca²⁺：Cl⁻＝2×1：1×2＝<b>1：1</b>。<br>
<span class="nt"><b>註</b>電解質水溶液必為電中性，但<b>酸鹼性則不一定為中性</b>。</span><br>
(2) 通電前，離子可以往四面八方自由移動；通電後，<i class="hl">陽離子往負極</i>移動，<i class="hl">陰離子往正極</i>移動。</p>
<div class="box key"><span class="bt">得分關鍵</span>電解質水溶液中，陽、陰離子的<b>總電量必相等</b>，但陽離子的總個數與陰離子的總個數<i class="hl">不一定相等</i>。</div>
</div>

<div class="blk">
<h4>二、影響反應速率的因素</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>因素</th><th>說明與舉例</th></tr>
<tr><td class="h">反應物的<br>本質</td><td>
<p><span class="lb r">關係</span>活性越大，反應速率<i class="hl">越快</i>。</p>
<p><span class="lb e">解釋</span>活性大表示與其他物質反應的能力越大。</p>
<p><span class="lb g">舉例</span>鈣與鋁均會與稀鹽酸反應產生氫氣，但將相同大小的鈣與鋁分別放入相同濃度的稀鹽酸中，因<b>鈣的活性較大</b>，故產生氫氣的速率較快。</p>
</td></tr>
<tr><td class="h">接觸面積</td><td>
<p><span class="lb r">關係</span>接觸面積越大，反應速率<i class="hl">越快</i>。</p>
<p><span class="lb e">解釋</span>粒子<b>碰撞機會變多</b>。</p>
<p><span class="lb g">舉例</span>相同質量下，碳酸鈣<b>顆粒</b>和碳酸鈣<b>粉末</b>分別與相同濃度的稀鹽酸反應時，碳酸鈣粉末較容易與 H⁺ 發生碰撞，故產生二氧化碳的速率較快。</p>
<div class="box tip"><span class="bt">概念補給</span>
<p>將正立方體每邊長 n 等分，共可分成 n³ 塊，總表面積將增加為「<i class="hl">n</i>」倍。以每邊 2 等分為例：</p>
<p>原總表面積：1×1×6＝<b>6</b><br>
切割後總表面積：<span class="fr"><i>1</i><i>2</i></span>×<span class="fr"><i>1</i><i>2</i></span>×6（面）×8（塊）＝<b>12</b><br>
→ 每邊 2 等分，總表面積增加為 <b>2 倍</b></p>
</div>
<div class="box key"><span class="bt">得分關鍵</span>同一物質在相同質量下，總表面積大小為<br>
<i class="hl">溶液狀態 ＞ 粉狀 ＞ 粒狀 ＞ 片狀 ＞ 塊狀</i>。</div>
</td></tr>
<tr><td class="h">濃度</td><td>
<p><span class="lb r">關係</span>濃度越大，反應速率<i class="hl">越快</i>。</p>
<p><span class="lb e">解釋</span>粒子<b>碰撞機會變多</b>。</p>
<p><span class="lb g">舉例</span>將相同的碳酸鈣分別加入 0.5M 鹽酸和 1M 鹽酸中，加入 <b>1M 鹽酸</b>中產生二氧化碳的速率較快。</p>
</td></tr>
<tr><td class="h">溫度</td><td>
<p><span class="lb r">關係</span>溫度越高，反應速率<i class="hl">越快</i>。</p>
<p><span class="lb e">解釋</span>因溫度升高時，粒子<b>能量大且移動速度快</b>，故碰撞次數變多。</p>
<p><span class="lb g">舉例</span>1. 加油站嚴禁煙火，是為了避免高溫引起燃燒或爆炸等化學反應。<br>
　　　2. 食物在低溫時能保存得較久。</p>
</td></tr>
<tr><td class="h">⚠<br>催化劑</td><td>
<p><span class="lb r">關係</span>加入<b>適當的</b>催化劑能加快反應速率。</p>
<p><span class="lb e">解釋</span>催化劑可<i class="hl">降低反應所需的能量</i>。</p><div class="fig"><svg viewBox="0 0 250 150" role="img" aria-label="催化劑降低反應所需能量的能量圖">

<p>1. <b>實驗步驟</b>：分別將白砂糖、麵粉、食鹽以<b>鋁箔紙包覆</b>後，進行<i class="hl">乾餾</i>。</p>

const U10_2=`<div class="blk">

<p>以<b>甲、乙、丙、丁…</b>等來代表<i class="hl">碳原子個數</i>，若碳原子超過 10 個，則以<i class="hl">數字</i>代表碳原子個數。</p>

<div class="blk">
<h4>二、烴類</h4>
<p>1. <b>定義</b>：只含有<i class="hl">碳、氫</i>兩種元素的有機化合物稱為<b>烴</b>，又稱為<b>碳氫化合物</b>。</p>
<div class="box tip"><span class="bt">概念補給</span>烴類可分成：1. <b>烷</b>類（通式為 CₙH₂ₙ₊₂）　2. <b>烯</b>類（通式為 CₙH₂ₙ）　3. <b>炔</b>類（通式為 CₙH₂ₙ₋₂）</div>
<p>2. <b>烷類</b>：烴類的一種，化學式的通式為 <i class="hl">CₙH₂ₙ₊₂</i>（n≥1）。常溫常壓下的性質：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>狀態</th><th>含碳數</th><th>舉例</th><th>特性</th></tr>
<tr><td class="h">氣態</td><td class="c">少</td><td class="c">甲烷、乙烷、丙烷、丁烷</td><td rowspan="3">
(1) <i class="hl">難溶於水</i>，且碳數越多，<b>沸點越高</b>。<br>
(2) <b>完全</b>燃燒時產生 CO₂ 及 H₂O；若<b>氧氣不足</b>時燃燒，則會產生 <i class="hl">CO</i> 及 H₂O。
</td></tr>
<tr><td class="h">液態</td><td class="c">↓</td><td class="c">己烷、辛烷</td></tr>
<tr><td class="h">固態</td><td class="c">多</td><td class="c">正二十烷</td></tr>
</table></div>
<p>3. <b>化石燃料</b>：主要成分為<i class="hl">烴類</i>。</p>
<p>　(1) <b>化石燃料的形成</b></p>
<div class="flow">
<div class="fb"><b>①</b>遠古時代的生物死亡。</div>
<div class="fb"><b>②</b>屍體與泥沙一起沉積在地底，並經由<b>細菌</b>的作用而漸漸分解。</div>
<div class="fb"><b>③</b>經過<b>溫度與壓力</b>的作用，使分解出的有機物進行複雜而緩慢的化學反應，最後形成<i class="hl">原油和天然氣</i>等化石燃料。</div>
</div>
<p>　(2) <b>原油的分餾</b>：原油分餾後可得到石油氣、汽油、煤油、柴油、石蠟、潤滑油和瀝青等多種物質，這些物質內含多種烴類，屬於<i class="hl">混合物</i>。<br>
<span class="nt"><b>註</b>分餾是將複雜的液態混合物加熱，利用其中各種物質<b>沸點高低不同</b>，使其分離的過程。</span></p>
<p>　⚠ (3) <b>天然氣與液化石油氣</b>：由多種烴類組成的<i class="hl">混合物</i>。<br>
<span class="nt"><b>註</b>液化石油氣是將石油分餾出的石油氣，<b>高壓液化</b>所形成。</span></p>
<div class="mtabwrap"><table class="ctab">

<tr><td class="h">天然氣<br>（天然瓦斯）</td><td class="c">甲烷（CH₄）</td><td class="c">無色、無味的氣體</td><td class="c">以<b>管線</b>輸送</td></tr>
<tr><td class="h">液化石油氣<br>（桶裝瓦斯）</td><td class="c">丙烷（C₃H₈）、丁烷（C₄H₁₀）</td><td class="c">無色、無味的氣體</td><td class="c">以<b>鋼桶</b>運送</td></tr>
</table></div>
<div class="box key"><span class="bt">得分關鍵</span>天然氣與液化石油氣均為<i class="hl">混合物</i>，常溫常壓下均為<i class="hl">氣態</i>。</div>
</div>

<div class="blk">
<h4>三、醇類</h4>
<p>1. <b>定義</b>：結構中含有 <i class="hl">OH 原子團</i>的有機化合物，化學式的通式為 <b>CₙH₂ₙ₊₁OH</b>（n≥1）。</p>
<p>2. <b>甲醇與乙醇的比較</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>化學式</th><th>性質</th></tr>
<tr><td class="h">甲醇<br>（俗稱<i class="hl">木精</i>）</td><td class="c">CH₃OH</td><td>

(1) 無色液體，在實驗室常作為<b>溶劑及燃料</b>，可與水以<i class="hl">任意比例</i>混合。<br>
(2) 醫藥上常作為<b>消毒劑</b>；乙醇水溶液的濃度在 <i class="hl">75%</i> 時的殺菌效果最佳。<br>

<div class="mtabwrap"><table class="ctab">

</td></tr>

<div class="box key"><span class="bt">得分關鍵</span><b>蟻</b>酸與<b>乙</b>酸的讀音相同，須注意區別！</div>
</div>

<span class="fml">醇 ＋ 有機酸 —〔濃硫酸〕⇌ 酯 ＋ 水</span>
<div class="mtabwrap"><table class="ctab">

<tr><td class="h">澱粉</td><td>
1. 由<i class="hl">葡萄糖</i>聚合而成，可經由<b>澱粉酶</b>水解成葡萄糖。<br>
2. 屬於<b>醣類</b>的一種，醣類中氫、氧原子數目比與水相同，均為 <i class="hl">2：1</i>，故醣類又稱為<i class="hl">碳水化合物</i>。<br>
<span class="eg">例</span>葡萄糖為碳水化合物，其化學式 C₆H₁₂O₆ 可寫成 C₆(H₂O)₆。<br>
3. <b>澱粉的檢驗</b>：澱粉可使<span class="res c-brown">黃褐色</span>的<b>碘液</b>呈 <span class="res c-blueblack">藍黑色</span>。
</td></tr>
<tr><td class="h">纖維素</td><td>
1. 由<i class="hl">葡萄糖</i>聚合而成，但<b>聚合方式與澱粉不同</b>，人體<b>無法分解</b>纖維素，但纖維素可幫助消化。<br>
2. 為植物<i class="hl">細胞壁</i>的主要成分。
</td></tr>
<tr><td class="h">蛋白質</td><td>
1. 由<i class="hl">胺基酸</i>聚合而成，含有碳、氫、氧、<b>氮、硫</b>等元素。<br>
2. 為構成<i class="hl">細胞</i>的主要物質。<br>
3. 容易受到<b>光、熱和酸</b>的作用而變質。<br>
<span class="eg">例</span>將透明的蛋白加熱後就會變成白色的固體。
</td></tr>
</table></div>
<div class="box key"><span class="bt">得分關鍵</span>
<p>1. 須注意<b>碳水化合物</b>（含碳、氫、氧，H：O＝2：1）與<b>碳氫化合物</b>（只含碳、氫）的差別！<br>
2. <b>脂質</b>為<i class="hl">酯類</i>，屬於<b>小分子化合物</b>，<i class="hl">並非聚合物</i>。</p>
</div>

<h4>一、摩擦力</h4>
<p>1. <b>定義</b>：施力於物體時，物體與接觸面間會產生一<i class="hl">阻止物體運動</i>的作用力，稱為摩擦力。</p>
<p>2. <b>種類</b>：分為<b>靜摩擦力</b>與<b>動摩擦力</b>。</p>
<div class="box tip"><span class="bt">概念補給</span>動摩擦力<i class="hl">恆比最大靜摩擦力小</i>。</div>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>靜摩擦力</th><th>⚠ 最大靜摩擦力</th><th>動摩擦力</th></tr>

<div class="box hot"><span class="bt">麻辣私房菜</span>
<p><b>1. 浮力大小的判斷</b></p>
<p>(1) 甲、乙兩物體<b>重量相同</b>，體積甲＞乙。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>情形</th><th>兩者皆為浮體</th><th>甲浮、乙沉</th><th>兩者皆為沉體</th></tr>
<tr><td class="h">運用概念</td><td>浮體所受浮力＝物重</td><td>浮體所受浮力＝物重<br>沉體所受浮力＜物重</td><td>所受浮力＝排開液體的重量</td></tr>
<tr><td class="h">浮力大小</td><td>兩物體重量相同，故所受浮力為 <i class="hl">甲＝乙</i>。</td><td>兩物體重量相同，故所受浮力為 <i class="hl">甲＞乙</i>。</td><td>排開液體的體積為甲＞乙，故所受浮力為 <i class="hl">甲＞乙</i>。</td></tr>
</table></div>
<p>(2) 甲、乙兩物體<b>體積相同</b>，重量甲＞乙。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>情形</th><th>兩者皆為浮體</th><th>甲沉、乙浮</th><th>兩者皆為沉體</th></tr>
<tr><td class="h">運用概念</td><td>浮體所受浮力＝物重</td><td>所受浮力＝排開液體的重量</td><td>所受浮力＝排開液體的重量</td></tr>
<tr><td class="h">浮力大小</td><td>重量為甲＞乙，故所受浮力為 <i class="hl">甲＞乙</i>。</td><td>排開的液體體積為甲＞乙，故所受浮力為 <i class="hl">甲＞乙</i>。</td><td>排開的液體體積為甲＝乙，故所受浮力為 <i class="hl">甲＝乙</i>。</td></tr>
</table></div>
<div class="box key" style="margin-top:10px"><span class="bt">結論</span>因沉體、浮體、懸浮體所受浮力<b>皆遵守</b> B＝V排開液體×d液體，故<i class="hl">優先以此概念解題</i>；若條件不足，再以「浮體與懸浮體所受的浮力＝物體重量」、「沉體所受浮力＜沉體重量」等概念解題。</div>

<p><b>2. 浮力的應用</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">浮體在<br>液面下的體積</td><td>根據「浮體所受浮力＝物重」，可列式（X 為液面上的體積，Y 為液面下的體積）：<br>
<span class="cb">Y × d液 ＝ V物體 × d物 → Y ＝ <span class="fr"><i>d物</i><i>d液</i></span> × V物體</span><br>
→ 浮體的密度<i class="hl">越接近液體密度</i>時，在液面下的體積越大。</td></tr>
<tr><td class="h">使浮體沉沒<br>所需的施力</td><td>若要使浮體完全沉沒，則物體<b>增加的浮力</b>（<span class="cb">X × d液</span>）即為所需的施力。</td></tr>
<tr><td class="h">船所受<br>浮力的改變</td><td>
❶ <b>船從淡水駛向海水</b>：船為浮體，船所受浮力＝船重，故<i class="hl">浮力不變</i>。又淡水密度較小、浮力相同，故船在<b>淡水</b>中時液面下的體積<b>較大</b>；在<b>海水</b>中時液面下的體積<b>較小</b>。<br>
❷ <b>船沉沒</b>：船由浮體變為沉體，表示船所受浮力＜船重，這是因為<i class="hl">水充滿船艙</i>，使得船排開水的體積變少。</td></tr>
<tr><td class="h">潛水艇的<br>浮潛原理</td><td>潛水艇的<b>體積固定不變</b>，故排開水的體積固定。若要使潛水艇<b>上浮</b>，則需<i class="hl">減輕重量</i>，即將艇內的海水<b>排出</b>；同理，潛水艇<b>吸入</b>海水後即會下沉。</td></tr>
</table></div>
</div>

<div class="blk">
<h4>四、浮力的其他應用</h4>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h" rowspan="2">魚鰾</td><td>當<b>魚鰾膨脹</b>，魚的體積會增加，使得魚所受浮力增加，魚就能<i class="hl">上浮</i>。</td></tr>
<tr><td>當<b>魚鰾收縮</b>，魚的體積會減少，使得魚所受浮力減少，魚便會<i class="hl">下沉</i>。</td></tr>
<tr><td class="h">熱氣球<br>與天燈</td><td>加熱內部的氣體，使氣體<b>體積膨脹</b>，當所受<i class="hl">浮力大於其重量</i>時，就能往上飄。</td></tr>
</table></div>
</div>

<div class="cq"><span class="tn">題型 2</span><b>施力將浮體壓入水中</b><span class="pair">搭配 重點演練第 3 題</span></div>

<p class="stepline"><span class="sol">解</span>完全壓入水中時，<b>向下總力 ＝ 向上總力</b></p>
<p>→ 手的施力 ＋ 木塊重量 ＝ 木塊所受浮力 ＝ 木塊排開的水體積 × 水的密度<br>
→ F ＋ 100×0.6 ＝ 100×1<br>
→ <b>F ＝ 40 gw</b></p>

<p><b>1. 等加速度運動的判斷方法</b></p>
<p>(1) <b>速度大小</b>有規律性的改變：</p>
<div class="mtabwrap"><table class="ctab" style="min-width:0">
<tr><td class="h">時間（s）</td><td class="c">0</td><td class="c">1</td><td class="c">2</td><td class="c">3</td></tr>
<tr><td class="h">速度（m/s）</td><td class="c">3</td><td class="c">7</td><td class="c">11</td><td class="c">15</td></tr>
<tr><td class="h">變化量</td><td class="c">—</td><td class="c c-green">＋4</td><td class="c c-green">＋4</td><td class="c c-green">＋4</td></tr>
</table></div>
<p>(2) <b>位移變化量</b>有規律性的改變：相鄰兩點距離依序為 3、7、11、15 cm，每段<b>多 4 cm</b>（單位時間的位移＝速度）。</p>

<p><b>2. 等加速度運動的三大公式</b></p>
<p>(1) <b>推導過程</b>（v：末速、v₀：初速）</p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">①</td><td>加速度 a ＝ <span class="fr"><i>v － v₀</i><i>t</i></span>　→　<span class="cb">v ＝ v₀ ＋ at</span></td></tr>
<tr><td class="h">②</td><td>位移 S ＝ 梯形面積 ＝ <span class="fr"><i>(v₀＋v) × t</i><i>2</i></span>　將 ① 代入 →　<span class="cb">S ＝ v₀t ＋ ½at²</span></td></tr>
<tr><td class="h">③</td><td>將前兩個式子聯立後，可得　<span class="cb">v² ＝ v₀² ＋ 2aS</span></td></tr>
</table></div>
<p><span class="nt"><b>註</b>上述公式是利用 v-t 圖推導而得，因此在解題時建議<b>畫出 v-t 圖</b>，再利用圖形求解。</span></p>
<p>(2) <b>應用</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th colspan="3">初速度 v₀ ＝ 0 時</th><th colspan="3">初速度 v₀ ＝ 0 的自由落體（重力加速度為 g）</th></tr>
<tr><td class="c">v ＝ at</td><td class="c">S ＝ ½at²</td><td class="c">v² ＝ 2aS</td>
<td class="c">v ＝ gt</td><td class="c">S ＝ ½gt²</td><td class="c">v² ＝ 2gS</td></tr>
</table></div>
</div>

<span class="nt"><b>註</b>自由落體運動包含<b>靜止下落、上拋、下拋、平拋、斜拋</b>。</span></p>

<p><b>A</b>　物體在最高點時，運動方向由向上改為向下，在方向轉變的過程中，<b>速度會先變為零</b>；但物體在全程中均受地球引力作用，故<i class="hl">全程均有一固定大小的加速度，且恆指向地心</i>。</p>

(1) 第 0～10 秒間，汽車的平均加速度為何？<br>
(2) 在第 12 秒時，汽車的加速度為何？</p>
<p class="stepline"><span class="sol">解</span>(1) 平均加速度 ＝ <span class="fr"><i>速度變化量</i><i>經過時間</i></span> ＝ <span class="fr"><i>4 － 10</i><i>10</i></span> ＝ <b>－0.6 m/s²</b></p>
<p>(2) 第 12 秒的加速度 ＝ 第 10～13 秒間的平均加速度 ＝ <span class="fr"><i>10 － 4</i><i>3</i></span> ＝ <b>2 m/s²</b></p>

<h4>一、牛頓第一運動定律（慣性定律）</h4>
<p>1. <b>內容</b>：在<i class="hl">不受外力作用</i>，或<i class="hl">受外力作用但合力為零</i>時，物體有<b>維持原來運動狀態</b>的特性，此特性稱為<i class="hl">慣性</i>。<br>
<span class="nt"><b>註</b>維持原來運動狀態為：<b>靜止者恆靜止，運動者恆做等速度運動</b>。（口訣：<i class="hl">靜者恆靜，動者恆動</i>）</span></p>
<div class="box tip"><span class="bt">概念補給</span>兩力的合力為零時，此兩力<b>大小相等、方向相反</b>，作用在<b>同一直線且相同物體</b>上。</div>
<div class="box myth"><span class="bt">迷思問答</span>
<p><b>Q　當物體未受力或所受合力為零時，物體必呈靜止狀態？</b></p>
<p><b>A</b>　當物體未受力或所受合力為零時，物體會<b>維持原來的運動狀態</b>，有可能為<i class="hl">靜止</i>，也有可能是做<i class="hl">等速度運動</i>。</p>
</div>
<p>2. <b>日常生活中的慣性現象</b></p>

<tr><td>在等速行駛的車上用手向上垂直拋球，球將落回手中 → 球在空中會<b>繼續進行水平移動</b></td></tr>

<p>2. <b>胚胎發育的方式</b>：分為<i class="hl">卵生</i>和<i class="hl">胎生</i>。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>受精方式</th><th>胚胎<br>發育場所</th><th>養分<br>來源</th><th>卵大小</th><th>子代<br>存活率</th><th>單次<br>產卵量</th><th>舉例</th></tr>
<tr><td class="h">卵生</td><td class="c">體內或體外</td><td class="c"><i class="hl">母體外</i></td><td class="c">卵</td><td class="c">較大</td><td class="c">較低</td><td class="c">較多</td><td>昆蟲、兩生類、鳥類、多數魚類和爬蟲類</td></tr>
<tr><td class="h">胎生</td><td class="c">體內</td><td class="c"><i class="hl">母體內</i></td><td class="c">母體</td><td class="c">較小</td><td class="c">較高</td><td class="c">較少</td><td>多數哺乳類<span class="nt"><b>註</b>鴨嘴獸和針鼴為<b>卵生哺乳類</b>。</span></td></tr>
</table></div>
<div class="box tip"><span class="bt">小提示</span>
<p>1. 親代護卵、育幼行為<b>完善</b> → 子代存活率<b>高</b> → 單次產卵量<b>少</b>，如鳥類、人類；<br>　 親代<b>無</b>護卵、育幼行為 → 子代存活率<b>低</b> → 單次產卵量<b>多</b>，以提高子代存活率，如珊瑚。</p>
<p>2. 卵生動物中，<i class="hl">體外受精者卵無硬殼，體內受精者卵有硬殼</i>。</p>
<p>3. <b>試管嬰兒</b>：父方的精子和母方的卵在母體外結合成受精卵，發育成胚胎後再植入母體子宮內繼續發育為胎兒，故試管嬰兒為<i class="hl">有性生殖、體外受精、胎生</i>。</p>
</div>
<p>3. <b>動物的生殖（繁殖）行為</b></p>
<p>（1）<b>求偶行為</b>：用以吸引同種異性，以產生後代。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>求偶方式</th><th>氣味</th><th>顏色</th><th>聲音</th><th>發光</th><th>行為</th></tr>
<tr><td class="h">舉例</td><td class="c">蛾類、哺乳類</td><td class="c">鮭魚體色變鮮豔<br>雄孔雀開屏</td><td class="c">雄蛙的鳴叫</td><td class="c">螢火蟲特定的<br>發光頻率</td><td class="c">雄、雌丹頂鶴<br>的求偶舞</td></tr>
</table></div>
<p>（2）<b>護卵及育幼行為</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>實際行為</th></tr>
<tr><td class="h">蝦、蟹</td><td>雌蝦、雌蟹將受精卵黏附在<b>腹部</b>以護卵。</td></tr>
<tr><td class="h">企鵝</td><td>母企鵝產卵後，由公、母企鵝<b>共同孵卵</b>，小企鵝出生後，公、母企鵝會吐出食糜餵食小企鵝。</td></tr>
<tr><td class="h">臺灣獼猴</td><td>母猴會用<b>乳汁</b>哺育幼兒，細心照料，直到小獼猴長大獨立。</td></tr>
</table></div>
</div>

<div class="blk">
<h4>二、開花植物的有性生殖</h4>
<p>1. 開花植物（<b>被子植物</b>）以<i class="hl">生殖器官</i>（花、果實、種子）進行有性生殖，稱為<i class="hl">種子繁殖</i>。<br>
<span class="nt"><b>小提示</b>裸子植物的生殖器官為<b>毬果</b>和<b>種子</b>。</span></p>
<p>2. <b>花的構造</b>：典型的花包括<i class="hl">萼片</i>、<i class="hl">花瓣</i>、<i class="hl">雄蕊</i>和<i class="hl">雌蕊</i>等四個部分，共同著生於<b>花托</b>上。</p>

<p>2. 已交配的母雞產下<b>受精蛋（2n）</b>，可孵出小雞；未交配的母雞也能產下<b>未受精蛋（n）</b>，但不能孵出小雞。</p>

<h4>三、花的觀察</h4>
<p>1. <b>觀察花的外形</b>：利用視覺、嗅覺觀察，若花朵顏色鮮豔、具有香氣，可初步判斷為<i class="hl">蟲媒花</i>。</p>
<p>2. <b>觀察花粉</b><br>
（1）花粉粒微小，通常須用<i class="hl">複式顯微鏡</i>觀察。<br>
（2）花粉粒的外形、顏色和花紋會因植物種類的不同而有差異。</p>
<p>3. <b>觀察子房與胚珠</b><br>
（1）須切開雌蕊基部膨大處（<b>子房</b>），以觀察胚珠；可用<i class="hl">解剖顯微鏡</i>觀察。<br>

<div class="blk">
<h4>三、遺傳法則</h4>
<p>1. <b>遺傳法則</b>：由<i class="hl">孟德爾</i>進行<b>豌豆雜交實驗</b>後歸納提出，他因此被稱為<i class="hl">遺傳學之父</i>。</p>
<p>2. 綜合孟德爾的遺傳法則與後人的補充與修改，等位基因和性狀間的關係可描述如下：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>等位基因與性狀的關係</th><th colspan="2">舉例</th></tr>
<tr><td class="h">等位<br>基因<br>型式</td><td>1. 個體的性狀由<i class="hl">等位基因的組合型式</i>決定。<br>2. 等位基因有兩種型式：<br>　（1）<i class="hl">顯性</i>，用<b>大寫</b>英文字母來表示。<br>　（2）<i class="hl">隱性</i>，用<b>小寫</b>英文字母來表示。</td><td colspan="2">1. 豌豆由<b>一對</b>等位基因控制莖的高度。<br>2. 控制莖高度的等位基因型式有兩種：<br>　（1）控制高莖的顯性等位基因：用 T 表示。<br>　（2）控制矮莖的隱性等位基因：用 t 表示。</td></tr>
<tr><td class="h">基因型<br>表現型</td><td>1. <i class="hl">基因型</i>：等位基因的組合型式。<br>2. <i class="hl">表現型</i>：個體某性狀所表現出的特徵。</td><td colspan="2">1. 控制豌豆莖高度的基因型有 TT、Tt、tt。<br>2. 豌豆莖高度的表現型則有高莖和矮莖兩種。</td></tr>
<tr><td class="h" rowspan="4">性狀<br>特徵</td><td rowspan="4">成對等位基因中：<br>1. 兩者均為顯性 → 表現出<b>顯性</b>性狀特徵。<br>2. 兩者均為隱性 → 表現出<b>隱性</b>性狀特徵。<br>3. <i class="hl">一為顯性，一為隱性</i>時，<b>只有顯性</b>等位基因所控制的性狀特徵才會表現。</td><th>基因型</th><th>表現型</th></tr>
<tr><td class="c">TT</td><td class="c">高莖（顯性性狀特徵）</td></tr>
<tr><td class="c">tt</td><td class="c">矮莖（隱性性狀特徵）</td></tr>
<tr><td class="c">Tt</td><td class="c">高莖（顯性性狀特徵）</td></tr>
</table></div>
<div class="box tip"><span class="bt">小提示</span>
<p>1. 孟德爾以豌豆作遺傳實驗的原因：<b>生長期短、容易大量栽培、特徵明顯易觀察、授粉過程能以人為控制</b>。</p>
<p>2. <i class="hl">基因型相同則表現型相同，表現型相同則基因型可能不同</i>。</p>
</div>
<p>3. <b>等位基因經過減數分裂和受精作用之後的變化</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>說明</th><th>舉例</th></tr>
<tr><td class="h">減數<br>分裂</td><td>1. 成對等位基因彼此<b>獨立</b>，並在<i class="hl">形成配子時彼此分離</i>。<br>2. 配子中只含有<b>成對等位基因中的一個</b>。</td><td rowspan="2"><div class="fig"><svg width="560" viewBox="0 0 560 320" role="img" aria-label="等位基因經減數分裂與受精作用的變化：親代雙套的成對等位基因在形成配子時彼此分離，配子為單套，精卵結合後又恢復成對狀態">

<p>2. 應用棋盤方格法，可得下列六種親代基因型的配對結果：</p>
<div class="mtabwrap"><table class="ctab">

</table></div>

const B7_3=`<div class="blk">
<h4>一、突變</h4>
<p>1. <b>突變</b>：為<i class="hl">遺傳物質發生變異</i>的情形。</p>
<div class="box tip"><span class="bt">延伸補充</span>美國遺傳學家<b>莫根</b>，在眾多紅眼果蠅中發現<b>白眼果蠅</b>，進一步研究出<i class="hl">突變</i>的現象。</div>
<p>2. <b>造成基因突變的原因</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>原因</th><th>說明</th><th>機率</th></tr>
<tr><td class="h">自然突變</td><td class="c">在自然界<b>自行發生</b></td><td class="c"><i class="hl">非常低</i></td></tr>
<tr><td class="h">人為誘變<br><span class="nt">物理、化學因子<br>引起的突變</span></td><td>當基因接觸到下列因子可能會造成突變：<br>1. <i class="hl">物理因子</i>：如紫外光、核輻射、放射線和 X 光。<br>2. <i class="hl">化學因子</i>：如亞硝酸鹽、黃麴毒素、某些防腐劑和染劑、感染某些病毒。</td><td class="c"><i class="hl">較高</i></td></tr>
</table></div>
<p>3. <b>突變可能的影響</b><br>
（1）<i class="hl">影響生物的性狀表現</i>。<span class="nt"><b>例</b>膚色基因若發生異常，會導致體表缺乏色素而接近白色，成為所謂的<b>白化個體</b>。</span><br>
（2）<i class="hl">造成疾病、甚至造成生物死亡</i>。<span class="nt"><b>例</b>癌症是由於細胞中的遺傳物質（DNA）發生突變所造成。</span></p>
<p>4. <b>突變的遺傳</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>突變發生的位置</th><th>是否遺傳給子代</th><th>結果</th></tr>
<tr><td class="h">體細胞</td><td class="c"><i class="hl">不會</i>遺傳給子代</td><td>只會在個體本身表現出突變的特徵（如：<b>癌症</b>）</td></tr>
<tr><td class="h">生殖細胞</td><td class="c">突變的遺傳物質<i class="hl">有機會</i>遺傳給子代</td><td>會改變後代的特徵（如：<b>遺傳性疾病</b>）</td></tr>
</table></div>
<div class="box tip"><span class="bt">小提示</span>突變若發生在<b>受精卵</b>，則此受精卵發育而成的個體<i class="hl">會</i>受突變影響。</div>
<p>5. <b>突變的利弊</b><br>
（1）<b>優點</b>：① 人類可運用突變的原理，<i class="hl">篩選出有利的特徵</i>，培育出所需要的品種。② 使生物更能<i class="hl">適應環境的變化</i>，有利演化。<br>
（2）<b>缺點</b>：突變通常對個體本身或其子代<b>有害</b>。</p>
</div>

<div class="blk">
<h4>二、遺傳疾病與遺傳諮詢</h4>
<p>1. <b>人類常見的遺傳疾病</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th colspan="2">致病原因</th><th>病名</th><th>疾病症狀</th></tr>
<tr><td class="h" colspan="2"><i class="hl">染色體數目異常</i>：<br>第 21 對染色體多了一條</td><td class="c">唐氏症</td><td>智能不足、器官發育不完全</td></tr>
<tr><td class="h" rowspan="5">基因<br>突變</td><td class="h" rowspan="2">體染色體<br>隱性遺傳</td><td class="c">白化症</td><td>無法合成黑色素，全身髮膚呈白色、虹膜呈紅色</td></tr>
<tr><td class="c">鐮刀型貧血症</td><td>紅血球變形以致於阻塞血管，導致局部缺血、梗塞</td></tr>
<tr><td class="h">體染色體<br>顯性遺傳</td><td class="c">軟骨發育不全症</td><td>骨骼發育不良、身材矮小、頭顯得大而手腳短、脊椎彎曲</td></tr>
<tr><td class="h" rowspan="2">X 染色體隱性遺傳<br>（<i class="hl">性聯遺傳</i>）</td><td class="c">血友病</td><td>血漿中缺乏凝血因子，一旦受傷會血流不止</td></tr>
<tr><td class="c">紅綠色盲</td><td>無法分辨顏色（紅／綠）的差異</td></tr>
</table></div>
<div class="box tip"><span class="bt">小提示</span>近親通婚容易讓雙方家族的<i class="hl">隱性等位基因結合</i>，生出患有遺傳疾病的後代，因此法律上禁止。</div>
<p>2. <b>遺傳諮詢</b><br>
（1）各大醫院有遺傳諮詢或優生保健門診，可提供民眾諮詢嬰兒<i class="hl">罹患遺傳疾病的機率</i>與資訊，以作為計畫生育的參考。<span class="nt"><b>註</b>遺傳諮詢<b>不處理</b>新生兒性別及智商高低的問題。</span><br>
（2）透過<i class="hl">新生兒篩檢</i>，可盡早發現新生兒的先天性遺傳疾病，以設法讓疾病傷害降到最低。</p>
<div class="box tip"><span class="bt">延伸補充</span>
<p>1. 愛滋媽媽或帶有 B 型肝炎病毒的母親，經懷孕而將病毒傳給新生兒，稱為<i class="hl">垂直感染</i>，<b>並非遺傳</b>。</p>
<p>2. <b>性聯遺傳</b>為基因位於<i class="hl">性染色體</i>上的遺傳現象，使男、女表現型比例不同。大部分性聯遺傳致病基因位於 <b>X 染色體</b>上，如紅綠色盲、血友病以及蠶豆症等，也有少部分存在於 <b>Y 染色體</b>上，如人類外耳道多毛症。</p>
</div>
</div>`;

<p>3. <b>育種</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">定義</td><td colspan="2">人類從動、植物的<i class="hl">變異</i>中刻意<b>篩選、培育</b>出特殊品種的過程</td></tr>
<tr><td class="h">目的</td><td colspan="2">滿足農、林、漁和畜牧業的需求或利益考量，解決農業和糧食等問題</td></tr>
<tr><td class="h" rowspan="2">方式<br>演變</td><th>傳統　→</th><th>→　現代</th></tr>
<tr><td>篩選出符合需求的品種，<i class="hl">逐代繁殖</i>，最後培育出所要的品種<span class="nt"><b>例1</b>從鯽魚培育出金魚<br><b>例2</b>從野生甘藍菜培育出花椰菜、大頭菜和高麗菜</span></td><td>運用<i class="hl">基因轉殖</i>等生物技術，在<b>短時間內</b>培育出不同的品種<span class="nt"><b>例</b>轉殖生長激素基因的鮭魚，生長速度是傳統鮭魚的一倍</span></td></tr>
</table></div>
<p>4. <b>親子鑑定</b>：因子代的 DNA 一半來自父親、一半來自母親，故若為親子關係，則 DNA 有 <i class="hl">50%</i> 的相似度。</p>
<p>5. <b>臍帶血</b>：胎兒的臍帶血內含有豐富的<i class="hl">幹細胞</i>（未分化的細胞，能分化成多種細胞），可用於醫療。</p>
<p>6. <b>生物技術的發展與隱憂</b><br>
（1）生物技術的發展對人類的<b>經濟和生活</b>帶來很大的便利。<br>
（2）生物技術也在<i class="hl">生態、倫理、法律和社會</i>層面造成衝擊，值得深思。</p>

<h4>二、化石</h4>
<p>1. <b>生物演化的證據</b>：化石是演化的<i class="hl">直接證據</i>。</p>
<p>2. <b>定義</b>：古生物的<b>遺骸</b>或其<b>活動遺跡</b>經漫長的地質作用而被保存，大都於<i class="hl">沉積岩</i>中發現。</p>

<p>3. <b>化石的形成</b></p>
<div class="fig"><svg width="560" viewBox="0 0 560 66" role="img" aria-label="化石的形成：生物在容易被掩埋的環境中死亡，遺骸較堅硬的部分被掩埋在岩層中，經漫長時間與複雜地質作用後形成化石">

<p><span class="nt"><b>註</b>在適宜環境中，生物遺骸可能被<b>較完整的保留</b>下來，並形成化石。<br><b>例</b>西伯利亞永凍層中的猛獁象（長毛象）化石仍保有柔軟組織、琥珀中的昆蟲化石。</span></p>
<p>4. <b>化石提供的訊息</b><br>
（1）古生物的<i class="hl">存在</i>。<br>
（2）古生物的<i class="hl">型態與構造、食性</i>。<span class="nt"><b>小提示</b>大多數化石<b>無法</b>推測動物體表顏色。</span><br>
（3）古生物的<i class="hl">生存年代</i>：已知岩層形成時間，可推估其內所含化石物種的生存年代；已知化石物種的生存年代，可推估其所在岩層的形成時間。<br>
（4）古生物生存的<i class="hl">環境及氣候</i>：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>發現的化石</th><th>推測的環境</th></tr>
<tr><td>存在<b>珊瑚</b>化石</td><td>此地曾是<i class="hl">清澈且溫暖的淺海</i></td></tr>
<tr><td>山區存在<b>海洋生物</b>化石</td><td>此山區曾經是<i class="hl">海洋</i></td></tr>
<tr><td>化石物種有<b>厚毛髮</b></td><td>生存於<i class="hl">寒冷</i>的環境</td></tr>
</table></div>
<p>（5）<i class="hl">生物演化過程</i>：由不同年代中，同物種一系列的化石可推測其演化過程。<span class="nt"><b>例</b>馬的演化。</span></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>演化過程</th><th>推測</th></tr>
<tr><td class="h">體型</td><td class="c">小 → 大</td><td rowspan="3">1. 奔跑速度：<i class="hl">慢 → 快</i><br>2. 生活環境：<i class="hl">叢林 → 草原</i><br>3. 食物種類：<i class="hl">嫩枝葉 → 草</i></td></tr>
<tr><td class="h">腳趾數</td><td class="c">四趾（抓地慢走）→ 三趾 → 單趾（跳躍奔跑）</td></tr>
<tr><td class="h">牙齒咀嚼面</td><td class="c">小 → 大（更適於磨碎）</td></tr>
</table></div>

<p>1. 學名可以看出生物的<i class="hl">親緣關係</i>，<b>同種生物學名相同</b>，但俗名未必相同。</p>

<div class="box key"><span class="bt">得分關鍵</span>階層<b>由高到低</b>（界→門→綱→目→科→屬→種）共七階層：<i class="hl">階層越高，種類越多，親緣關係越遠</i>。</div>
<p>4. <b>同種生物</b>：雌、雄個體能在<i class="hl">自然狀況下交配</i>，產下<i class="hl">具有生殖能力</i>的後代；<b>學名相同</b>。<br>
<span class="nt"><b>例</b>馬和驢在<b>人工圈養</b>的情況下交配產生騾，騾<b>不具生殖能力</b>，故馬和驢<b>非</b>同種生物。<br>
<b>例</b>黑種人與黃種人所生的孩子具有生殖能力，故黑種人與黃種人<b>為</b>同種生物。</span></p>
</div>`;

<h4>三、原核生物界、原生生物界與真菌界的比較</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>原核生物界</th><th>原生生物界</th><th>真菌界</th></tr>
<tr><td class="h">特色</td><td class="c"><i class="hl">最原始</i>的生命形態</td><td>1. 最原始的<b>真核</b>生物。<br>2. 由<b>原核生物</b>演化而來。</td><td>1. 單細胞真菌無菌絲。<br>2. 大部分為<b>多細胞</b>生物，個體由<i class="hl">菌絲</i>構成。<br>3. 可利用<i class="hl">孢子</i>繁殖後代。</td></tr>
<tr><td class="h">細胞核</td><td class="c"><i class="hl">無</i></td><td class="c">有</td><td class="c">有</td></tr>
<tr><td class="h">遺傳物質</td><td class="c">散布在<i class="hl">細胞質</i>特定區域中</td><td class="c">位於<i class="hl">細胞核</i>中</td><td class="c">位於<i class="hl">細胞核</i>中</td></tr>
<tr><td class="h">細胞壁</td><td class="c"><i class="hl">有</i><br><span class="nt">主成分：肽聚糖</span></td><td>藻類：有（主成分：纖維素）<br>原生動物：<b>無</b><br>原生菌類：部分時期才有</td><td class="c"><i class="hl">有</i><br><span class="nt">主成分：幾丁質</span></td></tr>
<tr><td class="h">葉綠體</td><td class="c"><b>無</b><br><span class="nt">藍綠菌有<b>葉綠素</b>，無葉綠體</span></td><td><i class="hl">藻類：有</i><br>原生菌類、多數原生動物：無</td><td class="c"><b>無</b></td></tr>
<tr><td class="h">致病性</td><td>有些細菌會引起疾病，如肺結核、霍亂、肺炎。</td><td>某些原生動物會引起疾病，如阿米巴原蟲（阿米巴痢疾）。</td><td>某些真菌會造成疾病，如皮癬菌（人類香港腳）。</td></tr>

<div class="box myth"><span class="bt">迷思問答</span>
<p><b>Q　蘚苔和蕨類植物可利用孢子來繁殖，故只能行無性生殖？</b></p>
<p><b>A</b>　蘚苔和蕨類植物也會產生<b>精細胞和卵</b>，行<i class="hl">有性生殖</i>，只是會產生孢子的構造，來完成整個生殖過程。</p>
</div>
</div>

<div class="blk">
<h4>三、蘚苔植物</h4>
<p>1. <i class="hl">最早登陸</i>的植物，具有可防止水分散失的<i class="hl">角質層</i>。</p>
<p>2. <i class="hl">無維管束</i>，以<b>擴散作用</b>和<b>細胞質流動</b>來運輸物質，運輸效率較差，故個體<b>矮小</b>。</p>
<p>3. 沒有真正的根、莖、葉，只有<i class="hl">假根、假莖、假葉</i>。<br>
<span class="nt"><b>例</b>蘚苔個體扁平，平鋪於地面，如<b>地錢</b>；苔類個體直立，藉假根固著在土壤內，如<b>土馬騌</b>。</span></p>
</div>

<div class="blk">
<h4>四、蕨類植物</h4>
<p>1. <i class="hl">最早演化出維管束</i>的植物，具有<b>根、莖、葉</b>。<span class="nt"><b>註</b>蕨類植物的莖多為<b>地下莖</b>；少數種類有地上莖，如筆筒樹。</span></p>
<p>2. <i class="hl">幼葉呈捲曲狀</i>，成熟葉多呈<i class="hl">羽狀複葉</i>，成熟葉的<b>背面</b>有<i class="hl">孢子囊堆</i>。</p>

<div class="blk">
<h4>五、裸子植物</h4>
<p>1. 生殖器官為<i class="hl">毬果</i>，毬果由一片片<b>鱗片</b>組成。</p>
<p>2. <b>雌毬果</b>鱗片<i class="hl">內側</i>有<b>裸露的胚珠</b>（內含卵細胞），<b>雄毬果</b>鱗片<i class="hl">外側</i>有<b>花粉</b>（內含精細胞）。花粉藉<i class="hl">風力</i>傳播到胚珠上，萌發<b>花粉管</b>使精卵結合後，胚珠會發育成<i class="hl">裸露的種子</i>，種子大多有<b>翅</b>可隨風飄散。</p>

<p>3. 部分裸子植物葉呈針狀，稱為<i class="hl">針葉樹</i>，如松、杉、柏和蘇鐵等。</p>
</div>

<div class="blk">
<h4>六、被子植物</h4>
<p>1. 生殖器官為<i class="hl">花、果實、種子</i>，果實會<b>包覆、保護</b>種子。<br>
<span class="nt"><b>註</b>　<b>花</b>：會開花，又稱<b>開花植物</b>。<br>　<b>果實</b>：受精後由<b>子房</b>發育而成，可包覆、保護種子。<br>　<b>種子</b>：受精後由<b>胚珠</b>發育而成，外有果實保護，使子代存活率較高。</span></p>
<p>2. 依種子的<i class="hl">子葉數目</i>分為<b>雙子葉植物</b>和<b>單子葉植物</b>。</p>

<p><b>種子植物適應陸地乾燥環境的原因</b></p>
<p>1. <i class="hl">種子耐乾燥</i>：種子有<b>種皮</b>保護，可抵抗乾旱環境而長期保存。</p>
<p>2. <i class="hl">可以防止水分散失</i>：體表有<b>角質層</b>，且有<b>氣孔</b>協助氣體交換。</p>
<p>3. <i class="hl">具有維管束</i>：提高水分、養分的運輸效率。</p>
<p>4. <i class="hl">具有花粉管</i>：精細胞由花粉管運送，精、卵結合<b>不需以水為媒介</b>。</p>

<tr><td class="h">軟體<br>動物門</td><td>1. 身體<i class="hl">柔軟、不分節</i>，有肌肉構成的<b>足</b>。<br>2. 大多有<b>堅硬外殼</b>保護，故移動緩慢。<span class="nt"><b>小提示</b>殼退化的可快速移動，如烏賊（殼部分退化）、章魚（無殼）。</span><br>3. 外殼可隨個體成長而長大，<i class="hl">不需蛻皮</i>。<br>4. 水生用鰓呼吸，陸生用肺呼吸。</td><td>文蛤、蝸牛（陸生）、烏賊、章魚</td><td><div class="fig"><svg width="104" viewBox="0 0 104 84" role="img" aria-label="蝸牛：具有螺旋形外殼的軟體動物"><path d="M18,58 q10,-10 30,-8 q26,2 36,8 q-18,6 -66,0 z" fill="#e8d2a8" stroke="#a9854a" stroke-width="1.3"/><circle cx="42" cy="34" r="22" fill="#d9a86a" stroke="#9a7444" stroke-width="1.4"/><path d="M45.0,34.0L45.2,34.1L45.3,34.3L45.4,34.4L45.6,34.6L45.7,34.8L45.8,35.0L45.9,35.2L46.0,35.4L46.1,35.7L46.1,35.9L46.2,36.2L46.2,36.4L46.3,36.7L46.3,37.0L46.3,37.2L46.2,37.5L46.2,37.8L46.1,38.1L46.1,38.4L46.0,38.7L45.9,39.0L45.7,39.2L45.6,39.5L45.4,39.8L45.2,40.1L45.0,40.4L44.8,40.6L44.6,40.9L44.3,41.2L44.1,41.4L43.8,41.6L43.5,41.9L43.1,42.1L42.8,42.3L42.5,42.4L42.1,42.6L41.7,42.8L41.3,42.9L40.9,43.0L40.5,43.1L40.1,43.2L39.6,43.3L39.2,43.3L38.7,43.3L38.3,43.3L37.8,43.3L37.4,43.2L36.9,43.2L36.4,43.1L35.9,42.9L35.5,42.8L35.0,42.6L34.5,42.4L34.1,42.2L33.6,42.0L33.1,41.7L32.7,41.4L32.3,41.1L31.8,40.7L31.4,40.4L31.0,40.0L30.6,39.6L30.2,39.1L29.9,38.7L29.5,38.2L29.2,37.7L28.9,37.2L28.6,36.6L28.4,36.1L28.2,35.5L28.0,34.9L27.8,34.3L27.6,33.7L27.5,33.1L27.4,32.4L27.3,31.8L27.3,31.1L27.3,30.4L27.3,29.7L27.3,29.1L27.4,28.4L27.5,27.7L27.7,27.0L27.9,26.3L28.1,25.6L28.3,24.9L28.6,24.3L28.9,23.6L29.3,22.9L29.6,22.3L30.0,21.6L30.5,21.0L31.0,20.4L31.5,19.8L32.0,19.2L32.6,18.7L33.2,18.2L33.8,17.7L34.4,17.2L35.1,16.7L35.8,16.3L36.5,15.9L37.3,15.5L38.1,15.2L38.9,14.9L39.7,14.6L40.5,14.4L41.4,14.2L42.2,14.0L43.1,13.9L44.0,13.8L44.9,13.7L45.8,13.7L46.7,13.8L47.6,13.8L48.5,13.9L49.4,14.1L50.4,14.3L51.3,14.5L52.2,14.8" fill="none" stroke="#8a6434" stroke-width="1.6"/><path d="M80,54 q6,-10 4,-16 M86,54 q8,-8 8,-14" fill="none" stroke="#a9854a" stroke-width="1.3"/><text x="52" y="78" font-size="8.5" fill="#5a6b62" text-anchor="middle">蝸牛</text></svg></div></td></tr>
<tr><td class="h">棘皮<br>動物門</td><td>1. 皆生活於<i class="hl">海水</i>中。<br>2. 身體表面有<i class="hl">棘</i>，主要運動構造為<i class="hl">管足</i>。</td><td>海星、海膽、海參</td><td><div class="fig"><svg width="104" viewBox="0 0 104 84" role="img" aria-label="海星：五條腕的棘皮動物"><path d="M52.0,8.0L58.5,29.1L80.5,28.7L62.5,41.4L69.6,62.3L52.0,49.0L34.4,62.3L41.5,41.4L23.5,28.7L45.5,29.1z" fill="#efa07a" stroke="#c0704a" stroke-width="1.4"/>

<tr><td class="h">環節<br>動物門</td><td>1. 身體柔軟細長且有<i class="hl">環狀分節</i>，各節<b>相似</b>。<br>2. 多用體壁肌肉伸縮爬行；蚯蚓體表有<b>剛毛</b>可協助爬行。</td><td>蚯蚓、水蛭、沙蠶</td><td><div class="fig"><svg width="104" viewBox="0 0 104 84" role="img" aria-label="沙蠶：身體細長且有環狀分節的環節動物"><path d="M12,46 q14,-18 28,0 q14,18 28,0 q12,-16 24,-4" fill="none" stroke="#c87a6a" stroke-width="12" stroke-linecap="round"/>

<tr><td class="h">節肢<br>動物門</td><td>1. 動物界中<i class="hl">種類和數量都最多</i>。<br>2. 身體<b>分節</b>，各節<b>不相似</b>；有分節的<b>附肢</b>。<br>3. 體表有<i class="hl">外骨骼</i>，須<i class="hl">蛻皮</i>才能長大。<br>4. 可依<b>步足數</b>分成<b>昆蟲綱</b>（三對步足）、<b>蛛形綱</b>（四對步足）、<b>甲殼綱</b>（五對步足）。</td><td>1. 昆蟲綱：蚊子、蝗蟲。<br>2. 蛛形綱：蜘蛛。<br>3. 甲殼綱：蝦、蟹。</td><td><div class="fig"><svg width="104" viewBox="0 0 104 84" role="img" aria-label="蟹：具五對步足、第一對特化為螯足的甲殼綱動物"><ellipse cx="52" cy="40" rx="26" ry="18" fill="#e06a4a" stroke="#a04028" stroke-width="1.4"/>
