<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然科學習網｜生物・理化・地球科學</title>
<style>
:root{--bg:#f6f9f5;--card:#ffffff;--ink:#29342b;--muted:#74807a;--brand:#2f7a58;--brand2:#3d7ea6;--ok:#2e7d32;--bad:#c62828;--line:#dfe8dc;--chip:#ecf3ea;--gold:#e4efe0;--mark:#ffe08a;--todo:#f6a623}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 60px}
header{text-align:center;padding:18px 0 6px}
header h1{font-size:1.5rem;letter-spacing:.12em;color:var(--brand)}
header .sub{color:var(--muted);font-size:.85rem;margin-top:4px;letter-spacing:.05em}
.units{display:flex;gap:8px;justify-content:center;margin:14px 0 4px;flex-wrap:wrap}
.unit{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 18px;font-size:.98rem;cursor:pointer;font-weight:800}
.unit.active{background:var(--sub-c,var(--brand));border-color:var(--sub-c,var(--brand));color:#fff}
.unit .cx{margin-left:6px;font-size:.72rem;opacity:.85}
.toc{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub-t,var(--brand));border-radius:12px;padding:11px 13px;margin:2px 0 12px}
.toc .tv{display:flex;align-items:center;gap:8px;margin:11px 0 6px;font-size:.84rem;font-weight:900;color:var(--sub-t,var(--brand))}
.toc .tv:first-child{margin-top:0}
.toc .tv .vb{background:var(--sub-t,var(--brand));color:#fff;border-radius:7px;padding:1px 10px;font-size:.78rem}
.toc .tv .vn{font-weight:400;font-size:.76rem;color:var(--muted)}
.toc .tl{display:flex;flex-wrap:wrap;gap:6px}
.toc .tu{display:inline-flex;align-items:center;gap:6px;background:var(--gold);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-size:.86rem;cursor:pointer;font-family:inherit;color:var(--ink);line-height:1.4}
.toc .tu:hover{border-color:var(--sub-t,var(--brand));background:var(--chip)}
.toc .tu .n{background:var(--sub-t,var(--brand));color:#fff;border-radius:6px;padding:0 6px;font-size:.73rem;font-weight:900;flex:none}
.toc .tu .c{color:var(--muted);font-size:.73rem;white-space:nowrap}
.toc .tu .c b{color:var(--ok)}
.toc .tx{display:block;margin:12px auto 0;background:transparent;border:1px solid var(--line);border-radius:999px;padding:4px 16px;font-size:.78rem;color:var(--muted);cursor:pointer;font-family:inherit}
.toc .tx:hover{border-color:var(--sub-t,var(--brand));color:var(--sub-t,var(--brand))}
.volhd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:24px 0 2px;font-weight:900;color:var(--sub,var(--brand))}
.volhd .vb{background:var(--sub,var(--brand));color:#fff;border-radius:9px;padding:3px 13px;font-size:.92rem}
.volhd .vp{font-weight:400;font-size:.8rem;color:var(--muted)}
.volhd .vbar{flex:1 1 120px;min-width:90px;height:7px;background:var(--chip);border-radius:99px;overflow:hidden}
.volhd .vbar i{display:block;height:100%;background:var(--sub,var(--brand));border-radius:99px}
.tabs{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.acct{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.88rem}
.acct-form{display:block}
.acct .atitle{font-size:.84rem;color:var(--muted);margin-bottom:8px;line-height:1.6}
.acct .arow{display:flex;gap:6px;flex-wrap:wrap}
.acct input{flex:1 1 150px;min-width:0;padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);font-size:.9rem;font-family:inherit}
.acct input:focus{outline:2px solid var(--brand);outline-offset:1px}
.acct .abtns{display:flex;gap:6px;flex-wrap:wrap}
.amsg{font-size:.82rem;margin-top:7px;color:var(--muted);min-height:1em}
.amsg.bad{color:var(--bad);font-weight:800}
.amsg.ok{color:var(--ok);font-weight:800}
.wgrp{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--line)}
.wgrp .wgn{font-weight:900;color:var(--brand)}
.wrec{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:11px;padding:10px 13px;margin:8px 0;line-height:1.75}
.wrec .wtop{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.wrec .wu{background:var(--gold);color:var(--brand);border-radius:6px;padding:1px 8px;font-size:.74rem;font-weight:800}
.wrec .wt{margin-left:auto;color:var(--muted);font-size:.74rem}
.wrec .wq{font-size:.93rem;margin:4px 0}
.wrec .wa{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;margin-top:5px;padding-top:5px;border-top:1px dashed var(--line)}
.wrec .wbad{color:var(--bad)}
.wrec .wok{color:var(--ok);font-weight:800}
.lstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:9px;margin:4px 0 12px}
.lstat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 8px;text-align:center}
.lstat b{display:block;font-size:1.5rem;color:var(--brand);line-height:1.3}
.lstat span{font-size:.76rem;color:var(--muted)}
.tab{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 18px;font-size:.95rem;cursor:pointer;font-weight:700}
.tab.active{background:var(--brand2);border-color:var(--brand2);color:#fff}
.pane{display:none}.pane.show{display:block}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.chip{border:1.5px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.88rem;cursor:pointer;color:var(--ink)}
.chip.active{background:var(--brand2);border-color:var(--brand2);color:#fff;font-weight:700}
.stat{color:var(--muted);font-size:.85rem}
.btn{border:none;border-radius:12px;padding:11px 22px;font-size:1rem;font-weight:800;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.primary{background:var(--brand);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:7px 14px;font-size:.88rem;border-radius:9px}
h2.sec{margin:22px 0 8px;font-size:1.05rem;color:var(--brand2);letter-spacing:.06em}
h2.sec .un{display:inline-block;background:var(--sub,var(--brand));color:#fff;border-radius:8px;padding:2px 10px;margin-right:8px;font-size:.92rem;letter-spacing:0}
/* ===== 重點表格 ===== */
.mtabwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.mtab{width:100%;min-width:620px;border-collapse:collapse;background:var(--card);font-size:.9rem}
.mtab th,.mtab td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;line-height:1.75;text-align:left}
.mtab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap}
.mtab td.nm{background:var(--chip);white-space:nowrap;text-align:center;font-weight:900;width:64px}
.mtab td.tt{white-space:nowrap;font-weight:800;width:1%}
.mtab td.pg{background:#fbfdfe;text-align:center;color:var(--muted);white-space:nowrap;width:54px;font-size:.84rem}
.mtab td .ln{display:block;margin:3px 0}
.mtab td .nt{display:block;margin:6px 0 0;padding:4px 7px;background:#fbfdfe;border-left:3px solid var(--brand);border-radius:3px;font-size:.78rem;line-height:1.5;color:var(--muted)}
.mtab td .nt b{color:var(--brand);margin-right:4px}
.tg{display:inline-block;background:#fde7ef;color:#b3376a;border:1px solid #f6cada;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:800;margin:1px 3px 1px 0;white-space:nowrap}
.tg.b{background:#e7f1fd;color:#2a5f9e;border-color:#cadcf6}
.todo{color:var(--muted);font-size:.84rem}
.todo b{color:var(--todo)}
.warn{color:var(--todo);font-weight:900;cursor:help}
.bkhd{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sub,var(--brand));border-radius:12px;padding:11px 14px;margin:4px 0 6px;font-size:.88rem;line-height:1.8;color:var(--muted)}
.bkhd b{color:var(--brand);font-size:1rem}
.bar{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:7px 0 2px}
.bar i{display:block;height:100%;background:var(--brand2);border-radius:99px}
.hl{font-style:normal;font-weight:900;color:var(--brand);background:var(--mark);border-radius:4px;padding:0 3px;margin:0 1px}
.fml{display:block;background:#fbfdfe;border:1px solid var(--line);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:.92rem;letter-spacing:.03em}
.mtab td.ct{text-align:center;white-space:nowrap;background:#fbfdfe;font-size:.82rem;width:1%}
.hot5{color:#d1462f;letter-spacing:1px}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 4px;line-height:1.32}
.fr i{font-style:normal;padding:1px 6px;white-space:nowrap}
.fr i+i{border-top:1.6px solid currentColor}
.ovline{background:var(--gold);border:1px dashed var(--brand);border-radius:9px;padding:6px 11px;margin:6px 0 2px;font-size:.85rem;color:var(--brand);font-weight:700}
.done{color:var(--ok);font-weight:800}
h3.sub{margin:20px 0 8px;font-size:1rem;color:var(--brand);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3.sub .kp{background:var(--sub,var(--brand));color:#fff;border-radius:8px;padding:2px 10px;font-size:.85rem}
h3.sub .pgt{color:var(--muted);font-size:.78rem;font-weight:400}
.blk{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin:9px 0;line-height:1.85;font-size:.92rem}
.blk h4{font-size:.96rem;color:var(--brand2);margin:14px 0 7px;letter-spacing:.04em}
.blk h4:first-child{margin-top:0}
.blk p{margin:6px 0}
.eg{display:inline-block;background:var(--brand2);color:#fff;border-radius:5px;padding:0 6px;font-size:.75rem;font-weight:800;margin-right:5px}
.box{border-radius:12px;padding:11px 14px;margin:10px 0;line-height:1.8;font-size:.9rem}
.box p{margin:5px 0}
.box .bt{display:inline-block;border-radius:6px;padding:1px 9px;font-size:.78rem;font-weight:900;margin-bottom:5px;color:#fff}
.box.key{background:#eef8f1;border:1px solid #bfe0cb}.box.key .bt{background:var(--brand2)}
.box.myth{background:#fdf1f5;border:1px solid #f3cddb}.box.myth .bt{background:#c0507e}
.box.hot{background:#f2f9ec;border:1px solid #cde5b8}.box.hot .bt{background:#6ea33c}
.box.tip{background:#f5f1fb;border:1px solid #d8cdec}.box.tip .bt{background:#7a5bb0}
.box.calc{background:#fdf3f7;border:1px solid #f3ccdf}.box.calc .bt{background:#d4548a}
.cq{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:14px 0 5px}
.cq:first-of-type{margin-top:6px}
.cq .tn{background:#d4548a;color:#fff;border-radius:7px;padding:1px 10px;font-size:.78rem;font-weight:900}
.cq b{color:#b23a6e;font-size:.96rem}
.cq .pair{margin-left:auto;font-size:.73rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 8px;white-space:nowrap}
.sol{display:inline-block;background:#d4548a;color:#fff;border-radius:6px;padding:0 8px;font-size:.78rem;font-weight:900;margin-right:6px;vertical-align:1px}
.ctab.rt{width:auto;min-width:0;margin:7px 0}
.ctab.rt th{background:#fce9f2;color:#b23a6e;border-color:#efc3d8;padding:5px 12px}
.ctab.rt td{border-color:#efc3d8;padding:5px 12px}
.cb{display:inline-block;border:1.5px solid #4aa3b8;border-radius:7px;padding:2px 9px;margin:3px 2px;background:#fff;vertical-align:middle}
.lb{display:inline-block;border-radius:5px;padding:0 7px;font-size:.74rem;font-weight:900;color:#fff;margin-right:5px;vertical-align:1px}
.lb.r{background:#d94f5c}.lb.e{background:#3d7ea6}.lb.g{background:#2f8f5f}.lb.p{background:#7a5bb0}
.cal{display:inline-block;color:#2b8f74;font-size:.76rem;font-weight:800;margin:0 4px}
.cal::before{content:"\21b3 ";font-weight:400}
.stepline{margin:8px 0;line-height:2.2}
.ctab{width:100%;border-collapse:collapse;background:var(--card);font-size:.88rem;min-width:480px}
.ctab th,.ctab td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top;line-height:1.7}
.ctab th{background:var(--gold);color:var(--brand);text-align:center;white-space:nowrap;font-size:.85rem}
.ctab td.h{background:var(--chip);font-weight:800;white-space:nowrap;text-align:center}
.ctab td.c{text-align:center}
.flow{display:flex;flex-wrap:wrap;gap:7px;align-items:stretch;margin:9px 0}
.flow .fb{flex:1 1 170px;background:var(--gold);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:.85rem;line-height:1.6}
.flow .fb b{display:block;color:var(--brand);margin-bottom:2px}
.act{background:var(--card);border:2px solid var(--brand);border-radius:10px;padding:9px 11px;margin:9px 0;text-align:center;line-height:2.1;font-size:.9rem;overflow-x:auto}
.act .big{font-weight:900;letter-spacing:.04em}
/* ===== 搜尋 ===== */
.sbar{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.sbar input{flex:1 1 220px;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:10px;
  background:var(--card);color:var(--ink);font-size:.95rem;font-family:inherit}
.sbar input:focus{outline:2px solid var(--brand);outline-offset:1px}
.sbtn{padding:9px 14px;border:1px solid var(--line);border-radius:10px;background:var(--brand);color:#fff;
  font-weight:700;cursor:pointer;font-family:inherit;font-size:.9rem;white-space:nowrap}
.sbtn.ghost{background:var(--card);color:var(--muted)}
.sbtn:hover{filter:brightness(1.08)}
.sres{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.sres .shead{font-weight:900;color:var(--brand);margin-bottom:8px;font-size:.9rem}
.sres .sgrp{font-weight:900;margin:10px 0 4px;color:var(--brand2);font-size:.86rem;
  border-bottom:1px dashed var(--line);padding-bottom:3px}
.sres .sitem{display:block;width:100%;text-align:left;background:var(--gold);border:1px solid var(--line);
  border-radius:8px;padding:7px 10px;margin:5px 0;cursor:pointer;font-family:inherit;font-size:.86rem;
  line-height:1.6;color:var(--ink)}
.sres .sitem:hover{border-color:var(--brand)}
.sres .sitem .swhere{display:block;color:var(--muted);font-size:.78rem;margin-bottom:2px}
.sres .qcard{background:#fbfdfe;border:1px solid var(--line);border-left:3px solid var(--brand2);
  border-radius:8px;padding:8px 10px;margin:5px 0;font-size:.86rem;line-height:1.7}
.sres .qcard .qa{color:var(--ok);font-weight:900}
.sres .qcard .qe{color:var(--muted);display:block;margin-top:3px}
.sres mark{background:var(--mark);color:var(--brand);font-weight:900;border-radius:3px;padding:0 2px}
.sres .snone{color:var(--muted);padding:6px 2px}
@keyframes secflash{0%,100%{background:transparent}25%,75%{background:var(--mark)}}
.secflash{animation:secflash 1.6s ease-in-out}
/* ===== 測驗 ===== */
.exam{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.exam .src{font-size:.72rem;background:var(--gold);color:var(--brand2);border-radius:6px;padding:2px 8px;margin-right:6px}
.exam .topic{font-size:.72rem;background:var(--chip);color:var(--muted);border-radius:6px;padding:2px 8px}
.exam .q{margin:10px 0;line-height:1.8;font-size:1.02rem}
img.qi{max-width:min(440px,100%);display:block;margin:10px auto;border:1px solid var(--line);border-radius:10px;background:#fff}
img.gi{display:inline-block;max-height:88px;max-width:160px;vertical-align:middle;border:1px solid var(--line);border-radius:6px;margin:2px;background:#fff}
.eopts{display:grid;gap:8px}
.eopt{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:#fbfdfe;border-radius:11px;padding:11px 13px;font-size:.98rem;cursor:pointer;line-height:1.7;color:var(--ink)}
.eopt .k{font-weight:900;color:var(--brand2);flex:none}
.eopt.correct{border-color:var(--ok);background:#eef7ee}
.eopt.wrong{border-color:var(--bad);background:#fdeeee}
.expl{display:none;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;line-height:1.75;font-size:.92rem}
.expl.show{display:block}
.expl .lbl{font-weight:900;color:var(--brand);margin-right:6px}
.progress{height:8px;background:var(--chip);border-radius:99px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s}
.counter{color:var(--muted);font-size:.85rem;text-align:center;margin-bottom:8px}
.nav{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.scorebox{background:var(--card);border:1px solid var(--line);border-radius:16px;text-align:center;padding:26px 16px;margin:14px 0}
.scorebox .big{font-size:2.2rem;font-weight:900;color:var(--brand)}
.review .r{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.9rem;line-height:1.7}
.qitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.qitem .q{line-height:1.8;margin:6px 0;font-size:.95rem}
.qitem .o{color:var(--muted);font-size:.9rem;line-height:1.75;margin-top:4px}
.qitem .a{display:none;margin-top:8px;font-size:.9rem;line-height:1.7;border-top:1px dashed var(--line);padding-top:8px}
.qitem .a.show{display:block}
.qitem .a b{color:var(--ok)}
footer{text-align:center;color:var(--muted);font-size:.75rem;margin-top:34px;letter-spacing:.05em}
@media(max-width:520px){header h1{font-size:1.25rem}.unit{padding:8px 12px;font-size:.9rem}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>🧪 自然科學習網</h1>
  <div class="sub" id="subT">學習重點＋題庫測驗</div>
</header>
<div class="units" id="unitChips"></div>
  <div class="sbar">
    <input id="sq" type="search" placeholder="搜尋全站…例如：酵素、莫耳、板塊、滲透、鋒面" autocomplete="off">
    <button id="sgo" class="sbtn">🔍 搜尋</button>
    <button id="sx" class="sbtn ghost" hidden>✕ 清除</button>
  </div>
  <div id="sres" class="sres" hidden></div>
  <div class="toc" id="toc" hidden></div>

<div class="tabs">
  <button class="tab active" data-tab="learn">📚 學習重點</button>
  <button class="tab" data-tab="quiz">📝 測驗</button>
  <button class="tab" data-tab="wrong">📕 錯題本</button>
  <button class="tab" data-tab="log">📈 紀錄</button>
</div>

<div class="pane show" id="pane-learn">
  <div class="lpane" id="learn-bio"></div>
  <div class="lpane" id="learn-phy"></div>
  <div class="lpane" id="learn-ear"></div>
</div>

<div class="pane" id="pane-quiz">
  <div class="row" id="secChips"></div>
  <div class="row" id="diffChips"></div>
  <div class="row"><span class="stat" id="poolStat"></span></div>
  <div style="text-align:center;margin:12px 0"><button class="btn primary" id="startBtn">📝 開始測驗</button></div>
  <div id="quizBox"></div>
  <div id="qlist"></div>
</div>

<div class="pane" id="pane-wrong"><div id="wbox"></div></div>
<div class="pane" id="pane-log"><div id="lbox"></div></div>

<footer>自然科學習網・生物／理化／地球科學・自學用教材整理</footer>
</div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

{"q":"阿土伯以種植水稻為生，他想要對 10 公頃的水稻田施加氮肥，已知每公頃水稻田所需的氮元素質量為 120 公斤，則阿土伯至少要購買多少公斤的硫酸銨（(NH₄)₂SO₄）才足夠施肥所需？（(NH₄)₂SO₄ 的分子量為 132，N 的原子量為 14）","opts":["120×⟬132|28⟭","120×⟬28|132⟭","120×10×⟬132|28⟭","120×10×⟬28|132⟭"],"ans":2,"sec":"質量守恆","diff":"中","src":"重點演練・素養題","exp":"(NH₄)₂SO₄ 中 N 所占的質量比為 ⟬28|132⟭（2 個 N，原子量 14×2＝28），故須購買肥料 120×10×⟬132|28⟭（kg）。注意田有 <b>10 公頃</b>，需求量要先乘 10。"},
{"q":"毒理學之父——帕拉賽瑟斯曾說過：「依使用劑量的多寡，可決定物質是否有毒」，例如喝水時人體會自動調節水及鈉的平衡，但若在短時間內攝取大量水分，就可能會發生低血鈉症而造成頭暈、嘔吐，甚至昏迷等症狀。則下列不同分量的水中，何者的質量最大？","opts":["1 分子的水","1 莫耳的水","1 毫克的水","1 公克的水"],"ans":1,"sec":"質量守恆","diff":"易","src":"重點演練・素養題","exp":"1 莫耳水的質量為 <b>18 公克</b>，故質量大小為：1 莫耳的水 ＞ 1 公克的水 ＞ 1 毫克的水 ＞ 1 分子的水，故選(B)。"},
{"q":"臺灣的「毒澱粉事件」源自於不肖業者將未經核准的順丁烯二酸酐（C₄H₂O₃）調製成修飾澱粉，以增加食品的口感，則 490 克的順丁烯二酸酐為多少莫耳？（原子量：H＝1，C＝12，O＝16）","opts":["2","3","4","5"],"ans":3,"sec":"質量守恆","diff":"中","src":"重點演練・素養題","exp":"順丁烯二酸酐的分子量＝4×12＋2×1＋3×16＝<b>98</b>，490 克相當於 ⟬490|98⟭＝<b>5 莫耳</b>。"},
{"q":"在適當的條件下，H₂S 和 SO₂ 會發生反應，生成 H₂O 和 S。小如記錄某一反應裝置內反應前、反應後各物質的質量如下：<br>　H₂S：反應前 70 g，反應後 <b>甲</b><br>　SO₂：反應前 64 g，反應後 <b>乙</b><br>　H₂O：反應前 0 g，反應後 <b>丙</b><br>　S：反應前 2 g，反應後 <b>丁</b><br>下列何組數據最可能是上述反應後各物質的質量？","opts":["甲 64、乙 70、丙 2、丁 0","甲 2、乙 0、丙 36、丁 98","甲 20、乙 48、丙 0、丁 68","甲 0、乙 32、丙 54、丁 48"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考114（通過率 47%）","exp":"解題關鍵：<b>反應物的質量會減少，生成物的質量會增加，且遵守質量守恆定律</b>。(A)反應物 SO₂ 在反應後的質量反而增加，不合理。(C)生成物 H₂O 在反應後的質量並未增加，不合理。(D)反應後的總質量為 32＋54＋48＝134 g，與反應前的總質量 70＋64＋2＝136 g 不同，不合理。故選(B)。"},
{"q":"已知甲、乙兩種不同的金屬元素分別與同濃度的鹽酸反應，反應後只會產生氫氣與金屬的氯化物。取甲金屬 24.3 g 與鹽酸反應，另取乙金屬 65.4 g 與鹽酸反應，兩個反應的金屬都完全耗盡，且產生的氫氣質量均為 2.0 g，則比較兩個反應的反應物與產物的質量，下列何者正確？（前項為「兩反應的鹽酸消耗質量」，後項為「兩反應的產物總質量」）","opts":["相同／相同","相同／不同","不同／相同","不同／不同"],"ans":1,"sec":"質量守恆","diff":"難","src":"會考113（通過率 37%）","exp":"解題關鍵：由產生的氫氣質量推論鹽酸消耗質量，再根據質量守恆推論產物總質量。氫氣是由鹽酸中的 H 所產生，因兩反應產生的氫氣質量相同，可推論兩反應的<b>鹽酸消耗質量也相同</b>。根據質量守恆定律，乙金屬消耗的質量較大（65.4 g ＞ 24.3 g），因此<b>產物的總質量也會較大</b>，故選(B)。"},
{"q":"小明響應環保團體所宣導的「中秋節不烤肉」，在中秋節時只賞月，不烤肉。若小明減少消耗 10 公斤的木炭，且木炭的含碳量為 96％，則他最多減少產生多少公斤的二氧化碳？（反應式為 C＋O₂→CO₂，原子量：C＝12，O＝16）","opts":["10×1000×96%","⟬10×1000×96%|12⟭","800×44","⟬800×44|1000⟭"],"ans":3,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練・素養題","exp":"碳的莫耳數＝⟬10×1000×96%|12⟭＝<b>800 mol</b>，由係數比可知可產生 800 mol 的二氧化碳，故二氧化碳質量＝⟬800×44|1000⟭＝<b>35.2 kg</b>。注意題目問的單位是<b>公斤</b>，所以最後要除以 1000。"},
{"q":"已知呼吸作用的化學反應為「C₆H₁₂O₆＋O₂→CO₂＋H₂O（未平衡）」，若平衡此反應式，則係數總和應為下列何者？","opts":["4","12","18","19"],"ans":3,"sec":"化學反應的微觀世界","diff":"易","src":"重點演練","exp":"平衡後的反應式為 <b>C₆H₁₂O₆＋6O₂→6CO₂＋6H₂O</b>，故係數總和為 1＋6＋6＋6＝<b>19</b>。"},
{"q":"已知鈉在氧氣中燃燒會生成氧化鈉，反應式為「Na＋O₂→Na₂O（未平衡）」，今取 34.5 克的鈉在足量的氧氣中完全燃燒，則會生成多少克的氧化鈉？（原子量：O＝16，Na＝23）","opts":["34.5","46.5","58.5","62.5"],"ans":1,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"先平衡反應式：<b>4Na＋O₂→2Na₂O</b>。鈉的莫耳數＝⟬34.5|23⟭＝1.5 莫耳，由係數比可知鈉與氧化鈉的莫耳數比為 <b>2：1</b>，故可生成 1.5×⟬1|2⟭＝0.75 莫耳的氧化鈉；Na₂O 的分子量＝23×2＋16＝62，則質量＝0.75×62＝<b>46.5 克</b>。"},
{"q":"鎂在空氣中燃燒的反應式為「2Mg＋O₂→2MgO」，若將 18 克的鎂與 16 克的氧氣混合後點火燃燒，則最多會產生多少克的氧化鎂？（原子量：O＝16，Mg＝24）","opts":["30","32","36","40"],"ans":0,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"鎂的莫耳數＝⟬18|24⟭＝0.75 莫耳，氧氣的莫耳數＝⟬16|32⟭＝0.5 莫耳。由係數比可知鎂與氧的莫耳數比為 2：1，若 0.75 莫耳鎂完全反應只需 0.375 莫耳氧氣，故<b>鎂為限量試劑</b>。鎂與氧化鎂的莫耳數比為 1：1，MgO 分子量＝40，則氧化鎂的質量＝0.75×40＝<b>30 克</b>。"},
{"q":"小佩在家烘焙麵包，他加入化合物 X，使麵團在烘烤過程中膨脹且變得鬆軟，反應式為：2X → Na₂CO₃ ＋ CO₂ ＋ H₂O，則 X 的分子量應為何？","opts":["21","42","84","168"],"ans":2,"sec":"化學反應的微觀世界","diff":"中","src":"重點演練","exp":"反應前、後原子的<b>種類及數目不變</b>：右側共有 Na 2、C 2、O 6、H 2，除以 2 即為 1 個 X，故 X 為 <b>NaHCO₃</b>（小蘇打），分子量＝23＋1＋12＋3×16＝<b>84</b>。"},
{"q":"關於反應「Mg ＋ 2HCl → H₂ ＋ MgCl₂」的敘述，下列何者<b>錯誤</b>？","opts":["1 個 Mg 原子可與 2 個 HCl 分子反應","1 克 Mg 可與 2 克 HCl 分子反應","1 莫耳 Mg 原子可與 2 莫耳 HCl 分子反應","6×10²³ 個 Mg 原子可與 2×6×10²³ 個 HCl 分子反應"],"ans":1,"sec":"化學反應的微觀世界","diff":"易","src":"重點演練","exp":"反應式的<b>係數比＝個數比＝莫耳數比</b>，但<i class=\"hl\">不等於質量比</i>，故(B)錯誤。"},
{"q":"已知甲烷和甲醇與足量的氧氣反應，生成物皆為二氧化碳和水，反應式如下：<br>　反應一　CH₄＋2O₂→CO₂＋2H₂O<br>　反應二　2CH₃OH＋3O₂→2CO₂＋4H₂O<br>若分別進行此兩種反應，且完全反應後所得到的生成物總質量相同，則關於反應物的比較，下列敘述何者正確？（原子量：H＝1、C＝12、O＝16）","opts":["甲烷消耗的質量較甲醇少","兩種反應氧氣消耗的質量相同","甲烷和甲醇兩者消耗的質量相同","反應一的氧氣消耗質量較反應二少"],"ans":0,"sec":"化學反應的微觀世界","diff":"難","src":"會考112大題考區","exp":"解題關鍵：思考「生成物總質量相同」的背後含意。每 1 莫耳 CH₄ 與每 1 莫耳 CH₃OH 產生的生成物都是 1 CO₂＋2 H₂O，故生成物總質量相同 → 兩者<b>消耗的莫耳數相同</b>。分子量 CH₄＝16、CH₃OH＝32，故消耗<b>質量比為 16：32＝1：2</b>，甲烷消耗的質量較少，(A)正確。氧氣方面，每莫耳燃料耗氧為 2 mol 對 1.5 mol，比為 4：3，故反應一耗氧較多，(B)(D)皆錯。"},
{"q":"鎂離子為海水中含量第二多的金屬離子，從海水中提取鎂離子為工業上製造鎂的方法之一，其步驟如下：<br>　步驟一：在濃縮的海水中加入氫氧化鈉，會產生氫氧化鎂而沉澱析出。Mg²⁺ ＋ 2NaOH → 2Na⁺ ＋ Mg(OH)₂<br>　步驟二：之後再加入鹽酸，經處理後可得到固態的氯化鎂。Mg(OH)₂ ＋ 2HCl → MgCl₂ ＋ 2H₂O<br>　步驟三：電解熔融狀態的氯化鎂即可得到鎂。MgCl₂ —〔電解〕→ Mg ＋ Cl₂<br>依據上述方法，在某次製鎂的反應後，共產生鎂 960 公克，則該次製鎂反應中，理論上會消耗重量百分濃度為 80% 的鹽酸共多少公克？（鎂的原子量為 24，氯化氫的分子量為 36.5）","opts":["1825","2400","2920","3650"],"ans":3,"sec":"化學反應的微觀世界","diff":"難","src":"會考109（通過率 29%）","exp":"解題關鍵：計算出鎂的莫耳數後，再由係數比推得所需 HCl 的莫耳數，最後計算出消耗的鹽酸質量。由步驟二、三可知，產生 1 莫耳 Mg 需要 1 莫耳 MgCl₂，而產生 1 莫耳 MgCl₂ 需消耗 <b>2 莫耳</b> HCl。960 g Mg 的莫耳數＝⟬960|24⟭＝40 莫耳，故需消耗 80 莫耳 HCl，質量＝80×36.5＝2920 g。鹽酸（溶液）質量＝⟬溶質質量|重量百分濃度⟭＝⟬2920|80%⟭＝<b>3650 g</b>。"},
{"q":"目前臺灣的中藥材大部分都是進口，這些進口的中藥材在加工過程中常會使用二氧化硫，達到漂白的功效，也因此常有二氧化硫殘留量超標的情形。因二氧化硫可溶於水形成 X 物質，食藥署建議在烹煮中藥材前應先以清水沖洗，以保障食用安全。上文中利用二氧化硫漂白時會進行何種反應？且 X 物質最可能為何種物質？","opts":["氧化還原反應，酸性物質","氧化還原反應，鹼性物質","酸鹼中和反應，酸性物質","酸鹼中和反應，鹼性物質"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"二氧化硫是利用<b>氧化還原反應</b>進行漂白；SO₂ 溶於水會形成<b>亞硫酸（H₂SO₃）</b>，屬<b>酸性</b>物質（非金屬氧化物的水溶液呈酸性），故選(A)。"},
{"q":"關於反應「2Al ＋ 3CuO → Al₂O₃ ＋ 3Cu」的敘述，下列何者正確？","opts":["Al 被氧化，進行氧化反應","CuO 被氧化，進行還原反應","Al 對氧的活性比 Cu 小","若進行燃燒試驗，則 Cu 較 Al 容易氧化"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"重點演練","exp":"Al 得到氧（Al→Al₂O₃），進行<b>氧化</b>反應，(A)正確。(B)CuO <b>失去氧</b>，進行還原反應。(C)(D)Al 能把 Cu 從 CuO 中還原出來，表示 <b>Al 對氧的活性較大</b>，進行燃燒試驗時也會較容易氧化。"},
{"q":"將 X、Y、Z、W 四種金屬與 XO、YO、ZO、WO 四種氧化物分別進行反應，「○」代表有反應、「×」代表無反應，結果如下：<br>　XO ＋ Y → ×　　XO ＋ Z → ○<br>　ZO ＋ Y → <b>甲</b>　　WO ＋ X → <b>乙</b>　　WO ＋ Z → ×<br>則甲、乙之符號應分別為何？","opts":["甲為○，乙為×","甲為×，乙為○","甲、乙均為○","甲、乙均為×"],"ans":3,"sec":"氧化與還原反應","diff":"難","src":"重點演練","exp":"由「XO＋Z」有反應可知活性 <b>Z＞X</b>；由「Z＋WO」無反應可知活性 <b>W＞Z</b>；由「Y＋XO」無反應可知活性 <b>X＞Y</b>。綜合上述，活性大小為 <i class=\"hl\">W＞Z＞X＞Y</i>。甲（ZO＋Y）因 Y 活性最小，無法搶走 Z 的氧 → ×；乙（WO＋X）因 W 活性大於 X → ×，故選(D)。"},
{"q":"由於食品中有一些成分容易被氧化，而產生變色或變質，故常添加抗氧化劑。抗氧化劑分為天然抗氧化劑與化學抗氧化劑，天然抗氧化劑如維生素 E 等，化學抗氧化劑較天然抗氧化劑穩定，如丁基羥基甲氧苯（BHA）等，經常食用化學抗氧化劑可能會有罹癌風險。則關於 BHA 在食品中發揮作用時的敘述，下列何者正確？","opts":["BHA 失去氧，進行氧化反應","BHA 失去氧，進行還原反應","BHA 得到氧，進行氧化反應","BHA 得到氧，進行還原反應"],"ans":2,"sec":"氧化與還原反應","diff":"中","src":"重點演練・素養題","exp":"抗氧化劑本身具有<b>易與氧作用</b>的特性，會<b>代替食品被氧化而得到氧</b>，進行<b>氧化反應</b>，故選(C)。"},
{"q":"有些物質可使棕色的碘液進行還原反應，反應後溶液呈無色，例如許多水果所含有的維生素 C。以維生素 C 和綠茶茶水分別進行實驗：<br>　甲試管：維生素 C 溶液　乙試管：水　丙試管：綠茶茶水<br>三支試管都滴入數滴碘液並搖晃後——<br>　甲：棕色消失　乙：液體呈棕色　丙：棕色消失<br>僅依據本實驗結果，下列推論何者最合理？","opts":["綠茶茶水中必定含有維生素 C","綠茶茶水中必定含有能被氧化的物質","綠茶茶水進行氧化反應，維生素 C 進行還原反應","因實驗結果溶液顏色改變，故綠茶茶水可做為酸鹼指示劑"],"ans":1,"sec":"氧化與還原反應","diff":"中","src":"會考114（通過率 57%）","exp":"解題關鍵：<b>碘液進行還原反應時，必有另一物質進行氧化反應</b>。(A)不一定，可能是含有其他可使碘液進行還原反應的物質。(C)兩者都是<b>進行氧化反應</b>。(D)酸鹼指示劑須在不同酸鹼性的溶液中變色，本實驗並未改變酸鹼性。故選(B)。"},
{"q":"某篇關於氫應用的報導說明如下：「金屬多以氧化物的形式封藏於岩石礦物中，可利用氫和氧易起反應的特性，<b>將氧從礦物中移除，留下可用的純金屬和水</b>。」關於上述畫線處提及的反應，下列說明何者最合理？","opts":["因為氫被氧化，所以是氧化還原反應","因為礦物被氧化，所以是氧化還原反應","因為金屬氧化物溶於水呈酸性，所以是酸鹼中和反應","因為金屬氧化物溶於水呈鹼性，所以是酸鹼中和反應"],"ans":0,"sec":"氧化與還原反應","diff":"中","src":"會考113（通過率 59%）","exp":"解題關鍵：判斷何者得到氧，何者失去氧。氫將氧從礦物中移除，形成純金屬與水，則<b>氫得到氧被氧化</b>、<b>礦物失去氧被還原</b>，屬於氧化還原反應，故選(A)。"},
{"q":"小凱在家中廚房找到下列物品，則這些物品中，何者<b>不含</b>有電解質？","opts":["手工釀醋","天然海鹽","萬用小蘇打粉","手工砂糖"],"ans":3,"sec":"認識電解質","diff":"易","src":"重點演練・素養題","exp":"(A)食醋中的醋酸為<b>酸</b>類，屬於電解質。(B)食鹽為<b>鹽</b>類，屬於電解質。(C)小蘇打粉為<b>鹽</b>類，屬於電解質。(D)砂糖（蔗糖）在水中<i class=\"hl\">不會解離</i>，水溶液無法導電，不屬於電解質。"},
{"q":"將氫氧化鈣溶於水中，其解離反應式為「Ca(OH)₂→Ca²⁺＋2OH⁻」，則關於氫氧化鈣水溶液的敘述，下列何者正確？","opts":["導電時，Ca²⁺ 移向負極，OH⁻ 移向正極","導電時，兩極不一定會發生化學反應","Ca²⁺ 的總個數與 OH⁻ 的總個數相等","Ca²⁺ 的總帶電量為 OH⁻ 總帶電量的兩倍"],"ans":0,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"通電後<b>陽離子往負極</b>、<b>陰離子往正極</b>移動，(A)正確。(B)導電時兩極<b>必會</b>發生化學反應。(C)(D)水溶液必為電中性，Ca²⁺ 的總帶電量<b>等於</b> OH⁻ 的總帶電量，但兩者的<i class=\"hl\">個數不相等</i>（OH⁻ 個數是 Ca²⁺ 的兩倍）。"},
{"q":"若質量數 40、原子序 20 的鈣原子失去兩個電子形成鈣離子，則關於鈣離子的敘述，下列何者正確？","opts":["質子數為 18","電子數為 18","中子數為 22","質量數為 38"],"ans":1,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"該鈣原子的質子數、電子數均為 20，中子數＝質量數－質子數＝40－20＝20。失去兩個電子後：質子數仍為 <b>20</b>、中子數仍為 <b>20</b>、質量數仍為 <b>40</b>（電子質量極小不計），只有電子數變成 20－2＝<b>18</b>，故選(B)。"},
{"q":"下列化合物各取 1 莫耳並完全溶於等量的水中，則哪一水溶液中所含離子總莫耳數最多？","opts":["NaCl","HCl","CaCl₂","NH₄OH"],"ans":2,"sec":"認識電解質","diff":"中","src":"重點演練","exp":"解離式分別為：(A)NaCl→Na⁺＋Cl⁻（2 個）；(B)HCl→H⁺＋Cl⁻（2 個）；(C)CaCl₂→Ca²⁺＋2Cl⁻（<b>3 個</b>）；(D)NH₄OH→NH₄⁺＋OH⁻（2 個）。故選(C)。"},
{"q":"西元 2011 年 3 月 11 日，日本外海發生大地震，造成核電廠機組損壞爆炸，釋出放射性物質「碘-129」、「碘-131」而造成恐慌，相關單位提醒當地民眾可適時的服用「碘化鉀」來防止甲狀腺大量吸收這些放射性物質。則下列關於碘-129、碘-131 以及碘化鉀的敘述，何者<b>錯誤</b>？","opts":["碘-129、碘-131 的質量數不同","碘-129、碘-131 為元素，而碘化鉀為化合物","碘-129、碘-131 與碘化鉀溶於水後，水溶液均為電中性","碘化鉀溶於水所解離出來的碘離子與碘-129、碘-131 的化學性質相同"],"ans":3,"sec":"認識電解質","diff":"中","src":"重點演練・素養題","exp":"(D)錯誤。<b>碘離子（I⁻）與碘原子（I）的電子數不同，化學性質也不同</b>。原子與其離子只有質子數、中子數相同，電子數與化學性質皆不同。"},
{"q":"已知 Ca 和 Cl 的原子序分別為 20、17，Ca²⁺ 和 Cl⁻ 的質子數和電子數如下：<br>　Ca²⁺：質子數 <b>w</b>、電子數 <b>y</b><br>　Cl⁻：質子數 <b>x</b>、電子數 <b>z</b><br>則 w、x、y、z 的數值大小比較，下列何者正確？","opts":["w＞z","x＞y","x＞z","y＞w"],"ans":0,"sec":"認識電解質","diff":"中","src":"會考114（通過率 66%）","exp":"解題關鍵：<b>電中性原子的原子序＝質子數＝電子數</b>。Ca²⁺ 表示失去 2 個電子，故 w＝20、y＝20－2＝18；Cl⁻ 表示得到 1 個電子，故 x＝17、z＝17＋1＝18。則 w(20)＞z(18)，故選(A)。"},
{"q":"有一個帶電的離子含有 X、Y、Z 三種粒子（質子、電子、中子，未依照順序排列），且 X、Y、Z 的粒子數目依序為 Nx、Ny、Nz。已知 X 粒子的質量最小，關於此離子的說明，下列何者最合理？","opts":["若為陽離子，且 Ny＞Nx＝Nz，則 Z 為質子","若為陽離子，且 Ny＞Nx＝Nz，則 Z 為電子","若為陰離子，且 Nx＝Ny＞Nz，則 Z 為質子","若為陰離子，且 Nx＞Ny＝Nz，則 Z 為電子"],"ans":2,"sec":"認識電解質","diff":"難","src":"會考111（通過率 45%）","exp":"解題關鍵：<b>陽離子則質子數＞電子數，陰離子則質子數＜電子數</b>。三種粒子中<i class=\"hl\">電子的質量最小</i>，故 X 為電子。(A)(B)若為陽離子，則質子數＞電子數（Nx），但選項中 Ny＞Nx，故 Y 才是質子。(C)若為陰離子，電子數（Nx）＞質子數，Nx＝Ny＞Nz，則 Z 可為質子，成立。(D)若為陰離子，電子數須大於質子數，但 Nx＞Ny＝Nz，Y 或 Z 為質子而非電子。故選(C)。"},
{"q":"家中電熱水瓶使用一段時間後，內壁常會出現白色的「水垢」，已知水垢的主要成分為碳酸鎂與碳酸鈣，則使用下列何種物質對去除水垢最有幫助？","opts":["熱水","燒鹼","檸檬酸","石灰"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練・素養題","exp":"<b>酸性物質</b>的水溶液可與碳酸鹽類反應，使其溶解。(B)燒鹼（氫氧化鈉）與(D)石灰（氧化鈣）均為<b>鹼性</b>物質，故選(C)檸檬酸。"},
{"q":"下列哪一項為酸與鹼的<b>共同</b>性質？","opts":["兩者皆可溶解油脂","兩者的水溶液皆可導電","兩者的水溶液皆可使酚酞呈紅色","兩者皆可使活性大的金屬產生氫氣"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"易","src":"重點演練","exp":"酸類與鹼類<b>都是電解質</b>，水溶液皆可導電，(B)正確。(A)<b>鹼</b>才可溶解油脂。(C)酚酞遇酸性溶液呈<b>無色</b>、遇鹼性溶液才呈紅色。(D)<b>酸</b>才可使活性大的金屬產生氫氣。"},
{"q":"關於酸性物質特性的敘述，下列何者<b>錯誤</b>？","opts":["濃硫酸具有強脫水性，可使碳水化合物失去水分","醋酸又稱為蟻酸，具有刺激性氣味","鹽酸應為無色，但是工業用的鹽酸含有雜質，故呈淡黃色","稀釋濃硫酸時，應將濃硫酸緩慢加入大量水中，並不斷攪拌"],"ans":1,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練","exp":"(B)錯誤。醋酸又稱為<i class=\"hl\">乙酸</i>；<b>蟻酸</b>則是<b>甲酸</b>，兩者不同。"},
{"q":"牡蠣殼的主要成分為碳酸鈣，牡蠣殼經過高溫煅燒後的煅燒牡蠣殼粉具有抗菌性，可抑制大腸桿菌、沙門氏菌與金黃色葡萄球菌等。若阿達想要研究煅燒牡蠣殼粉的抗菌性與 pH 值之相關性，而非與成分的相關性，則他可研究下列何種物質的抗菌性？","opts":["鹽酸","碳酸","食鹽","燒鹼"],"ans":3,"sec":"常見的酸、鹼性物質","diff":"中","src":"重點演練・素養題","exp":"碳酸鈣高溫煅燒會分解成<b>氧化鈣</b>（CaCO₃ →〔△〕→ CaO＋CO₂），氧化鈣為<b>鹼性</b>物質。若要研究抗菌性與 pH 值的相關性（而非成分），應選擇成分不同但同為<b>鹼性</b>的物質，故選(D)燒鹼（氫氧化鈉）。"},
{"q":"閱讀下文後回答：「為了減少溫室氣體，地質學家將二氧化碳變成岩石的一部分——將發電廠產生的二氧化碳灌入大量的水中，以管線將這些氣泡水輸送到數公里遠的區域，接著透過高壓將氣泡水注入地下一千公尺深的岩層中，這些氣泡水會和鈣、鎂等離子反應而『固化』，並填充岩層空隙。」上述二氧化碳變成岩石一部分的過程，是利用下列二氧化碳（水溶液）的何種性質？","opts":["密度大於空氣","溶於水呈酸性","可與鈣離子反應產生難溶於水的碳酸鹽","可與鈉離子反應產生易溶於水的碳酸鹽"],"ans":2,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考114（通過率 60%）","exp":"解題關鍵：藉由二氧化碳的檢驗方式判斷。由題目可知，二氧化碳水溶液會與<b>鈣、鎂離子</b>反應，形成<i class=\"hl\">難溶於水</i>的碳酸鈣而「固化」，與密度、酸鹼性無關，故選(C)。"},
{"q":"虎門銷煙為清朝銷毀鴉片的歷史事件。把海水引入浸泡池浸泡鴉片，之後再加入石灰等物質，石灰遇水會改變水溫，此改變也利於將鴉片溶於水中，等退潮時再排入海中。關於上述銷毀鴉片的說明，下列何者最合理？","opts":["石灰溶於水為放熱反應，而高溫使鴉片更易溶於水中","石灰溶於水為吸熱反應，而高溫使鴉片更易溶於水中","鴉片浸泡海水後會使水溫上升，使其與石灰反應速率加快","鴉片浸泡海水後會使水溫下降，使其與石灰反應速率加快"],"ans":0,"sec":"常見的酸、鹼性物質","diff":"中","src":"會考113（通過率 74%）","exp":"解題關鍵：思考石灰遇水會如何改變水溫。石灰（CaO）溶於水會<i class=\"hl\">放熱</i>，使水溫升高；由題目「此改變也利於將鴉片溶於水中」可推論高溫會使鴉片更易溶於水中，故選(A)。"},
{"q":"人體會自動將血液的 pH 值調節在 7.35 到 7.45 之間，若血液的 pH 值低於 7.35，即為「酸中毒」；若血液的 pH 值高於 7.45，則為「鹼中毒」。試問下列敘述何者正確？","opts":["人體酸中毒時的血液必呈酸性，且 [H⁺]＞[OH⁻]","人體酸中毒時的血液必呈酸性，且 [H⁺]＜[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＞[OH⁻]","人體鹼中毒時的血液必呈鹼性，且 [H⁺]＜[OH⁻]"],"ans":3,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練・素養題","exp":"酸中毒只要 pH 低於 7.35 即成立，例如 pH＝7.2 仍<b>大於 7</b>，血液<i class=\"hl\">可能仍呈鹼性</i>，故(A)(B)的「必呈酸性」不成立。鹼中毒時 pH 高於 7.45，<b>必定大於 7</b>，故血液必呈鹼性，且鹼性表示 [H⁺]＜[OH⁻]，故選(D)。"},
{"q":"小黃計畫假日要去泡溫泉，正在考慮下列四個地點。若小黃的皮膚較為敏感，不宜浸泡過酸或過鹼的溫泉，否則皮膚容易出現乾、癢等症狀，則小黃應選擇哪一地點的溫泉最為適當？","opts":["新北投，溫泉 pH 值 1.2","陽明山，溫泉 pH 值 2.3","礁溪，溫泉 pH 值 7.5","關子嶺，溫泉 pH 值 10.2"],"ans":2,"sec":"水溶液的酸鹼性","diff":"易","src":"重點演練・素養題","exp":"pH 值小於 7 為酸性，且數值越小酸性越強；pH 值大於 7 為鹼性，且數值越大鹼性越強。<b>pH 7.5 最接近中性 7</b>，故選(C)礁溪。"},
{"q":"將 1M、50 mL 的 HCl 水溶液加水稀釋到 100 mL，則關於稀釋過程的敘述，下列何者正確？","opts":["莫耳濃度變大","[H⁺] 變大","pH 值變大","重量百分率濃度變大"],"ans":2,"sec":"水溶液的酸鹼性","diff":"中","src":"重點演練","exp":"加水稀釋後，溶質的莫耳數與質量<b>不變</b>，但溶液的體積與質量<b>變大</b>，故(A)莫耳濃度與(D)重量百分率濃度均<b>變小</b>。(B)酸性減弱，[H⁺] <b>變小</b>。[H⁺] 變小則 pH 值<i class=\"hl\">變大</i>（趨近 7），故選(C)。"},
{"q":"牙齒酸蝕是指酸性物質會使牙齒外層的琺瑯質軟化，而容易損耗。<br><b>實驗一</b>：選用形狀大小很相近的豬牙齒，分別浸泡不同濃度的鹽酸數日，結果如下——<br>　鹽酸 X：pH 2.4，重量減少百分比 1 日後 6.82%、2 日後 7.87%<br>　鹽酸 Y：pH 3.7，重量減少百分比 1 日後 4.15%、2 日後 4.92%<br>　鹽酸 Z：pH 3.1，重量減少百分比 1 日後 5.95%、2 日後 6.76%<br><b>實驗二</b>：取形狀大小很相近的豬牙齒，分別浸泡在 pH 值介於 2～4 之間的甲、乙、丙三杯飲料中數日，發現牙齒重量減少百分比為丙＜甲＜乙。<br>若實驗二只考慮 pH 值的影響，則依實驗一的結果，關於甲、乙、丙三杯飲料的推測，下列何者最合理？","opts":["乙杯最酸，其 pH 值最大","乙杯最酸，其 pH 值最小","丙杯最酸，其 pH 值最大","丙杯最酸，其 pH 值最小"],"ans":1,"sec":"水溶液的酸鹼性","diff":"中","src":"會考113（通過率 70%）","exp":"解題關鍵：先由表中數據推論 pH 值與牙齒損耗的關係。由實驗一可見 <b>pH 值越小（酸性越強），牙齒重量減少越多</b>（X 的 pH 2.4 減少最多）。實驗二中重量減少百分比為丙＜甲＜乙，表示<b>乙杯使牙齒損耗最大 → 乙杯最酸 → pH 值最小</b>，故選(B)。"},
{"q":"閱讀下文後回答：「新聞報導某處養殖的白蝦大量暴斃，調查後初步推測是高溫與暴雨，使養殖池的溶氧量和 pH 值劇烈變化，導致水質改變所造成的。專家建議為避免白蝦大量死亡，應注意水溫變化，可先用水車調整水中的溶氧量，並監控水中的 pH 值，投放熟石灰（氫氧化鈣）調整至合適的 pH 值。」關於上述專家建議的方法，下列說明何者最合理？（溶氧量：溶解於水中的氧氣量）","opts":["使水中的溶氧量增加，pH 值增加","使水中的溶氧量增加，pH 值減少","使水中的溶氧量減少，pH 值增加","使水中的溶氧量減少，pH 值減少"],"ans":0,"sec":"水溶液的酸鹼性","diff":"中","src":"會考111（通過率 51%）","exp":"解題關鍵：思考高溫對水中溶氧量的影響，以及熟石灰水溶液的酸鹼性。<b>高溫會使水中的溶氧量減少</b>，故用水車的目的是使溶氧量<i class=\"hl\">增加</i>；熟石灰（氫氧化鈣）為<b>鹼性</b>物質，投放後會使水的 pH 值<i class=\"hl\">增加</i>，故選(A)。"},
{"q":"阿珍因胃酸分泌過多而服用胃藥（主要成分為碳酸鈉），則服用此胃藥後的敘述，下列何者<b>錯誤</b>？","opts":["胃部可能會有熱熱的感覺","會使胃內液體的 pH 值下降","胃內會進行酸鹼中和反應","會使胃內液體的 [H⁺] 下降"],"ans":1,"sec":"酸鹼中和","diff":"中","src":"重點演練・素養題","exp":"碳酸鈉（鹼性）會與胃內的鹽酸進行<b>酸鹼中和反應</b>，屬放熱反應（故(A)正確），並使胃內液體的 [H⁺] <b>下降</b>（故(D)正確）。[H⁺] 下降代表酸性減弱，pH 值應<i class=\"hl\">上升</i>，故(B)錯誤。"},
{"q":"在錐形瓶內裝入 1M、20 mL 的氫氧化鈣水溶液和數滴酚酞，再慢慢滴入 1M 的鹽酸，則下列敘述何者<b>錯誤</b>？","opts":["滴入鹽酸前，錐形瓶內的溶液顏色為無色","滴入鹽酸的過程中，錐形瓶內溶液的溫度會上升","滴入鹽酸的過程中，錐形瓶內溶液的 pH 值會下降","實驗完成後，將錐形瓶內的溶液蒸乾，可得到氯化鈣"],"ans":0,"sec":"酸鹼中和","diff":"中","src":"重點演練","exp":"(A)錯誤。氫氧化鈣水溶液為<b>鹼性</b>，而酚酞在鹼性溶液中呈<i class=\"hl\">紅色</i>，不是無色。(B)酸鹼中和為放熱反應。(C)加入酸使 pH 值下降。(D)Ca(OH)₂＋2HCl→CaCl₂＋2H₂O，蒸乾可得氯化鈣。"},
{"q":"取硫粉和鎂帶分別在空氣中燃燒，燃燒後的產物依序於 X、Y 兩瓶密閉容器內與水充分混合。在室溫下先以石蕊試紙檢測 X、Y 兩瓶水溶液，再將兩瓶水溶液混合並測量溫度變化。已知實驗結果兩瓶的石蕊試紙皆有變色，則下列哪一個代號最可能是實驗結果的紀錄？<br>　甲：X 瓶變紅色、Y 瓶變藍色，混合後溫度下降<br>　乙：X 瓶變紅色、Y 瓶變藍色，混合後溫度上升<br>　丙：X 瓶變藍色、Y 瓶變紅色，混合後溫度上升<br>　丁：X 瓶變藍色、Y 瓶變紅色，混合後溫度下降","opts":["甲","乙","丙","丁"],"ans":1,"sec":"酸鹼中和","diff":"難","src":"會考110補考","exp":"解題關鍵：<b>非金屬氧化物的水溶液呈酸性，金屬氧化物的水溶液呈鹼性</b>。硫為非金屬，X 瓶（SO₂ 溶於水成亞硫酸）呈<b>酸性</b>，會使藍色石蕊試紙<b>變紅色</b>；鎂為金屬，Y 瓶（MgO 溶於水成氫氧化鎂）呈<b>鹼性</b>，會使紅色石蕊試紙<b>變藍色</b>。酸性與鹼性水溶液混合會進行酸鹼中和，為<i class=\"hl\">放熱反應</i>，溫度<b>上升</b>，故選(B)乙。"},
{"q":"「刀工」是指切菜的技術，可根據烹調或食用的需要，將食材加工成一定的形狀。小佩將番茄切成薄片狀後再丟入鍋中拌炒，可讓番茄更快熟透，主要與下列何種影響反應速率的因素最相關？","opts":["濃度","溫度","催化劑","接觸面積"],"ans":3,"sec":"反應速率","diff":"易","src":"重點演練・素養題","exp":"物質被拆分得<b>越細、越薄</b>，則<i class=\"hl\">總表面積越大</i>，粒子碰撞機會變多，反應速率越快，故選(D)接觸面積。"},
{"q":"小華參觀麵粉工廠時，看到「嚴禁煙火」的警告標誌，廠長解釋是因為空氣中散布著麵粉粉末，若遇到火源容易發生爆炸。則麵粉粉末遇到火源容易爆炸，與下列哪兩個影響反應速率的因素最為相關？<br>　甲. 反應物活性　乙. 接觸面積　丙. 溫度　丁. 催化劑","opts":["甲乙","乙丙","乙丁","丙丁"],"ans":1,"sec":"反應速率","diff":"中","src":"重點演練・素養題","exp":"麵粉<b>散布在空氣中</b>，粉末與空氣的<i class=\"hl\">接觸面積增加</i>（乙）；<b>火源</b>則是增加<i class=\"hl\">溫度</i>（丙），故選(B)。"},
{"q":"閱讀下列新聞報導後回答：<br>　「一場泳池慶生派對中，工作人員在泳池中倒入大量的液態氮，以製造煙霧效果並且炒熱氣氛，最後卻造成數人昏迷送醫。有人分析：『氮氣和池水中的氯會反應產生有毒的三氯化氮，對皮膚和呼吸道相當刺激。』」<br>小莫看完報導後，認為三氯化氮雖然有毒，但應該不是此次意外的原因，應是其他因素所致。下列何者最可能是她認為不是三氯化氮的理由？","opts":["空氣中有大量氮氣，池水也會接觸氮氣，但一般泳池並沒有類似的意外","池水溫度會因液態氮汽化而下降，反而會加快產生三氯化氮的反應速率","泳池會加入較高濃度的氯氣用以殺菌消毒，故泳池的氯含量比自來水高","液態氮汽化後所產生的氣體會溶於池水中，與水中的氯接觸機會增加"],"ans":0,"sec":"反應速率","diff":"難","src":"會考112（通過率 52%）","exp":"解題關鍵：思考平時的泳池水是否已經有與氮氣接觸。(A)空氣中的<b>氮含量約占 78%</b>，池水平時就一直接觸氮氣卻沒出事，可支持「不是三氯化氮」的推論，故選(A)。(B)溫度<b>下降</b>會<i class=\"hl\">減慢</i>反應速率，敘述有誤。(C)泳池氯含量較高時，應更<b>容易</b>產生三氯化氮，並非認為「不是」的理由。(D)氮<b>不易</b>溶於水。"},
{"q":"甲、乙兩組製備氣體的實驗裝置（大理石與鹽酸反應）僅有<b>一個</b>條件不同，其他條件皆相同。已知乙組裝置產生氣泡的初始速率明顯較甲組裝置<b>慢</b>，則上述不同的條件，可能是指下列何者？","opts":["甲組的鹽酸濃度較高","甲組的廣口瓶容積較大","乙組的反應溫度較高","乙組的大理石顆粒較小"],"ans":0,"sec":"反應速率","diff":"中","src":"會考111補考","exp":"解題關鍵：反應速率與<b>接觸面積、濃度、溫度</b>有關。由題目可知乙組的反應速率較甲組慢。(A)濃度越高反應速率越快，故甲組的鹽酸濃度應較乙組高，<b>正確</b>。(B)廣口瓶容積大小<i class=\"hl\">不影響</i>反應速率。(C)溫度越高反應速率越快，應是<b>甲組</b>溫度較高。(D)顆粒越小總表面積越大、反應越快，應是<b>甲組</b>的大理石顆粒較小。"},
{"q":"室溫下有兩杯水溶液：<br>　<b>實驗一</b>：HCl 水溶液（pH＝2），加入適量的鋅粉<br>　<b>實驗二</b>：NaHCO₃ 水溶液（pH＝9），加入適量的鹽酸<br>兩杯均會冒泡。若改變 HCl 和 NaHCO₃ 的濃度，使這兩杯水溶液的 pH 值<b>均增加</b>，但其他實驗條件皆不變，則分別加入鋅粉和鹽酸後，這兩杯水溶液冒泡速率的改變情形，最可能為下列何者？","opts":["兩杯水溶液都變快","兩杯水溶液都變慢","實驗一：變快，實驗二：變慢","實驗一：變慢，實驗二：變快"],"ans":3,"sec":"反應速率","diff":"難","src":"會考110補考","exp":"解題關鍵：<b>酸性</b>溶液的 pH 值增加，表示濃度<i class=\"hl\">變小</i>；<b>鹼性</b>溶液的 pH 值增加，表示濃度<i class=\"hl\">變大</i>。HCl 為酸性，pH 增加代表濃度變小 → 冒泡<b>變慢</b>；NaHCO₃ 為鹼性，pH 增加代表濃度變大 → 冒泡<b>變快</b>。濃度越大反應速率越快，故選(D)。"},
{"q":"阿美進行下列實驗：<br>　① 在杯子中裝水並放入一顆方糖。<br>　② 攪拌時發現方糖的形狀改變了。<br>　③ 充分攪拌後杯底仍有方糖沉澱，此時再丟入一顆方糖。<br>　④ 一段時間後發現再放入的方糖，其形狀也改變了。<br>則步驟②與步驟④中，糖的溶解速率（D溶解）與析出速率（D析出）之大小關係分別為何？","opts":["兩步驟均為 D溶解＝D析出","兩步驟均為 D溶解＞D析出","步驟②：D溶解＝D析出，步驟④：D溶解＞D析出","步驟②：D溶解＞D析出，步驟④：D溶解＝D析出"],"ans":3,"sec":"可逆反應與平衡","diff":"中","src":"重點演練・素養題","exp":"步驟②時溶液<b>尚未達到飽和</b>（糖還在溶解、杯底還沒剩），此時<i class=\"hl\">溶解速率 ＞ 析出速率</i>。步驟③杯底仍有方糖沉澱，表示已達<b>飽和</b>；步驟④再放入的方糖形狀改變但總量不變，此時<i class=\"hl\">溶解速率 ＝ 析出速率</i>（動態平衡），故選(D)。"},
{"q":"某色溶液內的反應已達平衡狀態，則下列敘述何者正確？","opts":["溶液的顏色不再改變","正反應與逆反應均停止","反應物濃度與生成物濃度相同","平衡改變後就不會再達成新的平衡"],"ans":0,"sec":"可逆反應與平衡","diff":"中","src":"重點演練","exp":"達平衡時顏色、濃度等<b>不再改變</b>，(A)正確。(B)正反應速率<b>等於</b>逆反應速率，但<i class=\"hl\">都不為零</i>，兩者仍持續進行（動態平衡）。(C)反應物與生成物濃度<b>固定</b>，但<b>不一定相同</b>。(D)條件允許時<b>會</b>再達到新的平衡。"},
{"q":"鉻酸鉀和二鉻酸鉀的可逆反應如下：<br>　<b>2CrO₄²⁻（黃色）＋ 2H⁺ ⇌ Cr₂O₇²⁻（橘紅色）＋ H₂O</b><br>則改變溶液酸鹼性的平衡變化情形，下列何者正確？","opts":["pH 值變小時，平衡向左移動","pH 值變小時，平衡向右移動","pH 值變大時，平衡向右移動","不論 pH 值變小或變大，均不會改變平衡"],"ans":1,"sec":"可逆反應與平衡","diff":"中","src":"重點演練","exp":"pH 值<b>變小</b>時，[H⁺] 濃度<b>增加</b>；H⁺ 是反應物，增加反應物濃度會使平衡往生成物方向（<i class=\"hl\">向右</i>）移動，故選(B)。反之 pH 值變大時 [H⁺] 減少，平衡<b>向左</b>移動。"},
{"q":"在燒瓶中裝水並加熱到沸騰後，停止加熱、塞住瓶口，翻轉倒置燒瓶，使瓶內的空氣位於上方。此時拿一袋冰塊放在燒瓶的上方，瓶內的氣壓會改變，而水會由下而上開始冒出氣泡，是一種物理變化。根據上述說明，關於冰塊降溫造成此現象的解釋，下列何者最合理？","opts":["瓶內的水蒸氣凝結，接著藉由水汽化達到新的平衡","瓶內的水蒸氣蒸發，接著藉由水汽化達到新的平衡","瓶內的氣壓降低，接著藉由水分解反應產生氣體達到新的平衡","瓶內的氣壓升高，接著藉由水分解反應產生氣體達到新的平衡"],"ans":0,"sec":"可逆反應與平衡","diff":"難","src":"會考114（通過率 46%）","exp":"解題關鍵：思考溫度降低時氣壓如何變化，以及水冒出氣泡是何種變化。冰塊降溫使瓶內的<b>水蒸氣凝結成水</b>（氣壓下降），瓶內水冒出氣泡則表示<b>水汽化成水蒸氣</b>，兩者一來一往達到新的平衡，故選(A)。(C)(D)水分解屬於<i class=\"hl\">化學變化</i>，與題目「是一種物理變化」不符。"},
{"q":"將裝有紅棕色二氧化氮（NO₂）氣體的密閉玻璃瓶放入冰水中，二氧化氮會互相結合產生無色的四氧化二氮（N₂O₄）氣體，瓶內的顏色會逐漸變淡，反應式為 <b>2NO₂ ⇌ N₂O₄</b>。當溫度下降至某溫度，且保持恆定，一段時間後玻璃瓶內的顏色便不再改變。關於顏色不再改變時反應速率的說明，下列何者正確？","opts":["正反應速率等於逆反應速率，且速率為 0","正反應速率等於逆反應速率，且速率不為 0","正反應速率不等於逆反應速率，且兩速率均不為 0","正反應速率不等於逆反應速率，且其中一速率為 0"],"ans":1,"sec":"可逆反應與平衡","diff":"中","src":"會考113（通過率 63%）","exp":"解題關鍵：思考玻璃瓶內的顏色不再改變的含意。容器內氣體<b>顏色不再改變</b>，表示已達到<b>反應平衡</b>；此時正反應速率<b>等於</b>逆反應速率，且<i class=\"hl\">不為零</i>，兩者仍持續進行，屬於<b>動態平衡</b>，故選(B)。"},
{"q":"室溫時，在含有橘紅色二鉻酸根離子（Cr₂O₇²⁻）的水溶液中加入氫氧化鈉，會產生黃色的鉻酸根離子（CrO₄²⁻），達平衡後其可逆反應表示為：<br>　<b>Cr₂O₇²⁻ ＋ 2OH⁻ ⇌ 2CrO₄²⁻ ＋ H₂O</b><br>若對上述水溶液<b>通入二氧化碳</b>，使平衡再次移動，則關於此反應趨向和物質濃度的敘述，下列何者正確？","opts":["反應向正反應方向進行，達新平衡時 [Cr₂O₇²⁻] 等於 0","反應向正反應方向進行，達新平衡時 [CrO₄²⁻] 增加","反應向逆反應方向進行，達新平衡時 [CrO₄²⁻] 等於 0","反應向逆反應方向進行，達新平衡時 [Cr₂O₇²⁻] 增加"],"ans":3,"sec":"可逆反應與平衡","diff":"難","src":"會考109補考","exp":"解題關鍵：二氧化碳與水反應產生的物質會影響酸鹼性。CO₂ 會和 H₂O 反應生成<b>碳酸（H₂CO₃）</b>並解離產生 <b>H⁺</b>；H⁺ 會中和 OH⁻，使 <i class=\"hl\">[OH⁻] 減少</i>。OH⁻ 是反應物，反應物減少會使平衡往<b>逆反應</b>方向進行。達新平衡時 [CrO₄²⁻] <b>減少（但不為零）</b>、[Cr₂O₇²⁻] <b>增加</b>，故選(D)。"},
{"q":"人體雖然複雜，但主要是由 6 種元素構成，質量比例如下：<br>　氧(O) 65%、碳(C) 18%、氫(H) 10%、氮(N) 3.0%、鈣(Ca) 1.5%、磷(P) 1.0%<br>若只考慮這 6 種元素，則下列敘述何者正確？","opts":["金屬元素約占 19%","原子序最小的元素約占 3%","原子量越大的元素所占比例越高","碳在人體中所組成的物質可能為無機化合物"],"ans":3,"sec":"認識有機化合物","diff":"中","src":"重點演練・素養題","exp":"(A)這 6 種元素中<b>只有鈣</b>為金屬元素，約占 <b>1.5%</b>。(B)原子序最小的元素為<b>氫</b>，約占 <b>10%</b>。(C)不一定，氮、鈣、磷的原子量均大於氫，但占比較小。(D)有可能，例如 <i class=\"hl\">CO₂</i>（碳的氧化物屬於無機化合物），故選(D)。"},
{"q":"下列何者屬於有機化合物？","opts":["CO₂","CBr₄","HCN","H₂CO₃"],"ans":1,"sec":"認識有機化合物","diff":"易","src":"重點演練","exp":"<b>碳的氧化物</b>（CO₂）、<b>碳酸鹽類</b>（H₂CO₃ 為碳酸）、<b>氰化物</b>（HCN）等雖含有碳原子，但<i class=\"hl\">不屬於</i>有機化合物，故選(B) CBr₄。"},
{"q":"關於有機化合物與無機化合物的敘述，下列何者正確？","opts":["含碳的化合物皆為有機化合物","有機化合物只能從有機體中獲得","有機化合物的種類比無機化合物多","有機化合物必含有碳、氫、氧元素"],"ans":2,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"(A)一氧化碳、二氧化碳、碳酸鹽類及氰化物雖含碳，但<b>並非</b>有機化合物。(B)有機化合物<b>可由人工合成</b>（烏拉合成尿素）。(C)因排列與結合方式多變，有機化合物種類<i class=\"hl\">較多</i>，正確。(D)有機化合物必含<b>碳</b>元素，但<b>不一定</b>含有氫、氧元素（例如 CCl₄）。"},
{"q":"德國科學家烏拉在實驗室合成尿素，推翻有機化合物的早期推論，則尿素的化學式最可能為下列何者？","opts":["CO(NH₂)₂","NH₄ONH","NH₄NO₂","NH₄CaO"],"ans":0,"sec":"認識有機化合物","diff":"易","src":"重點演練","exp":"尿素為<b>有機化合物</b>，應<i class=\"hl\">含有碳元素</i>，四個選項中只有(A) CO(NH₂)₂ 含碳，故選(A)。"},
{"q":"甲乙醚與丙醇的分子式均為 C₃H₈O，但兩者的性質差異甚大，則造成兩者性質有所差異的主要原因為何？","opts":["分子量不同","原子種類不同","原子數目不同","原子排列方式不同"],"ans":3,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"<b>分子式相同</b>，則兩者的分子量、原子種類及原子數目<b>都相同</b>；但兩者的<i class=\"hl\">原子排列方式不同</i>，即為不同的化合物，故性質會有所差異，故選(D)。"},
{"q":"小佩將白砂糖放入蒸發皿中加熱，發現白砂糖會先變成白色液體（甲）後，再變成黑色物質（乙），則甲、乙兩階段分別屬於何種變化？","opts":["甲、乙均為物理變化","甲、乙均為化學變化","甲為物理變化，乙為化學變化","甲為化學變化，乙為物理變化"],"ans":2,"sec":"認識有機化合物","diff":"中","src":"重點演練","exp":"甲階段為<b>砂糖融化</b>（只改變狀態），為<i class=\"hl\">物理變化</i>；乙階段為<b>產生含碳的黑色物質</b>（產生新物質），為<i class=\"hl\">化學變化</i>，故選(C)。"},
{"q":"已知甲～丁四者均為純物質，其所含元素的質量百分比如下：<br>　甲：C 75%、H 25%、O 0%<br>　乙：C 27%、H 0%、O 73%<br>　丙：C 100%、H 0%、O 0%<br>　丁：C 52%、H 13%、O 35%<br>則哪些物質<b>不可能</b>是有機化合物？（原子量：C＝12、H＝1、O＝16）","opts":["甲、乙","乙、丙","丙、丁","甲、丙"],"ans":1,"sec":"認識有機化合物","diff":"難","src":"會考113（通過率 57%）","exp":"解題關鍵：思考哪些含有碳的化合物<b>並非</b>有機化合物。乙的 C：O 莫耳數比＝⟬27|12⟭：⟬73|16⟭≈1：2，即 <b>CO₂</b>，屬於<i class=\"hl\">碳的氧化物</i>，不是有機化合物。丙<b>完全由碳組成</b>，是<i class=\"hl\">元素而非化合物</i>，當然也不是有機化合物。故選(B)。"},
{"q":"下表為四位學生對於有機化合物、無機化合物中組成元素的說明，哪一位學生的說明最合理？<br>　小玉：有機化合物<b>必含 C</b>／無機化合物<b>必不含 C</b><br>　小如：有機化合物<b>必含 C</b>／無機化合物<b>可以含 C</b><br>　小方：有機化合物<b>必含 C、O</b>／無機化合物<b>必不含 C、O</b><br>　小德：有機化合物<b>必含 C、H、O</b>／無機化合物<b>可以含 C、H、O</b>","opts":["小玉","小如","小方","小德"],"ans":1,"sec":"認識有機化合物","diff":"難","src":"會考112（通過率 60%）","exp":"解題關鍵：<b>部分含碳的化合物屬於無機化合物</b>。有機化合物<b>必含有碳</b>，但碳的氧化物、碳酸鹽類、氰化物等含碳的化合物卻屬於<i class=\"hl\">無機化合物</i>，所以無機化合物<b>可以含 C</b>，故選(B)小如。有機化合物不一定含 O 或 H，故小方、小德的說明有誤。"},
{"q":"小華爺爺家中還保存著早期農民使用的「竹筒炮」，早期農民會使用竹筒炮產生巨響驅趕鳥類，阻止其啄食農作物。已知竹筒炮是將電石（CaC₂）放入竹筒中，再加水產生電石氣（C₂H₂），點火後即會爆炸產生巨響，則電石氣<b>不屬於</b>下列何者？","opts":["有機化合物","碳氫化合物","烴類","醇類"],"ans":3,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"電石氣（C₂H₂）<b>只含 C、H 兩種元素</b>，為<i class=\"hl\">碳氫化合物</i>，又稱為<i class=\"hl\">烴類</i>，也屬於有機化合物，故(A)(B)(C)皆屬於。(D)醇類須含有 <b>OH 原子團</b>（含 C、H、O），與電石氣不符，故選(D)。"},
{"q":"某科學家偵測電影院內的空氣數據並歸納後，發現人類的心情或舉動隨著劇情進行，會使空氣中某些氣體的濃度明顯增加：<br>　大笑 → 二氧化碳（CO₂）<br>　緊張 → 二氧化碳、異戊二烯（C₅H₈）<br>　喝啤酒 → 乙醇（C₂H₅OH）<br>關於上述三種氣體的敘述，何者正確？（原子量：H＝1，C＝12，O＝16）","opts":["大笑時明顯增加的氣體分子量為 28","緊張時明顯增加的氣體包含碳氫化合物","喝啤酒時明顯增加的氣體燃燒只會產生水","無論大笑、緊張或喝啤酒，明顯增加的氣體均屬於有機化合物"],"ans":1,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"(A)CO₂ 的分子量為 12＋16×2＝<b>44</b>，不是 28。(B)異戊二烯 C₅H₈ <b>只含 C、H</b>，屬於<i class=\"hl\">碳氫化合物</i>，正確。(C)乙醇<b>還含有碳原子</b>，燃燒時除了水還會產生二氧化碳。(D)CO₂ <b>不屬於</b>有機化合物。"},
{"q":"取 2 mL 的乙醇和 2 mL 的冰醋酸共置於一支試管中，並加入數滴濃硫酸後，將試管浸於盛有熱水的燒杯中，且不斷攪拌。反應完成後將試管取出，發現有少許油狀物<b>浮在最上層</b>。由以上結果可知該油狀物具下列哪些性質？<br>　甲. 易溶於水　乙. 難溶於水　丙. 密度比水小　丁. 密度比水大","opts":["甲丙","乙丙","甲丁","乙丁"],"ans":1,"sec":"常見的有機化合物","diff":"中","src":"重點演練","exp":"醇類加有機酸類會進行<b>酯化反應</b>產生<i class=\"hl\">酯類</i>。酯類<b>難溶於水</b>（乙），且會<b>浮在水面上</b>，表示<b>密度比水小</b>（丙），故選(B)。"},
{"q":"小佩利用回鍋油、氫氧化鈉水溶液、酒精與飽和食鹽水製造肥皂，則下列敘述何者正確？","opts":["氫氧化鈉水溶液可用硫酸代替","酒精可加快皂化反應，屬於催化劑","肥皂不溶於飽和食鹽水中，可析出於液面上","肥皂沾溼後可使藍色石蕊試紙變紅色"],"ans":2,"sec":"常見的有機化合物","diff":"中","src":"重點演練","exp":"(A)皂化反應應使用<b>鹼性</b>物質，而硫酸為<b>酸性</b>物質。(B)酒精可使油脂與氫氧化鈉水溶液混合得更均勻，但<i class=\"hl\">不屬於催化劑</i>（既不是反應物也不是催化劑）。(C)正確，這就是<b>鹽析</b>。(D)肥皂水呈<b>鹼性</b>，可使<i class=\"hl\">紅色</i>石蕊試紙變<i class=\"hl\">藍色</i>。"},
{"q":"粉刷牆面時常使用水性漆或油性漆，水性漆是以水（H₂O）作為溶劑，油性漆則常以甲苯（C₇H₈）作為溶劑。甲苯為無色液體，具有特殊氣味，長期吸聞會對神經系統造成傷害，因此在使用含甲苯的油性漆時應注意通風。根據上述，下列關於甲苯的分類何者<b>錯誤</b>？","opts":["烴類","有機化合物","碳水化合物","碳氫化合物"],"ans":2,"sec":"常見的有機化合物","diff":"中","src":"重點演練・素養題","exp":"甲苯的化學式為 C₇H₈，<b>只含 C、H</b>，屬於有機化合物中的<i class=\"hl\">碳氫化合物</i>，而碳氫化合物又稱為<i class=\"hl\">烴類</i>，故(A)(B)(D)皆正確。(C)<b>碳水化合物</b>中氫與氧的比例與水相同（H：O＝2：1），而甲苯<b>不含氧元素</b>，故並非碳水化合物，選(C)。"},
{"q":"木糖醇是一種可以代替蔗糖的食品添加物。若要知道木糖醇是否和乙醇一樣都是醇類，應查詢木糖醇的何項資訊？","opts":["分子量","組成的原子種類與排列方式","組成的原子總數是否超過 1000 個","氫和氧的原子數目比是否為 1：1"],"ans":1,"sec":"常見的有機化合物","diff":"易","src":"會考113（通過率 79%）","exp":"解題關鍵：<b>有機化合物的分類是根據特定的原子團或結構</b>。醇類的特性是含有 <i class=\"hl\">OH 原子團</i>，可由<b>原子種類與排列方式</b>判斷，而無法由分子量、原子總數或比例判斷，故選(B)。"},
{"q":"閱讀下文後回答：<br>　「為避免攝取過量咖啡因，可先降低咖啡豆中的咖啡因含量。將咖啡豆浸泡在有機溶劑中，咖啡因會溶在溶劑中，之後取出咖啡因加熱，使溶劑揮發掉。二氯甲烷是過往常用的有機溶劑，去除咖啡因效果好又易揮發，但後來因安全疑慮而棄用，並改用乙酸乙酯。因為酯類＿＿＿＿，所以較無安全性疑慮，美國食品藥物管理局許可使用乙酸乙酯來去除咖啡因，且無明定殘留許可標準。」<br>依據上述資訊，畫線處最適合填入下列何者？","opts":["只由碳和氫兩種原子所組成","是香蕉、柳丁等水果就含有的物質","沸點比二氯甲烷高，而不易揮發去除","是油脂與鹼性物質進行皂化反應後的產物"],"ans":1,"sec":"常見的有機化合物","diff":"難","src":"會考111（通過率 49%）","exp":"解題關鍵：「較無安全疑慮」表示<b>可以食用</b>。(B)水果本來就含有，代表可食用、較無安全疑慮，正確。(A)酯類含有 <b>C、H、O</b> 三種原子。(C)文中<b>未提及</b>酯類的沸點高低及揮發性。(D)<b>皂化</b>反應產生的是肥皂；酯類是由醇類與有機酸類進行<i class=\"hl\">酯化</i>反應而產生。"},

<h4>二、化學計量</h4>
<p>1. <b>意義</b>：利用化學反應式去推算產物的量或是所需反應物的量。</p>
<p>2. ⚠ <b>化學反應式的係數關係</b>：<i class="hl">係數比＝分子數比＝莫耳數比</i>。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>化學反應式</th><th>2H₂</th><th>＋</th><th>O₂</th><th>→</th><th>2H₂O</th></tr>
<tr><td class="h">平衡係數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">分子數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">莫耳數比</td><td class="c">2</td><td class="c">：</td><td class="c">1</td><td class="c">：</td><td class="c">2</td></tr>
<tr><td class="h">質量比<br><span style="font-weight:400;color:var(--muted);font-size:.8rem">（莫耳數×分子量）</span></td><td class="c">1<br><span style="color:var(--muted);font-size:.8rem">(2×2)</span></td><td class="c">：</td><td class="c">8<br><span style="color:var(--muted);font-size:.8rem">(1×32)</span></td><td class="c">：</td><td class="c">9<br><span style="color:var(--muted);font-size:.8rem">(2×18)</span></td></tr>
</table></div>
<p><span class="nt" style="display:block"><b>註1</b>上述的分子數比與莫耳數比是指分子數與莫耳數的<b>變化量</b>比。</span>
<span class="nt" style="display:block"><b>註2</b>反應式的係數比 <i class="hl">≠</i> 質量比。</span></p>
</div>

<div class="box hot"><span class="bt">麻辣私房菜</span>
<p><b>化學計量的解題步驟</b></p>
<div class="flow">
<div class="fb"><b>1</b>先確認反應式<i class="hl">是否已平衡</i>。</div>
<div class="fb"><b>2</b>將<i class="hl">質量轉換成莫耳數</i>。</div>
<div class="fb"><b>3</b>以完全消耗的反應物（<i class="hl">限量試劑</i>）作為基準，再利用「係數比＝莫耳數比」求得其他反應物消耗或生成物產生的莫耳數，再換算成質量。</div>
</div>
<p><span class="eg">例</span>將 16 g 的 H₂ 與 14 g 的 N₂ 進行反應，反應式為 H₂＋N₂→NH₃，則最多可生成多少 g 的氨氣？</p>
<p><span class="sol">解</span>1. 平衡反應式：3H₂＋N₂→2NH₃。<br>
2. 質量轉換成莫耳數：H₂（分子量 2）→ <span class="fr"><i>16</i><i>2</i></span>＝8 mol；N₂（分子量 28）→ <span class="fr"><i>14</i><i>28</i></span>＝0.5 mol。<br>
3. 以限量試劑為基準：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>反應式</th><th>3H₂</th><th>N₂（限量試劑）</th><th>2NH₃</th></tr>
<tr><td class="h">係數比</td><td class="c">3</td><td class="c">1</td><td class="c">2</td></tr>
<tr><td class="h">反應前莫耳數</td><td class="c">8 mol</td><td class="c">0.5 mol</td><td class="c">—</td></tr>
<tr><td class="h">消耗的莫耳數</td><td class="c">0.5×3＝1.5 mol</td><td class="c">0.5 mol</td><td class="c">—</td></tr>
<tr><td class="h">反應後莫耳數</td><td class="c">6.5 mol</td><td class="c">0</td><td class="c">0.5×2＝1 mol</td></tr>
</table></div>
<p>由上述可知，1.5 mol H₂ 與 0.5 mol N₂ 反應，可產生 1 mol NH₃，NH₃ 的質量＝1×17＝<b>17 g</b>。</p>
</div>

<span class="eg">例</span>氯化氫在水中會分解成氫離子與氯離子（HCl → H⁺ ＋ Cl⁻）。</p>
<p>2. <b>電解質水溶液的特性</b><br>
(1) 電解質水溶液必為<i class="hl">電中性</i>，即<b>陽離子的總帶電量＝陰離子的總帶電量</b> → 每個陽離子帶電量×陽離子數目＝每個陰離子帶電量×陰離子數目。<br>
<span class="eg">例</span>CaCl₂ 水溶液中，離子數目比 Ca²⁺：Cl⁻＝1：2，總帶電量比 Ca²⁺：Cl⁻＝2×1：1×2＝<b>1：1</b>。<br>
<span class="nt"><b>註</b>電解質水溶液必為電中性，但<b>酸鹼性則不一定為中性</b>。</span><br>

<div class="box key"><span class="bt">得分關鍵</span>電解質水溶液中，陽、陰離子的<b>總電量必相等</b>，但陽離子的總個數與陰離子的總個數<i class="hl">不一定相等</i>。</div>

<p><span class="eg">例1</span>鉻酸根離子與二鉻酸根離子的平衡：<b>2CrO₄²⁻（黃色）＋ 2H⁺ ⇌ Cr₂O₇²⁻（橘紅色）＋ H₂O</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>操作</th><th>平衡移動</th><th>結果</th></tr>
<tr><td class="c">加入<b>酸</b>（H⁺ 增加）</td><td class="c">平衡向<i class="hl">右</i>移動</td><td>Cr₂O₇²⁻ 濃度增加，溶液顏色偏向<b>橘紅色</b></td></tr>
<tr><td class="c">加入<b>鹼</b>（H⁺ 減少）</td><td class="c">平衡向<i class="hl">左</i>移動</td><td>CrO₄²⁻ 濃度增加，溶液顏色偏向<b>黃色</b></td></tr>
</table></div>
<p><span class="eg">例2</span>溴水溶液的平衡：<b>Br₂（紅棕色）＋ H₂O ⇌ H⁺ ＋ Br⁻（無色）＋ HBrO（無色）</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>操作</th><th>平衡移動</th><th>結果</th></tr>
<tr><td class="c">加入<b>酸</b>（H⁺ 增加）</td><td class="c">平衡向<i class="hl">左</i>移動</td><td>Br₂ 濃度增加，溶液顏色<b>變深</b></td></tr>
<tr><td class="c">加入<b>鹼</b>（H⁺ 減少）</td><td class="c">平衡向<i class="hl">右</i>移動</td><td>Br₂ 濃度減少，溶液顏色<b>變淡</b></td></tr>
</table></div>
<div class="box tip"><span class="bt">概念補給</span>
<p><b>勒沙特列原理</b>　若一平衡系統受到外來因素（如濃度、溫度、壓力、體積等）的影響時，系統將朝向<i class="hl">抵消此外來因素</i>的方向變化。</p>
<p>以「兩個相通的裝水容器」作比喻：為了抵消在左側加水的影響，水會流向另一個容器；相當於反應物濃度增加時，平衡向生成物方向移動，以抵消反應物濃度的增加。</p>
</div>
<p>2. <b>溫度</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>操作</th><th>平衡移動</th></tr>
<tr><td class="c">升高溫度</td><td><i class="hl">有利於吸熱反應</i>進行，反應往<b>吸熱</b>方向移動</td></tr>
<tr><td class="c">降低溫度</td><td><i class="hl">有利於放熱反應</i>進行，反應往<b>放熱</b>方向移動</td></tr>
</table></div>
<p><span class="eg">例</span>二氧化氮與四氧化二氮的平衡：<b>2NO₂（紅棕色）⇌ N₂O₄（無色）＋ 熱</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>操作</th><th>平衡移動</th><th>結果</th></tr>
<tr><td class="c">升高溫度</td><td class="c">平衡向<i class="hl">左</i>移動</td><td>NO₂ 濃度增加，顏色<b>變深</b></td></tr>
<tr><td class="c">降低溫度</td><td class="c">平衡向<i class="hl">右</i>移動</td><td>NO₂ 濃度減少，顏色<b>變淡</b></td></tr>
</table></div>
<div class="box key"><span class="bt">得分關鍵</span>
<p>熱量可視為<b>反應物</b>（當熱量寫在箭號<b>左</b>邊，即<i class="hl">吸熱反應</i>）或<b>生成物</b>（當熱量寫在箭號<b>右</b>邊，即<i class="hl">放熱反應</i>），再將<b>降低溫度視為減少熱量</b>、<b>升高溫度視為增加熱量</b>，來判斷平衡移動方向。</p>
</div>
</div>`;

const U10_1=`<div class="blk">
<h4>一、有機化合物的定義</h4>
<div class="flow">
<div class="fb"><b>早期定義</b>從動、植物等具有<b>生命現象的有機體</b>中取得的化合物</div>
<div class="fb"><b>推翻原由</b>德國科學家<i class="hl">烏拉</i>在實驗室中，以<b>人工方式</b>製得<i class="hl">尿素</i>，推翻早期定義</div>
<div class="fb"><b>⚠ 現今定義</b><i class="hl">含碳的化合物</i></div>
<div class="fb"><b>例外（不屬於有機化合物）</b>碳的氧化物（例如 CO、CO₂）<br>碳酸鹽類（例如 CaCO₃、MgCO₃）<br>氰化物（例如 KCN、NaCN）</div>
</div>
<div class="box myth"><span class="bt">迷思問答</span>
<p><b>Q　有機化合物必含有碳，所以含碳的化合物必為有機化合物？</b></p>
<p><b>A</b>　有機化合物的定義為「含碳的化合物」，故有機化合物<b>必含有碳</b>；但含碳的化合物中，<i class="hl">碳的氧化物、碳酸鹽類與氰化物</i>等為<b>無機化合物</b>，故含碳的化合物<b>不一定</b>是有機化合物。</p>
</div>
</div>

<div class="blk">
<h4>二、有機化合物的主要成分與結構</h4>
<p>1. <b>主要成分</b>：<i class="hl">碳、氫</i>。</p>
<div class="box tip"><span class="bt">概念補給</span>有機化合物<b>常</b>含有氫原子，但<b>並非一定</b>。例如 CCl₄ 不含氫原子，但仍為有機化合物。</div>
<p>2. <b>結構</b>：由於排列與結合方式多變，使得有機化合物的種類<i class="hl">較無機化合物多</i>。</p>
<p>　(1) 原子種類及數目相同時，若<b>原子排列方式不同</b>，則化合物的化學及物理性質即不同。例如甲醚與乙醇的分子式均為 <b>C₂H₆O</b>：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>甲醚（CH₃OCH₃）</th><th>乙醇（C₂H₅OH）</th></tr>
<tr><td class="h">結構差異</td><td class="c">氧原子夾在<b>兩個碳原子之間</b><br>C－O－C</td><td class="c">氧原子在<b>末端</b>，形成 OH 原子團<br>C－C－OH</td></tr>
<tr><td class="h">沸點</td><td class="c">－24.8℃</td><td class="c">78℃</td></tr>
<tr><td class="h">常溫常壓</td><td class="c"><i class="hl">氣態</i></td><td class="c"><i class="hl">液態</i></td></tr>
<tr><td class="h">溶於水</td><td class="c">不易溶於水</td><td class="c">易溶於水</td></tr>
</table></div>
<p>　(2) 碳原子可彼此結合，也可與其他原子結合，結合方式更有<i class="hl">鏈狀</i>與<i class="hl">環狀</i>之分：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>三氯甲烷（CHCl₃）</th><th>丙烷（C₃H₈）</th><th>環丙烷（C₃H₆）</th></tr>
<tr><td class="c">碳原子<b>和其他原子</b>結合</td><td class="c"><b>鏈狀</b><br>3 個碳排成一直鏈</td><td class="c"><b>環狀</b><br>3 個碳首尾相接成環</td></tr>
<tr><td class="c" colspan="2">碳原子和碳原子互相連結後再和其他原子結合</td><td class="c">同左</td></tr>
</table></div>
</div>

<div class="blk">
<h4>三、有機化合物與無機化合物的比較</h4>
<p>1. <b>實驗步驟</b>：分別將白砂糖、麵粉、食鹽以<b>鋁箔紙包覆</b>後，進行<i class="hl">乾餾</i>。</p>
<p>2. <b>實驗結果</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">加熱物質</td><td class="c">白砂糖</td><td class="c">麵粉</td><td class="c">食鹽</td></tr>
<tr><td class="h">有機／無機</td><td class="c">有機</td><td class="c">有機</td><td class="c">無機</td></tr>
<tr><td class="h">加熱後結果</td><td class="c"><i class="hl">產生黑色物質</i></td><td class="c"><i class="hl">產生黑色物質</i></td><td class="c">無明顯變化</td></tr>
</table></div>
<p>3. <b>結論</b>：有機化合物因<b>含有碳元素</b>，故加熱後會產生含碳的<i class="hl">黑色物質</i>；而無機化合物因不含碳元素，故加熱後<b>無明顯的變化</b>。</p>
<div class="box tip"><span class="bt">概念補給</span><b>乾餾</b>：將物質<i class="hl">隔絕空氣</i>進行加熱分解，觀察是否產生黑色固體，以證明物質中含有碳元素。</div>
</div>`;
const U10_2=`<div class="blk">
<h4>一、有機化合物的命名</h4>
<p>以<b>甲、乙、丙、丁…</b>等來代表<i class="hl">碳原子個數</i>，若碳原子超過 10 個，則以<i class="hl">數字</i>代表碳原子個數。</p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">含碳數</td><td class="c">1</td><td class="c">2</td></tr>
<tr><td class="h">舉例</td><td>甲烷（CH₄）、甲醇（CH₃OH）、甲酸（HCOOH）</td><td>乙烷（C₂H₆）、乙醇（C₂H₅OH）、乙酸（CH₃COOH）</td></tr>
</table></div>
</div>

<div class="blk">
<h4>二、烴類</h4>
<p>1. <b>定義</b>：只含有<i class="hl">碳、氫</i>兩種元素的有機化合物稱為<b>烴</b>，又稱為<b>碳氫化合物</b>。</p>
<div class="box tip"><span class="bt">概念補給</span>烴類可分成：1. <b>烷</b>類（通式為 CₙH₂ₙ₊₂）　2. <b>烯</b>類（通式為 CₙH₂ₙ）　3. <b>炔</b>類（通式為 CₙH₂ₙ₋₂）</div>
<p>2. <b>烷類</b>：烴類的一種，化學式的通式為 <i class="hl">CₙH₂ₙ₊₂</i>（n≥1）。常溫常壓下的性質：</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>狀態</th><th>含碳數</th><th>舉例</th><th>特性</th></tr>
<tr><td class="h">氣態</td><td class="c">少</td><td class="c">甲烷、乙烷、丙烷、丁烷</td><td rowspan="3">
(1) <i class="hl">難溶於水</i>，且碳數越多，<b>沸點越高</b>。<br>
(2) <b>完全</b>燃燒時產生 CO₂ 及 H₂O；若<b>氧氣不足</b>時燃燒，則會產生 <i class="hl">CO</i> 及 H₂O。
</td></tr>
<tr><td class="h">液態</td><td class="c">↓</td><td class="c">己烷、辛烷</td></tr>
<tr><td class="h">固態</td><td class="c">多</td><td class="c">正二十烷</td></tr>
</table></div>
<p>3. <b>化石燃料</b>：主要成分為<i class="hl">烴類</i>。</p>
<p>　(1) <b>化石燃料的形成</b></p>
<div class="flow">
<div class="fb"><b>①</b>遠古時代的生物死亡。</div>
<div class="fb"><b>②</b>屍體與泥沙一起沉積在地底，並經由<b>細菌</b>的作用而漸漸分解。</div>
<div class="fb"><b>③</b>經過<b>溫度與壓力</b>的作用，使分解出的有機物進行複雜而緩慢的化學反應，最後形成<i class="hl">原油和天然氣</i>等化石燃料。</div>
</div>
<p>　(2) <b>原油的分餾</b>：原油分餾後可得到石油氣、汽油、煤油、柴油、石蠟、潤滑油和瀝青等多種物質，這些物質內含多種烴類，屬於<i class="hl">混合物</i>。<br>
<span class="nt"><b>註</b>分餾是將複雜的液態混合物加熱，利用其中各種物質<b>沸點高低不同</b>，使其分離的過程。</span></p>
<p>　⚠ (3) <b>天然氣與液化石油氣</b>：由多種烴類組成的<i class="hl">混合物</i>。<br>
<span class="nt"><b>註</b>液化石油氣是將石油分餾出的石油氣，<b>高壓液化</b>所形成。</span></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>主要成分</th><th>常溫常壓下的性質</th><th>運送方式</th></tr>
<tr><td class="h">天然氣<br>（天然瓦斯）</td><td class="c">甲烷（CH₄）</td><td class="c">無色、無味的氣體</td><td class="c">以<b>管線</b>輸送</td></tr>
<tr><td class="h">液化石油氣<br>（桶裝瓦斯）</td><td class="c">丙烷（C₃H₈）、丁烷（C₄H₁₀）</td><td class="c">無色、無味的氣體</td><td class="c">以<b>鋼桶</b>運送</td></tr>
</table></div>
<div class="box key"><span class="bt">得分關鍵</span>天然氣與液化石油氣均為<i class="hl">混合物</i>，常溫常壓下均為<i class="hl">氣態</i>。</div>
</div>

<div class="blk">
<h4>三、醇類</h4>
<p>1. <b>定義</b>：結構中含有 <i class="hl">OH 原子團</i>的有機化合物，化學式的通式為 <b>CₙH₂ₙ₊₁OH</b>（n≥1）。</p>
<p>2. <b>甲醇與乙醇的比較</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>化學式</th><th>性質</th></tr>
<tr><td class="h">甲醇<br>（俗稱<i class="hl">木精</i>）</td><td class="c">CH₃OH</td><td>
(1) 無色液體，具有<i class="hl">毒性</i>，誤食可能會導致失明或死亡。<br>
(2) 常添加於酒精中，形成工業用的<i class="hl">變性酒精</i>，會加入<b>紅色染料</b>加以區別。
</td></tr>
<tr><td class="h">乙醇<br>（俗稱<i class="hl">酒精</i>）</td><td class="c">C₂H₅OH</td><td>
(1) 無色液體，在實驗室常作為<b>溶劑及燃料</b>，可與水以<i class="hl">任意比例</i>混合。<br>

</td></tr>
</table></div>
<div class="box tip"><span class="bt">概念補給</span>可食用酒精通常會被課以重稅，因此工業上會使用稅金較少、但有添加其他物質而無法食用的<b>變性酒精</b>。</div>
</div>

<div class="blk">
<h4>四、有機酸</h4>
<p>1. <b>定義</b>：結構中含有 <i class="hl">COOH 原子團</i>的有機化合物，化學式的通式為 <b>CₙH₂ₙ₊₁COOH</b>（n≥0）。<br>
<span class="nt"><b>註</b>無機酸為酸性的無機化合物，常見的有硫酸（H₂SO₄）、鹽酸（HCl）、硝酸（HNO₃）等。</span></p>
<p>2. <b>甲酸與乙酸的比較</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>化學式</th><th>性質</th></tr>
<tr><td class="h">甲酸<br>（俗稱<i class="hl">蟻酸</i>）</td><td class="c">HCOOH</td><td>
(1) 無色、具刺激性酸味的液體，溶於水呈<b>酸性</b>。<br>

(1) 無色、具刺激性酸味的液體，溶於水呈<b>酸性</b>。<br>

<div class="box key"><span class="bt">得分關鍵</span><b>蟻</b>酸與<b>乙</b>酸的讀音相同，須注意區別！</div>
</div>

<div class="blk">
<h4>五、酯類</h4>
<p>1. <b>酯化反應</b></p>
<span class="fml">醇 ＋ 有機酸 —〔濃硫酸〕⇌ 酯 ＋ 水</span>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h">濃硫酸</td><td>酯化反應的速率很慢，會加入濃硫酸<b>脫水</b>，作為<i class="hl">催化劑</i>使用。</td></tr>

<p>2. <b>酯類的命名</b>：<b>X酸 ＋ Y醇 → X酸Y酯</b>（只須把「醇」換成「酯」）</p>
<p><span class="eg">例</span>乙<b>酸</b>（CH₃COOH）＋ 乙<b>醇</b>（C₂H₅OH）→ 乙酸乙<b>酯</b>（CH₃COOC₂H₅）＋ 水（H₂O）</p>
</div>

<div class="blk">
<h4>六、常用的清潔劑</h4>
<p>1. <b>常用的清潔劑</b>：可分為<b>肥皂</b>與<b>合成清潔劑</b>。</p>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>來源</th><th>在硬水中的清潔能力</th><th>舉例</th></tr>
<tr><td class="h">肥皂</td><td class="c"><i class="hl">皂化反應</i></td><td class="c">不易起泡，且<b>產生沉澱</b></td><td class="c">肥皂</td></tr>
<tr><td class="h">合成清潔劑</td><td class="c"><i class="hl">石化原料</i>製成</td><td class="c"><b>不受影響</b>，仍具去汙能力</td><td class="c">洗衣精、洗碗精</td></tr>
</table></div>
<p><span class="nt"><b>註</b>硬水為含有鎂離子（Mg²⁺）、鈣離子（Ca²⁺）的水。</span></p>
<p>2. <b>肥皂的製造</b></p>
<div class="flow">
<div class="fb"><b>① 油脂 ＋ 酒精</b>加熱前會先利用<b>酒精溶解油脂</b>，使其能與鹼液均勻混合而加快反應。</div>
<div class="fb"><b>② 皂化反應</b>（加入鹼性溶液）<br>油脂 ＋ 氫氧化鈉 → <i class="hl">脂肪酸鈉（肥皂）</i> ＋ <i class="hl">丙三醇（甘油）</i></div>
<div class="fb"><b>③ 鹽析</b>皂化反應完成後，將產物倒入<b>飽和食鹽水</b>中。</div>
<div class="fb"><b>④ 分離</b>因肥皂<b>不溶於飽和食鹽水</b>，故會<i class="hl">浮在液面上</i>與甘油分離。</div>
</div>
<div class="box key"><span class="bt">得分關鍵</span>
<p>1. 皂化反應中的<b>酒精</b>可使反應物充分混合，<i class="hl">既不是反應物也不是催化劑</i>。<br>
2. 肥皂為<b>鹼性</b>物質，可使潮溼的<i class="hl">紅色石蕊試紙變藍色</i>。</p>
</div>
</div>`;
const U10_3=`<div class="blk">
<h4>一、有機聚合物的定義與分類</h4>
<p>1. <b>定義</b>：<i class="hl">單體分子重複連接</i>而成的巨大分子，其原子總數約有數千個至數十萬個。</p>
<p>2. <b>分類</b></p>
<div class="mtabwrap"><table class="ctab">
<tr><td class="h" rowspan="3">聚合物</td><td class="h">天然聚合物</td><td colspan="2">例如：澱粉、纖維素、蛋白質、天然橡膠</td></tr>
<tr><td class="h" rowspan="2">合成聚合物</td><td class="h">鏈狀聚合物<br>（熱塑性聚合物）</td><td>例如：耐綸、寶特瓶、保麗龍</td></tr>
<tr><td class="h">網狀聚合物<br>（熱固性聚合物）</td><td>例如：輪胎、環氧樹脂、酚醛樹脂</td></tr>
</table></div>
<div class="box tip"><span class="bt">概念補給</span>有機聚合物屬於<i class="hl">分子量很大</i>的有機化合物。</div>
</div>

<div class="blk">
<h4>二、天然聚合物</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>特性</th></tr>
<tr><td class="h">澱粉</td><td>
1. 由<i class="hl">葡萄糖</i>聚合而成，可經由<b>澱粉酶</b>水解成葡萄糖。<br>
2. 屬於<b>醣類</b>的一種，醣類中氫、氧原子數目比與水相同，均為 <i class="hl">2：1</i>，故醣類又稱為<i class="hl">碳水化合物</i>。<br>
<span class="eg">例</span>葡萄糖為碳水化合物，其化學式 C₆H₁₂O₆ 可寫成 C₆(H₂O)₆。<br>
3. <b>澱粉的檢驗</b>：澱粉可使黃褐色的<b>碘液</b>呈<i class="hl">藍黑色</i>。
</td></tr>
<tr><td class="h">纖維素</td><td>
1. 由<i class="hl">葡萄糖</i>聚合而成，但<b>聚合方式與澱粉不同</b>，人體<b>無法分解</b>纖維素，但纖維素可幫助消化。<br>
2. 為植物<i class="hl">細胞壁</i>的主要成分。
</td></tr>
<tr><td class="h">蛋白質</td><td>
1. 由<i class="hl">胺基酸</i>聚合而成，含有碳、氫、氧、<b>氮、硫</b>等元素。<br>
2. 為構成<i class="hl">細胞</i>的主要物質。<br>
3. 容易受到<b>光、熱和酸</b>的作用而變質。<br>
<span class="eg">例</span>將透明的蛋白加熱後就會變成白色的固體。
</td></tr>
</table></div>
<div class="box key"><span class="bt">得分關鍵</span>
<p>1. 須注意<b>碳水化合物</b>（含碳、氫、氧，H：O＝2：1）與<b>碳氫化合物</b>（只含碳、氫）的差別！<br>
2. <b>脂質</b>為<i class="hl">酯類</i>，屬於<b>小分子化合物</b>，<i class="hl">並非聚合物</i>。</p>
</div>
</div>

<div class="blk">
<h4>三、合成聚合物</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>特性</th><th>舉例</th></tr>
<tr><td class="h">鏈狀聚合物<br>（熱塑性聚合物）</td><td>加熱會<b>軟化</b>、冷卻後硬化，具有<i class="hl">可塑性</i>，<i class="hl">可回收再利用</i>。</td><td>寶特瓶（PET）、聚乙烯（PE）、聚氯乙烯（PVC）、保麗龍（PS）</td></tr>
<tr><td class="h">網狀聚合物<br>（熱固性聚合物）</td><td><i class="hl">耐高溫</i>、不容易變形，<i class="hl">不易回收</i>，容易造成環境汙染問題。</td><td>輪胎、合成橡膠、各種樹脂</td></tr>
</table></div>
</div>

<div class="blk">
<h4>四、衣料纖維</h4>
<div class="mtabwrap"><table class="ctab">
<tr><th>　</th><th>類別</th><th>成分與特性</th><th>舉例</th></tr>
<tr><td class="h" rowspan="2">天然纖維</td><td class="h">植物纖維</td><td class="c">由<i class="hl">纖維素</i>組成</td><td class="c">棉、麻</td></tr>
<tr><td class="h">動物纖維</td><td class="c">由<i class="hl">蛋白質</i>組成</td><td class="c">羊毛、蠶絲</td></tr>
<tr><td class="h" rowspan="2">人造纖維</td><td class="h">再生纖維<br>（人造絲）</td><td class="c">由<b>植物纖維</b>溶解後抽成絲狀所製成，具有類似<b>蠶絲</b>的光澤</td><td class="c">嫘縈</td></tr>
<tr><td class="h">合成纖維</td><td class="c">原料為<i class="hl">石油</i>，經人工方法合成</td><td class="c">耐綸、聚酯纖維</td></tr>
</table></div>
</div>`;

function tags(a){
  return (a||[]).map(x=>'<span class="tg'+(/補充/.test(x)?' b':'')+'">'+esc(x)+'</span>').join("");
}
function hotBar(h){
  if(!h) return '<span style="color:var(--line)">\u2014</span>';
  return '<span class="hot5">'+'\u25cf'.repeat(h)+'</span><span style="color:var(--line)">'+'\u25cf'.repeat(5-h)+'</span>';
}
function tally(us){
  const all=us.reduce((n,u)=>n+u.ps.length,0);
  const done=us.reduce((n,u)=>n+u.ps.filter(p=>p.c).length,0);
  return {all:all,done:done,pct:all?Math.round(done/all*100):0};
}
function unitBlock(u){
  let h='<h2 class="sec"><span class="un">'+esc(typeof u.n==="number"?"\u7b2c "+u.n+" \u55ae\u5143":u.n)+'</span> '+esc(u.t)+'</h2>';

  h+='<div class="mtabwrap"><table class="mtab">'+
     '<tr><th>\u91cd\u9ede</th><th>\u540d\u7a31</th><th>\u6703\u8003\u91cd\u8981\u5ea6</th><th>\u5167\u5bb9</th><th>\u9801</th></tr>'+
     u.ps.map(p=>
       '<tr><td class="nm">'+esc(String(p.n))+'</td>'+
       '<td class="tt">'+esc(p.t)+(p.un?' <span class="warn" title="\u76ee\u9304\u7167\u7247\u5b57\u592a\u5c0f\uff0c\u540d\u7a31\u6216\u9801\u78bc\u5c1a\u672a\u78ba\u8a8d">\u26a0</span>':'')+
         (p.tg&&p.tg.length?'<div style="margin-top:4px">'+tags(p.tg)+'</div>':'')+'</td>'+
       '<td class="ct">'+hotBar(p.hot)+'</td>'+
       '<td class="ct">'+(p.c?'<span class="done">\u2713 \u5df2\u6536\u9304</span>':'<span class="todo"><b>\u5f85\u88dc</b></span>')+'</td>'+
       '<td class="pg">'+esc(String(p.p))+'</td></tr>').join("")+
     '</table></div>';
  u.ps.forEach(p=>{
    if(!p.c) return;
    h+='<h3 class="sub"><span class="kp">\u91cd\u9ede '+esc(String(p.n))+'</span>'+esc(p.t)+
       '<span class="pgt">\u8ab2\u672c p.'+esc(String(p.p))+'</span></h3>'+p.c;
  });
  return h;
}

let SEC_MAP=null;
function secInfo(subK,sec){
  if(!SEC_MAP){
    SEC_MAP={};
    SUBJECTS.forEach(sj=>{SEC_MAP[sj.k]={};sj.vols.forEach(v=>v.us.forEach(u=>u.ps.forEach(p=>{
      SEC_MAP[sj.k][p.t]={vol:v.name,un:u.n,ut:u.t};})));});
  }
  return (SEC_MAP[subK]||{})[sec]||null;
}
function newRound(){quizRound=new Date().toISOString();}
function logMistake(q,chosen){
  const info=secInfo(unit,q.sec)||{};
  const rec={sub:unit,subName:UNITS[unit].name,vol:info.vol||"",un:info.un||null,ut:info.ut||"",
    sec:q.sec||"",diff:q.diff||"",src:q.src||"",
    qk:String(q.q).slice(0,60),
    correct:"\uff08"+"\uff21\uff22\uff23\uff24"[q.ans]+"\uff09"+q.opts[q.ans],
    chosen:"\uff08"+"\uff21\uff22\uff23\uff24"[chosen]+"\uff09"+q.opts[chosen],
    t:new Date().toISOString(),round:quizRound||new Date().toISOString()};
  const a=loadM();a.push(rec);saveM(a);cloudMirror();
}
function logRound(n,score,pct){
  const a=loadL();
  a.push({t:quizRound||new Date().toISOString(),sub:unit,subName:UNITS[unit].name,
    scope:(secSel==="all"?"\u5168\u90e8":secSel)+"\uff5c"+(diffSel==="all"?"\u4e0d\u9650\u96e3\u5ea6":diffSel),
    n:n,score:score,pct:pct});
  saveL(a);cloudMirror();
}

/* ---------- 帳號區塊 ---------- */
function acctMsg(t,k){const m=$("#amsg");if(m){m.textContent=t;m.className="amsg"+(k?(" "+k):"")}}
function acctHTML(){
  if(!CLOUD)return "";
  if(loggedIn())return '<div class="acct"><span>\ud83d\udc64 \u5df2\u767b\u5165\uff1a<b>'+esc(acctName())+
    '</b>\u3000<span style="color:var(--ok)">\u96f2\u7aef\u540c\u6b65\u4e2d</span></span>'+
    '<span class="abtns"><button class="btn ghost sm" onclick="acctSync()">\u21bb \u5f9e\u96f2\u7aef\u540c\u6b65</button>'+
    '<button class="btn ghost sm" onclick="acctLogout()">\u767b\u51fa</button></span></div>';
  return '<div class="acct acct-form"><div class="atitle">\ud83d\udc64 \u767b\u5165\u5f8c\uff0c\u932f\u984c\u8207\u7d00\u9304\u6703\u5b58\u5230\u96f2\u7aef\uff0c\u63db\u88dd\u7f6e\u4e5f\u770b\u5f97\u5230\uff08\u8207\u82f1\u6587\u5b78\u7fd2\u7db2\u540c\u4e00\u7d44\u5e33\u865f\uff09</div>'+
    '<div class="arow"><input id="aem" type="text" placeholder="\u59d3\u540d\uff0f\u5ea7\u865f \u6216 Email" autocomplete="username">'+
    '<input id="apw" type="password" placeholder="\u5bc6\u78bc\uff08\u81f3\u5c11 6 \u78bc\uff09" autocomplete="current-password">'+
    '<button class="btn primary sm" onclick="acctLogin()">\u767b\u5165</button>'+
    '<button class="btn ghost sm" onclick="acctReg()">\u8a3b\u518a</button></div>'+
    '<div id="amsg" class="amsg"></div></div>';
}
window.acctLogin=async function(){
  const e=$("#aem").value.trim(),p=$("#apw").value;
  if(!e||!p)return acctMsg("\u8acb\u8f38\u5165\u5e33\u865f\u8207\u5bc6\u78bc","bad");
  acctMsg("\u767b\u5165\u4e2d\u2026");
  try{await doSignIn(e,p);await syncDown();renderWrong();renderLog();}
  catch(err){acctMsg("\u767b\u5165\u5931\u6557\uff1a"+err.message,"bad");}
};
window.acctReg=async function(){
  const e=$("#aem").value.trim(),p=$("#apw").value;
  if(!e||p.length<6)return acctMsg("\u8acb\u8f38\u5165\u5e33\u865f\uff0c\u5bc6\u78bc\u81f3\u5c11 6 \u78bc","bad");
  acctMsg("\u8a3b\u518a\u4e2d\u2026");
  try{await doSignUp(e,p);
    if(loggedIn()){await syncDown();renderWrong();renderLog();}
    else acctMsg("\u8a3b\u518a\u5b8c\u6210\uff0c\u8acb\u518d\u6309\u4e00\u6b21\u300c\u767b\u5165\u300d","ok");}
  catch(err){acctMsg("\u8a3b\u518a\u5931\u6557\uff1a"+err.message,"bad");}
};
window.acctLogout=function(){saveSession(null);renderWrong();renderLog();};
window.acctSync=async function(){acctMsg("\u540c\u6b65\u4e2d\u2026");await syncDown();renderWrong();renderLog();};

/* ---------- 錯題本 ---------- */
let wSub="all";
window.wSetSub=function(k){wSub=k;renderWrong();};
window.wClear=function(){
  if(!confirm("\u78ba\u5b9a\u6e05\u7a7a\u6240\u6709\u932f\u984c\uff1f"))return;
  saveM([]);if(CLOUD&&loggedIn())cloudSaveApp(APP_M,[]).catch(()=>{});renderWrong();
};
window.wExport=function(){
  const blob=new Blob([JSON.stringify({mistakes:loadM(),log:loadL()},null,1)],{type:"application/json"});
  const u=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=u;a.download="\u81ea\u7136\u79d1\u932f\u984c\u672c.json";a.click();URL.revokeObjectURL(u);
};
window.wImport=function(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=function(){
    const f=i.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=function(){try{
      const j=JSON.parse(rd.result);
      saveM(mergeBy(mKey,loadM(),j.mistakes||(Array.isArray(j)?j:[])));
      saveL(mergeBy(lKey,loadL(),j.log||[]));
      cloudMirror();renderWrong();renderLog();
    }catch(e){alert("\u532f\u5165\u5931\u6557\uff1a"+e.message)}};
    rd.readAsText(f);
  };
  i.click();
};
window.wRetest=function(k){
  const qs=(UNITS[k]&&UNITS[k].qs)||[];
  const keys=new Set(loadM().filter(r=>r.sub===k).map(r=>r.qk));
  const pool=qs.filter(q=>keys.has(String(q.q).slice(0,60)));
  if(!pool.length)return alert("\u9019\u4e9b\u932f\u984c\u5c0d\u61c9\u4e0d\u5230\u73fe\u6709\u984c\u76ee\u3002");
  if(unit!==k){unit=k;secSel="all";diffSel="all";tocOpen=false;renderUnits();renderLearn();renderChips();renderList();renderToc();}
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  document.querySelector('.tab[data-tab="quiz"]').classList.add("active");
  document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
  $("#pane-quiz").classList.add("show");
  qStart(pool);
  window.scrollTo({top:0,behavior:"instant"});
};
function renderWrong(){
  const host=$("#wbox");if(!host)return;
  const all=loadM();
  let h=acctHTML();
  const cnt={};all.forEach(r=>{cnt[r.sub]=(cnt[r.sub]||0)+1;});
  h+='<div class="row" style="justify-content:space-between;align-items:center">'+
     '<span class="stat">\u5171 '+all.length+' \u7b46\u932f\u984c</span>'+
     '<span class="abtns"><button class="btn ghost sm" onclick="wExport()">\u2b07 \u532f\u51fa</button>'+
     '<button class="btn ghost sm" onclick="wImport()">\u2b06 \u532f\u5165</button>'+
     '<button class="btn ghost sm" onclick="wClear()">\ud83d\uddd1 \u6e05\u7a7a</button></span></div>';
  if(!all.length){
    host.innerHTML=h+'<p class="stat" style="margin-top:24px;text-align:center">\u9084\u6c92\u6709\u932f\u984c\u3002\u53bb\u6e2c\u9a57\u5427\uff01\u7b54\u932f\u7684\u6703\u81ea\u52d5\u6536\u9032\u9019\u88e1 \ud83d\udcda</p>';
    return;
  }
  h+='<div class="row">';
  h+='<button class="chip'+(wSub==="all"?" active":"")+'" onclick="wSetSub(\'all\')">\u5168\u90e8\uff08'+all.length+'\uff09</button>';
  Object.keys(UNITS).forEach(k=>{if(cnt[k])h+='<button class="chip'+(wSub===k?" active":"")+'" onclick="wSetSub(\''+k+'\')">'+esc(UNITS[k].icon+" "+UNITS[k].name)+'\uff08'+cnt[k]+'\uff09</button>';});
  h+='</div>';
  const shown=all.filter(r=>wSub==="all"||r.sub===wSub).slice().reverse();
  /* 依科目分組，每組一顆重測鈕 */
  const groups={};shown.forEach(r=>{(groups[r.sub]=groups[r.sub]||[]).push(r);});
  Object.keys(groups).forEach(k=>{
    h+='<div class="wgrp"><span class="wgn">'+esc((UNITS[k]?UNITS[k].icon+" "+UNITS[k].name:k))+'\u3000'+groups[k].length+' \u7b46</span>'+
       '<button class="btn primary sm" onclick="wRetest(\''+k+'\')">\ud83d\udd01 \u91cd\u6e2c\u9019\u4e9b\u932f\u984c</button></div>';
    groups[k].forEach(r=>{
      h+='<div class="wrec"><div class="wtop">'+
         (r.un?'<span class="wu">'+esc((r.vol?r.vol+" ":"")+"\u7b2c "+r.un+" \u55ae\u5143")+'</span>':'')+
         '<span class="topic">'+esc(r.sec||"")+(r.diff?"\u30fb"+esc(r.diff):"")+'</span>'+
         (r.src?'<span class="topic">'+esc(r.src)+'</span>':'')+
         '<span class="wt">'+esc(String(r.t).slice(0,10))+'</span></div>'+
         '<div class="wq">'+rep(r.qk,false)+'\u2026</div>'+
         '<div class="wa"><span class="wbad">\u4f60\u9078 '+rep(r.chosen,false)+'</span>'+
         '<span class="wok">\u6b63\u89e3 '+rep(r.correct,false)+'</span></div></div>';
    });
  });
  host.innerHTML=h;
}

/* ---------- 測驗紀錄 ---------- */
window.lClear=function(){
  if(!confirm("\u78ba\u5b9a\u6e05\u7a7a\u6240\u6709\u6e2c\u9a57\u7d00\u9304\uff1f"))return;
  saveL([]);if(CLOUD&&loggedIn())cloudSaveApp(APP_L,[]).catch(()=>{});renderLog();
};
function renderLog(){
  const host=$("#lbox");if(!host)return;
  const all=loadL().slice().sort((a,b)=>String(b.t).localeCompare(String(a.t)));
  let h=acctHTML();
  if(!all.length){
    host.innerHTML=h+'<p class="stat" style="margin-top:24px;text-align:center">\u9084\u6c92\u6709\u6e2c\u9a57\u7d00\u9304\u3002\u6bcf\u505a\u5b8c\u4e00\u6b21\u6e2c\u9a57\u5c31\u6703\u8a18\u4e00\u7b46 \ud83d\udcc8</p>';
    return;
  }
  const tot=all.reduce((n,r)=>n+r.n,0), got=all.reduce((n,r)=>n+r.score,0);
  const avg=tot?Math.round(got/tot*100):0;
  const d7=Date.now()-7*864e5, recent=all.filter(r=>new Date(r.t).getTime()>=d7).length;
  h+='<div class="lstat"><div><b>'+all.length+'</b><span>\u6e2c\u9a57\u6b21\u6578</span></div>'+
     '<div><b>'+tot+'</b><span>\u4f5c\u7b54\u984c\u6578</span></div>'+
     '<div><b>'+avg+'%</b><span>\u5e73\u5747\u7b54\u5c0d\u7387</span></div>'+
     '<div><b>'+recent+'</b><span>\u8fd1 7 \u5929</span></div></div>';
  h+='<div class="row" style="justify-content:flex-end"><button class="btn ghost sm" onclick="lClear()">\ud83d\uddd1 \u6e05\u7a7a\u7d00\u9304</button></div>';
  h+='<div class="mtabwrap"><table class="ctab"><tr><th>\u6642\u9593</th><th>\u79d1\u76ee</th><th>\u7bc4\u570d</th><th>\u5f97\u5206</th><th>\u7b54\u5c0d\u7387</th></tr>';
  all.slice(0,200).forEach(r=>{
    const t=new Date(r.t), ts=(t.getMonth()+1)+"/"+t.getDate()+" "+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    const col=r.pct>=90?"var(--ok)":r.pct>=60?"var(--brand)":"var(--bad)";
    h+='<tr><td class="c">'+esc(ts)+'</td><td class="c">'+esc((UNITS[r.sub]?UNITS[r.sub].icon+" ":"")+r.subName)+'</td>'+
       '<td>'+esc(r.scope||"")+'</td><td class="c">'+r.score+" / "+r.n+'</td>'+
       '<td class="c" style="color:'+col+';font-weight:900">'+r.pct+'%</td></tr>';
  });
  h+='</table></div>';
  if(all.length>200)h+='<p class="stat">\uff08\u50c5\u986f\u793a\u6700\u8fd1 200 \u7b46\uff09</p>';
  host.innerHTML=h;
}

loadSession();
if(CLOUD&&loggedIn())syncDown().then(()=>{renderWrong();renderLog();});
renderWrong();renderLog();

/* ===== 全站搜尋 ===== */
(function(){
  const box=$("#sq"), go=$("#sgo"), clr=$("#sx"), out=$("#sres");
  if(!box) return;
  let IDX=null;

  function build(){
    const idx=[];
    Object.keys(UNITS).forEach(u=>{
      const pane=$("#learn-"+u); if(!pane) return;
      let cur=null;
      [...pane.children].forEach(el=>{
        if(el.tagName==="H2"&&el.classList.contains("sec")){
          cur={unit:u,unitName:UNITS[u].name,sec:el.textContent.trim(),el:el,text:""};
          idx.push(cur);
        } else if(cur){
          cur.text+=" "+el.textContent.replace(/\s+/g," ");
        }
      });
    });
    return idx;
  }

  /* 題庫原文含 <b>/<i class="hl"> 與 ⟬分子|分母⟭ 標記，搜尋結果是純文字，先還原成好讀的樣子 */
  const plain=s=>String(s)
    .replace(/⟦[^⟧]*⟧/g,"〔圖〕")
    .replace(/⟬([^|⟭]*)[|]([^⟭]*)⟭/g,"$1/$2")
    .replace(/<br>/g,"　")
    .replace(/<[^>]+>/g,"");
  const norm=s=>String(s).toLowerCase();
  const escH=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

  function mark(s,q){
    const i=norm(s).indexOf(norm(q));
    if(i<0) return escH(s);
    return escH(s.slice(0,i))+"<mark>"+escH(s.slice(i,i+q.length))+"</mark>"+escH(s.slice(i+q.length));
  }

  function snip(text,q,pad){
    const i=norm(text).indexOf(norm(q));
    if(i<0) return "";
    const a=Math.max(0,i-pad), b=Math.min(text.length,i+q.length+pad);
    return (a>0?"…":"")+text.slice(a,b).trim()+(b<text.length?"…":"");
  }

  function jump(unitKey,secText){
    if(unit!==unitKey){unit=unitKey;secSel="all";diffSel="all";qQuit();renderUnits();renderLearn();renderChips();renderList();}
    tocOpen=false;renderUnits();renderToc();
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
    const lt=document.querySelector('.tab[data-tab="learn"]'); if(lt)lt.classList.add("active");
    document.querySelectorAll(".pane").forEach(p=>p.classList.remove("show"));
    $("#pane-learn").classList.add("show");
    const h=[...document.querySelectorAll("#learn-"+unitKey+" h2.sec")].find(x=>x.textContent.trim()===secText);
    if(h){h.scrollIntoView({block:"start",behavior:"smooth"});h.classList.remove("secflash");void h.offsetWidth;h.classList.add("secflash");}
  }

  function run(){
    const q=box.value.trim();
    if(!q){out.hidden=true;clr.hidden=true;return;}
    if(!IDX) IDX=build();
    clr.hidden=false; out.hidden=false;

    const hits=IDX.filter(s=>norm(s.sec).includes(norm(q))||norm(s.text).includes(norm(q)));

    const qhits=[];
    Object.keys(UNITS).forEach(u=>{
      (UNITS[u].qs||[]).forEach(o=>{
        const blob=[o.q,(o.opts||[]).join(" "),o.exp||""].join(" ");
        if(norm(blob).includes(norm(q))) qhits.push({u:u,uName:UNITS[u].name,o:o});
      });
    });

    let html='<div class="shead">「'+escH(q)+'」找到 學習重點 '+hits.length+' 節、題庫 '+qhits.length+' 題</div>';

    if(hits.length){
      let lastU="";
      hits.slice(0,40).forEach(s=>{
        if(s.unitName!==lastU){html+='<div class="sgrp">📚 '+escH(s.unitName)+'</div>';lastU=s.unitName;}
        const sp=snip(s.text,q,38)||snip(s.sec,q,38)||s.text.slice(0,80).trim()+"…";
        html+='<button class="sitem" data-u="'+s.unit+'" data-s="'+escH(s.sec)+'">'+
              '<span class="swhere">'+escH(s.sec)+'</span>'+mark(sp,q)+'</button>';
      });
      if(hits.length>40) html+='<div class="snone">（還有 '+(hits.length-40)+' 節未列出，請輸入更精確的關鍵字）</div>';
    }

    if(qhits.length){
      html+='<div class="sgrp">📝 題庫</div>';
      qhits.slice(0,15).forEach(h=>{
        const o=h.o, ans=(o.opts||[])[o.ans]||"";
        html+='<div class="qcard">'+mark(plain(o.q),q)+
              '<br><span class="qa">答：'+escH(plain(ans).replace(/。$/,""))+'</span>'+
              (o.exp?'<span class="qe">'+mark(plain(o.exp),q)+'</span>':'')+
              '<span class="qe">—— '+escH(h.uName)+(o.src?'｜'+escH(o.src):'')+'</span></div>';
      });
      if(qhits.length>15) html+='<div class="snone">（還有 '+(qhits.length-15)+' 題未列出）</div>';
    }

    if(!hits.length&&!qhits.length) html+='<div class="snone">找不到「'+escH(q)+'」。試試較短的關鍵字，例如「比熱」而不是「比熱要怎麼算」。</div>';

    out.innerHTML=html;
    out.querySelectorAll(".sitem").forEach(b=>b.onclick=()=>jump(b.dataset.u,b.dataset.s));
  }

  go.onclick=run;
  clr.onclick=()=>{box.value="";out.hidden=true;clr.hidden=true;box.focus();};
  box.addEventListener("keydown",e=>{
    if(e.key==="Enter"){e.preventDefault();run();}
    if(e.key==="Escape"){box.value="";out.hidden=true;clr.hidden=true;}
  });
})();
</script>
